<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>BIGLIGHT 予実管理システム</title>
<!-- ファビコン: BIGLIGHTのロゴから作った小さいPNG（32/48px・各2KB前後）。
     元のロゴは1254px・860KBあり、タブのアイコンに毎回読ませるには重すぎるため縮小版を置く。 -->
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png">
<!-- iOSのホーム画面アイコンだけは白い下地つき。透明のまま渡すと黒く塗られるため。 -->
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta name="theme-color" content="#ffffff">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<!-- Đặt sáng/tối TRƯỚC khi render để không nháy -->
<script>
(function(){try{if((localStorage.getItem('bl_yj_theme')||'light')==='dark')document.documentElement.classList.add('dark');}catch(e){}})();
/* アイコンは絵文字ではなく線画のSVG。絵文字は端末ごとに形も色も変わり、印刷にも残るため使わない。 */
var SVG_MOON='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
var SVG_SUN='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
function toggleTheme(){var d=document.documentElement.classList.toggle('dark');try{localStorage.setItem('bl_yj_theme',d?'dark':'light');}catch(e){}var b=document.getElementById('themeToggle');if(b)b.innerHTML=d?SVG_SUN:SVG_MOON;}
window.addEventListener('DOMContentLoaded',function(){var b=document.getElementById('themeToggle');if(b)b.innerHTML=document.documentElement.classList.contains('dark')?SVG_SUN:SVG_MOON;});
</script>
<style>
  /* ===== DESIGN SYSTEM — theo CONG-THUC-XAY-DUNG-APP.md §2 =====
     Toàn bộ app CHỈ tham chiếu nhóm ALIAS. Đổi thương hiệu = sửa khối này. */
  :root{
    --bg-page:#f7f8fa; --bg-surface:#ffffff; --bg-subtle:#f5f6f8; --bg-hover:#f2f5f9; --bg-selected:#edf4ff;
    --text-primary:#172033; --text-secondary:#5f6b7a; --text-muted:#8b95a5;
    --border-default:#e5e9f0; --border-strong:#d8dee8;
    --primary:#1677ff; --primary-hover:#0867df; --primary-soft:#eaf3ff;
    --success:#238636; --success-soft:#eaf7ee;
    --warning:#b77900; --warning-soft:#fff5d9;
    --danger:#d92d20; --danger-hover:#b42318; --danger-soft:#fff0ef;
    --radius-sm:6px; --radius-md:10px; --radius-lg:14px;
    --shadow-sm:0 1px 2px rgba(16,24,40,.04); --shadow-md:0 6px 20px rgba(16,24,40,.06);
    /* ALIAS */
    --bg:var(--bg-page); --card:var(--bg-surface); --surface-2:var(--bg-subtle);
    --thead:#fafbfc; --row-hover:var(--bg-hover); --section-bg:var(--bg-subtle);
    --filter-bg:#fafbfc; --input-bg:#ffffff;
    --border:var(--border-default); --text:var(--text-primary); --muted:var(--text-secondary);
    --accent:#f5a623;
    --green:#238636; --amber:#b77900; --red:#d92d20; --gray:#9ca3af; --purple:#7a56d6;
    /* Riêng của app tiền: cột số, 増減 */
    --plus:#0b7a3b; --minus:#c0392b; --plan:#5b6ef5; --zero:#98a2b3;
  }
  html.dark{
    --bg-page:#0f1420; --bg-surface:#161c2c; --bg-subtle:#1b2334; --bg-hover:#1e2740; --bg-selected:#182a4a;
    --text-primary:#e8edf7; --text-secondary:#9aa7be; --text-muted:#7c8aa5;
    --border-default:#27314a; --border-strong:#344060;
    --primary:#3b8bff; --primary-hover:#5ea1ff; --primary-soft:#16233f;
    --success:#34d399; --success-soft:#0f2b1f;
    --warning:#fbbf24; --warning-soft:#2a2410;
    --danger:#f87171; --danger-hover:#ef4444; --danger-soft:#331b1b;
    --thead:#1b2334; --filter-bg:#1b2334; --input-bg:#0f1830;
    --green:#34d399; --amber:#fbbf24; --red:#f87171; --purple:#a78bfa;
    --plus:#4ade80; --minus:#f87171; --plan:#8ea2ff;
  }
  *{box-sizing:border-box; font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic UI','Yu Gothic',Meiryo,sans-serif;}
  body{margin:0; background:var(--bg); color:var(--text); font-size:14px; line-height:1.5;}
  .num{font-variant-numeric:tabular-nums;}
  .muted{color:var(--muted);}
  .hide{display:none !important;}
  button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
    outline:2px solid var(--primary); outline-offset:1px; border-radius:4px;}
  @media (prefers-reduced-motion:reduce){ *,*::before,*::after{transition:none !important; animation:none !important;} }
  body,.kpi,.modal,table,th,td,input,select,textarea,.btn,.badge,.panel{
    transition:background-color .25s ease,color .25s ease,border-color .25s ease;}
  input:not([type=checkbox]):not([type=radio]),select,textarea{background:var(--input-bg); color:var(--text);}
  #themeToggle{position:fixed; right:16px; bottom:16px; z-index:3000; width:46px; height:46px;
    border-radius:50%; border:1px solid var(--border); background:var(--card); color:var(--text);
    font-size:20px; cursor:pointer; box-shadow:0 6px 20px rgba(0,0,0,.18);
    display:flex; align-items:center; justify-content:center; transition:transform .15s;}
  #themeToggle:hover{transform:scale(1.08);}

  /* ===== TOP BAR ===== */
  #topbar{position:sticky; top:0; z-index:45; display:flex; align-items:center; gap:12px; height:56px; padding:0 16px;
    background:var(--card); color:var(--text); border-bottom:1px solid var(--border);}
  #menuBtn{display:flex; align-items:center; justify-content:center; background:transparent; border:none;
    color:var(--text); width:38px; height:38px; border-radius:9px; font-size:18px; cursor:pointer; flex-shrink:0;}
  #menuBtn:hover{background:var(--bg-hover);}
  /* ブランド: ロゴ ＋ 2段の文字。ロゴは背景が透明なので、明るい画面でも暗い画面でも
     そのまま置ける（白いタイルで囲う必要がない）。 */
  #topbar .brand{display:flex; align-items:center; gap:10px; white-space:nowrap; min-width:0;}
  #topbar .brand .blogo{height:32px; width:32px; flex:none; object-fit:contain;}
  #topbar .brand .btxt{display:flex; flex-direction:column; line-height:1.25; min-width:0;}
  #topbar .brand .btxt b{font-size:14.5px; font-weight:800; letter-spacing:.03em; color:var(--text);}
  #topbar .brand .btxt i{font-style:normal; font-size:10.5px; font-weight:600; letter-spacing:.08em; color:var(--text-muted);}
  #topbar .topsearch{position:relative; margin-left:8px; flex:1; max-width:420px;}
  #topbar .topsearch input{width:100%; height:38px; border:1px solid var(--border); border-radius:10px; padding:0 12px 0 34px;
    font-size:13px; background:var(--bg-subtle); color:var(--text); outline:none;}
  #topbar .topsearch input:focus{background:var(--card); border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-soft);}
  #topbar .topsearch .si{position:absolute; left:10px; top:10px; width:18px; height:18px; opacity:.55; pointer-events:none;}
  #topbar .top-right{display:flex; align-items:center; gap:10px; margin-left:auto;}
  .fy-pick{background:var(--card); color:var(--text); border:1px solid var(--border-strong); border-radius:8px; padding:7px 10px; font-size:12.5px; font-weight:600;}
  .avatar{width:32px;height:32px;border-radius:50%;background:var(--primary-soft);color:var(--primary);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;cursor:pointer;flex:none;overflow:hidden;}
  .avatar img{width:100%;height:100%;object-fit:cover;}
  .acct-menu{position:absolute;right:14px;top:52px;background:var(--card);border:1px solid var(--border);border-radius:12px;
    box-shadow:0 12px 34px rgba(16,24,40,.16);min-width:230px;padding:6px;z-index:60;display:none;}
  .acct-menu.open{display:block;}
  .acct-menu .who{padding:9px 12px;border-bottom:1px solid var(--border);margin-bottom:4px;}
  .acct-menu .who b{display:block;font-size:13px;} .acct-menu .who i{font-style:normal;font-size:11.5px;color:var(--muted);}

  /* ===== 通知ベル ＋ 入力ガイド（CRMと同じ置き方・同じ操作感） ===== */
  .icon-btn{position:relative; width:36px; height:36px; border-radius:50%; background:transparent;
    border:1px solid var(--border-strong); color:var(--text); cursor:pointer; display:grid; place-items:center; flex:none;}
  .icon-btn:hover{background:var(--bg-hover);}
  .icon-btn svg{width:19px; height:19px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;}
  .notif{position:relative;}
  .notif-dot{position:absolute; top:-3px; right:-3px; min-width:17px; height:17px; padding:0 4px; border-radius:9px;
    background:var(--danger); color:#fff; font-size:10.5px; font-weight:700; line-height:17px; text-align:center;
    border:2px solid var(--card); display:none;}
  .notif-menu{position:absolute; right:0; top:44px; width:380px; max-width:92vw; max-height:74vh; overflow-y:auto;
    background:var(--card); color:var(--text); border:1px solid var(--border); border-radius:14px;
    box-shadow:0 12px 34px rgba(16,24,40,.16); padding:6px; display:none; z-index:60;}
  .notif.open .notif-menu{display:block;}
  .nm-head{font-weight:700; font-size:11.5px; color:var(--muted); letter-spacing:.03em;
    padding:9px 11px 5px; border-bottom:1px solid var(--border); margin-bottom:3px;}
  .nm-item{display:flex; gap:9px; align-items:flex-start; padding:9px 11px; border-radius:9px; cursor:pointer;}
  .nm-item:hover{background:var(--bg-hover);}
  .nm-item .nm-ic{flex:none; width:22px; height:22px; border-radius:6px; display:grid; place-items:center; font-size:11px; font-weight:700;}
  .nm-item .nm-txt{flex:1; font-size:12.5px; line-height:1.55;}
  .nm-item .nm-amt{font-weight:700; font-variant-numeric:tabular-nums;}
  .nm-time{font-size:10.5px; color:var(--muted);}
  .nm-empty{padding:16px 12px; text-align:center; font-size:12.5px; color:var(--muted);}
  .nm-chips{display:flex; gap:6px; padding:6px 10px 9px; flex-wrap:wrap;}
  .nm-chips button{border:1px solid var(--border); background:var(--card); color:var(--text); border-radius:999px;
    padding:5px 11px; font:inherit; font-size:11.5px; cursor:pointer; white-space:nowrap;}
  .nm-chips button:hover{border-color:var(--primary); color:var(--primary);}
  @media(max-width:720px){ .notif-menu{position:fixed; left:10px; right:10px; top:60px; width:auto; max-width:none;} }

  /* ===== SHELL + SIDEBAR ===== */
  .shell{display:flex; align-items:flex-start;}
  #sidebar{flex-shrink:0; width:236px; background:var(--card); border-right:1px solid var(--border);
    height:calc(100vh - 56px); position:sticky; top:56px; overflow-y:auto; padding:12px 10px 24px;}
  #sidebar nav{display:flex; flex-direction:column; gap:2px;}
  .nav-grp{display:flex; align-items:center; gap:8px; width:100%; text-align:left; background:transparent; border:none;
    color:var(--text-secondary); padding:11px 12px 9px; margin-top:6px; font-size:12.5px; font-weight:800; letter-spacing:.04em;
    cursor:pointer; border-radius:8px;}
  .nav-grp:hover{background:var(--bg-hover); color:var(--text);}
  .nav-grp .chev{margin-left:auto; flex:none; width:14px; height:14px; transition:transform .22s ease; opacity:.75;}
  .nav-grp.open .chev{transform:rotate(90deg);}
  .nav-grp .gbdg{flex:none;background:var(--danger);color:#fff;font-size:9.5px;font-weight:800;border-radius:999px;
    min-width:16px;height:16px;line-height:16px;text-align:center;padding:0 4px;}
  .nav-grp-body{overflow:hidden; max-height:0; opacity:.4; transition:max-height .26s ease, opacity .2s ease;}
  .nav-grp-body.open{max-height:640px; opacity:1;}
  .navitem{display:flex; align-items:center; gap:11px; width:100%; text-align:left; background:transparent; border:none;
    color:var(--text-secondary); padding:9px 12px 9px 20px; border-radius:8px; font-size:14px; cursor:pointer;}
  .navitem:hover{background:var(--bg-hover); color:var(--text);}
  .navitem.active{background:var(--bg-selected); color:var(--primary); font-weight:650;}
  .navitem .ic{width:19px; height:19px; flex-shrink:0;}
  .navitem .nbdg{margin-left:auto;background:var(--danger);color:#fff;font-size:10px;font-weight:800;border-radius:999px;
    min-width:17px;height:17px;line-height:17px;text-align:center;padding:0 4px;}
  #sidebarOverlay{display:none; position:fixed; inset:56px 0 0 0; background:rgba(15,23,42,.35); z-index:38;}
  main{flex:1; min-width:0; padding:20px 22px 60px;}
  .page{display:none;} .page.active{display:block;}
  @media (min-width:981px){
    body.sidebar-hidden #sidebar{width:60px; padding-left:6px; padding-right:6px;}
    body.sidebar-hidden #sidebar .navitem{justify-content:center; gap:0; padding:9px 0;}
    body.sidebar-hidden #sidebar .navitem span,body.sidebar-hidden #sidebar .nav-grp{display:none;}
    body.sidebar-hidden #sidebar .nav-grp-body{max-height:none !important; opacity:1;}
  }
  @media (max-width:980px){
    #topbar .brand .btxt i{display:none;}   /* 狭い画面: システム名の副題は省く（ロゴと社名は残す） */
    .shell{display:block;}
    #sidebar{position:fixed; left:0; top:56px; z-index:39; transform:translateX(-100%);
      transition:transform .28s cubic-bezier(.22,1,.36,1); box-shadow:8px 0 30px rgba(0,0,0,.18);
      height:calc(100dvh - 56px); padding-bottom:110px;}
    body.sidebar-open #sidebar{transform:translateX(0);}
    body.sidebar-open #sidebarOverlay{display:block;}
    main{padding:14px 14px 80px;}
  }
  @media (max-width:560px){ #topbar{gap:8px;padding:0 10px;} #topbar .brand-word{display:none;} }

  /* ===== Nút — đúng 3 loại ===== */
  .btn{display:inline-flex; align-items:center; gap:6px; background:var(--primary); color:#fff; border:1px solid transparent;
    padding:8px 15px; border-radius:8px; cursor:pointer; font-size:13px; font-weight:600; line-height:1.4;}
  .btn:hover{background:var(--primary-hover);}
  .btn:active{transform:translateY(1px);}
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  .btn.secondary{background:var(--card); color:var(--text); border:1px solid var(--border-strong);}
  .btn.secondary:hover{background:var(--bg-subtle);}
  .btn.danger{background:var(--card); color:var(--danger); border:1px solid #f3b6b1;}
  .btn.danger:hover{background:var(--danger-soft);}
  .btn.sm{padding:5px 10px; font-size:12px;}
  .pillbtn{display:inline-flex; align-items:center; gap:5px; cursor:pointer; font-size:11.5px; font-weight:600;
    padding:7px 13px; border-radius:999px; border:1px solid transparent; white-space:nowrap; user-select:none;
    transition:transform .14s ease, box-shadow .14s ease;}
  .pillbtn:hover{transform:translateY(-1px); box-shadow:0 3px 9px rgba(20,60,120,.16);}
  .pill-save{background:var(--primary-soft); color:var(--primary); border-color:#BBD8FB;}
  .pill-manage{background:#F1F4F8; color:#5A7490; border-color:#DDE5EF;}
  .pill-new{background:#E7F7EC; color:#166534; border-color:#BEE9CB;}
  html.dark .pill-save{background:#16233F;color:#7FB3FF;border-color:#2B4470;}
  html.dark .pill-manage{background:#1B2746;color:#B7C3D8;border-color:#2E3D62;}
  html.dark .pill-new{background:#13301F;color:#7BD79B;border-color:#28502F;}

  /* ===== Badge ===== */
  .badge{padding:2px 9px; border-radius:6px; font-size:11px; font-weight:600; display:inline-block; line-height:1.6; white-space:nowrap;}
  .b-gray{background:#f2f4f7; color:#5f6b7a;}
  .b-blue{background:#eaf3ff; color:#0b5cd7;}
  .b-green{background:#eaf7ee; color:#238636;}
  .b-amber{background:#fff5d9; color:#9a6700;}
  .b-red{background:#fff0ef; color:#d92d20;}
  .b-purple{background:#f2ecff; color:#6941c6;}
  html.dark .b-gray{background:#232c42;color:#a8b3c7;} html.dark .b-blue{background:#16233f;color:#7fb3ff;}
  html.dark .b-green{background:#12301f;color:#6ee7a8;} html.dark .b-amber{background:#2b2410;color:#fbbf24;}
  html.dark .b-red{background:#331b1b;color:#fca5a5;}   html.dark .b-purple{background:#241b3a;color:#c4b5fd;}
  .tag{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:5px;
    border:1px solid var(--border-strong);color:var(--muted);background:var(--surface-2);}
  .tag.crm{color:var(--primary);border-color:#bcd8ff;background:var(--primary-soft);}
  .tag.manual{color:#6941c6;border-color:#ded0ff;background:#f4efff;}
  html.dark .tag.manual{background:#241b3a;border-color:#3d3163;color:#c4b5fd;}

  /* ===== Bảng ===== */
  table{width:100%; border-collapse:collapse; background:var(--card); border-radius:10px; overflow:clip; font-size:12.5px;}
  th,td{padding:9px 12px; border-bottom:1px solid var(--border); text-align:left; white-space:nowrap;}
  th{background:var(--thead); color:var(--text-secondary); font-weight:600; font-size:12.5px; position:sticky; top:0; z-index:2;}
  tr:hover td{background:var(--row-hover);}
  .table-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:12px; background:var(--card); box-shadow:var(--shadow-sm);}
  td.r,th.r{text-align:right; font-variant-numeric:tabular-nums;}
  td.c,th.c{text-align:center;}
  tr.clickable{cursor:pointer;}
  .empty{padding:26px; text-align:center; color:var(--muted); font-size:13px;}
  .totrow td{font-weight:700; background:var(--surface-2);}
  /* Cột đầu dính khi kéo ngang — bảng 予実 rất rộng */
  .stick1 th:first-child,.stick1 td:first-child{position:sticky; left:0; background:var(--card); z-index:1;}
  .stick1 th:first-child{z-index:3; background:var(--thead);}
  .stick1 tr:hover td:first-child{background:var(--row-hover);}

  /* ===== Panel / KPI ===== */
  .panel{border:1px solid var(--border); border-radius:12px; background:var(--card); box-shadow:var(--shadow-sm); margin-bottom:16px; overflow:hidden;}
  .panel-hd{display:flex; align-items:center; gap:8px; padding:10px 14px; border-bottom:1px solid var(--border); background:var(--thead);}
  .panel-hd b{font-size:13.5px; font-weight:650;}
  .panel-hd .sub{font-size:11.5px; color:var(--muted);}
  .panel-bd{padding:14px;}
  .panel-bd.tight{padding:0;}
  .kpi-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(168px,1fr)); gap:10px; margin-bottom:16px;}
  .kpi{background:var(--card); border:1px solid var(--border); border-radius:10px; padding:12px 14px;}
  .kpi .lbl{font-size:11.5px; color:var(--muted); margin-bottom:3px; display:flex; align-items:center; gap:5px;}
  .kpi .num{font-size:22px; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:-.02em;}
  .kpi .sub{font-size:11px; color:var(--muted); margin-top:2px;}
  .kpi.clickable{cursor:pointer;} .kpi.clickable:hover{border-color:var(--primary);}
  .dash-section{border-radius:14px; margin-bottom:16px; overflow:hidden; border:1px solid var(--border); background:var(--card); box-shadow:var(--shadow-sm);}
  .dash-head{padding:11px 16px; font-size:14px; font-weight:650; color:#fff; display:flex; align-items:center; gap:8px;}
  .dash-head .cnt{margin-left:auto; background:rgba(255,255,255,.25); padding:2px 11px; border-radius:13px; font-size:13px; font-weight:700;}
  .dash-head.clickable{cursor:pointer;} .dash-head.clickable:hover{filter:brightness(1.08);}
  .c-blue .dash-head{background:#3577e0;} .c-teal .dash-head{background:#149086;}
  .c-amber .dash-head{background:#d08a1d;} .c-red .dash-head{background:#d6544c;}
  .c-green .dash-head{background:#2f9e57;} .c-purple .dash-head{background:#7a56d6;}

  /* ===== Toolbar ===== */
  .toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; flex-wrap:wrap; gap:8px;}
  .toolbar-left{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .section-title{font-size:16px; font-weight:650; margin:0; letter-spacing:-.01em;}
  .page-sub{font-size:12px; color:var(--muted); margin:-6px 0 12px;}
  details.more-tools{position:relative;}
  details.more-tools>summary{list-style:none; cursor:pointer;}
  details.more-tools>summary::-webkit-details-marker{display:none;}
  .more-panel{position:absolute; right:0; top:calc(100% + 5px); background:var(--card); border:1px solid var(--border);
    border-radius:12px; box-shadow:0 12px 32px rgba(16,24,40,.14); padding:8px; z-index:36; min-width:232px;
    display:flex; flex-direction:column; gap:6px;}
  .more-panel .btn{justify-content:flex-start; width:100%;}
  .more-panel hr{border:none; border-top:1px solid var(--border); margin:2px 0;}
  /* 画面の上のタブ＝「同じ仕事の、見方の違い」。ページの中のタブ(.tabs)とは形を変えて、
     どちらの階層にいるかが一目で分かるようにする。 */
  .sectabs{display:flex; gap:6px; margin:0 0 14px; overflow-x:auto; padding-bottom:2px;}
  .sectabs button{border:1px solid var(--border-strong); background:var(--card); color:var(--text-secondary);
    border-radius:999px; padding:7px 15px; font:inherit; font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap;}
  .sectabs button:hover{border-color:var(--primary); color:var(--primary);}
  .sectabs button.on{background:var(--primary); border-color:var(--primary); color:#fff;}
  .sectabs button .n{display:inline-block; margin-left:6px; background:var(--danger); color:#fff;
    border-radius:999px; padding:0 6px; font-size:10.5px; line-height:16px; font-variant-numeric:tabular-nums;}
  .sectabs button.on .n{background:rgba(255,255,255,.28);}
  @media print{ .sectabs{display:none !important;} }

  .tabs{display:flex; gap:2px; border-bottom:1px solid var(--border); margin-bottom:14px; overflow-x:auto;}
  .tabs button{border:0; background:none; font-family:inherit; font-size:13.5px; color:var(--muted);
    padding:9px 14px; cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap;}
  .tabs button:hover{color:var(--text);}
  .tabs button.on{color:var(--primary); font-weight:650; border-bottom-color:var(--primary);}
  .tabs button .n{font-size:11.5px; margin-left:5px; font-variant-numeric:tabular-nums;}
  .seg{display:inline-flex; border:1px solid var(--border-strong); border-radius:9px; overflow:hidden;}
  .seg button{border:0; background:var(--card); color:var(--muted); font-family:inherit; font-size:12.5px;
    padding:7px 13px; cursor:pointer; border-right:1px solid var(--border);}
  .seg button:last-child{border-right:0;}
  .seg button.on{background:var(--primary); color:#fff; font-weight:650;}
  .bulkbar{background:var(--primary); color:#fff; border-radius:8px; padding:7px 14px; margin-bottom:10px;
    display:flex; gap:12px; align-items:center; flex-wrap:wrap;}
  .bulkbar .btn{background:rgba(255,255,255,.18); border-color:transparent; padding:6px 13px; font-size:12px;}
  .bulkbar .btn:hover{background:rgba(255,255,255,.3);}
  .alertbar{border:1px solid var(--danger); background:var(--danger-soft); color:var(--danger-hover);
    border-radius:10px; padding:10px 14px; margin-bottom:12px; font-size:12.5px; font-weight:600;
    display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  .warnbar{border:1px solid #f0d08a; background:var(--warning-soft); color:#8a6100;
    border-radius:10px; padding:10px 14px; margin-bottom:12px; font-size:12.5px;}
  .infobar{border:1px solid var(--border); background:var(--surface-2); color:var(--muted);
    border-radius:10px; padding:9px 13px; margin-bottom:12px; font-size:12px;}

  /* ===== Modal ===== */
  .modal-bg{position:fixed; inset:0; background:rgba(15,23,42,.35); display:none; align-items:center; justify-content:center; z-index:50; padding:16px;}
  .modal-bg.show{display:flex;}
  .modal{background:var(--card); color:var(--text); border-radius:14px; padding:20px 24px; width:540px; max-width:100%;
    max-height:88vh; overflow:auto; box-shadow:0 20px 60px rgba(16,24,40,.18); border:1px solid var(--border);}
  .modal h3{margin:0 0 4px; font-size:15.5px;}
  .modal .mdsub{font-size:11.5px; color:var(--muted); margin-bottom:12px;}
  @media(min-width:981px){ .modal.modal-lg{width:900px;} .modal.modal-xl{width:1220px;} }
  #modalBg2{z-index:60;}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:16px; padding-top:12px; border-top:1px solid var(--border);}
  .modal-actions.split{justify-content:space-between;}
  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .form-grid label{font-size:12px; color:var(--muted); display:block; margin-bottom:3px;}
  .form-grid input,.form-grid select,.form-grid textarea{width:100%; padding:9px 11px; border:1px solid var(--border-strong);
    border-radius:8px; font-size:13.5px; background:var(--input-bg); color:var(--text);}
  .form-grid input:focus,.form-grid select:focus,.form-grid textarea:focus{border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-soft); outline:none;}
  .form-grid input[readonly]{background:var(--surface-2); color:var(--muted); cursor:not-allowed;}
  .form-grid textarea{line-height:1.55; min-height:70px;}
  .full{grid-column:1/-1;}
  .li{width:15px; height:15px; flex:none; vertical-align:-2.5px;}
  .form-section{grid-column:1/-1; margin:10px 0 2px; padding:6px 11px; font-weight:700; font-size:12.5px;
    color:var(--primary); background:var(--section-bg); border-radius:4px; display:flex; align-items:center; gap:8px;}
  .form-section:first-child{margin-top:0;}
  .fhelp{font-size:11px; color:var(--muted); margin-top:3px; line-height:1.5;}
  @media(max-width:700px){ .form-grid{grid-template-columns:1fr;} }

  /* ===== 取引先モーダル（得意先／支払先）: 横3列（大）→ 2列（中）→ 1列（スマホ） ===== */
  .modal.modal-co{width:1320px; max-width:min(94vw,100%); max-height:94vh; padding:14px 20px 12px;}
  .coform .lb-ap,.coform .lb-both{display:none;}
  .coform[data-side=ap] .lb-ar,.coform[data-side=both] .lb-ar{display:none;}
  .coform[data-side=ap] .lb-ap,.coform[data-side=both] .lb-both{display:inline;}
  .coform[data-side=ar] [data-only=ap]:not(.hasv),.coform[data-side=ap] [data-only=ar]:not(.hasv){display:none;}
  .co-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:10px;}
  .co-title{display:flex; align-items:center; flex-wrap:wrap; gap:6px 10px; min-width:0;}
  .modal .co-title h3{margin:0; font-size:16.5px;}
  .co-mode{font-weight:600; color:var(--muted); font-size:13px; margin-left:8px;}
  .co-dir{display:inline-block; font-size:12px; font-weight:600; padding:3px 11px; border-radius:999px; border:1px solid transparent;}
  .co-dir.d-ar{background:#eaf3ff; color:#0b5cd7; border-color:#bcd7fb;}
  .co-dir.d-ap{background:#f2ecff; color:#6941c6; border-color:#d9cbfa;}
  .co-dir.d-both{background:#e7f7ec; color:#166534; border-color:#bee9cb;}
  html.dark .co-dir.d-ar{background:#16233f; color:#7fb3ff; border-color:#2b4470;}
  html.dark .co-dir.d-ap{background:#241b3a; color:#c4b5fd; border-color:#3d2f63;}
  html.dark .co-dir.d-both{background:#13301f; color:#7bd79b; border-color:#28502f;}
  .co-lock{font-size:11.5px; color:var(--muted);}
  .co-x{flex:none; width:32px; height:32px; border:1px solid var(--border); border-radius:8px; background:var(--card); color:var(--muted);
    display:inline-flex; align-items:center; justify-content:center; cursor:pointer;}
  .co-x:hover{color:var(--text); background:var(--row-hover);}
  .co3{display:grid; grid-template-columns:minmax(0,35fr) minmax(0,30fr) minmax(0,35fr); border:1px solid var(--border); border-radius:10px;}
  .co-col{min-width:0; padding:10px 14px 12px;}
  .co-col+.co-col{border-left:1px solid var(--border);}
  .co-colhead{display:flex; align-items:center; gap:6px; font-weight:700; font-size:13px; color:var(--primary);
    margin-bottom:8px; padding-bottom:6px; border-bottom:1px solid var(--border);}
  .form-grid.co-sub{grid-template-columns:repeat(2,minmax(0,1fr)); gap:7px 10px;}
  .co-sub > div{min-width:0;}
  .form-grid.co-sub label{font-size:11.5px; margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .form-grid.co-sub input,.form-grid.co-sub select,.form-grid.co-sub textarea{padding:6px 9px; font-size:13px; border-radius:7px;}
  .form-grid.co-sub textarea{min-height:0; height:66px; resize:vertical; line-height:1.5;}
  .co-v > div{font-size:13.5px; min-height:24px; padding:1px 0 4px; border-bottom:1px dashed var(--border); overflow-wrap:anywhere;}
  .co-note{max-height:4.8em; overflow:auto; white-space:pre-wrap;}
  .co-preview{font-size:12px; line-height:1.6; background:var(--surface-2); border-radius:7px; padding:6px 9px;}
  .co-stats{display:flex; gap:10px; align-items:stretch; margin-top:10px; min-width:0;}
  .co-stats-lb{flex:none; display:flex; align-items:center; gap:5px; font-size:12px; font-weight:700; color:var(--muted);}
  .co-stat-row{flex:1; min-width:0; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px;}
  .co-stat-row.n5{grid-template-columns:repeat(5,minmax(0,1fr));}
  .co-stat{min-width:0; border:1px solid var(--border); border-radius:9px; padding:7px 11px; background:var(--card);}
  .co-stat.click{cursor:pointer;}
  .co-stat.click:hover{border-color:var(--primary); background:var(--row-hover);}
  .co-stat .lbl{font-size:11px; font-weight:600; color:var(--muted);}
  .co-stat .val,.co-stat .sub{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .co-stat .val{font-size:13px; margin-top:1px;}
  .co-stat .val .big{font-size:17px;}
  .co-stat .sub{font-size:11px; color:var(--muted); margin-top:2px;}
  .co-att{display:flex; align-items:center; gap:8px; min-width:0; margin-top:8px; padding:6px 11px; border:1px solid var(--border); border-radius:9px; font-size:12.5px;}
  .co-att-lb{flex:none; display:inline-flex; align-items:center; gap:5px; font-weight:700; color:var(--muted);}
  .co-att-list{flex:1; min-width:0; display:flex; flex-wrap:wrap; gap:6px;}
  .co-chip{max-width:240px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer; font-size:12px; font-weight:600;
    color:var(--primary); background:var(--primary-soft); padding:2px 9px; border-radius:6px;}
  .co-chip.more{color:var(--muted); background:var(--surface-2);}
  .co-att-add{flex:none;}
  .modal-co .modal-actions{margin-top:10px; padding-top:10px;}
  @media(max-width:1100px){
    .co3{grid-template-columns:repeat(2,minmax(0,1fr));}
    .co-col:nth-child(3){grid-column:1/-1; border-left:none; border-top:1px solid var(--border);}
    .co-stats{flex-direction:column; gap:6px;}
    .co-stat-row,.co-stat-row.n5{grid-template-columns:repeat(auto-fit,minmax(180px,1fr));}
  }
  @media(max-width:700px){
    .co3{grid-template-columns:minmax(0,1fr);}
    .co-col+.co-col{border-left:none; border-top:1px solid var(--border);}
    .co-att{flex-wrap:wrap;}
  }
  @media(max-width:520px){ .form-grid.co-sub{grid-template-columns:minmax(0,1fr);} }

  /* ===== 回収（売掛金）: 取引先 × 月 の残高表 ===== */
  .ar-kpis .num{font-size:21px;}
  .ar-filters{display:flex; align-items:center; flex-wrap:wrap; gap:8px 14px; margin:0 0 10px;}
  .ar-chk{display:inline-flex; align-items:center; gap:5px; font-size:13px; cursor:pointer; user-select:none;}
  .ar-note{font-size:11.5px; margin-left:auto;}
  .ar-wrap{max-height:calc(100vh - 300px); overflow:auto;}
  .ar-tbl{border-collapse:separate; border-spacing:0; width:100%;}
  .ar-tbl th,.ar-tbl td{padding:6px 8px; font-size:12.5px;}
  .ar-tbl th{font-size:11.5px; line-height:1.2; vertical-align:bottom;}
  .ar-tbl .ar-y{display:block; font-size:9.5px; font-weight:500; color:var(--text-muted);}
  .ar-tbl .ar-co{position:sticky; left:0; z-index:1; background:var(--card); min-width:190px; white-space:nowrap; border-right:1px solid var(--border);}
  .ar-tbl th.ar-co{z-index:4; background:var(--thead);}
  .ar-tbl tr:hover td.ar-co{background:var(--row-hover);}
  .ar-tbl .totrow td.ar-co{background:var(--surface-2);}
  .ar-tbl td.ar-c{min-width:78px; cursor:pointer;}
  .ar-tbl td.ar-c:hover{box-shadow:inset 0 0 0 1.5px var(--primary); border-radius:4px;}
  .ar-tbl th.ar-cur,.ar-tbl td.ar-cur{background:var(--bg-selected);}
  .ar-tbl .ar-now{position:sticky; right:0; z-index:1; background:var(--card); border-left:1px solid var(--border); min-width:96px; font-weight:700; cursor:pointer;}
  .ar-tbl th.ar-now{z-index:4; background:var(--thead);}
  .ar-tbl .totrow td.ar-now{background:var(--surface-2);}
  .ar-name{cursor:pointer; color:var(--text); font-weight:600; margin-right:6px;}
  .ar-name:hover{color:var(--primary); text-decoration:underline;}
  .ar-fut{color:var(--border-strong);}
  .ar-pos{color:var(--text); font-weight:600;}
  .ar-neg{color:var(--text-muted);}
  .ar-over{color:var(--danger); font-weight:700;}
  .ar-st{display:inline-block; font-size:10px; font-weight:600; padding:0 6px; border-radius:5px; line-height:1.7; white-space:nowrap; vertical-align:1px;}
  .ar-st.s-ok{color:var(--text-muted); background:var(--surface-2);}
  .ar-st.s-open{color:var(--text-secondary); background:var(--surface-2); border:1px solid var(--border);}
  .ar-st.s-over{color:var(--danger); background:var(--danger-soft);}
  .ar-pop{position:absolute; z-index:40; width:290px; background:var(--card); color:var(--text); border:1px solid var(--border-strong);
    border-radius:10px; box-shadow:0 12px 32px rgba(16,24,40,.18); padding:10px 12px; font-size:12.5px;}
  .ar-pop-h{display:flex; justify-content:space-between; gap:8px; margin-bottom:6px;}
  .ar-pop-h .muted{font-size:11.5px;}
  .ar-x{cursor:pointer; color:var(--muted); display:inline-flex;}
  .ar-pop-t{width:100%; border-collapse:collapse;}
  .ar-pop-t td{padding:3px 0; border:none; font-size:12.5px;}
  .ar-pop-t tr.sum td{border-top:1px solid var(--border); font-weight:700; padding-top:5px;}
  .ar-pop-t tr:hover td{background:none;}
  .ar-pop-l{margin-top:8px; border-top:1px dashed var(--border); padding-top:6px; font-size:11.5px;}
  .ar-pop-i{display:flex; justify-content:space-between; gap:6px; padding:1px 0;}
  .ar-pop-i a,.ar-pop-f a{color:var(--primary); cursor:pointer;}
  .ar-pop-f{margin-top:8px; text-align:right; font-size:12px;}
  .ar-src{font-size:9.5px; font-weight:700; padding:0 4px; border-radius:4px; background:var(--primary-soft); color:var(--primary);}
  .ar-src.man{background:var(--surface-2); color:var(--text-secondary);}
  .ar-src.old{background:var(--surface-2); color:var(--text-muted);}
  .ar-led-h{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .ar-led-h h3{display:flex; align-items:center; gap:8px;}
  .ar-led-k{display:flex; gap:26px; margin:4px 0 10px;}
  .ar-led-k > div{display:flex; flex-direction:column;}
  .ar-led-k .muted{font-size:11.5px;} .ar-led-k b{font-size:20px;}
  .ar-led{max-height:58vh; overflow:auto;}
  .ar-led td,.ar-led th{padding:6px 12px;}
  .ar-mf-src{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .ar-mf-row{display:flex; flex-wrap:wrap; align-items:center; gap:6px;}
  .ar-mf-row input{padding:5px 8px; border:1px solid var(--border-strong); border-radius:7px;}
  .ar-mf-sum{display:flex; flex-wrap:wrap; gap:6px 16px; font-size:13px; margin-bottom:8px;}
  @media(max-width:980px){ .ar-mf-src{grid-template-columns:1fr;} .ar-note{margin-left:0;} .ar-wrap{max-height:none;} }
  @media(max-width:560px){ .ar-tbl .ar-co{min-width:130px;} .ar-tbl .ar-now{position:static;} }
  @media print{ .ar-wrap{max-height:none; overflow:visible;} .ar-pop{display:none;} }
  .ac-wrap{position:relative;}
  .ac-list{position:absolute; top:calc(100% + 3px); left:0; right:0; background:var(--card); border:1px solid var(--border);
    border-radius:10px; box-shadow:0 10px 26px rgba(16,24,40,.14); z-index:70; max-height:250px; overflow-y:auto; display:none;}
  .ac-list.show{display:block;}
  .ac-item{padding:8px 12px; font-size:13px; cursor:pointer; display:flex; justify-content:space-between; gap:10px;}
  .ac-item:hover{background:var(--primary-soft); color:var(--primary);}

  /* ===== Ô nhập số tiền trong bảng (予実・予算入力) ===== */
  .cellin{width:100%; border:1px solid transparent; background:transparent; color:var(--text); text-align:right;
    font-size:12.5px; font-variant-numeric:tabular-nums; padding:4px 6px; border-radius:5px; font-family:inherit;}
  .cellin:hover{border-color:var(--border-strong); background:var(--input-bg);}
  .cellin:focus{border-color:var(--primary); background:var(--input-bg); box-shadow:0 0 0 2px var(--primary-soft); outline:none;}
  .cellin.dirty{background:var(--warning-soft);}
  .cellin.over{background:var(--danger-soft); color:var(--danger-hover); font-weight:700;
    box-shadow:inset 3px 0 0 var(--danger);}
  .cellin.under{background:var(--success-soft); color:var(--success); box-shadow:inset 3px 0 0 var(--success);}
  .grprow td{background:var(--surface-2); font-weight:700; font-size:11.5px; color:var(--muted); letter-spacing:.03em;}
  td.curcol{box-shadow:inset 0 0 0 1px var(--primary-soft);}

  /* ===== 取引先台帳: 12か月の帯 =====
     色は「その伝票の期日（取引先ごとに違う）」と比べて決める。計上からの日数では決めない。 */
  .lgbar{display:block; height:13px; border-radius:3px; background:var(--gray);}
  .lg-ok{background:#2ea34d;}  .lg-warn{background:#e0a80f;} .lg-bad{background:#e04b3d;}
  .lg-wait{background:#cbd5e1;} .lg-over{background:#8b6ff0;} .lg-none{background:transparent;}
  .lgcell{padding:6px 4px !important;}
  .lgdue{outline:2px dashed var(--text-muted); outline-offset:1px;}
  .lgdot{font-size:10px; line-height:1.3; text-align:center; color:var(--text-secondary);}
  .attbtn{display:inline-flex; align-items:center; gap:2px; color:var(--text-muted); cursor:pointer; padding:2px 4px; border-radius:6px;}
  .attbtn:hover{background:var(--bg-hover); color:var(--primary);}
  .attbtn.has{color:var(--primary);}
  .attbtn span{font-size:11px; font-weight:700; font-variant-numeric:tabular-nums;}
  .attdrop{display:block; border:2px dashed var(--border-strong); border-radius:12px; padding:18px; text-align:center;
    cursor:pointer; background:var(--bg-subtle); font-size:13px; line-height:1.8;}
  .attdrop:hover,.attdrop.over{border-color:var(--primary); background:var(--primary-soft);}
  .kbtw{display:inline-block; width:16px; color:var(--text-muted); font-size:10px; user-select:none;}
  .lgkey{display:inline-block; width:14px; height:9px; border-radius:2px; margin-right:3px; vertical-align:middle;}
  .printonly{display:none;}
  .plus{color:var(--plus);} .minus{color:var(--minus);} .zero{color:var(--zero);}
  .rate{font-size:11px; font-weight:700;}
  .bar{height:6px; border-radius:99px; background:var(--border); overflow:hidden; min-width:52px;}
  .bar i{display:block; height:100%; border-radius:99px; background:var(--primary);}
  .bar i.ok{background:var(--green);} .bar i.warn{background:var(--amber);} .bar i.bad{background:var(--red);}
  .spark{display:flex; align-items:flex-end; gap:2px; height:26px;}
  .spark i{flex:1; min-width:3px; background:var(--primary-soft); border-radius:2px 2px 0 0;}
  .spark i.on{background:var(--primary);}

  /* ===== Đăng nhập ===== */
  #loginPage{position:fixed; inset:0; background:var(--bg-page); display:flex; align-items:center; justify-content:center; z-index:2000; padding:20px;}
  .login-card{background:var(--card); border:1px solid var(--border); border-radius:16px; padding:40px 36px; width:404px; max-width:100%;
    box-shadow:0 12px 40px rgba(16,24,40,.08); text-align:center;}
  .login-logo{width:84px; height:84px; margin:0 auto 16px; display:block; object-fit:contain;}
  .login-brand{font-size:22px; font-weight:900; color:var(--text); letter-spacing:.06em; margin-bottom:3px;}
  .login-sub{font-size:12.5px; color:var(--muted); margin-bottom:24px; letter-spacing:.04em;}
  .login-note{font-size:11.5px; color:var(--muted); margin-top:18px; line-height:1.7;}
  .login-err{color:var(--red); font-size:12.5px; margin-top:12px; min-height:18px;}
  #gbtn{display:flex; justify-content:center;}

  /* ===== In ấn: chỉ in dữ liệu, không in công cụ ===== */
  @media print{
    #topbar,#sidebar,#themeToggle,.toolbar,.tabs,.seg,.bulkbar,.more-tools,.modal-bg,#sidebarOverlay{display:none !important;}
    .printonly{display:block !important;}

/* ============================================================================

/* ============ ① CONFIG ============ */

/* ============ ② 権限 — backend/src/authz.ts と同じ表 ============

const ADMIN_ONLY_PAGES = ['users','audit','settings','crmlink','apilink'];

function myRole(){ return (SESSION && SESSION.role) || 'Viewer'; }

/* 同じ台帳を別の入口から見る画面は、権限も同じにする（二重に設定させない） */
const PAGE_PERM_ALIAS = { arbook:'invoices', vendors:'companies', ledger:'companies', arco:'invoices', apco:'bills', dunning:'invoices', kbunrui:'expenses', properties:'properties', accounts:'settings' };
function permOf(page){
  page = PAGE_PERM_ALIAS[page] || page;
  const role = myRole();
  if(role==='Admin') return {c:1,e:1,d:1,v:1};
  const own = (DB && DB.userPerms && DB.userPerms[(SESSION&&SESSION.email)||''] || {})[page];
  const def = (ROLE_DEFAULT[role]||{})[page] || {c:0,e:0,d:0};
  /* 見せない画面は、作る・直す・消す もできない（backend/src/authz.ts と同じ決まり） */
  const v = own&&'v' in own? +own.v : 1;
  return { c: v&&(own&&'c' in own?+own.c:def.c)?1:0, e: v&&(own&&'e' in own?+own.e:def.e)?1:0,
           d: v&&(own&&'d' in own?+own.d:def.d)?1:0, v };
}
const canCreate = p => !!permOf(p).c;
const canEdit   = p => !!permOf(p).e;

  return !!permOf(page).v;

/* ============ ③ 会計年度 — 8/1〜翌7/31 ============
   2025年度 = 2025-08-01 〜 2026-07-31。四半期 Q1=8〜10月。
   月配列の index 0 は必ず「8月」。全画面この約束で動く。 */
const FY_START_MONTH = 8;
const FY_MONTH_LABELS = ['8月','9月','10月','11月','12月','1月','2月','3月','4月','5月','6月','7月'];
const QUARTERS = [{k:1,label:'Q1（8〜10月）',s:0},{k:2,label:'Q2（11〜1月）',s:3},
                  {k:3,label:'Q3（2〜4月）',s:6},{k:4,label:'Q4（5〜7月）',s:9}];
let CUR_FY = 2025;                                  // 画面が見ている年度

function fyOf(ym){ if(!ym) return null; const [y,m]=String(ym).split('-').map(Number); return m>=FY_START_MONTH? y : y-1; }
function fyLabel(fy){ return `${fy}年度（${fy}/8〜${fy+1}/7）`; }
function fyMonths(fy){
  return Array.from({length:12},(_,i)=>{ const t=FY_START_MONTH+i;
    const y=fy+Math.floor((t-1)/12), m=((t-1)%12)+1; return `${y}-${String(m).padStart(2,'0')}`; });
}
function fyIndexOf(ym){ const m=Number(String(ym).split('-')[1]); return (m-FY_START_MONTH+12)%12; }
function quarterOfIdx(i){ return Math.floor(i/3)+1; }
function thisMonth(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addMonths(ym,n){ let [y,m]=ym.split('-').map(Number); m+=n; y+=Math.floor((m-1)/12); m=((m-1)%12+12)%12+1; return y+'-'+String(m).padStart(2,'0'); }
function addDays(ds,n){ const d=new Date(ds+'T00:00:00'); d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function daysBetween(a,b){ return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000); }
function monthEnd(ym){ const [y,m]=ym.split('-').map(Number); return ym+'-'+String(new Date(y,m,0).getDate()).padStart(2,'0'); }
function monthStart(ym){ return ym+'-01'; }
function daysInMonth(ym){ const [y,m]=ym.split('-').map(Number); return new Date(y,m,0).getDate(); }

/** 支払サイト → 入金期日。
    計上月を締めた月として、site か月後の payDay 日を期日にする。
      例) 末日締・翌月末払い  : 2025-08 → 2025-09-30
          20日締・翌々月25日払い: 2025-08 → 2025-10-25
    payDay=31 は「末日」の意味。2月なら28日（うるう年は29日）に丸める。
    ※ 締日(closing)は請求書に印字するための情報。どの月に締めるかは計上月で決めているため、
      期日の計算そのものには使わない（ここを月またぎで動かすと請求が二重になる）。 */
function dueDateOf(bookMonth, closing, site, payDay){
  site = Number(site==null?1:site); payDay = Number(payDay||31);
  const payYm = addMonths(bookMonth, site);
  return payYm+'-'+String(Math.min(payDay, daysInMonth(payYm))).padStart(2,'0');
}


/* ============ 営業日 — 期日が土日・祝日・年末年始に当たるとき ============
   ★ 2026-09-14 利用者と決めたこと: 期日が銀行の休業日に当たると、お客様は
     翌営業日（会社によっては前営業日）に払う。それを「遅れ」と数えると、
     期日どおりの会社の評価が不当に下がる（月末はよく土日に当たる）。
     だから「遅れているか」は必ず 調整後の期日（effDue）で判断する。
     請求書に書く期日（dueDate）そのものは変えない。
   ・銀行の休業日 ＝ 土日 ＋ 国民の祝日（振替休日・国民の休日を含む）＋ 12/31・1/2・1/3
   ・祝日は計算で出す（外部に取りに行かない）。2020年以降の法律どおり。
     backend/src/apiv1/finance.ts に同じ式があり、テストで突き合わせる。 */
const _JP_HOL = new Map();
function nthMonday(y, m, n){
  const first=new Date(y, m-1, 1).getDay();
  return 1 + ((8-first)%7) + (n-1)*7;
}
function jpHolidays(y){
  if(_JP_HOL.has(y)) return _JP_HOL.get(y);
  const base=new Set();
  const add=(m,d)=>base.add(`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`);
  add(1,1); add(1,nthMonday(y,1,2)); add(2,11);
  if(y>=2020) add(2,23);
  add(3, Math.floor(20.8431+0.242194*(y-1980)-Math.floor((y-1980)/4)));
  add(4,29); add(5,3); add(5,4); add(5,5);
  if(y===2020){ add(7,23); add(7,24); add(8,10); }
  else if(y===2021){ add(7,22); add(7,23); add(8,8); }
  else { add(7,nthMonday(y,7,3)); add(8,11); add(10,nthMonday(y,10,2)); }
  add(9,nthMonday(y,9,3));
  add(9, Math.floor(23.2488+0.242194*(y-1980)-Math.floor((y-1980)/4)));
  add(11,3); add(11,23);
  const out=new Set(base);
  /* 国民の休日: 前の日と次の日が祝日にはさまれた日 */
  [...base].sort().forEach(d=>{ if(base.has(addDays(d,2)) && !base.has(addDays(d,1))) out.add(addDays(d,1)); });
  /* 振替休日: 日曜の祝日 → 次の「祝日でない日」 */
  [...out].sort().forEach(d=>{
    if(new Date(d+'T00:00:00').getDay()===0){ let x=addDays(d,1); while(out.has(x)) x=addDays(x,1); out.add(x); }
  });
  _JP_HOL.set(y,out);
  return out;
}
function isBankHoliday(ds){
  if(!ds) return false;
  const w=new Date(ds+'T00:00:00').getDay();
  if(w===0||w===6) return true;
  const md=ds.slice(5);
  if(md==='12-31'||md==='01-02'||md==='01-03') return true;
  return jpHolidays(Number(ds.slice(0,4))).has(ds);
}
const DUE_ADJUST = ['翌営業日','前営業日','そのまま'];
/** 実際に払われるはずの日。会社の設定（期日が休業日のとき）で前後にずらす。 */
function effDue(doc){
  const d=doc && doc.dueDate; if(!d) return '';
  const c=findById('companies', doc.companyId);
  const mode=(c && c.dueAdjust) || '翌営業日';
  if(mode==='そのまま') return d;
  const step = mode==='前営業日' ? -1 : 1;
  let x=d, guard=0;
  while(isBankHoliday(x) && guard++<15) x=addDays(x,step);
  return x;
}
const isOverdue  = doc => { const e=effDue(doc); return !!e && e < today(); };
const daysOverdue = doc => { const e=effDue(doc); return e ? Math.max(0, daysBetween(e, today())) : 0; };

/* ============ 選択肢 ============ */

/* ============ ⑥ 共通部品 ============ */
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const attr = s => String(s==null?'':s).replace(/"/g,'&quot;');
const num  = v => { const n=Number(String(v==null?'':v).replace(/[^\d.-]/g,'')); return isFinite(n)?n:0; };
/** 金額表示。0 は薄く、マイナスは赤（会計は符号を見間違えると致命的） */
function money(n, opt){
  n = Math.round(num(n)); opt = opt||{};
  if(!n && !opt.keepZero) return '<span class="zero">0</span>';
  const s = n.toLocaleString('ja-JP');
  if(opt.plain) return s;
  return n<0 ? `<span class="minus">${esc(s)}</span>` : esc(s);
}
const yen = n => '¥'+Math.round(num(n)).toLocaleString('ja-JP');
const moneyPlain = n => Math.round(num(n)).toLocaleString('ja-JP');
/** 増減の表示: +12.3% / −5.0% / 比較不可 */
function pct(cur, base, opt){
  opt = opt||{};
  if(!base) return '<span class="zero">—</span>';
  const p = ((cur-base)/Math.abs(base))*100;
  const good = opt.reverse ? p<0 : p>0;
  const cls = Math.abs(p)<0.05 ? 'zero' : (good?'plus':'minus');
  return `<span class="rate ${cls}">${p>0?'+':''}${p.toFixed(1)}%</span>`;
}
function rateBar(cur, target){
  const r = target? (cur/target*100) : 0;
  const cls = r>=100?'ok':(r>=80?'warn':'bad');
  return `<div style="display:flex;align-items:center;gap:6px;">
    <div class="bar" style="flex:1;"><i class="${cls}" style="width:${Math.max(0,Math.min(100,r))}%"></i></div>
    <span class="rate num" style="min-width:44px;text-align:right;">${target?r.toFixed(0)+'%':'—'}</span></div>`;
}
function uid(prefix){ return prefix+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function coll(k){ if(!DB[k]) DB[k]=[]; return DB[k]; }
function findById(k,id){ return (DB[k]||[]).find(r=>r&&String(r.id)===String(id)) || null; }
function companyName(id){ const c=findById('companies',id); return c? (c.name||'-') : '<span class="zero">-</span>'; }
/** 一覧の取引先名は「その会社の台帳」への入口にする（どの画面からでも1社の全体が見える） */
function coLink(companyId, side){
  const n=String(companyName(companyId)).replace(/<[^>]+>/g,'');
  if(!companyId || n==='-' || !n) return '<span class="zero">-</span>';
  return `<a onclick="event.stopPropagation();openLedger('${companyId}','${side||'ar'}')" title="この取引先の台帳を開く"
    style="cursor:pointer;color:var(--primary);font-weight:600;">${esc(n)}</a>`;
}

  t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none', kind==='err'?4200:2200);
}

/* ============ データ層 — サーバーが唯一の正（公式 §12） ============ */
function loadCache(){
  try{
    const meta = JSON.parse(localStorage.getItem(CACHE_META_KEY)||'{}');
    if(meta.v !== CACHE_VERSION) { localStorage.removeItem(STORAGE_KEY); return null; }
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return null;
    const d = JSON.parse(raw);
    if(!d || !d.fromServer) return null;      // サーバー由来でないものは絶対に使わない
    SERVER_REV = meta.rev||0; SERVER_EPOCH = meta.epoch||'';
    return d.data;
  }catch(e){ return null; }
}
function saveCache(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({fromServer:true, data:DB}));
    localStorage.setItem(CACHE_META_KEY, JSON.stringify({v:CACHE_VERSION, rev:SERVER_REV, epoch:SERVER_EPOCH, at:Date.now()}));
  }catch(e){ /* 容量超過: キャッシュ無しでも動く */ }
}
function headers(){ return { 'Content-Type':'application/json', 'Authorization':'Bearer '+GTOKEN, 'x-client-contract':String(CLIENT_CONTRACT) }; }

async function pullState(){
  const r = await fetch(API_BASE+'/state', { headers: headers() });
  if(r.status===401){ logout('セッションが切れました。もう一度ログインしてください。'); throw new Error('401'); }
  /* 承認待ち・停止のアカウント: データは1行も来ない。白い画面にせず、理由を出す。 */
  if(r.status===403){ const d=await r.json().catch(()=>({})); showPending(d.message||''); throw new Error('403'); }
  if(!r.ok) throw new Error('state '+r.status);
  const d = await r.json();
  DB = d.data || {}; SERVER_REV = d.rev||0; SERVER_EPOCH = d.epoch||'';
  ensureShape(); saveCache();
}
async function pullDiff(){
  if(!GTOKEN) return;
  try{
    const r = await fetch(API_BASE+'/state-diff?since='+SERVER_REV, { headers: headers() });
    if(!r.ok) return;
    const d = await r.json();
    if(d.epoch && SERVER_EPOCH && d.epoch!==SERVER_EPOCH){ location.reload(); return; }
    const keys = Object.keys(d.changed||{});
    if(keys.length){ keys.forEach(k=>DB[k]=d.changed[k]); SERVER_REV=d.rev; ensureShape(); saveCache(); renderPage(CURRENT_PAGE); }
    else SERVER_REV = d.rev||SERVER_REV;
  }catch(e){ /* ネットワーク断: 次の通知で拾う */ }
}
/** 承認待ちの人に見せる画面。ここから先には金額は何も出さない。 */

    <span style="font-weight:400;">${esc((SESSION&&SESSION.email)||'')}</span>`;
  const btn=document.getElementById('gbtn'); if(btn) btn.innerHTML='';
}
/** 空の器を用意（データを作るのではない。null 参照で画面が落ちないようにするだけ） */
function ensureShape(){
  ['companies','workers','assignments','billingRules','invoices','payments','bills','payouts',
   'expenses','costItems','budgets','forecasts','actualAdjust','objectives','keyResults','checkins',
   'accounts','departments','mailLog','mailTemplates','collectionLogs'].forEach(k=>{ if(!Array.isArray(DB[k])) DB[k]=[]; });
  if(!DB.userPerms) DB.userPerms={};
  if(!DB.settings)  DB.settings={};
  if(!DB.accounts.length) DB.accounts = DEFAULT_ACCOUNTS.map(a=>({id:uid('AC'),...a}));
}

/* --- 書き込み: 変更を貯めて、まとめてサーバーへ。UI は待たせない --- */
function markDirty(k, rec){
  if(!PENDING.changed[k]) PENDING.changed[k]=[];
  const at = PENDING.changed[k].findIndex(x=>String(x.id)===String(rec.id));
  if(at>=0) PENDING.changed[k][at]=rec; else PENDING.changed[k].push(rec);
  schedulePush();
}
function markDeleted(k, id){
  if(!PENDING.deleted[k]) PENDING.deleted[k]=[];
  if(!PENDING.deleted[k].includes(String(id))) PENDING.deleted[k].push(String(id));
  if(!PENDING.changed[k]) PENDING.changed[k]=[];
  schedulePush();
}
let _pushTimer=null, _pushing=false, _confirmShrink=false;
function schedulePush(){ clearTimeout(_pushTimer); _pushTimer=setTimeout(pushDelta, 400); }
function pendingCount(){
  let n=0; Object.values(PENDING.changed).forEach(a=>n+=a.length);
  Object.values(PENDING.deleted).forEach(a=>n+=a.length); return n;
}
async function pushDelta(retry){
  if(_pushing || !GTOKEN) return;
  if(!pendingCount()) return;
  _pushing = true;
  const body = { changed:{...PENDING.changed}, deleted:{...PENDING.deleted}, since:SERVER_REV, epoch:SERVER_EPOCH };
  /* 安全装置（縮小ガード）を外すのは、デモデータを消すときだけ。
     ここを常に true にしてはいけない — 事故のときに止めてくれるのがこの装置。 */
  if(_confirmShrink) body.confirmShrink = true;
  try{
    const r = await fetch(API_BASE+'/state-delta', { method:'PUT', headers:headers(), body:JSON.stringify(body) });
    const d = await r.json().catch(()=>({}));
    if(r.ok){
      PENDING = { changed:{}, deleted:{} };
      SERVER_REV = d.rev||SERVER_REV;
      Object.keys(d.applied||{}).forEach(k=>DB[k]=d.applied[k]);   // サーバーの結果をそのまま採用＝ズレ0
      saveCache(); syncBadge();
    } else if(r.status===409 && d.error==='conflict'){
      // 他の人が先に書いた → サーバーの最新を取り込んでから、自分の変更を上に載せて再送
      Object.keys(d.current||{}).forEach(k=>DB[k]=d.current[k]);
      SERVER_REV = d.rev||SERVER_REV; _pushing=false;
      if(!retry) return pushDelta(true);
      toast('同期がぶつかりました。画面を再読み込みします。','err'); setTimeout(()=>location.reload(),1500);
    } else if(r.status===409 && d.error==='shrink-guard'){
      toast(`安全装置: ${d.collection} が ${d.before}件→${d.after}件 に減るため中止しました。`,'err');
      PENDING = { changed:{}, deleted:{} };
    } else if(r.status===409 && d.error==='epoch-mismatch'){
      toast('データが復元されました。画面を読み込み直します。','err'); setTimeout(()=>location.reload(),1200);
    } else if(r.status===426){
      toast('アプリが古い版です。Ctrl+Shift+R で再読み込みしてください。','err');
    } else if(r.status===403){
      toast(d.message||'権限がありません。','err'); PENDING={changed:{},deleted:{}};
      await pullState(); renderPage(CURRENT_PAGE);
    } else {
      toast('保存に失敗しました（'+(d.error||r.status)+'）。','err');
    }
  }catch(e){
    // ネットワーク断: 変更は PENDING に残る。次の操作かオンライン復帰で再送
    syncBadge();
  }finally{ _pushing=false; syncBadge(); }
}
window.addEventListener('online', ()=>pushDelta());
window.addEventListener('beforeunload', e=>{ if(pendingCount()){ e.preventDefault(); e.returnValue=''; } });
function syncBadge(){
  const el=document.getElementById('syncState'); if(!el) return;
  const n=pendingCount();
  el.innerHTML = n? `<span class="badge b-amber">未同期 ${n}件</span>` : '';
}

/* --- 唯一の書き込み口（公式 §0.3・§6）。手入力もCSVも自動生成もここを通る --- */
function commitRecord(k, rec, opts){
  opts = opts||{};
  Object.keys(rec).forEach(f=>{ if(f.indexOf('__')===0) delete rec[f]; });   // 照合用の一時キーは残さない
  const list = coll(k);
  const me = (SESSION&&SESSION.email)||'';
  const now = new Date().toISOString();
  let target, mode;
  const exist = opts.existingId ? findById(k, opts.existingId) : null;
  if(exist){
    Object.keys(rec).forEach(f=>{ if(f!=='id') exist[f]=rec[f]; });
    exist.updatedAt=now; exist.updatedBy=me; target=exist; mode='update';
  }else{
    rec.id = rec.id || uid(ENTITIES[k]?.idPrefix || k.slice(0,2).toUpperCase());
    rec.createdAt=now; rec.createdBy=me; rec.updatedAt=now; rec.updatedBy=me;
    if(!rec.source) rec.source='manual';
    list.push(rec); target=rec; mode='insert';
  }
  markDirty(k, target);
  return { mode, record: target };
}
function deleteRecord(k, id, label){
  const page = ENTITIES[k]?.page || k;
  if(!canDelete(page)){ toast('削除の権限がありません。','err'); return false; }
  const rec = findById(k,id); if(!rec) return false;
  if(!confirm(`「${label||rec.name||rec.no||id}」を削除します。よろしいですか？\n削除は取り消せません（操作履歴には残ります）。`)) return false;
  DB[k] = (DB[k]||[]).filter(r=>String(r.id)!==String(id));
  markDeleted(k, id);
  toast('削除しました。','ok');
  return true;
}

/* ============ Realtime（SSE） ============ */
let _sse=null;
function connectSSE(){
  if(_sse){ try{_sse.close();}catch(e){} }
  try{
    _sse = new EventSource(API_BASE+'/events?token='+encodeURIComponent(GTOKEN));
    _sse.addEventListener('changed', ()=>pullDiff());
    _sse.onerror = ()=>{ try{_sse.close();}catch(e){} setTimeout(connectSSE, 15000); };
  }catch(e){ /* SSE が使えなくても定期取得で動く */ }
}
setInterval(()=>{ if(GTOKEN && document.visibilityState==='visible') pullDiff(); }, 60000);

/* ============ 認証 — Google Identity Services ============
   クライアントIDはサーバー（/config）から取る。画面に直接書くと .env と
   食い違ったときに aud-mismatch になり、原因が見えないまま止まる。
   /config が取れないときだけ、下の既定値を使う。 */
let GOOGLE_CID_EFF = GOOGLE_CID;
async function initGoogle(){
  try{
    const r = await fetch(API_BASE+'/config');
    if(r.ok){ const c = await r.json(); if(c.googleClientId) GOOGLE_CID_EFF = c.googleClientId; }
  }catch(e){ /* サーバーが落ちていても、ボタンは出す */ }
  renderGoogleBtn();
}
function renderGoogleBtn(){
  if(!window.google||!google.accounts||!google.accounts.id){ setTimeout(renderGoogleBtn,300); return; }
  google.accounts.id.initialize({ client_id: GOOGLE_CID_EFF, callback: onGoogleCredential, auto_select:false });
  google.accounts.id.renderButton(document.getElementById('gbtn'),
    { theme:'outline', size:'large', width:320, text:'signin_with', locale:'ja' });
}
async function onGoogleCredential(resp){
  const err = document.getElementById('loginErr'); err.textContent='ログイン中…';
  try{
    const r = await fetch(API_BASE+'/auth/google', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ credential: resp.credential }) });
    const d = await r.json();
    if(!r.ok){
      // 「なぜ入れないのか」を必ず出す。管理者が調べられるよう技術的な内訳も添える。
      err.innerHTML = esc(d.message || ('ログインできません（'+(d.error||r.status)+'）'))
        + (d.detail? `<div style="font-size:11px;color:var(--muted);margin-top:6px;">${esc(d.detail)}</div>`:'');
      return;
    }
    GTOKEN = resp.credential; SESSION = d;
    try{ localStorage.setItem(TOKEN_KEY, GTOKEN); localStorage.setItem(AUTH_KEY, JSON.stringify(d)); }catch(e){}
    await afterLogin();
  }catch(e){ err.textContent='通信に失敗しました。ネットワークをご確認ください。'; }
}
function logout(msg){
  try{ localStorage.removeItem(TOKEN_KEY); localStorage.removeItem(AUTH_KEY); }catch(e){}
  GTOKEN=''; SESSION=null;
  document.getElementById('loginPage').classList.remove('hide');
  document.getElementById('topbar').classList.add('hide');
  document.getElementById('shell').classList.add('hide');
  if(msg) document.getElementById('loginErr').textContent=msg;
  initGoogle();
}

  loadUserCache();
  if(SESSION.status!=='active'){
    document.getElementById('loginErr').innerHTML =
      'このアカウントはまだ承認されていません。<br>管理者（'+esc('n-tung@biglight.jp')+'）にご連絡ください。';
    return;
  }
  document.getElementById('loginPage').classList.add('hide');
  document.getElementById('topbar').classList.remove('hide');
  document.getElementById('shell').classList.remove('hide');
  const av=document.getElementById('avatarBox');
  av.innerHTML = SESSION.picture? `<img src="${attr(SESSION.picture)}" alt="">` : esc((SESSION.name||SESSION.email||'?').slice(0,1).toUpperCase());

  document.getElementById('acctMail').textContent = SESSION.email;

      '<div class="alertbar">サーバーに接続できません。ネットワークをご確認のうえ、再読み込みしてください。</div>'; return; } }
  connectSSE();
  const start = (location.hash||'').replace('#','') || 'dashboard';
  goto(ALL_PAGES.includes(PAGE_REDIRECT[start]||start)? start : 'dashboard');
  /* Money Forward の接続から戻ってきたとき（/api/mf/callback → /?mf=connected#arbook） */
  try{ const qs=new URLSearchParams(location.search); const mf=qs.get('mf');
    if(mf){ toast(mf==='connected'? 'Money Forward と接続しました。「Money Forward から取り込む」で請求を取得できます。' : 'Money Forward と接続できませんでした：'+(qs.get('msg')||''), mf==='connected'?'ok':'err');
      history.replaceState(null,'',location.pathname+location.hash); } }catch(e){}
}

/* ============ 年度セレクタ ============ */
function fyChoices(){
  const now=new Date(); const cur = fyOf(thisMonth());
  const set = new Set([cur-2, cur-1, cur, cur+1]);
  (DB?.budgets||[]).forEach(b=>set.add(Number(b.fy)));
  (DB?.invoices||[]).forEach(i=>{ const f=fyOf(i.bookMonth); if(f) set.add(f); });
  return [...set].filter(n=>isFinite(n)).sort((a,b)=>b-a);
}
function buildFyPicker(){
  CUR_FY = Number(localStorage.getItem('bl_yj_fy')) || fyOf(thisMonth());
  const sel=document.getElementById('fyPick');
  sel.innerHTML = fyChoices().map(f=>`<option value="${f}" ${f===CUR_FY?'selected':''}>${f}年度</option>`).join('');
}
function setFY(v){ CUR_FY=Number(v); try{localStorage.setItem('bl_yj_fy',String(CUR_FY));}catch(e){} renderPage(CURRENT_PAGE); }

/* ============ ナビ・ルーター ============ */
function toggleSidebar(){
  if(window.innerWidth<=980) document.body.classList.toggle('sidebar-open');
  else document.body.classList.toggle('sidebar-hidden');
}
function renderNav(){
  const nav=document.getElementById('navList');
  const badges = navBadges();
  nav.innerHTML = SECTIONS.map(sec=>{
    const tabs = sec.tabs.filter(t=>canSee(t.id));
    if(!tabs.length) return '';
    const b = tabs.reduce((n,t)=>n+(badges[t.id]||0),0);
    const on = SECTION_OF[CURRENT_PAGE]===sec;
    /* 押すと、その仕事で最初に開く画面（最初の見られるタブ）へ */
    return `<button class="navitem${on?' active':''}" onclick="goto('${tabs[0].id}')" title="${attr(sec.label)}">
      ${ICONS[sec.icon]||ICONS.dashboard}<span>${esc(sec.label)}</span>${b?`<span class="nbdg">${b>99?'99+':b}</span>`:''}</button>`;
  }).join('');
}
/** 画面の上のタブ（同じ仕事の、見方の違い）。1つしか無いときは出さない。 */
function sectionTabs(page){
  const sec=SECTION_OF[page]; if(!sec) return '';
  const tabs=sec.tabs.filter(t=>canSee(t.id));
  if(tabs.length<2) return '';
  const badges=navBadges();
  return `<div class="sectabs">${tabs.map(t=>`<button class="${t.id===page?'on':''}" onclick="goto('${t.id}')">${esc(t.label)}${
    badges[t.id]?`<span class="n">${badges[t.id]}</span>`:''}</button>`).join('')}</div>`;
}

/* ============================================================================
   ⑦ 計算エンジン — この システムの「数字の意味」を決める唯一の場所
   ----------------------------------------------------------------------------
   ★ 会計の約束（THIET-KE-YOJITSU.md §4.2）:
     ・bookMonth（計上月）が 予実 を決める。入金日・支払日ではない。
     ・入金／支払は P/L に影響しない。債権・債務の残高を減らすだけ。
     ・実績は保存しない。毎回、伝票から計算する（公式 §0.10）。
   ========================================================================== */

/* ---------- 明細 → 金額 ---------- */
function itemAmount(it){
  if(!it) return 0;
  if(it.amount!=null && it.amount!=='') return num(it.amount);
  return Math.round(num(it.qty||1) * num(it.price||0));
}
function itemsSubtotal(items){ return (items||[]).reduce((s,it)=>s+itemAmount(it),0); }
function itemsTax(items){
  return (items||[]).reduce((s,it)=>s+Math.floor(itemAmount(it)*(TAX_RATE[it.taxCat||'課税10%']||0)),0);
}
function docTotal(doc){
  if(!doc) return 0;
  if(Array.isArray(doc.items) && doc.items.length) return itemsSubtotal(doc.items)+itemsTax(doc.items);
  return num(doc.total);
}
/** 伝票の税抜合計（予実は税抜で見る — 消費税は預り金であって儲けではない） */
function docNet(doc){
  if(!doc) return 0;
  if(Array.isArray(doc.items) && doc.items.length) return itemsSubtotal(doc.items);
  /* Money Forward から取り込んだ請求・手入力の請求額は 税抜（subtotal）を持っている → それを使う（backend finance.ts と同じ式） */
  if(doc.subtotal!=null && doc.subtotal!=='') return num(doc.subtotal);
  return Math.round(num(doc.total)/1.1);
}

/* ---------- 債権（売掛金） ---------- */
function paidOfInvoice(inv){
  let s=0;
  (DB.payments||[]).forEach(p=>{
    if(p.status==='取消') return;
    (p.allocations||[]).forEach(a=>{ if(String(a.invoiceId)===String(inv.id)) s+=num(a.amount); });
  });
  return s;
}
function balanceOfInvoice(inv){ return docTotal(inv) - paidOfInvoice(inv); }
/** 状態は「保存された値」ではなく事実から決める。押し忘れで実態とズレない。 */
function invoiceStatus(inv){
  if(inv.status==='取消'||inv.status==='作成中') return inv.status;
  const bal = balanceOfInvoice(inv);
  if(bal<=0) return '入金済';
  if(paidOfInvoice(inv)>0) return '一部入金';
  if(isOverdue(inv)) return '延滞';
  return '確定';
}
function openInvoices(){ return (DB.invoices||[]).filter(i=>i.status!=='取消'&&i.status!=='作成中'&&balanceOfInvoice(i)>0); }
function arBalanceOf(companyId){
  return openInvoices().filter(i=>String(i.companyId)===String(companyId)).reduce((s,i)=>s+balanceOfInvoice(i),0);
}
function arTotal(){ return openInvoices().reduce((s,i)=>s+balanceOfInvoice(i),0); }
/** 年齢区分: 期日からの経過日数 */
function agingBucket(inv){
  const d = effDue(inv) ? daysBetween(effDue(inv), today()) : 0;
  if(d<=0)  return '未到来';
  if(d<=30) return '1〜30日';
  if(d<=60) return '31〜60日';
  if(d<=90) return '61〜90日';
  return '90日超';
}
const AGING_BUCKETS = ['未到来','1〜30日','31〜60日','61〜90日','90日超'];
const AGING_COLOR   = {'未到来':'b-gray','1〜30日':'b-amber','31〜60日':'b-amber','61〜90日':'b-red','90日超':'b-red'};

/* ---------- 債務（買掛金） ---------- */
function paidOfBill(bill){
  let s=0;
  (DB.payouts||[]).forEach(p=>{
    if(p.status==='取消') return;
    (p.allocations||[]).forEach(a=>{ if(String(a.billId)===String(bill.id)) s+=num(a.amount); });
  });
  return s;
}
function balanceOfBill(b){ return docTotal(b) - paidOfBill(b); }
function billStatus(b){
  if(b.status==='取消'||b.status==='作成中') return b.status;
  const bal = balanceOfBill(b);
  if(bal<=0) return '支払済';
  if(paidOfBill(b)>0) return '一部支払';
  if(isOverdue(b)) return '期日超過';
  return '確定';
}
function openBills(){ return (DB.bills||[]).filter(b=>b.status!=='取消'&&b.status!=='作成中'&&balanceOfBill(b)>0); }
function apBalanceOf(companyId){
  return openBills().filter(b=>String(b.companyId)===String(companyId)).reduce((s,b)=>s+balanceOfBill(b),0);
}
function apTotal(){ return openBills().reduce((s,b)=>s+balanceOfBill(b),0); }

/* ---------- 在籍者数 — 支援委託料の土台 ----------
   在籍 ⟺ 入社日 ≤ 月末 かつ（退職日が空 または 退職日 ≥ 月初）
   ここを1か所にしておくと、請求・予実・人数推移がずっと同じ数字になる。 */
function assignmentsOfCompany(companyId){
  return (DB.assignments||[]).filter(a=>a && String(a.companyId)===String(companyId));
}
function activeInMonth(a, ym){
  if(!a) return false;
  const s=monthStart(ym), e=monthEnd(ym);
  const j=(a.joinDate||'').slice(0,10), x=(a.exitDate||'').slice(0,10);
  if(!j) return false;
  if(j>e) return false;
  if(x && x<s) return false;
  return true;
}
/** 月内の在籍日数（日割り用） */
function activeDaysInMonth(a, ym){
  const s=monthStart(ym), e=monthEnd(ym);
  const j=(a.joinDate||'').slice(0,10), x=(a.exitDate||'').slice(0,10);
  const from = (j>s? j : s), to = (x && x<e ? x : e);
  if(from>to) return 0;
  return daysBetween(from,to)+1;
}
function workersInMonth(companyId, ym, mode){
  const list = assignmentsOfCompany(companyId).filter(a=>activeInMonth(a,ym));
  if(mode==='month_start') return list.filter(a=>(a.joinDate||'')<=monthStart(ym));
  if(mode==='prorate') return list;                       // 数は同じ・金額計算側で日割り
  return list.filter(a=>!a.exitDate || a.exitDate>=monthEnd(ym));   // 既定: 月末在籍
}
function workerName(workerId){ const w=findById('workers',workerId); return w? (w.name||w.code||'-') : '-'; }

/* ---------- 請求ルール ---------- */
function rulesOfCompany(companyId){
  return (DB.billingRules||[]).filter(r=>r && String(r.companyId)===String(companyId) && r.active!==false);
}
/** 1社1か月ぶんの自動明細を組み立てる。spot は自動生成しない（人が決めること）。 */
function autoItemsFor(companyId, ym){
  const out=[]; const snap=[];
  rulesOfCompany(companyId).forEach(r=>{
    if(r.kind==='fixed'){
      out.push({ accountCode:r.accountCode||'4900', name:r.name||'月額固定', qty:1,
                 price:num(r.unitPrice), amount:num(r.unitPrice), taxCat:r.taxCat||'課税10%', ruleId:r.id });
    }else if(r.kind==='per_worker'){
      const mode = r.countMode||'month_end';
      const list = workersInMonth(companyId, ym, mode);
      if(mode==='prorate'){
        const dim = daysInMonth(ym);
        let amt=0;
        list.forEach(a=>{ const d=activeDaysInMonth(a,ym); amt += Math.round(num(r.unitPrice)*d/dim);
          snap.push({workerId:a.workerId, name:workerName(a.workerId), days:d, join:a.joinDate||'', exit:a.exitDate||''}); });
        if(list.length) out.push({ accountCode:r.accountCode||'4100', name:(r.name||'支援委託料')+`（日割り ${list.length}名）`,
          qty:list.length, price:num(r.unitPrice), amount:amt, taxCat:r.taxCat||'課税10%', ruleId:r.id });
      }else{
        list.forEach(a=>snap.push({workerId:a.workerId, name:workerName(a.workerId), join:a.joinDate||'', exit:a.exitDate||''}));
        if(list.length) out.push({ accountCode:r.accountCode||'4100', name:(r.name||'支援委託料'),
          qty:list.length, price:num(r.unitPrice), amount:Math.round(list.length*num(r.unitPrice)),
          taxCat:r.taxCat||'課税10%', ruleId:r.id });
      }
    }
  });
  return { items: out, snapshot: snap };
}

/* ---------- 予実: 実績はここで「計算」される ---------- */
function ymOfDoc(d){ return (d.bookMonth||'').slice(0,7); }
/** kind 別・月別の実績（税抜）。CUR_FY の12か月配列を返す。 */
function actualSeries(fy, kind, opt){
  opt = opt||{};
  const months = fyMonths(fy);
  const idx = {}; months.forEach((m,i)=>idx[m]=i);
  const out = Array(12).fill(0);
  const addTo = (ym, amount) => { const i=idx[ym]; if(i!=null) out[i]+=amount; };

  if(kind==='revenue'){
    (DB.invoices||[]).forEach(inv=>{
      if(inv.status==='取消') return;
      if(opt.confirmedOnly && inv.status==='作成中') return;
      const ym=ymOfDoc(inv); if(idx[ym]==null) return;
      (inv.items||[]).forEach(it=>{ if(accountKind(it.accountCode)==='revenue') addTo(ym, itemAmount(it)); });
      if(!(inv.items||[]).length) addTo(ym, docNet(inv));
    });
  } else {
    // 費用側: bills（買掛あり）＋ expenses（即払い）
    (DB.bills||[]).forEach(b=>{
      if(b.status==='取消') return;
      const ym=ymOfDoc(b); if(idx[ym]==null) return;
      (b.items||[]).forEach(it=>{ if(accountKind(it.accountCode)===kind) addTo(ym, itemAmount(it)); });
    });
    (DB.expenses||[]).forEach(e=>{
      const ym=(e.bookMonth||e.date||'').slice(0,7); if(idx[ym]==null) return;
      if(accountKind(e.accountCode)!==kind) return;
      const rate = TAX_RATE[e.taxCat||'課税10%']||0;
      addTo(ym, Math.round(num(e.amount)/(1+rate)));    // 経費は税込入力 → 税抜へ
    });
    if(kind==='nonop'){
      (DB.invoices||[]).forEach(inv=>{     // 営業外収益が請求書に混ざる場合
        if(inv.status==='取消') return;
        const ym=ymOfDoc(inv); if(idx[ym]==null) return;
        (inv.items||[]).forEach(it=>{ if(accountKind(it.accountCode)==='nonop') addTo(ym, itemAmount(it)); });
      });
    }
  }
  // 手入力の調整（会計事務所の数字・期首の持ち込みなど）
  (DB.actualAdjust||[]).forEach(a=>{
    if(Number(a.fy)!==Number(fy)) return;
    if(accountKind(a.accountCode)!==kind) return;
    const i=Number(a.mIndex); if(i>=0&&i<12) out[i]+=num(a.amount);
  });
  return out;
}
/** 予算/見込: budgets・forecasts から kind 別12か月 */
function planSeries(fy, kind, which){
  const src = which==='forecast' ? (DB.forecasts||[]) : (DB.budgets||[]);
  const out = Array(12).fill(0);
  src.forEach(b=>{
    if(Number(b.fy)!==Number(fy)) return;
    if(accountKind(b.accountCode)!==kind) return;
    const i=Number(b.mIndex); if(i>=0&&i<12) out[i]+=num(b.amount);
  });
  return out;
}
/** 勘定科目ごとの12か月（一覧表の行） */
function seriesByAccount(fy, accountCode, source){
  const months=fyMonths(fy); const idx={}; months.forEach((m,i)=>idx[m]=i);
  const out=Array(12).fill(0);
  if(source==='budget'||source==='forecast'){
    (source==='budget'?DB.budgets:DB.forecasts||[]).forEach(b=>{
      if(Number(b.fy)!==Number(fy)||b.accountCode!==accountCode) return;
      const i=Number(b.mIndex); if(i>=0&&i<12) out[i]+=num(b.amount);
    });
    return out;
  }
  const kind = accountKind(accountCode);
  if(kind==='revenue'||kind==='nonop'){
    (DB.invoices||[]).forEach(inv=>{ if(inv.status==='取消') return; const i=idx[ymOfDoc(inv)]; if(i==null) return;
      (inv.items||[]).forEach(it=>{ if(it.accountCode===accountCode) out[i]+=itemAmount(it); }); });
  }
  (DB.bills||[]).forEach(b=>{ if(b.status==='取消') return; const i=idx[ymOfDoc(b)]; if(i==null) return;
    (b.items||[]).forEach(it=>{ if(it.accountCode===accountCode) out[i]+=itemAmount(it); }); });
  (DB.expenses||[]).forEach(e=>{ const i=idx[(e.bookMonth||e.date||'').slice(0,7)]; if(i==null) return;
    if(e.accountCode!==accountCode) return;
    const rate=TAX_RATE[e.taxCat||'課税10%']||0; out[i]+=Math.round(num(e.amount)/(1+rate)); });
  (DB.actualAdjust||[]).forEach(a=>{ if(Number(a.fy)!==Number(fy)||a.accountCode!==accountCode) return;
    const i=Number(a.mIndex); if(i>=0&&i<12) out[i]+=num(a.amount); });
  return out;
}

/** 損益一式（予算・実績・見込）を1回で。画面は全部これを使う。 */
function plBook(fy, source){
  const g = k => source==='actual' ? actualSeries(fy,k) : planSeries(fy,k,source);
  const revenue=g('revenue'), cogs=g('cogs'), sga=g('sga'), nonop=g('nonop');
  const gross     = revenue.map((v,i)=>v-cogs[i]);
  const operating = gross.map((v,i)=>v-sga[i]);
  const ordinary  = operating.map((v,i)=>v+nonop[i]);
  return { revenue, cogs, gross, sga, operating, nonop, ordinary };
}
const sumRange = (a,s,e)=>{ let t=0; for(let i=s;i<=e&&i<a.length;i++) t+=a[i]||0; return t; };
const sum12 = a => sumRange(a,0,11);

/** 期間比較（公式どおりの1関数。全画面この結果を使う） */
function compareSeries(cur, prev, i){
  const qs=Math.floor(i/3)*3, qSpan=i-qs;
  const hs=Math.floor(i/6)*6, hSpan=i-hs;
  return {
    month: cur[i]||0,
    prevMonth: i>0 ? (cur[i-1]||0) : (prev[11]||0),
    lastYearMonth: prev[i]||0,
    qtd: sumRange(cur,qs,i),
    prevQtd: qs>=3 ? sumRange(cur,qs-3,qs-3+qSpan) : sumRange(prev,9,9+qSpan),
    lastYearQtd: sumRange(prev,qs,i),
    htd: sumRange(cur,hs,i),
    prevHtd: hs>=6 ? sumRange(cur,hs-6,hs-6+hSpan) : sumRange(prev,6,6+hSpan),
    ytd: sumRange(cur,0,i),
    lastYearYtd: sumRange(prev,0,i),
  };
}
/** 着地見込 = 実績累計 ＋ 残り月（見込があれば見込、無ければ予算） */
function landing(fy, key, uptoIdx){
  const act=plBook(fy,'actual')[key], bud=plBook(fy,'budget')[key], fc=plBook(fy,'forecast')[key];
  let t = sumRange(act,0,uptoIdx);
  for(let i=uptoIdx+1;i<12;i++) t += (fc[i]||bud[i]||0);
  return t;
}
/** 直近で実績のある月（無ければ今月） */
function lastActualIdx(fy){
  const rev=actualSeries(fy,'revenue'), cost=actualSeries(fy,'sga');
  let last=-1; for(let i=0;i<12;i++) if((rev[i]||0)!==0||(cost[i]||0)!==0) last=i;
  if(last>=0) return last;
  const t=thisMonth(); return fyOf(t)===fy ? fyIndexOf(t) : 0;
}

/* ---------- 資金繰り: 入金予定 − 支払予定 ---------- */
function cashPlanByMonth(fromYm, months){
  const out=[];
  for(let k=0;k<months;k++){
    const ym = addMonths(fromYm,k);
    const inAmt = openInvoices().filter(i=>effDue(i).slice(0,7)===ym).reduce((s,i)=>s+balanceOfInvoice(i),0);
    const outAmt= openBills().filter(b=>effDue(b).slice(0,7)===ym).reduce((s,b)=>s+balanceOfBill(b),0);
    out.push({ ym, in:inAmt, out:outAmt, net:inAmt-outAmt });
  }
  return out;
}
function cashPlanByWeek(weeks){
  const out=[]; let start=today();
  const dow=new Date(start+'T00:00:00').getDay(); start=addDays(start,-((dow+6)%7));   // 月曜起点
  for(let k=0;k<weeks;k++){
    const s=addDays(start,k*7), e=addDays(s,6);
    const inAmt = openInvoices().filter(i=>effDue(i)&&effDue(i)>=s&&effDue(i)<=e).reduce((t,i)=>t+balanceOfInvoice(i),0);
    const outAmt= openBills().filter(b=>effDue(b)&&effDue(b)>=s&&effDue(b)<=e).reduce((t,b)=>t+balanceOfBill(b),0);
    out.push({ s, e, in:inAmt, out:outAmt, net:inAmt-outAmt });
  }
  return out;
}

/* ============================================================================
   ⑧ 一覧エンジン — ENTITIES の宣言だけで 表・フィルタ・フォーム・CSV が動く
   ========================================================================== */
const SEARCH = {};                 // pageId → 検索語
const FCOL   = {};                 // pageId → { col: Set(値) }
const FADAPT = {};                 // pageId → { rows, valueOf, isDate }
const SEL    = {};                 // pageId → Set(選択id)
const _FBLANK = '（空欄）';

function selOf(p){ if(!SEL[p]) SEL[p]=new Set(); return SEL[p]; }
function fcolReg(p,a){ FADAPT[p]=a; }
function fcolCount(p){ const s=FCOL[p]||{}; return Object.keys(s).filter(c=>s[c]&&s[c].size).length; }
function fcolClearAll(p){ delete FCOL[p]; renderPage(CURRENT_PAGE); }
function _facet(p,row,col){
  const a=FADAPT[p]; let v=a? a.valueOf(row,col) : row[col];
  v = (v==null?'':String(v)).trim();
  if(a&&a.isDate&&a.isDate(col)&&v){ const m=v.match(/(\d{4})[-\/](\d{1,2})/); return m? m[1]+'-'+String(m[2]).padStart(2,'0') : v; }
  return v===''? _FBLANK : v;
}
function fcolPass(p,row){
  const st=FCOL[p]; if(!st) return true;
  return Object.keys(st).every(col=>{ const s=st[col]; if(!s||!s.size) return true; return s.has(_facet(p,row,col)); });
}
function fcolHead(p,col,label){
  const on = !!(FCOL[p]&&FCOL[p][col]&&FCOL[p][col].size);
  return `<span style="display:inline-flex;align-items:center;gap:5px;white-space:nowrap;">${esc(label)}
    <span onclick="event.stopPropagation();fcolOpen(event,'${p}','${attr(col)}')" title="絞り込み"
      style="cursor:pointer;font-size:9px;padding:2px 4px;border-radius:4px;
      color:${on?'#fff':'var(--muted)'};background:${on?'var(--primary)':'transparent'};border:1px solid ${on?'var(--primary)':'var(--border)'};">▼</span></span>`;
}
let _fpop=null;
function _fpopClose(){ if(_fpop){ try{_fpop.remove();}catch(e){} _fpop=null; document.removeEventListener('mousedown',_fpopOut,true);} }
function _fpopOut(e){ if(_fpop && !_fpop.contains(e.target)) _fpopClose(); }
function fcolOpen(ev,p,col){
  const same=_fpop&&_fpop.dataset.col===col; _fpopClose(); if(same) return;
  const a=FADAPT[p]; if(!a) return;
  const cur=(FCOL[p]&&FCOL[p][col])||null;
  const seen=new Set(), facets=[];
  (a.rows()||[]).forEach(r=>{ const f=_facet(p,r,col); if(!seen.has(f)){seen.add(f);facets.push(f);} });
  facets.sort((x,y)=> x===_FBLANK?1 : y===_FBLANK?-1 : String(x).localeCompare(String(y),'ja',{numeric:true}));
  const ck=f=>cur?cur.has(f):true;
  const body=facets.map(f=>`<label class="fitem" data-t="${attr(String(f).toLowerCase())}"
      style="display:flex;align-items:center;gap:6px;padding:3px 2px;font-size:12.5px;">
      <input type="checkbox" class="fchk" value="${attr(encodeURIComponent(f))}" ${ck(f)?'checked':''} style="width:14px;height:14px;flex:none;">
      <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(f)}</span></label>`).join('');
  const d=document.createElement('div'); d.dataset.col=col;
  d.style.cssText='position:fixed;z-index:80;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:9px;box-shadow:0 12px 40px rgba(0,0,0,.24);width:240px;max-width:92vw;padding:8px;';
  d.innerHTML=`<input type="text" placeholder="検索…" oninput="_fpopSearch(this)" style="width:100%;padding:5px 8px;border:1px solid var(--border);border-radius:6px;font-size:12px;margin-bottom:6px;">
    <div style="display:flex;gap:10px;font-size:11px;margin-bottom:4px;">
      <a onclick="_fpopAll(1)" style="cursor:pointer;color:var(--primary);">すべて選択</a>
      <a onclick="_fpopAll(0)" style="cursor:pointer;color:var(--primary);">すべて解除</a></div>
    <div style="max-height:250px;overflow:auto;border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:4px 0;">
      ${body||'<div class="muted" style="font-size:12px;padding:6px;">値がありません</div>'}</div>
    <div style="display:flex;gap:6px;margin-top:8px;">
      <button class="btn secondary sm" onclick="_fpopApply('${p}','${attr(col)}',1)">解除</button>
      <button class="btn sm" style="flex:1;" onclick="_fpopApply('${p}','${attr(col)}',0)">適用</button></div>`;
  document.body.appendChild(d); _fpop=d;
  const r=(ev.currentTarget||ev.target).getBoundingClientRect();
  d.style.left=Math.max(4,Math.min(r.left,innerWidth-248))+'px';
  d.style.top=(r.bottom+340>innerHeight? Math.max(4,r.bottom-344) : r.bottom+4)+'px';
  setTimeout(()=>document.addEventListener('mousedown',_fpopOut,true),0);
}
function _fpopSearch(i){ const q=i.value.toLowerCase(); _fpop.querySelectorAll('.fitem').forEach(el=>{ el.style.display=(el.dataset.t||'').includes(q)?'':'none'; }); }
function _fpopAll(on){ _fpop.querySelectorAll('.fitem').forEach(el=>{ if(el.style.display!=='none'){ el.querySelector('.fchk').checked=!!on; } }); }
function _fpopApply(p,col,clear){
  if(!FCOL[p]) FCOL[p]={};
  if(clear) delete FCOL[p][col];
  else{
    const chosen=new Set(); _fpop.querySelectorAll('.fchk:checked').forEach(c=>chosen.add(decodeURIComponent(c.value)));
    const total=_fpop.querySelectorAll('.fchk').length;
    if(chosen.size===0) FCOL[p][col]=new Set(['__none__']);
    else if(chosen.size>=total) delete FCOL[p][col];
    else FCOL[p][col]=chosen;
  }
  _fpopClose(); renderPage(CURRENT_PAGE);
}
function setSearch(p,v){
  if(p==='users'){ SEARCH[p]=v; drawUsers(); return; }
  SEARCH[p]=v; renderPage(CURRENT_PAGE);
  const i=document.querySelector(`[data-sb="${p}"]`);
  if(i){ i.focus(); try{ i.setSelectionRange(i.value.length,i.value.length); }catch(e){} }   // 再描画で focus を失わせない
}
