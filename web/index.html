/* ============================================================================
   ⑫ OKR — 目的④。数字は 予実 から自動で取れる（手で写さない）
   ========================================================================== */
function periodsOfFy(fy){ return QUARTERS.map(q=>`${fy}-Q${q.k}`); }
function curPeriod(){ const i=lastActualIdx(CUR_FY); return `${CUR_FY}-Q${quarterOfIdx(i)}`; }
let OKR_PERIOD=null;
function setOkrPeriod(p){ OKR_PERIOD=p; renderPage('okr'); }

/** KRの現在値。autoSource があれば実データから取る（公式 §0.10 と同じ考え方） */
function krCurrent(kr){
  const a=kr.autoSource;
  if(!a||!a.type) return num(kr.current);
  const fy=Number((kr.period||curPeriod()).split('-')[0])||CUR_FY;
  const i=lastActualIdx(fy);
  if(a.type==='yojitsu'){
    const b=plBook(fy,'actual')[a.metric||'revenue']||[];
    if(a.scope==='month') return b[i]||0;
    if(a.scope==='quarter'){ const qs=Math.floor(i/3)*3; return sumRange(b,qs,i); }
    return sumRange(b,0,i);                       // ytd
  }
  if(a.type==='ar'){
    if(a.metric==='overdue') return openInvoices().filter(x=>x.dueDate&&x.dueDate<today()).reduce((s,x)=>s+balanceOfInvoice(x),0);
    return arTotal();
  }
  if(a.type==='ap') return apTotal();
  if(a.type==='workers') return (DB.assignments||[]).filter(x=>activeInMonth(x,thisMonth())).length;
  if(a.type==='companies') return new Set((DB.assignments||[]).filter(x=>activeInMonth(x,thisMonth())).map(x=>x.companyId)).size;
  return num(kr.current);
}
function krRate(kr){
  const t=num(kr.target); if(!t) return 0;
  const c=krCurrent(kr);
  return kr.lowerIsBetter ? (c<=t?100:Math.max(0, (2-c/t)*100)) : Math.max(0, c/t*100);
}
function objRate(o){
  const krs=(DB.keyResults||[]).filter(k=>String(k.objectiveId)===String(o.id));
  if(!krs.length) return 0;
  return krs.reduce((s,k)=>s+Math.min(120,krRate(k)),0)/krs.length;
}
function okrSignal(r){ return r>=100?'完了':(r>=70?'順調':(r>=40?'注意':'遅延')); }

          <tbody>${krs.length? krs.map(k=>`<tr>

            <td>${canEdit('okr')?`<a onclick="krForm('${o.id}','${k.id}')" style="cursor:pointer;color:var(--primary);font-size:12px;">編集</a>`:''}</td></tr>`).join('')
            : '<tr><td colspan="6" class="empty">Key Result がありません。</td></tr>'}</tbody></table></div>
        ${canEdit('okr')?`<div style="padding:10px 14px;"><a class="pillbtn pill-new" onclick="krForm('${o.id}')">＋ Key Result を追加</a></div>`:''}
      </div></div>`;
  };
  const totalRate = objs.length? objs.reduce((s,o)=>s+objRate(o),0)/objs.length : 0;
  const kpis=`<div class="kpi-grid">
    <div class="kpi"><div class="lbl">全体の達成率</div><div class="num">${totalRate.toFixed(0)}%</div><div class="sub">${objs.length}個の目標</div></div>
    ${['順調','注意','遅延'].map(s=>`<div class="kpi"><div class="lbl">${s}</div>
      <div class="num">${objs.filter(o=>okrSignal(objRate(o))===s).length}</div></div>`).join('')}
  </div>`;
  const periods=[...new Set([...periodsOfFy(CUR_FY), ...(DB.objectives||[]).map(o=>o.period)])].filter(Boolean).sort().reverse();

  return pageShell({ title:'OKR / KPI', sub:'四半期ごとの目標。数字は予実・債権から自動で取れます。',
    tools:`<select onchange="setOkrPeriod(this.value)" style="padding:7px 10px;border:1px solid var(--border-strong);border-radius:8px;">
        ${periods.map(p=>`<option value="${attr(p)}" ${p===period?'selected':''}>${esc(p)}</option>`).join('')}</select>
      ${canCreate('okr')?`<button class="btn" onclick="okrForm()">＋ 目標を追加</button>`:''}
      ${toolsMenu(`<button class="btn secondary" onclick="window.print()">${IC.print} 印刷</button>`)}`,
    body: kpis + (objs.length? OKR_LEVELS.map(lv=>{
      const list=byLevel(lv); if(!list.length) return '';
      return `<div class="section-title" style="margin:16px 0 8px;">${esc(lv)}の目標</div>`+list.map(card).join('');
    }).join('') : '<div class="empty">この四半期の目標はまだありません。「＋ 目標を追加」から作成してください。</div>') });
}

/* ============================================================================
   ⑬' 通知ベル と 入力ガイド
   ----------------------------------------------------------------------------
   ベルに出すのは「いま、お金のことで手を打つべきこと」だけ。
   何かが起きた履歴ではなく、放っておくと損をすることを並べます。
   数字はすべてその場で計算します（保存しません。公式 §0.10）。
   取れなかった数字は出しません（0 と書くと「無い」と読めてしまう。公式 §0.6）。
   ========================================================================== */
const NOTIF_SEEN_KEY='bl_yj_notif_seen';

/** 通知の中身。sev: danger(赤) / warn(黄) / info(青) */
function notifItems(){
  const out=[], t=today();
  if(!DB) return out;

  /* ── 債権: 期日を過ぎた請求 ── */
  const over=openInvoices().filter(i=>i.dueDate&&i.dueDate<t);
  if(over.length) out.push({ sev:'danger', key:'ar-over', label:'入金期日を過ぎた請求',
    n:over.length, amount:over.reduce((s,i)=>s+balanceOfInvoice(i),0), go:"goto('aging')",
    sub:`最長 ${Math.max(...over.map(i=>daysBetween(i.dueDate,t)))}日 超過` });

  /* ── 債権: 今週が期日の請求（先に声をかければ遅れない） ── */
  const soonAr=openInvoices().filter(i=>i.dueDate&&i.dueDate>=t&&i.dueDate<=addDays(t,7));
  if(soonAr.length) out.push({ sev:'info', key:'ar-soon', label:'7日以内が入金期日の請求',
    n:soonAr.length, amount:soonAr.reduce((s,i)=>s+balanceOfInvoice(i),0), go:"goto('invoices')" });

  /* ── 入金したが、どの請求にも結び付けていないお金 ── */
  const un=unAllocated();
  if(un>0) out.push({ sev:'warn', key:'unalloc', label:'未消込の入金',
    amount:un, go:"goto('receipts')", sub:'どの請求に充てるか決めると、残高が正しくなります' });

  /* ── 債務: 期日を過ぎた支払（相手の信用に関わる） ── */
  const apOver=openBills().filter(b=>b.dueDate&&b.dueDate<t);
  if(apOver.length) out.push({ sev:'danger', key:'ap-over', label:'支払期日を過ぎた支払',
    n:apOver.length, amount:apOver.reduce((s,b)=>s+balanceOfBill(b),0), go:"goto('apaging')" });

  const apSoon=openBills().filter(b=>b.dueDate&&b.dueDate>=t&&b.dueDate<=addDays(t,7));
  if(apSoon.length) out.push({ sev:'warn', key:'ap-soon', label:'7日以内に支払う',
    n:apSoon.length, amount:apSoon.reduce((s,b)=>s+balanceOfBill(b),0), go:"goto('bills')" });

  /* ── 今月の請求を作り忘れていないか（締日を過ぎた取引先だけ言う） ── */
  const ym=thisMonth();
  const notBilled=(DB.companies||[]).filter(c=>{
    if(c._gone||c.kind==='仕入先') return false;
    if(!rulesOfCompany(c.id).filter(r=>r.kind!=='spot').length) return false;
    const closing=Number(c.closingDay||31);
    const dd=new Date().getDate();
    if(dd < Math.min(closing, daysInMonth(ym))) return false;          // まだ締めていない
    return !(DB.invoices||[]).some(i=>String(i.companyId)===String(c.id)&&i.bookMonth===ym&&i.status!=='取消');
  });
  if(notBilled.length) out.push({ sev:'warn', key:'nobill', label:`${ym} の請求が未作成`,
    n:notBilled.length, go:"openGenerate()", sub:notBilled.slice(0,4).map(c=>c.name).join('、')+(notBilled.length>4?' ほか':'') });

  /* ── 作成中のまま置き去りの請求 ── */
  const draft=(DB.invoices||[]).filter(i=>i.status==='作成中'&&i.updatedAt&&daysBetween(String(i.updatedAt).slice(0,10),t)>7);
  if(draft.length) out.push({ sev:'warn', key:'draft', label:'「作成中」のまま7日以上の請求',
    n:draft.length, amount:draft.reduce((s,i)=>s+docTotal(i),0), go:"goto('invoices')",
    sub:'確定するまで売上にも債権にも入りません' });

  const draftB=(DB.bills||[]).filter(b=>b.status==='作成中'&&b.updatedAt&&daysBetween(String(b.updatedAt).slice(0,10),t)>7);
  if(draftB.length) out.push({ sev:'info', key:'draftb', label:'「作成中」のままの支払請求',
    n:draftB.length, amount:draftB.reduce((s,b)=>s+docTotal(b),0), go:"goto('bills')" });

  /* ── 定期費用の入力もれ（今月・月次費用表） ── */
  if(fyOf(ym)===CUR_FY){
    const i=fyIndexOf(ym);
    const miss=costRowsOf(CUR_FY).rows.filter(r=>!r.ap && r.kind==='fixed' && r.cells[i]!=null && !r.cells[i] && num(r.it.monthly));
    if(miss.length) out.push({ sev:'info', key:'costmiss', label:`${FY_MONTH_LABELS[i]}の定期費用が未入力`,
      n:miss.length, go:"goto('expenses')", sub:miss.slice(0,4).map(r=>r.it.name).join('、')+(miss.length>4?' ほか':'') });
  }

  /* ── 契約満了が近い物件（更新の交渉には時間が要る） ── */
  const endSoon=(DB.properties||[]).filter(pr=>{ const d=propDaysLeft(pr); return d!==null && d<=PROP_ALERT_DAYS; });
  if(endSoon.length) out.push({ sev:'warn', key:'prop-end', label:'契約満了が近い物件',
    n:endSoon.length, go:"goto('properties')",
    sub:endSoon.map(pr=>`${pr.name}：${propDaysLeft(pr)<0?'満了済み':'あと'+propDaysLeft(pr)+'日'}`).join('、') });

  /* ── 資金が足りなくなる週 ── */
  const cash=cashPlanByWeek(8); let run=num(DB.settings&&DB.settings.cashStart);
  let short=null;
  for(const w of cash){ run+=w.net; if(run<0){ short=w; break; } }

  /* ── 物件（建物） ── */

    put('properties',{name:DEMO_TAG+'さくら寮 A棟', kind:'社宅・寮', address:'栃木県小山市本郷町1-2-3', companyId:vend.oya.id,
      rooms:6, capacity:12, contractStart:addMonths(endYm,-26)+'-01', contractEnd:addMonths(endYm,22)+'-28',
      rent:165000, kyoeki:12000, parking:16500, deposit:330000, note:'解約予告は3か月前'}),
    put('properties',{name:DEMO_TAG+'さくら寮 B棟', kind:'社宅・寮', address:'栃木県小山市本郷町1-2-8', companyId:vend.oya.id,
      rooms:4, capacity:8, contractStart:addMonths(endYm,-14)+'-01', contractEnd:addMonths(endYm,2)+'-28',
      rent:143000, kyoeki:8800, parking:0, deposit:286000, note:'★まもなく満了。更新するか要判断'}),
    put('properties',{name:DEMO_TAG+'本社事務所', kind:'事務所', address:'栃木県小山市駅前通り2-5', companyId:vend.oya.id,
      rooms:1, capacity:0, contractStart:addMonths(endYm,-38)+'-01', contractEnd:addMonths(endYm,10)+'-31',
      rent:220000, kyoeki:22000, parking:0, deposit:660000}),
    put('properties',{name:DEMO_TAG+'第2駐車場', kind:'駐車場', address:'栃木県小山市本郷町1-2-20', companyId:vend.oya.id,
      rent:33000, kyoeki:0, parking:0, contractStart:addMonths(endYm,-20)+'-01', contractEnd:''}),
  ];

  /* ── 費目（月次費用表の行） ──
     家賃と清掃は「買掛」＝毎月の支払請求になる。光熱費は「即払い」＝マスに打つ。 */
  const ci=(o)=>put('costItems', Object.assign({kind:'fixed', taxCat:'課税10%', active:true}, o));
  const rentAcc = pr => pr.kind==='駐車場'? A.rentPark : (pr.kind==='事務所'? A.rentOffice : A.rentDorm);
  const rentItems = props.map(pr=>ci({name:DEMO_TAG+pr.name.replace(DEMO_TAG,'')+' 家賃', accountCode:rentAcc(pr),
    monthly:num(pr.rent)+num(pr.kyoeki)+num(pr.parking), payMode:'買掛', companyId:vend.oya.id, propertyId:pr.id}));
  const util=[];
  const uAcc={ '電気代':A.denki, '水道代':A.suido, 'ガス代':A.gas };
  [[0,'電気代',18000,vend.den],[0,'水道代',9000,vend.sui],[0,'ガス代',14000,vend.gas],
   [1,'電気代',12000,vend.den],[1,'水道代',6500,vend.sui],[1,'ガス代',9000,vend.gas],
   [2,'電気代',22000,vend.den],[2,'水道代',5000,vend.sui]].forEach(([pi,nm,base,co])=>{
    util.push({ it: ci({name:DEMO_TAG+props[pi].name.replace(DEMO_TAG,'')+' '+nm, accountCode:uAcc[nm],
      monthly:base, payMode:'即払い', companyId:co.id, propertyId:props[pi].id}), base, kind:nm });
  });
  const cleanItem = ci({name:DEMO_TAG+'寮の共用部清掃', accountCode:'6900', monthly:33000, payMode:'買掛',
    companyId:vend.clean.id, propertyId:props[0].id});
  const other=[
    { it: ci({name:DEMO_TAG+'クラウド・通信費', accountCode:'6220', monthly:38500, payMode:'即払い'}), base:38500 },
    { it: ci({name:DEMO_TAG+'複合機リース', accountCode:'6900', monthly:16500, payMode:'即払い'}), base:16500 },
    { it: ci({name:DEMO_TAG+'旅費交通費', accountCode:'6300', monthly:0, payMode:'即払い', kind:'variable'}), base:45000, vary:true },
  ];

  /* ── 14か月ぶんの 請求・入金 ──
     会社ごとに「払い方のくせ」を変える。台帳のタイムラインで色の違いが見えるように。 */
  const invOf=(c, ym, items)=>{
    const rec={ companyId:c.id, bookMonth:ym, issueDate:monthEnd(ym), status:'確定', items,
      dueDate: dueDateOf(ym, c.closingDay, c.paySite, c.payDay), note:DEMO_TAG+'自動作成' };
    prepareDoc('invoices', rec, null);
    return put('invoices', rec);
  };
  const payFor=(c, inv, dayOffset, ratio)=>{
    const date=addDays(inv.dueDate, dayOffset);
    if(date>t) return null;                                  // 未来の入金は作らない
    const amt=Math.round(docTotal(inv)*(ratio==null?1:ratio));
    return put('payments',{ companyId:c.id, date, amount:amt, fee:0, method:'銀行振込', status:'確定',
      allocations:[{invoiceId:inv.id, amount:amt}], note:DEMO_TAG });
  };
  months.forEach((ym,mi)=>{
    /* さくら製作所: 在籍4名 × 30,000。いつも期日どおり（緑） */
    const i1=invOf(cust[0], ym, [{accountCode:'4100', name:'支援委託料', qty:4+(mi>9?1:0), price:30000, taxCat:'課税10%'}]
      .concat(mi%6===3? [{accountCode:'4300', name:'在留期間更新 申請手数料', qty:1, price:44000, taxCat:'課税10%'}]:[]));
    payFor(cust[0], i1, dint(-2,0));

    /* 東和フーズ: 月額固定。期日は遠いが、3〜12日遅れる（黄） */
    const i2=invOf(cust[1], ym, [{accountCode:'4100', name:'月額支援料', qty:1, price:165000, taxCat:'課税10%'}]
      .concat(mi%5===1? [{accountCode:'4200', name:'人材紹介料', qty:1, price:dvar(300000,.15), taxCat:'課税10%'}]:[]));
    payFor(cust[1], i2, dint(3,12));

    /* 北関東物流: 遅れがち（赤）。直近3か月は未入金のまま＝いま超過中 */
    const i3=invOf(cust[2], ym, [{accountCode:'4100', name:'支援委託料', qty:2, price:35000, taxCat:'課税10%'}]);
    if(mi < months.length-3){
      if(mi%7===2) payFor(cust[2], i3, dint(25,45), .6);      // 一部入金だけ
      else payFor(cust[2], i3, dint(20,70));
    }
  });

  /* ── 支払請求（買掛）と支払 ── */
  const billOf=(co, ym, items, note)=>{
    const rec={ companyId:co.id, bookMonth:ym, recvDate:monthEnd(ym), status:'確定', items,
      dueDate: dueDateOf(ym, co.closingDay, co.paySite, co.payDay), note:DEMO_TAG+(note||'') };
    prepareDoc('bills', rec, null);
    return put('bills', rec);
  };
  const payoutFor=(co, bill, dayOffset)=>{
    const date=addDays(bill.dueDate, dayOffset==null?0:dayOffset);
    if(date>t) return null;
    return put('payouts',{ companyId:co.id, date, amount:docTotal(bill), method:'銀行振込', status:'確定',
      allocations:[{billId:bill.id, amount:docTotal(bill)}], note:DEMO_TAG });
  };
  months.forEach((ym,mi)=>{
    /* 家賃: 大家さんへ1枚にまとめて（物件ごとの明細） */
    const rentBill=billOf(vend.oya, ym, props.map((pr,i)=>({ accountCode:rentAcc(pr), costItemId:rentItems[i].id,
      name:pr.name.replace(DEMO_TAG,'')+' 家賃', amount: netOfGross(num(pr.rent)+num(pr.kyoeki)+num(pr.parking),'課税10%'), taxCat:'課税10%' })), '家賃');
    payoutFor(vend.oya, rentBill, mi>=months.length-1? null : 0);
    /* 清掃 */
    const cb=billOf(vend.clean, ym, [{accountCode:'6900', costItemId:cleanItem.id, name:'寮 共用部清掃', amount:30000, taxCat:'課税10%'}], '清掃');
    if(mi < months.length-2) payoutFor(vend.clean, cb, dint(0,4));
    /* 通訳・翻訳（売上原価）: 毎月ではない */
    if(mi%3!==2){
      const tb=billOf(vend.tsu, ym, [{accountCode:'5200', name:'通訳・翻訳費', amount:dvar(90000,.4), taxCat:'課税10%'}], '通訳');
      if(mi < months.length-2) payoutFor(vend.tsu, tb, dint(-1,2));
    }
  });

  /* ── 光熱費など「即払い」の費用（月次費用表のマス） ──
     夏と冬は電気・ガスが上がる。1年の形が出るように季節で変える。 */
  const season=(ym,kind)=>{
    const m=Number(ym.split('-')[1]);
    if(kind==='電気代') return (m>=7&&m<=9)?1.35 : ((m===12||m<=2)?1.25:1);
    if(kind==='ガス代') return (m===12||m<=3)?1.4 : ((m>=6&&m<=9)?.7:1);
    return 1;
  };
  months.forEach(ym=>{
    util.forEach(u=>{
      put('expenses',{ costItemId:u.it.id, bookMonth:ym, date:monthEnd(ym), accountCode:u.it.accountCode,
        companyId:u.it.companyId, vendor:'', amount: dvar(u.base*season(ym,u.kind), .12),
        taxCat:'課税10%', method:'口座振替', note:u.it.name.replace(DEMO_TAG,'') });
    });
    other.forEach(o=>{
      const amt = o.vary? (drnd()<.25? 0 : dvar(o.base,.5)) : o.base;
      if(!amt) return;
      put('expenses',{ costItemId:o.it.id, bookMonth:ym, date:monthEnd(ym), accountCode:o.it.accountCode,
        amount:amt, taxCat:'課税10%', method:'クレジット', note:o.it.name.replace(DEMO_TAG,'') });
    });
  });

  /* ── 予算（今年度と前年度） ── */
  [CUR_FY, CUR_FY-1].forEach(fy=>{
    fyMonths(fy).forEach((ym,i)=>{
      put('budgets',{fy, mIndex:i, accountCode:'4100', amount: fy===CUR_FY? 700000 : 620000});
      put('budgets',{fy, mIndex:i, accountCode:'4200', amount: 100000});
      put('budgets',{fy, mIndex:i, accountCode:'5200', amount: 90000});
      put('budgets',{fy, mIndex:i, accountCode:'6200', amount: 620000});
      put('budgets',{fy, mIndex:i, accountCode:'6210', amount: 95000});
    });
  });
  if(!DB.settings) DB.settings={};
  if(!num(DB.settings.cashStart)){ DB.settings.cashStart=3500000; PENDING.changed.settings=DB.settings; }

  toast('デモデータを作りました。保存しています…','ok');
  await pushDelta();
  LED_CO=String(cust[2].id); LED_SIDE='ar'; LED_TAB='timeline';
  toast(`デモデータ ${demoCount()}件 を入れました。`,'ok');
  goto('ledger');
}

/** 印（demo:true）が付いた行だけを消す。本物には触れない。 */
async function demoRemove(quiet){
  if(!isAdmin()){ toast('管理者だけが消せます。','err'); return; }
  /* 消す順番: 使っている側から先に。科目は最後（費目・伝票が参照しているため） */
  const keys=['payments','payouts','invoices','bills','expenses','costItems','properties','billingRules','assignments','workers','budgets','companies','accounts'];
  const total=demoCount();
  if(!total){ toast('デモデータはありません。','ok'); return; }
  if(!quiet && !confirm(`デモデータ ${total}件 を全部消します。\n【デモ】の印が付いた行だけを消すので、本物のデータは残ります。\n\nよろしいですか？`)) return;

  /* まとめて消すと サーバーの安全装置（1回200件・3割減）に当たる。
     少しずつ、消してよいと伝えながら送る。 */
  for(const k of keys){
    const ids=(DB[k]||[]).filter(x=>x&&x.demo).map(x=>String(x.id));
    for(let i=0;i<ids.length;i+=120){
      const chunk=ids.slice(i,i+120);
      DB[k]=(DB[k]||[]).filter(x=>!chunk.includes(String(x.id)));
      chunk.forEach(id=>markDeleted(k,id));
      _confirmShrink=true;
      await pushDelta();
    }
  }
  _confirmShrink=false;
  if(!quiet){ toast(`デモデータ ${total}件 を消しました。`,'ok'); renderPage(CURRENT_PAGE); renderNav(); }
}

  const agg=scopes.includes('yojitsu.read');

  if(agg) parts.push('合計の数字');
  parts.push(`表 ${named.length}/${cols.length}`);

  return parts.join(' ・ ');
}

/** 発行・変更のフォーム。段（基本／全画面／全画面＋個人情報）で一気に決めてから、個別に足し引きできる。 */
function apiKeyForm(id){
  if(!isAdmin()){ toast('管理者のみです。','err'); return; }
  const k=id? API_KEYS.find(x=>x.id===id):null;
  API_FORM={ id:id||null, name:k?k.name:'', note:k?k.note:'', scopes:new Set(k?(k.scopes||[]):(API_META.levels[0].scopes||[])) };

function apiLevel(lv){
  const l=(API_META.levels||[]).find(x=>x.id===lv); if(!l) return;

}
function apiScopeToggle(s,on){ if(on) API_FORM.scopes.add(s); else API_FORM.scopes.delete(s); }
function drawApiKeyForm(){
  const f=API_FORM, cols=API_META.collections||[];

      <button class="btn" onclick="apiKeySave()">${f.id?'保存':'発行する'}</button></div>`,'lg');

async function apiKeySave(){
  const f=API_FORM;
  if(!f.name.trim()){ toast('名前を入れてください。','err'); return; }
  if(!f.scopes.size){ toast('読ませるものを1つ以上選んでください。','err'); return; }
  const body=JSON.stringify({ name:f.name.trim(), note:f.note||'', scopes:Array.from(f.scopes) });
  try{
    const r=await fetch(API_BASE+'/apimgmt/keys'+(f.id?('/'+encodeURIComponent(f.id)):''),
      { method:f.id?'PATCH':'POST', headers:headers(), body });
    const d=await r.json();
    if(!r.ok){ toast(d.message||'保存できませんでした。','err'); return; }
    closeModal();
    if(d.api_key) apiShowKey(d.api_key, d.notice);
    else toast('保存しました。','ok');
    renderPage('apilink');
  }catch(e){ toast('通信に失敗しました。','err'); }
}

async function apiRotate(id){
  const k=API_KEYS.find(x=>x.id===id);
  if(!confirm(`「${k?k.name:''}」の鍵を作り直します。\n新しい鍵が出ます。古い鍵は24時間後に使えなくなります。`)) return;
  const r=await fetch(API_BASE+'/apimgmt/keys/'+encodeURIComponent(id)+'/rotate',{method:'POST',headers:headers(),body:JSON.stringify({grace_hours:24})});
  const d=await r.json();
  if(r.ok&&d.api_key){ apiShowKey(d.api_key,d.notice); renderPage('apilink'); } else toast('作り直せませんでした。','err');
}
async function apiRevoke(id){
  const k=API_KEYS.find(x=>x.id===id);
  if(!confirm(`「${k?k.name:''}」を失効します。\nこの鍵を使っている連携とAIは、その場で読めなくなります。`)) return;
  const r=await fetch(API_BASE+'/apimgmt/keys/'+encodeURIComponent(id)+'/revoke',{method:'POST',headers:headers()});
  if(r.ok){ toast('失効しました。','ok'); renderPage('apilink'); } else toast('失効できませんでした。','err');
}
async function apiDelete(id){
  const k=API_KEYS.find(x=>x.id===id);
  if(!confirm(`「${k?k.name:''}」を一覧から消します。\n記録（連携ログ）は残ります。よろしいですか？`)) return;
  const r=await fetch(API_BASE+'/apimgmt/keys/'+encodeURIComponent(id),{method:'DELETE',headers:headers()});
  if(r.ok){ toast('削除しました。','ok'); renderPage('apilink'); } else toast('削除できませんでした。','err');

          let body='';
          if(x.action==='update') body=Object.entries(det).slice(0,6).map(([f,v])=>
            `${esc(auditFieldLabel(x.entity,f))}: ${auditVal(v.old)} → <b>${auditVal(v.new)}</b>`).join('<br>');
          else if(x.action==='create') body='<span class="muted">新規作成</span>';
          else if(x.action==='delete') body='<span class="minus">削除（内容は記録済み）</span>';
          else body='<span class="muted">'+esc(x.action)+'</span>';
          return `<tr><td>${esc(String(x.at).slice(0,16).replace('T',' '))}</td><td>${esc(x.actor_email||'')}</td>
            <td>${statusBadge(x.action==='create'?'確定':(x.action==='delete'?'取消':'一部入金')).replace(/>[^<]+</,'>'+({create:'作成',update:'更新',delete:'削除',restore:'復元'}[x.action]||x.action)+'<')}</td>
            <td>${esc(AUDIT_ENT[x.entity]||x.entity)}</td>
            <td style="white-space:normal;font-size:11.5px;line-height:1.7;">${body}</td></tr>`;
        }).join('')||'<tr><td colspan="5" class="empty">記録がありません。</td></tr>'}</tbody></table></div>`;
    } else if(AUDIT_TAB==='guard'){
      const r=await fetch(API_BASE+'/sync-log',{headers:headers()}); const d=await r.json();
      box.innerHTML=`<div class="infobar">書き込みの記録です。ブロックされた行は、安全装置が働いた（＝データが守られた）ことを意味します。</div>
        <div class="table-wrap"><table><thead><tr><th>日時</th><th>利用者</th><th>結果</th><th>理由</th><th>IP</th><th>内容</th></tr></thead>
        <tbody>${(d.items||[]).map(x=>`<tr><td>${esc(String(x.at).slice(0,16).replace('T',' '))}</td><td>${esc(x.actor_email||'')}</td>
          <td>${x.result==='accepted'?'<span class="badge b-green">受付</span>':'<span class="badge b-red">ブロック</span>'}</td>
          <td>${esc(x.reason||'')}</td><td class="muted">${esc(x.ip||'')}</td>
          <td style="white-space:normal;font-size:11px;" class="muted">${esc(JSON.stringify(x.detail||{}).slice(0,120))}</td></tr>`).join('')
          ||'<tr><td colspan="6" class="empty">記録がありません。</td></tr>'}</tbody></table></div>`;
    } else {
      const r=await fetch(API_BASE+'/state-history',{headers:headers()}); const d=await r.json();
      box.innerHTML=`<div class="warnbar">復元すると、その時点のデータ全体に戻ります。復元前の状態も自動で保存されるので、やり直せます。</div>
        <div class="table-wrap"><table><thead><tr><th>日時</th><th>実行者</th><th>種類</th><th>件数</th><th></th></tr></thead>
        <tbody>${(d.items||[]).map(x=>`<tr><td>${esc(String(x.at).slice(0,16).replace('T',' '))}</td><td>${esc(x.actor_email||'')}</td>
          <td>${esc(x.reason||'')}</td>
          <td class="muted" style="white-space:normal;font-size:11px;">${esc(Object.entries(x.counts||{}).filter(([,v])=>v).map(([k,v])=>`${AUDIT_ENT[k]||k} ${v}`).join(' / '))}</td>
          <td>${isAdmin()?`<button class="btn secondary sm" onclick="doRestore('${x.id}','${esc(String(x.at).slice(0,16).replace('T',' '))}')">この時点に戻す</button>`:''}</td></tr>`).join('')
          ||'<tr><td colspan="5" class="empty">履歴がありません。</td></tr>'}</tbody></table></div>`;
    }
  }catch(e){ box.innerHTML='<div class="alertbar">取得できませんでした。</div>'; }
}
async function doRestore(id, at){
  if(!confirm(`${at} の状態に戻します。\n現在のデータは自動で保存され、やり直すこともできます。よろしいですか？`)) return;
  try{
    const r=await fetch(API_BASE+'/state-history/'+id+'/restore',{method:'POST',headers:headers()});
    if(r.ok){ toast('復元しました。画面を読み込み直します。','ok'); setTimeout(()=>location.reload(),1200); }
    else toast('復元できませんでした。','err');
  }catch(e){ toast('通信に失敗しました。','err'); }
}

function accForm(id){

  openModal(`<h3>${a?'勘定科目の編集':'勘定科目の追加'}</h3>
    <div class="form-grid">
      <div><label>コード</label><input id="acC" value="${attr(a?a.code:'')}" placeholder="6500"></div>
      <div><label>区分</label><select id="acK">${selOpts(Object.keys(KIND_LABEL).map(k=>({k,label:KIND_LABEL[k]})), a?a.kind:'sga')}</select></div>
      <div class="full"><label>名称</label><input id="acL" value="${attr(a?a.label:'')}" placeholder="例: 採用費"></div>
    </div>
    <div class="modal-actions"><button class="btn secondary" onclick="closeModal()">キャンセル</button>
      <button class="btn" onclick="accSave('${a?a.id:''}')">保存</button></div>`);
}
function accSave(id){
  const rec={ code:document.getElementById('acC').value.trim(), label:document.getElementById('acL').value.trim(),
    kind:document.getElementById('acK').value };
  if(!rec.code||!rec.label){ toast('コードと名称を入力してください。','err'); return; }
  commitRecord('accounts', rec, { existingId:id||null });
  closeModal(); renderPage('settings'); toast('保存しました。','ok');
}

/* ============ 検索・CSV ============ */
function globalSearch(q){
  const box=document.getElementById('searchResults');
  q=(q||'').trim().toLowerCase();
  if(!q||!DB){ box.classList.remove('show'); return; }
  const res=[];
  (DB.companies||[]).forEach(c=>{ if(((c.name||'')+(c.kana||'')).toLowerCase().includes(q))
    res.push({t:c.name, s:'取引先', go:`openDetail('companies','${c.id}')`}); });
  (DB.invoices||[]).forEach(i=>{ if(((i.no||'')+companyName(i.companyId)).toLowerCase().includes(q))
    res.push({t:i.no+' ／ '+companyName(i.companyId).replace(/<[^>]+>/g,''), s:'請求書 '+moneyPlain(docTotal(i))+'円', go:`openDetail('invoices','${i.id}')`}); });
  (DB.bills||[]).forEach(b=>{ if(((b.no||'')+companyName(b.companyId)).toLowerCase().includes(q))
    res.push({t:b.no+' ／ '+companyName(b.companyId).replace(/<[^>]+>/g,''), s:'支払請求', go:`openDetail('bills','${b.id}')`}); });
  /* 特定技能者はこのシステムの対象から外したため、検索からも外しています（データは残っています）。 */
  box.innerHTML = res.slice(0,10).map(r=>`<div class="ac-item" onmousedown="closeSearch();${r.go}">
    <span>${esc(r.t)}</span><span class="muted" style="font-size:11px;">${esc(r.s)}</span></div>`).join('')
    || `<div class="ac-item muted">「${esc(q)}」に一致する結果がありません</div>`;
  box.classList.add('show');
}
function closeSearch(){ document.getElementById('searchResults').classList.remove('show');
  document.getElementById('quickSearch').value=''; }
document.addEventListener('click', e=>{ if(!e.target.closest('.topsearch')) document.getElementById('searchResults')?.classList.remove('show'); });

function downloadCsv(name, rows){
  const csv='﻿'+rows.map(r=>r.map(c=>`"${String(c==null?'':c).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download=`${name}_${today()}.csv`; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
}
function exportCsvTable(key){
  const map={
    invoices:[['請求番号','発行日','請求先','計上月','請求額','入金済','残高','期日','状態'],
      ()=>(DB.invoices||[]).map(i=>[i.no,i.issueDate,companyName(i.companyId).replace(/<[^>]+>/g,''),i.bookMonth,
        docTotal(i),paidOfInvoice(i),balanceOfInvoice(i),i.dueDate,invoiceStatus(i)])],
    bills:[['管理番号','受領日','支払先','計上月','金額','支払済','残高','期日','状態'],
      ()=>(DB.bills||[]).map(b=>[b.no,b.recvDate,companyName(b.companyId).replace(/<[^>]+>/g,''),b.bookMonth,
        docTotal(b),paidOfBill(b),balanceOfBill(b),b.dueDate,billStatus(b)])],
    payments:[['入金日','取引先','入金額','手数料','方法','備考'],
      ()=>(DB.payments||[]).map(p=>[p.date,companyName(p.companyId).replace(/<[^>]+>/g,''),p.amount,p.fee,p.method,p.note])],
    payouts:[['支払日','支払先','支払額','方法','備考'],
      ()=>(DB.payouts||[]).map(p=>[p.date,companyName(p.companyId).replace(/<[^>]+>/g,''),p.amount,p.method,p.note])],
    expenses:[['支払日','計上月','勘定科目','支払先','金額','方法','摘要'],
      ()=>(DB.expenses||[]).map(e=>[e.date,e.bookMonth,accountLabel(e.accountCode),e.vendor,e.amount,e.method,e.note])],
    companies:[['取引先名','区分','データ元','締日','支払サイト','支払日','売掛残','買掛残'],
      ()=>(DB.companies||[]).map(c=>[c.name,c.kind,c.source==='crm'?'CRM':'手入力',c.closingDay,c.paySite,c.payDay,arBalanceOf(c.id),apBalanceOf(c.id)])],
  };
  const m=map[key]; if(!m) return;
  downloadCsv(key, [m[0], ...m[1]()]);
}
function exportCsvYojitsu(){
  const act=plBook(CUR_FY,'actual'), bud=plBook(CUR_FY,'budget');
  const rows=[['科目','種別',...FY_MONTH_LABELS,'年間']];
  PL_ROWS.filter(r=>r.type!=='rate').forEach(r=>{
    rows.push([r.label,'実績',...act[r.key],sum12(act[r.key])]);
    rows.push([r.label,'予算',...bud[r.key],sum12(bud[r.key])]);
  });
  downloadCsv(`予実_${CUR_FY}年度`, rows);
}

  if(GTOKEN && SESSION){

      SESSION=Object.assign(SESSION,me); afterLogin();

    initGoogle();
  }
})();
