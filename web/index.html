/* ============================================================================
   督促 — 「今日、誰に、何をするか」と「やったことの記録」
   ----------------------------------------------------------------------------
   利用者の指示（2026-09-14）: 支払いが遅い会社への警告の仕組みを作る。

   いままで足りなかったもの（相談の結果）:
     ① やったことが残らない → 同じ会社に2人が電話する／誰も電話しない
     ② いつ何をするかの決まりが無い → 各自の記憶まかせ
     ③ 「払います」と言われた日を過ぎても 誰も気づかない
   そこで:
   ・対応記録（collectionLogs）… いつ・どうやって（電話・メール・訪問）・何を話したか・
     入金の約束日と額・次に対応する日
   ・段階（期日からの日数。基本設定で変えられる）
       督促1 期日＋1日  やさしいお知らせ（メール）
       督促2 期日＋7日  再度のお願い・入金予定日を聞く（メール）
       督促3 期日＋30日 電話・責任者へ（最終のお願い）
   ・督促キュー … 今日やるべき会社を、急ぐ順に。1押しで記録、1押しで その段階のメール
   ・メールを送ったら、それ自体を対応記録に自動で残す（記録の手間を増やさない）
   ★ お客様へ自動では送りません。送るのは人（確認画面つき）。
   ★ 遅れの判断は 調整後の期日（effDue）。土日祝で払いが翌営業日になる会社を責めない。
   ========================================================================== */
const DUN_METHODS = ['電話','メール','訪問','郵送','その他'];
function dunDays(){
  const d=(DB.settings && DB.settings.dunning) || {};
  return { d1: num(d.d1)||1, d2: num(d.d2)||7, d3: num(d.d3)||30 };
}
const DUN_STAGE = [
  { n:0, label:'—', cls:'b-gray' },
  { n:1, label:'督促1', cls:'b-amber', note:'やさしいお知らせ', tpl:'d-ar-remind',  method:'メール' },
  { n:2, label:'督促2', cls:'b-amber', note:'再度のお願い・入金予定日を聞く', tpl:'d-ar-remind2', method:'メール' },
  { n:3, label:'督促3', cls:'b-red',   note:'電話・責任者へ（最終のお願い）', tpl:'d-ar-remind3', method:'電話' },
];
function dunLogs(companyId){
  return (DB.collectionLogs||[]).filter(x=>x && String(x.companyId)===String(companyId))
    .sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')) || String(b.createdAt||'').localeCompare(String(a.createdAt||'')));
}
/** 1社の督促の状態。「今日やること（todo）」まで決める。 */
function dunStatus(companyId){
  const t=today(), D=dunDays();
  const overdue=openInvoices().filter(i=>String(i.companyId)===String(companyId) && isOverdue(i));
  const amount=overdue.reduce((s,i)=>s+balanceOfInvoice(i),0);
  const maxDays=overdue.reduce((m,i)=>Math.max(m, daysOverdue(i)),0);
  const oldestDue=overdue.map(effDue).sort()[0]||'';
  const stage = !overdue.length ? 0 : (maxDays>=D.d3 ? 3 : (maxDays>=D.d2 ? 2 : (maxDays>=D.d1 ? 1 : 0)));
  const logs=dunLogs(companyId), last=logs[0]||null;
  const c=findById('companies',companyId)||{};

  /* 約束: いちばん新しい「約束日つき」の記録。約束した日以降の入金で 守られたかを見る */
  const pl=logs.find(x=>x.promiseDate);
  let promise=null;
  if(pl){
    const paid=(DB.payments||[]).filter(p=>p.status!=='取消' && String(p.companyId)===String(companyId)
      && p.date && p.date>=(pl.date||'') && p.date<=pl.promiseDate).reduce((s,p)=>s+num(p.amount)+num(p.fee),0);
    const want=num(pl.promiseAmount);
    const kept = (want? paid>=want : paid>0) || !overdue.length;
    promise={ date:pl.promiseDate, amount:want, paid, state: kept? 'kept' : (pl.promiseDate<t ? 'broken' : 'waiting'), log:pl };
  }
  /* その段階に入った日（最も古い延滞の期日＋段階の日数） */
  const stageStart = stage && oldestDue ? addDays(oldestDue, [0,D.d1,D.d2,D.d3][stage]) : '';
  const actedSinceStage = !!(stageStart && logs.some(x=>(x.date||'')>=stageStart));

  let todo=null;
  if(promise && promise.state==='broken' && overdue.length)
    todo={ rank:5, cls:'b-red', text:`約束日（${promise.date}）を過ぎても入金がありません → 電話`, method:'電話', stage:Math.max(stage,2) };
  else if(last && last.nextDate && last.nextDate<=t && overdue.length && !(promise && promise.state==='waiting'))
    todo={ rank:4, cls:'b-amber', text:`対応予定日（${last.nextDate}）です`, method:(last.method||'電話'), stage };
  else if(stage && !actedSinceStage && !(promise && promise.state==='waiting'))
    todo={ rank:stage, cls:DUN_STAGE[stage].cls, text:`${DUN_STAGE[stage].label}：${DUN_STAGE[stage].note}`, method:DUN_STAGE[stage].method, stage };

  return { companyId, company:c, overdue, amount, maxDays, oldestDue, stage, logs, last, promise, todo,
    owner:c.owner||'', grade:payGrade(companyId,'ar'), creditOver: creditOver(companyId) };
}
/** 与信限度額を超えているか（限度額を入れていない会社は false） */
function creditOver(companyId){
  const c=findById('companies',companyId);
  const lim=num(c && c.creditLimit);
  return lim>0 && arBalanceOf(companyId) > lim;
}
/** 督促キューに出す会社（延滞がある or 約束待ち）。今日やる会社が先。 */
function dunRows(){
  const ids=new Set();
  openInvoices().forEach(i=>{ if(isOverdue(i)) ids.add(String(i.companyId)); });
  (DB.collectionLogs||[]).forEach(x=>{ if(x && x.promiseDate && x.promiseDate>=addDays(today(),-60)) ids.add(String(x.companyId)); });
  return [...ids].map(dunStatus).filter(r=>r.overdue.length || (r.promise && r.promise.state==='waiting'))
    .sort((a,b)=> ((b.todo?b.todo.rank:0)-(a.todo?a.todo.rank:0)) || (b.maxDays-a.maxDays) || (b.amount-a.amount));
}

let DUN_FILTER='today', DUN_MINE=false;
function setDunFilter(f){ DUN_FILTER=f; renderPage('dunning'); }
function toggleDunMine(){ DUN_MINE=!DUN_MINE; renderPage('dunning'); }

function viewDunning(){
  const all=dunRows(), me=String((SESSION&&SESSION.email)||'').toLowerCase();
  let rows=all;
  if(DUN_FILTER==='today') rows=rows.filter(r=>r.todo);
  if(DUN_MINE) rows=rows.filter(r=>String(r.owner).toLowerCase()===me);
  const todoN=all.filter(r=>r.todo).length;
  const broken=all.filter(r=>r.promise&&r.promise.state==='broken'&&r.overdue.length);
  const waiting=all.filter(r=>r.promise&&r.promise.state==='waiting');
  const canLog=canCreate('invoices')||canEdit('invoices');

  const kpis=`<div class="kpi-grid">
    <div class="kpi ${todoN?'clickable':''}" onclick="setDunFilter('today')"><div class="lbl">今日やる</div>
      <div class="num ${todoN?'minus':''}">${todoN}社</div><div class="sub">督促・約束切れ・予定日</div></div>
    <div class="kpi"><div class="lbl">延滞（調整後の期日で）</div>
      <div class="num ${all.some(r=>r.amount)?'minus':''}">${moneyPlain(all.reduce((s,r)=>s+r.amount,0))}</div>
      <div class="sub">${all.filter(r=>r.overdue.length).length}社</div></div>
    <div class="kpi"><div class="lbl">約束を過ぎた</div><div class="num ${broken.length?'minus':''}">${broken.length}社</div>
      <div class="sub">払うと言われた日を過ぎて入金なし</div></div>
    <div class="kpi"><div class="lbl">約束待ち</div><div class="num">${moneyPlain(waiting.reduce((s,r)=>s+(r.promise.amount||r.amount),0))}</div>
      <div class="sub">${waiting.length}社</div></div>
  </div>`;

  const body=rows.map(r=>{
    const st=DUN_STAGE[r.stage];
    const pr=r.promise? `${esc(r.promise.date)}${r.promise.amount?`<div class="muted" style="font-size:10.5px;">${moneyPlain(r.promise.amount)}円</div>`:''}
      <span class="badge ${r.promise.state==='broken'?'b-red':(r.promise.state==='kept'?'b-green':'b-blue')}">${r.promise.state==='broken'?'過ぎた':(r.promise.state==='kept'?'守られた':'待ち')}</span>` : '<span class="zero">—</span>';
    const stageTpl = r.todo && r.todo.stage ? DUN_STAGE[r.todo.stage].tpl : (r.stage? DUN_STAGE[r.stage].tpl : 'd-ar-remind');
    return `<tr onclick="openArLedger('${attr(r.companyId)}')" style="cursor:pointer;">
      <td><b>${esc(r.company.name||'')}</b> <span class="badge ${r.grade.cls}">${esc(r.grade.g)}</span>
        ${r.creditOver?'<span class="badge b-red" title="与信限度額を超えています">限度超過</span>':''}
        <div class="muted" style="font-size:10.5px;">${r.owner?'担当 '+esc(String(r.owner).split('@')[0]):'<span style="color:var(--warning);">担当未設定</span>'}</div></td>
      <td class="r num">${r.amount?`<b class="minus">${moneyPlain(r.amount)}</b><div class="muted" style="font-size:10.5px;">${r.overdue.length}件</div>`:'<span class="zero">0</span>'}</td>
      <td class="r">${r.maxDays?`<b>${r.maxDays}日</b>`:'<span class="zero">—</span>'}</td>
      <td><span class="badge ${st.cls}">${esc(st.label)}</span></td>
      <td style="font-size:12px;">${r.last?`${esc(r.last.date||'')} ${esc(r.last.method||'')}<div class="muted" style="font-size:10.5px;">${esc(String(r.last.by||'').split('@')[0])}：${esc(String(r.last.content||'').slice(0,24))}</div>`:'<span style="color:var(--warning);">未対応</span>'}</td>
      <td style="font-size:12px;">${pr}</td>
      <td style="font-size:12px;">${r.todo?`<span class="badge ${r.todo.cls}">${esc(r.todo.text)}</span>`
        : (r.promise&&r.promise.state==='waiting'?`<span class="muted">約束日まで待つ</span>`
        : (r.last&&r.last.nextDate?`<span class="muted">${esc(r.last.nextDate)} に予定</span>`:'<span class="muted">対応済み</span>'))}</td>
      <td class="r" style="white-space:nowrap;">${canLog?`<a class="pillbtn pill-new" onclick="event.stopPropagation();dunLogForm('${attr(r.companyId)}','${attr(r.todo?r.todo.method:'電話')}')">記録</a>`:''}
        <a class="pillbtn pill-save" onclick="event.stopPropagation();mailCompose('ar','${attr(r.companyId)}','${attr(stageTpl)}')" title="${attr((DUN_STAGE[r.todo&&r.todo.stage||r.stage]||{}).label||'')}のメール">${IC.mail}</a></td></tr>`;
  }).join('');

  const D=dunDays();
  return pageShell({ title:'督促（今日やること）', count:all.length, shown:rows.length,
    sub:`延滞のある会社と、入金の約束を待っている会社。段階は 期日＋${D.d1}日／＋${D.d2}日／＋${D.d3}日（基本設定で変更）。期日は土日祝を調整した日で判断します。`,
    tools:`<div class="seg">
        <button class="${DUN_FILTER==='today'?'on':''}" onclick="setDunFilter('today')">今日やる（${todoN}）</button>
        <button class="${DUN_FILTER==='all'?'on':''}" onclick="setDunFilter('all')">すべて（${all.length}）</button></div>
      <div class="seg" style="margin-left:6px;"><button class="${DUN_MINE?'on':''}" onclick="toggleDunMine()">自分の担当だけ</button></div>`,
    body: kpis + `<div class="table-wrap"><table class="stick1">
      <thead><tr><th style="min-width:190px;">取引先</th><th class="r">延滞額</th><th class="r">最長</th><th>段階</th>
        <th style="min-width:150px;">最後の対応</th><th style="min-width:110px;">入金の約束</th><th style="min-width:210px;">今日やること</th><th></th></tr></thead>
      <tbody>${body || `<tr><td colspan="8" class="empty" style="padding:22px;">${DUN_FILTER==='today'?'今日やる督促はありません。':'延滞している会社はありません。'}</td></tr>`}</tbody></table></div>
      <div class="fhelp" style="margin-top:8px;">「記録」＝電話や訪問の内容・入金の約束日を残す。「✉」＝その段階のメールを開く（送るとそのまま対応記録になります）。<br>
        約束日を過ぎても入金が無い会社は、いちばん上に来ます。</div>` });
}

/* ---------- 対応を記録する ---------- */
function dunLogForm(companyId, method){
  const s=dunStatus(companyId), t=today();
  openModal2(`<h3>対応を記録　<span style="font-size:13px;color:var(--muted);font-weight:400;">${esc(s.company.name||'')}</span></h3>
    <div class="mdsub">延滞 ${moneyPlain(s.amount)}円（${s.overdue.length}件・最長${s.maxDays}日）${s.stage?` ／ いまの段階 ${esc(DUN_STAGE[s.stage].label)}`:''}</div>
    <div class="form-grid">
      <div><label>日付</label><input type="date" id="dlDate" value="${attr(t)}"></div>
      <div><label>方法</label><select id="dlMethod">${DUN_METHODS.map(m=>`<option ${m===(method||'電話')?'selected':''}>${esc(m)}</option>`).join('')}</select></div>
      <div class="full"><label>内容 <span style="color:var(--danger)">*</span></label>
        <textarea id="dlContent" rows="3" placeholder="例: 経理の佐藤様と話した。社内の承認待ちで今月末に払うとのこと"></textarea></div>
      <div><label>入金の約束日</label><input type="date" id="dlPromise" onchange="dunDefaultNext()"></div>
      <div><label>約束の額</label><input id="dlAmount" class="num" style="text-align:right;" value="${attr(moneyPlain(s.amount))}" oninput="fmtMoneyInput(this)"></div>
      <div><label>次に対応する日</label><input type="date" id="dlNext" value="${attr(addDays(t,7))}">
        <div class="fhelp">この日になると督促キューの「今日やる」に出ます。</div></div>
    </div>
    <div class="modal-actions"><button class="btn secondary" onclick="closeModal2()">キャンセル</button>
      <button class="btn" onclick="dunLogSave('${attr(companyId)}')">記録する</button></div>`);
}
function dunDefaultNext(){
  const p=document.getElementById('dlPromise').value, n=document.getElementById('dlNext');
  if(p && n) n.value=addDays(p,1);        // 約束日の翌日に「入ったか」を確かめる
}
function dunLogSave(companyId, preset){
  const g=id=>{ const el=document.getElementById(id); return el? el.value : ''; };
  const rec = preset || { companyId, date:g('dlDate')||today(), method:g('dlMethod')||'電話', content:(g('dlContent')||'').trim(),
    promiseDate:g('dlPromise')||'', promiseAmount:num(g('dlAmount')), nextDate:g('dlNext')||'' };
  if(!preset && !rec.content){ toast('内容を入れてください（何を話したか・誰と）。','err'); return; }
  const s=dunStatus(companyId);
  rec.companyId=companyId;
  rec.stage=s.stage;
  rec.invoiceIds=s.overdue.map(i=>i.id);
  rec.by=(SESSION&&SESSION.email)||'';
  if(!rec.promiseDate) rec.promiseAmount=0;
  commitRecord('collectionLogs', rec, {});
  if(!preset){ closeModal2(); toast('記録しました。','ok'); }
  renderPage(CURRENT_PAGE);
}
/** 取引先別の詳細に出す「督促・対応の記録」 */

    <div class="panel-bd" style="font-size:12.5px;line-height:1.8;">

const mailFill = (text, vars) => String(text||'').replace(/\{\{([^}]+)\}\}/g, (m,k)=> k in vars ? vars[k] : m);
function mailTemplates(side){
  const saved=(DB.mailTemplates||[]).filter(t=>t && t.side===side);
  return MAIL_TPL_DEFAULT.filter(t=>t.side===side).concat(saved);
}
const mailPinKey = side => 'bl_yj_mailpin_'+side;
function mailPinned(side){ try{ return localStorage.getItem(mailPinKey(side))||''; }catch(e){ return ''; } }
function mailHistory(side, companyId){
  return (DB.mailLog||[]).filter(x=>x && x.side===side && String(x.companyId)===String(companyId))
    .sort((a,b)=>String(b.at||'').localeCompare(String(a.at||'')));
}

let MAIL_CTX=null, _mailFocus='mailBody';

  const tpl=(tplId && tpls.find(t=>t.id===tplId)) || tpls.find(t=>t.id===pin) || tpls[0];
  const vars=mailVars(side, companyId);
  MAIL_CTX={ side, companyId, tplId: tpl? tpl.id:'', to: c.billEmail||c.email||'', cc:(SESSION&&SESSION.email)||'',
    subject: tpl? mailFill(tpl.subject,vars):'', body: tpl? mailFill(tpl.body,vars):'', files:null };
  drawMailCompose();
  mailLoadFiles();
}

function mailApplyTpl(id){
  const t=mailTemplates(MAIL_CTX.side).find(x=>x.id===id); if(!t) return;
  const v=mailVars(MAIL_CTX.side, MAIL_CTX.companyId);
  MAIL_CTX.tplId=id; MAIL_CTX.subject=mailFill(t.subject,v); MAIL_CTX.body=mailFill(t.body,v);
  drawMailCompose();
}
function mailInsert(token){
  const el=document.getElementById(_mailFocus)||document.getElementById('mailBody'); if(!el) return;
  const v=mailVars(MAIL_CTX.side, MAIL_CTX.companyId);
  const val=mailFill(token, v);
  const s0=el.selectionStart??el.value.length, s1=el.selectionEnd??el.value.length;
  el.value=el.value.slice(0,s0)+val+el.value.slice(s1);
  el.selectionStart=el.selectionEnd=s0+val.length; el.focus();
  if(el.id==='mailBody') MAIL_CTX.body=el.value; else MAIL_CTX.subject=el.value;
}
function mailPin(){
  try{ localStorage.setItem(mailPinKey(MAIL_CTX.side), MAIL_CTX.tplId); }catch(e){}
  toast('次からこのテンプレで開きます。','ok'); drawMailCompose();
}

function mailSaveTpl(){

    ${saved.length? `<div class="table-wrap"><table><tbody>${saved.map(t=>`<tr><td><b>${esc(t.name)}</b><div class="muted" style="font-size:11px;">${esc(t.subject||'')}</div></td>

function mailDelTpl(id){
  if(!confirm('このテンプレを消します。よろしいですか？')) return;
  DB.mailTemplates=(DB.mailTemplates||[]).filter(t=>String(t.id)!==String(id)); markDeleted('mailTemplates', id);
  closeModal2(); if(MAIL_CTX && MAIL_CTX.tplId===id) MAIL_CTX.tplId=''; drawMailCompose();
}
/** この会社の添付（会社 ＋ 直近の伝票）を集める */
async function mailLoadFiles(){
  const m=MAIL_CTX; if(!m) return;
  const S=ledS(m.side), docEnt=m.side==='ap'?'bills':'invoices';
  const docs=S.docs(m.companyId).filter(d=>d.status!=='取消').sort((a,b)=>String(b.bookMonth||'').localeCompare(String(a.bookMonth||''))).slice(0,6);
  const asks=[{entity:'companies', id:m.companyId, where:'取引先'}].concat(docs.map(d=>({entity:docEnt, id:d.id, where:(d.no||'')})));
  const out=[];
  await Promise.all(asks.map(async a=>{
    try{
      const r=await fetch(API_BASE+'/files?entity='+a.entity+'&id='+encodeURIComponent(a.id),{headers:headers()});
      if(!r.ok) return;
      const d=await r.json();
      (d.items||[]).forEach(f=>out.push(Object.assign({ where:a.where, on:false }, f)));
    }catch(e){}
  }));
  if(MAIL_CTX!==m) return;                   // 待っている間に別の会社を開いた
  m.files=out;
  if(document.getElementById('mailFiles')) drawMailCompose();
}
function mailConfirm(){

async function mailSend(){
  const m=MAIL_CTX, gas=(SESSION&&SESSION.gasUrl)||'';
  if(!gas){ toast('メール設定（Apps Script の URL）が未設定です。','err'); return; }
  const btn=document.getElementById('mailSendBtn'); if(btn){ btn.disabled=true; btn.textContent='送信しています…'; }
  const chosen=(m.files||[]).filter(f=>f.on);
  try{
    const attachments=[];
    for(const f of chosen){
      const b=await attBlob(f.id);
      const dataBase64=await attReadB64(b);
      attachments.push({ name:f.fileName, mimeType:f.mime, dataBase64 });
    }
    const payload={ to:m.to, cc:m.cc, subject:m.subject, body:m.body,
      senderName:(SESSION&&SESSION.name)||'', attachments };
    await fetch(gas,{ method:'POST', mode:'no-cors', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) });
    commitRecord('mailLog', { side:m.side, companyId:m.companyId, to:m.to, cc:m.cc, subject:m.subject,
      files:chosen.length, template:m.tplId||'', by:(SESSION&&SESSION.email)||'', at:new Date().toISOString() }, {});
    /* 回収のメールは、送ったこと自体が「対応」。記録の手間を増やさないよう自動で残す */
    if(m.side==='ar') dunLogSave(m.companyId, { date:today(), method:'メール', content:'メール送信：'+m.subject+(chosen.length?`（添付${chosen.length}）`:''),
      promiseDate:'', promiseAmount:0, nextDate:addDays(today(),7) });
    closeModal();
    toast('送信を依頼しました。届いたかどうかは、あなたの Gmail の「送信済み」で確かめられます。','ok');
    renderPage(CURRENT_PAGE);
  }catch(e){
    if(btn){ btn.disabled=false; btn.textContent='この内容で送信'; }
    toast('送信できませんでした：'+(e.message||''),'err');
  }
}

function gasCodeText(){
  return `// Google Apps Script — BIGLIGHT Gmail送信 Web App（CRM と同じもの。CRM で作ってあれば その URL をそのまま使えます）
// 1. script.google.com に自分のGmailでログイン → 新しいプロジェクト → このコードを全部貼り付け → 保存
// 2. 関数メニューで「sendTest」を選び ▶実行 → 承認 → 許可（初回だけ）→ 自分宛にテストメールが届けばOK
// 3. デプロイ → 新しいデプロイ → ウェブアプリ → 実行者:自分 → アクセスできるユーザー:全員 → デプロイ
// 4. ウェブアプリの URL（…/exec で終わる）をコピーして、予実管理システムの「メール設定」に貼る

function doPost(e) {
  try {
    var params = JSON.parse(e.postData.contents);
    var opts = { name: params.senderName ? ('BIGLIGHT ' + params.senderName) : 'BIGLIGHT' };
    if (params.cc)  opts.cc  = params.cc;
    if (params.bcc) opts.bcc = params.bcc;
    if (params.attachments && params.attachments.length) {
      opts.attachments = params.attachments.map(function(a){
        return Utilities.newBlob(Utilities.base64Decode(a.dataBase64), a.mimeType || 'application/octet-stream', a.name || 'file');
      });
    }
    GmailApp.sendEmail(params.to, params.subject, params.body, opts);
    return ContentService.createTextOutput(JSON.stringify({success: true})).setMimeType(ContentService.MimeType.JSON);
  } catch(err) {
    return ContentService.createTextOutput(JSON.stringify({success: false, error: String(err)})).setMimeType(ContentService.MimeType.JSON);
  }
}

function sendTest() {

/* ============================================================================
   取引先別（回収）／ 支払先別（支払）— 「この期間、どの会社と、いくら動いたか」
   ----------------------------------------------------------------------------
   利用者の指示（2026-09-14）:
     「回収に 1ページ。今期お金が動いた会社の一覧。押すと、その会社の
       お金の出入り・未回収・過入金・払い方の評価・次に請求する額が全部見える。
       メールも CRM と同じように送れる。支払も同じ形で」

   決めごと:
   ・一覧に出す会社 ＝ 期間中に伝票か入金があった会社 ＋ いま未回収（未払）か 過入金がある会社。
     「今期は動いていないが去年の未回収が残っている会社」を落とすと、回収の画面として役に立たない。
   ・残高はどこで見ても同じ数字（台帳・年齢表・ダッシュボードと同じ関数）。
   ・評価は 期日内率・平均の遅れ・いま超過しているか から決める。期日は会社ごとに違う
     （その会社の 締日・サイト・支払日 で決まった日と比べる）。
   ========================================================================== */
let CO_PERIOD='fy';                       // fy=年度 / q=四半期 / m=今月
let CO_SEL={ ar:null, ap:null };          // 開いている会社（null なら一覧）
let CO_TAB={ ar:'history', ap:'history' };
let CO_SORT={ ar:'bal', ap:'bal' };

/** いまの期間の [開始日, 終了日]。年度はセレクタの年度、四半期と今月は今日から決める。 */
function coRange(){
  const t=thisMonth();
  if(CO_PERIOD==='m') return { from:monthStart(t), to:monthEnd(t), label:t.replace('-','年')+'月' };
  if(CO_PERIOD==='q'){
    const fy=fyOf(t), i=fyIndexOf(t), qs=Math.floor(i/3)*3, ms=fyMonths(fy);
    return { from:monthStart(ms[qs]), to:monthEnd(ms[qs+2]), label:`${fy}年度 Q${quarterOfIdx(i)}` };
  }
  const ms=fyMonths(CUR_FY);
  return { from:monthStart(ms[0]), to:monthEnd(ms[11]), label:fyLabel(CUR_FY) };
}
function setCoPeriod(p){ CO_PERIOD=p; renderPage(CURRENT_PAGE); }
function setCoSort(side,k){ CO_SORT[side]=k; renderPage(CURRENT_PAGE); }
function coOpen(side,id){ CO_SEL[side]=id?String(id):null; renderPage(side==='ap'?'apco':'arco'); window.scrollTo(0,0); }
function coTab(side,t){ CO_TAB[side]=t; renderPage(side==='ap'?'apco':'arco'); }

/** 過入金（過払い）＝ 結び付けていない入金 ＋ 請求額を超えて入った分 */
function coOverpaid(side, companyId){
  const S=ledS(side);
  const over=S.docs(companyId).filter(d=>d.status!=='取消'&&d.status!=='作成中')
    .reduce((s,d)=>s+Math.max(0,-S.bal(d)),0);
  return S.unapplied(companyId) + over;
}
/** 払い方の評価 A〜D と、その理由（人に説明できる言葉で） */
function payGrade(companyId, side){
  const p=ledPerf(companyId, side, null);
  const who = side==='ap' ? '自社の支払' : '入金';
  if(!p.n && !p.openOver) return { g:'—', cls:'b-gray', why:'まだ判断できる実績がありません' };
  if(p.openOver && p.worst>30) return { g:'D', cls:'b-red', why:`期日を ${p.worst}日 過ぎた未${side==='ap'?'払':'回収'}があります（${p.openOver}件）` };
  if((p.rate!=null && p.rate<80) || p.avgLate>15) return { g:'C', cls:'b-red',
    why:`${who}の期日内率 ${p.rate==null?'—':p.rate+'%'}・遅れた分は平均 ${p.avgLate}日` };
  if((p.rate!=null && p.rate<95) || p.avgLate>0 || p.openOver) return { g:'B', cls:'b-amber',
    why:`おおむね期日どおり（期日内 ${p.rate==null?'—':p.rate+'%'}${p.avgLate?`・遅れは平均${p.avgLate}日`:''}${p.openOver?`・超過中 ${p.openOver}件`:''}）` };
  return { g:'A', cls:'b-green', why:`期日どおり（${p.n}件すべて期日内）` };
}
/** 次に請求する月（その会社の今月の請求がまだなら今月、あれば翌月） */
function coNextYm(companyId){
  const t=thisMonth();
  const has=(DB.invoices||[]).some(i=>String(i.companyId)===String(companyId)&&i.bookMonth===t&&i.status!=='取消');
  return has? addMonths(t,1) : t;
}
/** 次回の請求額（繰越式）。今回お買上額 は請求ルールから、繰越 は 未回収 − 過入金。 */
function coNextBilling(companyId){
  const ym=coNextYm(companyId);
  const { items } = autoItemsFor(companyId, ym);
  const current = itemsSubtotal(items)+itemsTax(items);
  const unpaid = arBalanceOf(companyId);
  const over = coOverpaid('ar', companyId);
  /* 繰越は 印刷する請求書と同じ式で出す（ここと請求書で数字が違うのが一番まずい）。
     次に出す請求書を「その月の末日付け」で仮に置いて invoiceCarry に数えさせる。
     ★ 今日付けにしてはいけない: 今月分がすでに月末日付けで確定していると、
       今日より後の日付なので「前の請求」に数えられず、繰越が1か月分少なく出る（テストで発覚）。 */
  const k = invoiceCarry({ id:'__next__', companyId, bookMonth:ym, issueDate:monthEnd(ym), status:'作成中', items });
  const carry = k.carry;
  /* 未回収−過入金 と ずれるのは、取消した請求に入金を結び付けたまま など、データの食い違いがあるとき */
  const diff = carry - (unpaid - over);
  return { ym, items, current, unpaid, over, carry, diff, total: carry + current };
}

/** 一覧の行。期間の数字は期間で、残高と評価は「いま」で出す。 */
function coRows(side){
  const S=ledS(side), R=coRange();
  const inR=d=>d && d>=R.from && d<=R.to;
  const rows=[];
  (DB.companies||[]).forEach(c=>{
    const docs=S.docs(c.id).filter(d=>d.status!=='取消'&&d.status!=='作成中');
    const pays=S.pays(c.id).filter(p=>p.status!=='取消');
    const periodDocs=docs.filter(d=>inR((d.bookMonth||'').slice(0,7)+'-01') || inR(monthEnd((d.bookMonth||'').slice(0,7)||'0000-01')));
    const periodPays=pays.filter(p=>inR(p.date));
    const bal=S.balOf(c.id), over=coOverpaid(side,c.id);
    if(!periodDocs.length && !periodPays.length && bal<=0 && over<=0) return;
    const lastPay=pays.map(p=>p.date||'').sort().pop()||'';
    const perf=ledPerf(c.id, side, null);
    rows.push({ c, billed:periodDocs.reduce((s,d)=>s+S.total(d),0), paid:periodPays.reduce((s,p)=>s+num(p.amount),0),
      bal, over, perf, grade:payGrade(c.id, side), lastPay,
      next: side==='ar' ? coNextBilling(c.id) : null });
  });
  const key=CO_SORT[side];
  const by={ bal:(a,b)=>b.bal-a.bal, billed:(a,b)=>b.billed-a.billed, paid:(a,b)=>b.paid-a.paid,
    over:(a,b)=>b.over-a.over, grade:(a,b)=>String(b.grade.g).localeCompare(String(a.grade.g)),
    name:(a,b)=>String(a.c.name||'').localeCompare(String(b.c.name||''),'ja'),
    last:(a,b)=>String(b.lastPay).localeCompare(String(a.lastPay)),
    next:(a,b)=>((b.next&&b.next.total)||0)-((a.next&&a.next.total)||0) };
  return rows.sort(by[key]||by.bal);
}

/** 1社のすべて: 評価・次回請求額・履歴（通帳）・タイムライン・添付・メール */
function viewCoDetail(side, companyId){
  const c=findById('companies',companyId);
  if(!c){ CO_SEL[side]=null; return viewCoList(side); }

/* ============================================================================
   ⑪' 取引先台帳 — 1社のお金の出入りを「通帳」と「12か月の帯」で見る
   ----------------------------------------------------------------------------
   なぜ要るのか（2026-09-13 利用者の指示）:
     請求管理・入金消込は「伝票の一覧」なので、「この会社とは今どうなっているか」が
     一目で分からない。会社を軸に、請求と入金を1本の時間順に並べ、
     さらに12か月の帯で「期日どおり払う会社か」を色で見せる。

   ★ 期日は会社ごとに違う（末日締・翌月末払い／20日締・翌々月25日払い…）。
     だから「計上からの日数」では絶対に色を付けない。必ず その伝票の入金期日
     （＝その会社の締日・サイト・支払日から計算された日）と比べる。
     翌々月25日払いの会社は、85日かかっても「期日内」。
   ★ 残高はどこで見ても同じ数字にする（売掛残高＝未回収の請求の合計）。
     入ったが消し込んでいないお金は残高から引かず、別に注意として出す。
   ========================================================================== */
const LED_LATE_WARN = 30;          // これを超える遅れは赤（それ以下は黄）
let LED_CO=null, LED_TAB='history', LED_SIDE='ar';

/** 債権（売掛）と債務（買掛）で同じ画面を使うための言い換え表。ここだけ見れば違いが分かる。 */
function ledS(side){
  return side==='ap' ? {
    side:'ap', title:'支払（買掛金）', docLabel:'支払請求', payLabel:'支払', balLabel:'買掛残高',
    dueLabel:'支払期日', docAmtLabel:'請求された額', payAmtLabel:'支払額',
    docs: id=>(DB.bills||[]).filter(b=>String(b.companyId)===String(id)),
    pays: id=>(DB.payouts||[]).filter(p=>String(p.companyId)===String(id)),
    docDate: b=> b.recvDate || (b.bookMonth? monthEnd(b.bookMonth):''),
    total: docTotal, paid: b=>paidOfBill(b), bal: b=>balanceOfBill(b), status: b=>billStatus(b),
    balOf: id=>apBalanceOf(id), payBtn: id=>`openPayoutFor('${id}')`, payPage:'payouts',
    unapplied: id=>(DB.payouts||[]).filter(p=>p.status!=='取消'&&String(p.companyId)===String(id))
      .reduce((s,p)=>s+Math.max(0,num(p.amount)-(p.allocations||[]).reduce((t,a)=>t+num(a.amount),0)),0),
  } : {
    side:'ar', title:'請求・入金（売掛金）', docLabel:'請求書', payLabel:'入金', balLabel:'売掛残高',
    dueLabel:'入金期日', docAmtLabel:'請求額', payAmtLabel:'入金額',
    docs: id=>(DB.invoices||[]).filter(i=>String(i.companyId)===String(id)),
    pays: id=>(DB.payments||[]).filter(p=>String(p.companyId)===String(id)),
    docDate: i=> i.issueDate || (i.bookMonth? monthEnd(i.bookMonth):''),
    total: docTotal, paid: i=>paidOfInvoice(i), bal: i=>balanceOfInvoice(i), status: i=>invoiceStatus(i),
    balOf: id=>arBalanceOf(id), payBtn: id=>`openPaymentFor('${id}')`, payPage:'receipts',
    unapplied: id=>(DB.payments||[]).filter(p=>p.status!=='取消'&&String(p.companyId)===String(id))
      .reduce((s,p)=>s+Math.max(0,num(p.amount)-(p.allocations||[]).reduce((t,a)=>t+num(a.amount),0)),0),
  };
}
/** その伝票に充てられた入金（支払）を古い順に。1回の振込が複数の伝票に分かれることがある。 */
function ledAllocs(side, docId){
  const src = side==='ap' ? (DB.payouts||[]) : (DB.payments||[]);
  const key = side==='ap' ? 'billId' : 'invoiceId';
  const out=[];
  src.forEach(p=>{ if(p.status==='取消') return;
    (p.allocations||[]).forEach(a=>{ if(String(a[key])===String(docId)) out.push({date:p.date||'', amount:num(a.amount), pid:p.id, method:p.method||''}); }); });
  return out.sort((x,y)=>String(x.date).localeCompare(String(y.date)));
}
/** 残高が0になった日＝「払い終わった日」。これと期日を比べて遅れを測る。 */
function ledSettleDate(side, doc){
  const S=ledS(side), total=S.total(doc);
  if(total<=0) return null;
  let s=0;
  for(const a of ledAllocs(side, doc.id)){ s+=a.amount; if(s>=total) return a.date||null; }
  return null;
}
/** 1枚の伝票の「払われ方」。days は期日から何日遅れたか（マイナスは前倒し）。 */
function ledLate(side, doc){
  const S=ledS(side), due=effDue(doc), bal=S.bal(doc), settle=ledSettleDate(side,doc);
  if(bal<0) return {state:'over', days:0, settle};                       // 過入金
  if(settle) return {state:'paid', days: due? daysBetween(due,settle):0, settle};
  if(!due)   return {state:'open', days:0, settle:null};
  const d=daysBetween(due, today());
  return {state: d>0?'late':'notyet', days: Math.max(0,d), settle:null};
}
function ledColor(x){
  if(x.state==='over') return 'lg-over';
  if(x.state==='notyet'||x.state==='open') return 'lg-wait';
  if(x.days<=0) return 'lg-ok';
  return x.days<=LED_LATE_WARN ? 'lg-warn' : 'lg-bad';
}
function ledLateText(x){
  if(x.state==='over')   return '<span class="badge b-purple">過入金</span>';
  if(x.state==='open')   return '<span class="badge b-gray">期日なし</span>';
  if(x.state==='notyet') return '<span class="badge b-gray">未到来</span>';
  if(x.state==='late')   return `<span class="badge ${x.days<=LED_LATE_WARN?'b-amber':'b-red'}">${x.days}日 超過中</span>`;
  if(x.days<=0)          return `<span class="badge b-green">期日内${x.days<0?`（${-x.days}日前）`:''}</span>`;
  return `<span class="badge ${x.days<=LED_LATE_WARN?'b-amber':'b-red'}">${x.days}日 遅れ</span>`;
}

/** 支払いぶり。閉じた（払い終わった）伝票だけで数える。fy を渡すとその年度だけ。 */
function ledPerf(companyId, side, fy){
  const S=ledS(side);
  let n=0, onTime=0, late=0, lateSum=0, worst=0, openOver=0, openOverAmt=0;
  S.docs(companyId).forEach(d=>{
    if(d.status==='取消'||d.status==='作成中') return;
    if(fy!=null && fyOf((d.bookMonth||'').slice(0,7))!==Number(fy)) return;
    const x=ledLate(side,d);
    if(x.state==='paid'||x.state==='over'){
      n++;
      if(x.days<=0) onTime++; else { late++; lateSum+=x.days; worst=Math.max(worst,x.days); }
    }else if(x.state==='late'){ openOver++; openOverAmt+=S.bal(d); worst=Math.max(worst,x.days); }
  });
  return { n, onTime, late, rate: n? Math.round(onTime/n*1000)/10 : null,
    avgLate: late? Math.round(lateSum/late) : 0, worst, openOver, openOverAmt };
}
/** 一覧に出す小さな札。「この会社は期日を守るか」を1目盛りで。 */
function ledPerfBadge(companyId, side){
  const p=ledPerf(companyId, side==='ap'?'ap':'ar', null);
  if(!p.n && !p.openOver) return '<span class="zero">—</span>';
  if(!p.n) return `<span class="badge b-red">${p.openOver}件 超過中</span>`;
  const cls = p.rate>=95?'b-green' : (p.rate>=80?'b-amber':'b-red');
  return `<span class="badge ${cls}">期日内 ${p.rate}%</span>`
    + (p.avgLate? `<div class="muted" style="font-size:10.5px;">平均 ${p.avgLate}日遅れ</div>`:'')
    + (p.openOver? `<div style="font-size:10.5px;color:var(--danger);">超過中 ${p.openOver}件</div>`:'');
}

/** 出来事を時間順に1本へ。伝票＝残高が増える、入金＝消し込んだぶん減る。 */
function ledEvents(companyId, side){
  const S=ledS(side), ev=[];
  S.docs(companyId).forEach(d=>{
    if(d.status==='取消'||d.status==='作成中') return;
    ev.push({ kind:'doc', date:S.docDate(d)||'', doc:d, amount:S.total(d) });
  });
  S.pays(companyId).forEach(p=>{
    if(p.status==='取消') return;
    const alloc=(p.allocations||[]).reduce((s,a)=>s+num(a.amount),0);
    ev.push({ kind:'pay', date:p.date||'', pay:p, amount:num(p.amount), alloc, fee:num(p.fee) });
  });
  /* 同じ日なら 伝票 → 入金 の順（その日の残高の動きが読める順） */
  ev.sort((a,b)=> String(a.date).localeCompare(String(b.date)) || (a.kind==='doc'?-1:1));
  let bal=0;
  ev.forEach(e=>{ bal += e.kind==='doc' ? e.amount : -e.alloc; e.bal=bal; });
  return ev;
}

function ledHistoryHtml(c, side, fy){
  const S=ledS(side);
  const all=ledEvents(c.id, side);
  const months=fyMonths(fy), from=months[0]+'-01', to=monthEnd(months[11]);
  const inFy=all.filter(e=>e.date>=from && e.date<=to);
  const before=all.filter(e=>e.date<from);
  const carry = before.length? before[before.length-1].bal : 0;

  const rows = inFy.slice().reverse().map(e=>{
    if(e.kind==='doc'){
      const d=e.doc, x=ledLate(side,d), bal=S.bal(d);
      return `<tr onclick="openDetail('${side==='ap'?'bills':'invoices'}','${d.id}')" style="cursor:pointer;">
        <td>${esc(e.date)}</td>
        <td><span class="badge b-blue">${esc(S.docLabel)}</span></td>
        <td>${attBtn(side==='ap'?'bills':'invoices', d.id)} <b>${esc(d.no||'')}</b>${d.bookMonth?`<div class="muted" style="font-size:10.5px;">計上 ${esc(d.bookMonth)}</div>`:''}</td>
        <td class="r num"><b>${moneyPlain(e.amount)}</b></td>
        <td class="r"><span class="zero">—</span></td>
        <td class="r num">${moneyPlain(e.bal)}</td>

function ledTimelineHtml(c, side, fy){
  const S=ledS(side), months=fyMonths(fy), idx={}; months.forEach((m,i)=>{ idx[m]=i; });
  const curYm=thisMonth(), curIdx = fyOf(curYm)===fy ? fyIndexOf(curYm) : -1;

  /* ---- 上の3行: 月ごとの合計 ---- */
  const docSum=Array(12).fill(0), paySum=Array(12).fill(0);
  S.docs(c.id).forEach(d=>{
    if(d.status==='取消'||d.status==='作成中') return;
    const i=idx[(d.bookMonth||'').slice(0,7)]; if(i!=null) docSum[i]+=S.total(d);
  });
  S.pays(c.id).forEach(p=>{
    if(p.status==='取消') return;
    const i=idx[String(p.date||'').slice(0,7)]; if(i!=null) paySum[i]+=num(p.amount);
  });
  /* 月末残高は「その月末までの出来事」を積んだもの（通帳と同じ数え方） */
  const ev=ledEvents(c.id, side), balEnd=Array(12).fill(0);
  months.forEach((m,i)=>{
    const end=monthEnd(m);
    const upto=ev.filter(e=>e.date<=end);
    balEnd[i] = upto.length? upto[upto.length-1].bal : (i>0? balEnd[i-1] : 0);
  });

  /* ---- 帯: 伝票1枚 = 1行 ---- */
  const docs=S.docs(c.id).filter(d=>d.status!=='取消'&&d.status!=='作成中'&&idx[(d.bookMonth||'').slice(0,7)]!=null)
    .sort((a,b)=>String(a.bookMonth||'').localeCompare(String(b.bookMonth||'')));

  const barRow = d => {
    const s=idx[(d.bookMonth||'').slice(0,7)];
    const x=ledLate(side,d), cls=ledColor(x);
    const settleIdx = x.settle!=null && idx[String(x.settle).slice(0,7)]!=null ? idx[String(x.settle).slice(0,7)] : null;
    const dueIdx = d.dueDate && idx[String(d.dueDate).slice(0,7)]!=null ? idx[String(d.dueDate).slice(0,7)] : null;
    /* 終わり: 払い終わった月。まだなら 今月（過去年度なら12月目）まで伸ばす */
    let e = settleIdx!=null ? settleIdx : (curIdx>=0? curIdx : 11);
    if(x.settle && settleIdx==null) e=11;                 // 翌年度に払い終わった → 端まで
    if(e<s) e=s;
    const cells=months.map((m,i)=>{
      const on = i>=s && i<=e;
      const isDue = dueIdx===i, isEnd = settleIdx===i;
      return `<td class="r lgcell ${i===curIdx?'curcol':''}">${on?`<span class="lgbar ${cls} ${isDue?'lgdue':''}"></span>`:(isDue?'<span class="lgbar lg-none lgdue"></span>':'')}
        ${isEnd?'<div class="lgdot">●</div>':''}${isDue&&!isEnd?'<div class="lgdot muted">期日</div>':''}</td>`;
    }).join('');
    return `<tr onclick="openDetail('${side==='ap'?'bills':'invoices'}','${d.id}')" style="cursor:pointer;">
      <td><b>${esc(d.no||'')}</b><div class="muted" style="font-size:10.5px;">計上 ${esc(d.bookMonth||'')} ／ 期日 ${esc(d.dueDate||'—')}</div></td>
      ${cells}
      <td class="r num">${moneyPlain(S.total(d))}</td>
      <td class="r num">${S.bal(d)>0?`<b class="minus">${moneyPlain(S.bal(d))}</b>`:'<span class="zero">0</span>'}</td>
      <td>${ledLateText(x)}</td></tr>`;
  };

  const sumRow=(label,arr,cls)=>`<tr class="totrow"><td>${esc(label)}</td>
    ${arr.map((v,i)=>`<td class="r num ${i===curIdx?'curcol':''} ${cls||''}">${v?moneyPlain(v):'<span class="zero">—</span>'}</td>`).join('')}
    <td class="r num">${moneyPlain(arr.reduce((s,v)=>s+v,0))}</td><td></td><td></td></tr>`;

  const perf=ledPerf(c.id, side, fy);
  return `<div class="infobar" style="margin-bottom:10px;">
      ${fyLabel(fy)}：${esc(S.docLabel)} ${docs.length}件 ／ 期日内 ${perf.rate==null?'—':perf.rate+'%'}${perf.avgLate?` ／ 遅れた分は平均 ${perf.avgLate}日`:''}
      <span style="margin-left:auto;display:flex;gap:10px;align-items:center;font-size:11.5px;">
        <span><span class="lgkey lg-ok"></span>期日内</span>
        <span><span class="lgkey lg-warn"></span>${LED_LATE_WARN}日までの遅れ</span>
        <span><span class="lgkey lg-bad"></span>${LED_LATE_WARN}日超</span>
        <span><span class="lgkey lg-wait"></span>期日前</span>
        <span><span class="lgkey lg-over"></span>過${side==='ap'?'払':'入金'}</span>
      </span></div>
    <div class="table-wrap"><table class="stick1">
      <thead><tr><th style="min-width:190px;">${esc(S.docLabel)}</th>
        ${FY_MONTH_LABELS.map((m,i)=>`<th class="r ${i===curIdx?'curcol':''}" style="min-width:92px;">${m}</th>`).join('')}
        <th class="r" style="min-width:104px;">金額</th><th class="r" style="min-width:100px;">残</th><th style="min-width:110px;">期日との差</th></tr></thead>
      <tbody>
        ${sumRow(S.docAmtLabel+' 計', docSum)}
        ${sumRow(S.payAmtLabel+' 計', paySum, 'plus')}
        ${sumRow('月末の'+S.balLabel, balEnd)}
        ${docs.length? `<tr class="grprow"><td colspan="${1+12+3}">${esc(S.docLabel)}ごとの動き（帯の色 ＝ その会社の期日を守れたか）</td></tr>`+docs.map(barRow).join('')
          : `<tr><td colspan="${1+12+3}" class="empty" style="padding:20px;">${fyLabel(fy)}に計上された${esc(S.docLabel)}はありません。</td></tr>`}
      </tbody></table></div>
    <div class="fhelp" style="margin-top:8px;">帯は「計上した月 → 払い終わった月」。● が払い終わった月、「期日」の印がその伝票の入金期日です。
      期日は取引先ごとに違います（この会社は ${esc((c.closingDay||31)+'日締 / '+(c.paySite==null||c.paySite===''?'未設定':(c.paySite+'か月後 '+(c.payDay||31)+'日'))) }）。</div>`;
}

/** 履歴をCSVに（いま見えている年度・いまの側） */
function exportCsvLedger(){
  const c=LED_CO?findById('companies',LED_CO):null; if(!c) return;
  const S=ledS(LED_SIDE), months=fyMonths(CUR_FY), from=months[0]+'-01', to=monthEnd(months[11]);
  const rows=[['日付','種類','番号・内容',S.docAmtLabel,S.payAmtLabel,'残高',S.dueLabel,'期日との差']];
  ledEvents(c.id, LED_SIDE).filter(e=>e.date>=from&&e.date<=to).forEach(e=>{
    if(e.kind==='doc'){
      const x=ledLate(LED_SIDE,e.doc);
      rows.push([e.date, S.docLabel, e.doc.no||'', e.amount, '', e.bal, e.doc.dueDate||'',
        x.state==='paid'? (x.days<=0?'期日内':x.days+'日遅れ') : (x.state==='late'? x.days+'日超過中':'')]);

      rows.push([e.date, S.payLabel, (e.pay.allocations||[]).length?'消込あり':'未消込', '', e.amount, e.bal, '', '']);

  downloadCsv(`${(c.name||'取引先').replace(/[\\/:*?"<>|]/g,'')}_${CUR_FY}年度_${LED_SIDE==='ap'?'支払':'請求入金'}`, rows);
}

/* ============================================================================
   マスタ系の画面
   ========================================================================== */
/* ============================================================================
   ⑬ 費用管理 — 月次費用表（表は1枚だけ）
   ----------------------------------------------------------------------------
   ★ 考え方（2026-09-05 決定）:
     ・領収書を1枚ずつ入力する台帳ではない。正しい数字は会計事務所が持っている。
     ・この画面の目的はただ一つ —「毎月かかる費用が、いくらで、増えていないか」。
     ・だから 費目（行）× 月（列）の1枚の表。マスに税込金額を直接打つだけ。
     ・1マス ＝ expenses の1行（costItemId ＋ bookMonth）。だから予実の計算は
       今までのまま動く（actualSeries が expenses を税抜に直して費用に入れる）。
   ========================================================================== */
const COST_DIFF_PCT = 0.10;      // 月額予定からこれ以上ズレたらマスに色を付ける

/** 表に出す費目（定期が先・科目順）。active===false は出さない。 */
function costItemsSorted(){
  return (DB.costItems||[]).filter(c=>c && c.active!==false).slice().sort((a,b)=>
    ((a.kind==='variable')-(b.kind==='variable')) ||
    String(a.accountCode||'').localeCompare(String(b.accountCode||'')) ||
    String(a.name||'').localeCompare(String(b.name||''),'ja'));
}
/** その費目がその月に生きているか（開始月・終了月） */
function costItemActive(it, ym){
  if(!it) return false;
  if(it.startYm && ym < String(it.startYm).slice(0,7)) return false;
  if(it.endYm   && ym > String(it.endYm).slice(0,7))   return false;
  return true;
}
/** 表の1マスに対応する expenses の行 */
function costCell(costItemId, ym){
  return (DB.expenses||[]).find(e=>e && String(e.costItemId)===String(costItemId)
    && (e.bookMonth||'').slice(0,7)===ym) || null;
}
function costCellAmount(costItemId, ym){ const r=costCell(costItemId,ym); return r? num(r.amount) : 0; }
/** 税込 → 税抜（actualSeries と同じ式でなければ予実とズレる） */
function netOfGross(gross, taxCat){
  return Math.round(num(gross)/(1+(TAX_RATE[taxCat||'課税10%']||0)));
}
/** マスに書き込む。空欄・0 にすると行ごと消す（残すと「0円の費用」が残ってしまう）。 */
function setCostCell(costItemId, ym, amount){
  const it = findById('costItems', costItemId); if(!it) return;
  /* 買掛の費目は支払請求が唯一の入口。ここで経費も作ると、予実に二重に乗る。 */
  if(isApCost(it)){ toast('この費目は「買掛」です。金額は支払請求（支払管理）で直します。','err'); return; }
  const v = num(amount);
  const r = costCell(costItemId, ym);
  if(!r){
    if(!v) return;
    commitRecord('expenses', { costItemId:String(costItemId), bookMonth:ym, date:'',
      accountCode:it.accountCode||'', vendor:it.vendor||'', amount:v,
      taxCat:it.taxCat||'課税10%', method:it.method||'', note:it.name||'' }, {});
    return;
  }
  if(!v){ DB.expenses=(DB.expenses||[]).filter(x=>String(x.id)!==String(r.id)); markDeleted('expenses', r.id); return; }
  r.amount=v;
  r.accountCode=it.accountCode||r.accountCode;
  r.taxCat=it.taxCat||r.taxCat||'課税10%';
  r.vendor=it.vendor||r.vendor||'';
  r.note=it.name||r.note||'';
  r.updatedAt=new Date().toISOString(); r.updatedBy=(SESSION&&SESSION.email)||'';
  markDirty('expenses', r);
}
function onCostInput(el, costItemId, mi){
  fmtMoneyInput(el); el.classList.add('dirty');
  clearTimeout(el._t);
  el._t = setTimeout(()=>{
    setCostCell(costItemId, fyMonths(CUR_FY)[mi], el.value);
    el.classList.remove('dirty'); syncBadge(); costRerenderSoon();
  }, 500);
}
/** 合計を描き直す。ただし入力中は待つ — 打っている最中に画面が入れ替わるのが一番困る。 */
let _costRT=null;
function costRerenderSoon(){
  clearTimeout(_costRT);
  _costRT = setTimeout(()=>{
    const a = document.activeElement;
    if(a && a.classList && a.classList.contains && a.classList.contains('cellin')) return costRerenderSoon();
    if(CURRENT_PAGE==='expenses') renderPage('expenses');
  }, 900);
}

/** 費目 × 12か月（税込）。期間外のマスは null。 */
function costRowsOf(fy){
  const months = fyMonths(fy);
  const rows = costItemsSorted().map(it=>{
    const ap = isApCost(it);
    return {
      it, ap,
      kind: it.kind==='variable'?'variable':'fixed',
      /* 買掛の費目は expenses を持たない。金額の出どころは「その月の支払請求の明細」だけ
         （二重計上を防ぐため）。だから表はそれを読むだけで、打ち込みはできない。 */
      cells: months.map(ym => !costItemActive(it,ym) ? null
        : (ap ? ((costBillCell(it.id,ym)||{}).gross || 0) : costCellAmount(it.id,ym))),
      bills: ap ? months.map(ym => costBillCell(it.id,ym)) : null,
    };
  });
  return { months, rows };
}
/** 費目のない経費（過去の個別入力・CSV取込）。隠さずに1行にまとめて出す。 */
function costOtherByMonth(fy){
  const months=fyMonths(fy), idx={}; months.forEach((m,i)=>idx[m]=i);
  const gross=Array(12).fill(0), net=Array(12).fill(0); let n=0;
  (DB.expenses||[]).forEach(e=>{
    if(!e || e.costItemId) return;
    const i=idx[(e.bookMonth||e.date||'').slice(0,7)]; if(i==null) return;
    gross[i]+=num(e.amount); net[i]+=netOfGross(e.amount, e.taxCat); n++;
  });
  return { gross, net, n };
}

function viewExpenses(){
  const fy=CUR_FY, months=fyMonths(fy);
  const { rows } = costRowsOf(fy);
  const other = costOtherByMonth(fy);
  const canE = canEdit('expenses');
  const cur = thisMonth();
  const curIdx = fyOf(cur)===fy ? fyIndexOf(cur) : -1;
  const fixed = rows.filter(r=>r.kind==='fixed'), varia = rows.filter(r=>r.kind==='variable');

  /* ---- 月別の合計 ---- */
  const totGross=Array(12).fill(0), totNet=Array(12).fill(0);
  rows.forEach(r=>r.cells.forEach((v,i)=>{ if(!v) return; totGross[i]+=v; totNet[i]+=netOfGross(v, r.it.taxCat); }));
  for(let i=0;i<12;i++){ totGross[i]+=other.gross[i]; totNet[i]+=other.net[i]; }
  const totTax = totGross.map((v,i)=>v-totNet[i]);

  const arrOf  = list => { const a=Array(12).fill(0); list.forEach(r=>r.cells.forEach((v,i)=>{ if(v) a[i]+=v; })); return a; };
  const planOf = list => list.reduce((s,r)=>s+num(r.it.monthly),0);
  /** 平均は「数字が入っている月」だけで割る。12で割ると、期の途中では必ず小さく出てしまう
      （2か月しか実績が無い家賃が 43,083円/月 に見える。実際は 258,500円/月）。 */
  const avgOf  = arr => { const n=arr.filter(v=>v).length;
    return n? moneyPlain(Math.round(arr.reduce((s,v)=>s+v,0)/n)) : '<span class="zero">—</span>'; };

  /* ---- KPI ---- */
  const kCur  = curIdx>=0? totGross[curIdx] : 0;
  const kPrev = curIdx>0 ? totGross[curIdx-1] : 0;
  const planNow = curIdx>=0 ? fixed.filter(r=>r.cells[curIdx]!=null).reduce((s,r)=>s+num(r.it.monthly),0) : planOf(fixed);
  const actNow  = curIdx>=0 ? fixed.reduce((s,r)=>s+(r.cells[curIdx]||0),0) : 0;
  const missing = curIdx>=0 ? fixed.filter(r=>r.cells[curIdx]!=null && !r.cells[curIdx] && num(r.it.monthly)) : [];

  const kpis=`<div class="kpi-grid">
    <div class="kpi"><div class="lbl">今月の費用（税込）</div><div class="num">${moneyPlain(kCur)}</div>
      <div class="sub">前月比 ${kPrev?pct(kCur,kPrev,{reverse:true}):'<span class="zero">—</span>'}</div></div>
    <div class="kpi"><div class="lbl">定期費用 月額予定</div><div class="num">${moneyPlain(planNow)}</div>
      <div class="sub">${fixed.length}費目</div></div>
    <div class="kpi"><div class="lbl">今月 定期の実績</div><div class="num ${actNow>planNow&&planNow?'minus':''}">${moneyPlain(actNow)}</div>
      <div class="sub">予定との差 ${planNow?`<b class="${actNow-planNow>0?'minus':'plus'}">${actNow-planNow>0?'+':''}${moneyPlain(actNow-planNow)}</b>`:'—'}</div></div>
    <div class="kpi"><div class="lbl">年度累計（税抜）</div><div class="num">${moneyPlain(totNet.reduce((s,v)=>s+v,0))}</div>
      <div class="sub">この額が予実の費用に入ります</div></div>
  </div>`;

  const alert = missing.length? `<div class="alertbar">${IC.warn} ${FY_MONTH_LABELS[curIdx]}の定期費用が ${missing.length}件 未入力です（${missing.map(r=>esc(r.it.name)).join('、')}）。
    ${canE?`<button class="btn sm" style="background:#fff;color:var(--danger);border-color:currentColor;margin-left:auto;" onclick="costReflect()">月額予定で埋める</button>`:''}</div>` : '';

  /* ---- 表 ---- */
  const NCOL = 4+12+2;
  const grp = (label,hint) => `<tr class="grprow"><td colspan="${NCOL}">${esc(label)}${hint?` <span style="font-weight:400;">${esc(hint)}</span>`:''}</td></tr>`;

  const cellHtml = (r,i) => {
    const v = r.cells[i];
    if(v==null) return `<td class="r"><span class="zero">—</span></td>`;
    if(r.ap){
      const hit = r.bills && r.bills[i];
      if(!hit) return `<td class="r ${i===curIdx?'curcol':''}"><span class="zero">未作成</span></td>`;
      const bal = balanceOfBill(hit.bill);
      return `<td class="r num ${i===curIdx?'curcol':''}"><a onclick="openDetail('bills','${hit.bill.id}')"
        style="cursor:pointer;color:var(--primary);" title="支払請求 ${attr(hit.bill.no||'')}（${attr(billStatus(hit.bill))}）">${moneyPlain(hit.gross)}</a>
        ${bal>0?`<div class="lgdot" style="color:var(--warning);">未払</div>`:''}</td>`;
    }
    if(!canE) return `<td class="r num ${i===curIdx?'curcol':''}">${v?moneyPlain(v):'<span class="zero">—</span>'}</td>`;
    let cls='cellin';
    const plan=num(r.it.monthly);
    if(r.kind==='fixed' && plan && v){
      const d=(v-plan)/plan;
      if(d>=COST_DIFF_PCT) cls+=' over'; else if(d<=-COST_DIFF_PCT) cls+=' under';
    }
    return `<td class="r ${i===curIdx?'curcol':''}"><input class="${cls}" value="${v?moneyPlain(v):''}"
      inputmode="numeric" oninput="onCostInput(this,'${attr(r.it.id)}',${i})"></td>`;
  };

  const rowHtml = r => {
    const tot = r.cells.reduce((s,c)=>s+(c||0),0);
    const nMon = r.cells.filter(c=>c).length;
    return `<tr>
      <td>${attBtn('costItems', r.it.id)} <a onclick="openForm('costItems','${attr(r.it.id)}')" style="cursor:pointer;font-weight:600;">${esc(r.it.name||'(名称なし)')}</a>

      <tbody>

        ${varia.length? grp('変動費（月によって変わるもの）','')+varia.map(rowHtml).join('')+sumRow('変動費 計', arrOf(varia), 0) : ''}

/* ---- 定期費用を月額予定で埋める（空欄だけ・入力済みは触らない） ---- */
function costReflect(){
  if(!canEdit('expenses')){ toast('入力の権限がありません。','err'); return; }
  const months=fyMonths(CUR_FY), cur=thisMonth();
  const sel=Math.max(0, months.indexOf(cur));
  const n=(DB.costItems||[]).filter(c=>c&&c.active!==false&&c.kind!=='variable'&&num(c.monthly)).length;
  openModal(`<h3>定期費用を反映</h3>
    <div class="mdsub">「定期」の費目の<b>月額予定</b>を、<b>空欄の月だけ</b>に入れます。すでに入っている数字は書き換えません。</div>
    <div class="form-grid">
      <div class="full"><label>対象月</label><select id="rfM">
        ${months.map((m,i)=>`<option value="${i}" ${i===sel?'selected':''}>${FY_MONTH_LABELS[i]}（${m}）</option>`).join('')}</select></div>
      <div class="full"><label style="display:flex;gap:7px;align-items:center;font-weight:500;cursor:pointer;">
        <input type="checkbox" id="rfAll" style="width:auto;"> ${CUR_FY}年度の12か月すべてに入れる</label></div>
    </div>
    <div class="infobar" style="margin-top:10px;">対象になる定期費目：<b>${n}件</b>（月額予定が入っているもの）</div>
    <div class="modal-actions"><button class="btn secondary" onclick="closeModal()">キャンセル</button>
      <button class="btn" onclick="costReflectGo()">反映する</button></div>`);
}
function costReflectGo(){
  const months=fyMonths(CUR_FY);
  const all=document.getElementById('rfAll').checked;
  const idxs = all? months.map((_,i)=>i) : [Number(document.getElementById('rfM').value)];
  let n=0;
  costItemsSorted().filter(it=>it.kind!=='variable' && num(it.monthly)).forEach(it=>{
    idxs.forEach(i=>{
      const ym=months[i];
      if(!costItemActive(it,ym)) return;
      if(costCell(it.id,ym)) return;               // 入力済みには触らない
      setCostCell(it.id, ym, num(it.monthly)); n++;
    });
  });
  closeModal(); renderPage('expenses');
  toast(n? `${n}マスに入力しました。`:'入れる場所がありませんでした（すべて入力済みです）。', n?'ok':'err');
}

function exportCsvCost(){
  const { rows } = costRowsOf(CUR_FY);
  const out=[['費目','勘定科目','区分','支払先','税区分','月額予定',...FY_MONTH_LABELS,'年間計']];
  rows.forEach(r=>out.push([ r.it.name, accountLabel(r.it.accountCode), r.kind==='fixed'?'定期':'変動',
    r.it.vendor||'', r.it.taxCat||'課税10%', num(r.it.monthly)||'',
    ...r.cells.map(c=>c==null?'':c), r.cells.reduce((s,c)=>s+(c||0),0) ]));
  const o=costOtherByMonth(CUR_FY);
  if(o.n) out.push(['個別入力（費目なし）','—','—','','','', ...o.gross, o.gross.reduce((s,v)=>s+v,0)]);
  downloadCsv(`月次費用表_${CUR_FY}年度`, out);
}

/* ============================================================================
   取引先モーダル（得意先／支払先）— 新規登録・編集・詳細 を同じ「横3列」で
   ----------------------------------------------------------------------------
   ★ 2026-09-14 利用者の指示:
     得意先 ＝ BIGLIGHT が お金を受け取る相手（請求書を出す・売掛金）
     支払先 ＝ BIGLIGHT が お金を払う相手（請求書を受け取る・買掛金）
     ① 基本情報 ｜ ② 条件 ｜ ③ 管理・口座 を横に並べ、縦に長くしない（1920×1080 で1画面）。
   ★ データは今までどおり companies 1つ（kind: 得意先／仕入先／両方）。項目名も変えない
     （paySite・payDay は API・MCP・CRM連携がそのまま読む）。変えるのは画面の文言だけ:
     得意先 ＝ 入金サイト・入金日 ／ 支払先 ＝ 支払サイト・支払日。
   ★ 区分に関係ない欄（例: 支払先の 請求書メール）は CSS で隠すだけ。フォームには残すので
     保存しても値は消えない。すでに値が入っている欄は、区分に関係なく出したまま。
   ========================================================================== */
const coSideOf = kind => kind==='仕入先' ? 'ap' : (kind==='両方' ? 'both' : 'ar');
/** 区分で文言を切り替える（.coform[data-side] で片方だけ見せる）。both を省くと ar と同じ。 */
const coLb = (ar, ap, both) => `<span class="lb-ar">${ar}</span><span class="lb-ap">${ap}</span><span class="lb-both">${both==null?ar:both}</span>`;
/* 保存する値は 得意先／仕入先／両方 のまま。見せ方だけ「支払先」。 */
const CO_KIND_OPTS = [{k:'得意先',label:'得意先（受け取る）'},{k:'仕入先',label:'支払先（払う）'},{k:'両方',label:'両方'}];
/* only: その区分のときだけ出す欄（ar=得意先 / ap=支払先）。full: 列の中で横いっぱい。 */
const CO_LAYOUT = [
  { icon:'building', head:()=>'基本情報', fields:[
    {n:'name', label:'会社名', full:1}, {n:'kana', full:1},
    {n:'kind', options:CO_KIND_OPTS}, {n:'corpNo'},
    {n:'zip'}, {n:'phone'},
    {n:'staffName'}, {n:'field', label:'業種・分野'},
    {n:'email', full:1}, {n:'address', full:1} ]},
  { icon:'yen', head:()=>coLb('請求・回収条件','支払条件','請求・支払条件'), preview:true, fields:[
    {n:'closingDay', label:'締日', ph:'31＝末日'},
    {n:'paySite', label:coLb('入金サイト（か月後）','支払サイト（か月後）','サイト（か月後）'), ph:'1＝翌月'},
    {n:'payDay', label:coLb('入金日','支払日','入金日・支払日'), ph:'31＝末日'},
    {n:'dueAdjust', label:'土日祝の場合'},
    {n:'creditLimit', only:'ar'} ]},
  { icon:'pen', head:()=>coLb('管理情報','管理・口座情報','管理・口座情報'), fields:[
    {n:'owner', label:'BIGLIGHT担当者', ph:'メール'}, {n:'taxCat', label:'税区分'},
    {n:'billEmail', label:'請求先メール', full:1, only:'ar'},
    {n:'billTo', full:1, only:'ar'},
    {n:'bankInfo', full:1, only:'ap'},
    {n:'note', full:1} ]},
];

function openCompanyModal(mode, row, id){
  const E=ENTITIES.companies, isForm=mode==='form', isEdit=!!id;
  const c = id? findById('companies', id) : null;          // 取引状況・添付は 保存済みの会社だけ
  const side=coSideOf(row.kind);
  const hasv = n => row[n]!=null && String(row[n]).trim()!=='';
  const placed = new Set(CO_LAYOUT.flatMap(col=>col.fields.map(x=>x.n)));
  const cols = CO_LAYOUT.map((col,ci)=>{
    const items=col.fields.slice();
    /* 宣言に項目が増えても 画面から落ちない（＝保存で消えない）ように、最後の列の 備考 の前に足す */
    if(ci===CO_LAYOUT.length-1) E.fields.filter(f=>!placed.has(f.name)).forEach(f=>items.splice(items.length-1,0,{n:f.name, full:1}));
    const cells=items.map(it=>{
      const f=E.fields.find(x=>x.name===it.n); if(!f) return '';
      const cls=[it.full?'full':'', it.only&&hasv(it.n)?'hasv':''].filter(Boolean).join(' ');
      const attrs=it.only? ` data-only="${it.only}"` : '';
      if(isForm) return formFieldHtml('companies', E, Object.assign({}, f, {full:false}), row,
        { label:it.label, options:it.options, ph:it.ph, noHelp:true, cls, attrs });
      return `<div class="co-v ${cls}"${attrs}><label>${it.label!=null?it.label:esc(f.label)}</label><div>${coValHtml(f, row)}</div></div>`;
    }).join('');
    const pv = col.preview? `<div class="full co-preview" id="coDuePv">${coDuePreview(row)}</div>` : '';
    return `<section class="co-col"><div class="co-colhead">${IC[col.icon]||''}${'①②③'[ci]||''} ${col.head()}</div>
      <div class="form-grid co-sub">${cells}${pv}</div></section>`;
  }).join('');

  const modeLabel = isForm? (isEdit?'編集':'新規登録') : '詳細';
  const dir = coLb('<span class="co-dir d-ar">BIGLIGHT が お金を<b>受け取る</b>相手 ・ 請求書を出す ・ 売掛金</span>',

/** 入力に合わせて 区分の文言と 期日の見本 を直す（フォームを作り直さないので 入力中の値は消えない） */
function coFormSync(){

  if(FORM_CTX) FORM_CTX.coDirty=true;
  const box=f.closest && f.closest('.coform');
  if(box) box.dataset.side=coSideOf(g('kind'));
  const pv=document.getElementById('coDuePv');

/** 「今月分なら いつ お金が動くか」を1行で。計算は請求・支払と同じ dueDateOf と 休業日の調整。 */
function coDuePreview(r){
  const side=coSideOf(r.kind);
  const what = side==='ap'? '支払予定日' : (side==='both'? '期日' : '入金予定日');
  if(r.paySite==null || r.paySite===''){
    return `<span class="muted">${side==='ap'?'支払':(side==='both'?'':'入金')}サイトを入れると、${what}が自動で決まります。</span>`;
  }
  const ym=thisMonth(), due=dueDateOf(ym, r.closingDay, r.paySite, r.payDay);
  const mode=r.dueAdjust||'翌営業日';
  let adj=due, guard=0;
  if(mode!=='そのまま'){ const step=mode==='前営業日'?-1:1; while(isBankHoliday(adj) && guard++<15) adj=addDays(adj,step); }
  const wd=d=>'日月火水木金土'[new Date(d+'T00:00:00').getDay()];
  return `例）<b>${Number(ym.slice(5))}月分</b> → ${what} <b class="num">${due}（${wd(due)}）</b>`
    + (adj!==due? ` → 休業日のため <b class="num">${adj}（${wd(adj)}）</b>` : '');
}
/** 詳細（見るだけ）での値の出し方 */
function coValHtml(f, r){

  if(v==null || String(v).trim()==='') return '<span class="zero">-</span>';
  switch(f.name){
    case 'kind': {
      const o=CO_KIND_OPTS.find(x=>x.k===v);
      return `<span class="badge ${({'得意先':'b-blue','仕入先':'b-purple','両方':'b-green'})[v]||'b-gray'}">${esc(o?o.label:v)}</span>`;
    }
    case 'closingDay': case 'payDay': return Number(v)>=31? '末日' : esc(v)+'日';
    case 'paySite': return Number(v)===0? '当月' : esc(v)+'か月後';
    case 'owner': { const u=(_USERS||[]).find(x=>x.email===v); return esc(u&&u.name? `${u.name}（${v}）` : v); }
    case 'note': return `<div class="co-note">${esc(v)}</div>`;

function coGo(what, id, side){

/** 取引状況（横並びのカード）。得意先＝売掛、支払先＝買掛。両方の動きがある会社は 両方を並べる。 */
function coStatsHtml(c, side){
  const id=String(c.id), jid=attr(c.id);
  const ofCo = x => x && String(x.companyId)===id;
  const live = x => x.status!=='取消' && x.status!=='作成中';
  const latest = (list, dateOf) => list.slice().sort((a,b)=>String(dateOf(b)||'').localeCompare(String(dateOf(a)||'')))[0]||null;
  const card = (lbl, val, sub, go) => `<div class="co-stat${go?' click':''}"${go?` onclick="${go}"`:''}>
      <div class="lbl">${lbl}</div><div class="val">${val}</div>${sub?`<div class="sub">${sub}</div>`:''}</div>`;
  const dm = (d, amt) => `<span class="num">${esc(String(d||'').slice(0,10))}</span> <b class="num">${moneyPlain(amt)}</b>`;
  const none = '<span class="zero">なし</span>';
  const perf = sd => { const p=ledPerf(c.id, sd, null);
    if(!p.n) return p.openOver? `<span class="badge b-red">超過中 ${p.openOver}件</span>` : '';
    return `<span class="badge ${p.rate>=95?'b-green':(p.rate>=80?'b-amber':'b-red')}">期日内 ${p.rate}%</span>`; };

  /* 売掛（受け取る） */
  const invs=(DB.invoices||[]).filter(i=>ofCo(i)&&live(i)), openI=invs.filter(i=>balanceOfInvoice(i)>0);
  const pays=(DB.payments||[]).filter(p=>ofCo(p)&&p.status!=='取消');
  const lastInv=latest(invs, invDocDate), lastPay=latest(pays, p=>p.date);
  const rules=rulesOfCompany(c.id), arBal=arBalanceOf(c.id);
  const ruleVal = rules.length? `${rules.length}件` : '<span style="color:var(--amber);font-weight:600;">未設定</span>';
  const ruleSub = rules.length? esc(ruleText(rules[0]))+(rules.length>1?` 他${rules.length-1}件`:'') : '押すと作れます';
  /* 買掛（払う） */
  const bills=(DB.bills||[]).filter(b=>ofCo(b)&&live(b)), openB=bills.filter(b=>balanceOfBill(b)>0);
  const pos=(DB.payouts||[]).filter(p=>ofCo(p)&&p.status!=='取消'), lastPo=latest(pos, p=>p.date);
  const overB=openB.filter(isOverdue);
  const nextB=openB.filter(b=>!isOverdue(b)&&b.dueDate).sort((a,b)=>String(effDue(a)).localeCompare(String(effDue(b))))[0]||null;
  const apBal=apBalanceOf(c.id);
  const nItems=(DB.costItems||[]).filter(ofCo).length, nProps=(DB.properties||[]).filter(ofCo).length;
  const apStatus = overB.length? `<b style="color:var(--danger);">期日超過 ${overB.length}件</b>`
    : (nextB? `次回 ${dm(effDue(nextB), balanceOfBill(nextB))}` : '<span class="zero">未払なし</span>');

  /* 区分が片方でも、もう片方の伝票が実際にあれば 両方を出す（見落とさないため） */
  let st=side;
  if(st==='ar' && (bills.length||pos.length)) st='both';
  if(st==='ap' && (invs.length||pays.length)) st='both';

  const go = (w, sd) => `coGo('${w}','${jid}','${sd||''}')`;
  const cArBal = card('売掛残高', `<b class="num big ${arBal?'minus':''}">${moneyPlain(arBal)}</b> 円`,
    `${openI.length}件 未回収 ${perf('ar')}${creditOver(c.id)?' <span class="badge b-red">与信超過</span>':''}`, go('ledger','ar'));
  const cApBal = card('買掛残高', `<b class="num big">${moneyPlain(apBal)}</b> 円`,
    `${openB.length}件 未払 ${perf('ap')}`, go('ledger','ap'));
  const cLed = st==='both'
    ? card('台帳を見る', `<a class="pillbtn pill-manage" onclick="${go('ledger','ar')}">請求・入金</a> <a class="pillbtn pill-manage" onclick="${go('ledger','ap')}">支払</a>`, '履歴・タイムライン')
    : card('台帳を見る', `<span class="pillbtn pill-manage">台帳を開く ›</span>`, '履歴・タイムライン', go('ledger', st));
  let list;
  if(st==='ap') list=[ cApBal,
      card('支払状況', apStatus, (nItems||nProps)? `費目 ${nItems}件${nProps?`・物件 ${nProps}件`:''}` : '', go('ledger','ap')),
      card('最終支払', lastPo? dm(lastPo.date, lastPo.amount) : none, lastPo&&lastPo.method? esc(lastPo.method) : '', go('ledger','ap')),
      cLed ];
  else if(st==='both') list=[ cArBal, cApBal,
      card('請求', ruleVal, `最終請求 ${lastInv? dm(invDocDate(lastInv), docTotal(lastInv)) : none}`, go('rules')),
      card('支払', apStatus, `最終支払 ${lastPo? dm(lastPo.date, lastPo.amount) : none}`, go('ledger','ap')),
      cLed ];
  else list=[ cArBal,
      card('請求ルール', ruleVal, ruleSub, go('rules')),
      card('最終請求・入金', `請求 ${lastInv? dm(invDocDate(lastInv), docTotal(lastInv)) : none}`, `入金 ${lastPay? dm(lastPay.date, lastPay.amount) : none}`, go('ledger','ar')),
      cLed ];
  return `<div class="co-stats"><div class="co-stats-lb">${IC.chart}取引状況</div>
    <div class="co-stat-row n${list.length}">${list.join('')}</div></div>`;
}

   ========================================================================== */
function periodsOfFy(fy){ return QUARTERS.map(q=>`${fy}-Q${q.k}`); }
function curPeriod(){ const i=lastActualIdx(CUR_FY); return `${CUR_FY}-Q${quarterOfIdx(i)}`; }
let OKR_PERIOD=null;
function setOkrPeriod(p){ OKR_PERIOD=p; renderPage('okr'); }

/** KRの現在値。autoSource があれば実データから取る（公式 §0.10 と同じ考え方） */
function krCurrent(kr){
  const a=kr.autoSource;
  if(!a||!a.type) return num(kr.current);
  const fy=Number((kr.period||curPeriod()).split('-')[0])||CUR_FY;
  const i=lastActualIdx(fy);
  if(a.type==='yojitsu'){
    const b=plBook(fy,'actual')[a.metric||'revenue']||[];
    if(a.scope==='month') return b[i]||0;
    if(a.scope==='quarter'){ const qs=Math.floor(i/3)*3; return sumRange(b,qs,i); }
    return sumRange(b,0,i);                       // ytd
  }
  if(a.type==='ar'){
    if(a.metric==='overdue') return openInvoices().filter(x=>isOverdue(x)).reduce((s,x)=>s+balanceOfInvoice(x),0);
    return arTotal();
  }
  if(a.type==='ap') return apTotal();
  if(a.type==='workers') return (DB.assignments||[]).filter(x=>activeInMonth(x,thisMonth())).length;
  if(a.type==='companies') return new Set((DB.assignments||[]).filter(x=>activeInMonth(x,thisMonth())).map(x=>x.companyId)).size;
  return num(kr.current);
}
function krRate(kr){
  const t=num(kr.target); if(!t) return 0;
  const c=krCurrent(kr);
  return kr.lowerIsBetter ? (c<=t?100:Math.max(0, (2-c/t)*100)) : Math.max(0, c/t*100);
}
function objRate(o){
  const krs=(DB.keyResults||[]).filter(k=>String(k.objectiveId)===String(o.id));
  if(!krs.length) return 0;
  return krs.reduce((s,k)=>s+Math.min(120,krRate(k)),0)/krs.length;
}
function okrSignal(r){ return r>=100?'完了':(r>=70?'順調':(r>=40?'注意':'遅延')); }

    const r=objRate(o), sig=o.status==='中止'?'中止':okrSignal(r);
    return `<div class="panel" style="margin-bottom:12px;">
      <div class="panel-hd">
        <b>${esc(o.title)}</b>
        <span class="sub">${esc(o.level||'会社')}${o.ownerEmail?' ／ '+esc(o.ownerEmail):''}</span>
        <span style="margin-left:auto;display:flex;gap:8px;align-items:center;">
          ${statusBadge(sig)}<b class="num" style="font-size:15px;">${r.toFixed(0)}%</b>
          ${canEdit('okr')?`<a onclick="okrForm('${o.id}')" style="cursor:pointer;color:var(--primary);font-size:12px;">編集</a>`:''}</span>
      </div>
      <div class="panel-bd tight">

          <tbody>${krs.length? krs.map(k=>`<tr>
            <td>${esc(k.title)}</td>
            <td class="r num"><b>${k.unit==='円'?moneyPlain(krCurrent(k)):krCurrent(k).toLocaleString('ja-JP')}</b>${k.unit&&k.unit!=='円'?esc(k.unit):''}</td>
            <td class="r num">${k.unit==='円'?moneyPlain(k.target):num(k.target).toLocaleString('ja-JP')}</td>
            <td>${rateBar(krCurrent(k), num(k.target))}</td>
            <td>${k.autoSource&&k.autoSource.type? `<span class="tag crm">自動</span> <span class="muted" style="font-size:10.5px;">${esc(autoLabel(k.autoSource))}</span>`
              : '<span class="tag manual">手入力</span>'}</td>
            <td>${canEdit('okr')?`<a onclick="krForm('${o.id}','${k.id}')" style="cursor:pointer;color:var(--primary);font-size:12px;">編集</a>`:''}</td></tr>`).join('')
            : '<tr><td colspan="6" class="empty">Key Result がありません。</td></tr>'}</tbody></table></div>
        ${canEdit('okr')?`<div style="padding:10px 14px;"><a class="pillbtn pill-new" onclick="krForm('${o.id}')">＋ Key Result を追加</a></div>`:''}
      </div></div>`;
  };
  const totalRate = objs.length? objs.reduce((s,o)=>s+objRate(o),0)/objs.length : 0;
  const kpis=`<div class="kpi-grid">
    <div class="kpi"><div class="lbl">全体の達成率</div><div class="num">${totalRate.toFixed(0)}%</div><div class="sub">${objs.length}個の目標</div></div>
    ${['順調','注意','遅延'].map(s=>`<div class="kpi"><div class="lbl">${s}</div>
      <div class="num">${objs.filter(o=>okrSignal(objRate(o))===s).length}</div></div>`).join('')}
  </div>`;
  const periods=[...new Set([...periodsOfFy(CUR_FY), ...(DB.objectives||[]).map(o=>o.period)])].filter(Boolean).sort().reverse();

  return pageShell({ title:'OKR / KPI', sub:'四半期ごとの目標。数字は予実・債権から自動で取れます。',
    tools:`<select onchange="setOkrPeriod(this.value)" style="padding:7px 10px;border:1px solid var(--border-strong);border-radius:8px;">
        ${periods.map(p=>`<option value="${attr(p)}" ${p===period?'selected':''}>${esc(p)}</option>`).join('')}</select>
      ${canCreate('okr')?`<button class="btn" onclick="okrForm()">＋ 目標を追加</button>`:''}
      ${toolsMenu(`<button class="btn secondary" onclick="window.print()">${IC.print} 印刷</button>`)}`,
    body: kpis + (objs.length? OKR_LEVELS.map(lv=>{
      const list=byLevel(lv); if(!list.length) return '';
      return `<div class="section-title" style="margin:16px 0 8px;">${esc(lv)}の目標</div>`+list.map(card).join('');
    }).join('') : '<div class="empty">この四半期の目標はまだありません。「＋ 目標を追加」から作成してください。</div>') });
}
function autoLabel(a){
  if(a.type==='yojitsu') return ({revenue:'売上高',gross:'粗利',operating:'営業利益',ordinary:'経常利益'}[a.metric]||a.metric)
    +'・'+({month:'当月',quarter:'四半期',ytd:'年度累計'}[a.scope]||'年度累計');
  if(a.type==='ar') return a.metric==='overdue'?'延滞債権':'売掛残高';
  if(a.type==='ap') return '買掛残高';
  if(a.type==='workers') return '在籍者数';

/* ============================================================================
   ⑬' 通知ベル と 入力ガイド
   ----------------------------------------------------------------------------
   ベルに出すのは「いま、お金のことで手を打つべきこと」だけ。
   何かが起きた履歴ではなく、放っておくと損をすることを並べます。
   数字はすべてその場で計算します（保存しません。公式 §0.10）。
   取れなかった数字は出しません（0 と書くと「無い」と読めてしまう。公式 §0.6）。
   ========================================================================== */
const NOTIF_SEEN_KEY='bl_yj_notif_seen';

/** 通知の中身。sev: danger(赤) / warn(黄) / info(青) */
function notifItems(){
  const out=[], t=today();
  if(!DB) return out;

  /* ── 債権: 期日を過ぎた請求 ── */
  const over=openInvoices().filter(i=>isOverdue(i));
  if(over.length) out.push({ sev:'danger', key:'ar-over', label:'入金期日を過ぎた請求',
    n:over.length, amount:over.reduce((s,i)=>s+balanceOfInvoice(i),0), go:"goto('aging')",
    sub:`最長 ${Math.max(...over.map(i=>daysOverdue(i)))}日 超過` });

  /* ── 債権: 今週が期日の請求（先に声をかければ遅れない） ── */
  const soonAr=openInvoices().filter(i=>effDue(i)&&effDue(i)>=t&&effDue(i)<=addDays(t,7));
  if(soonAr.length) out.push({ sev:'info', key:'ar-soon', label:'7日以内が入金期日の請求',
    n:soonAr.length, amount:soonAr.reduce((s,i)=>s+balanceOfInvoice(i),0), go:"goto('invoices')" });

  /* ── 督促: 今日やること（約束切れ・予定日・次の段階） ── */
  const dr=dunRows().filter(r=>r.todo);
  if(dr.length){
    const me=String((SESSION&&SESSION.email)||'').toLowerCase();
    const mine=dr.filter(r=>String(r.owner).toLowerCase()===me).length;
    const brk=dr.filter(r=>r.todo.rank===5).length;
    out.push({ sev: brk?'danger':'warn', key:'dunning', label:'今日やる督促', n:dr.length, go:"goto('dunning')",
      sub:(brk?`入金の約束を過ぎた会社 ${brk}社`:'')+(mine?`${brk?' ・ ':''}あなたの担当 ${mine}社`:'') || dr.slice(0,3).map(r=>r.company.name).join('、') });
  }
  /* ── 与信限度額を超えた取引先 ── */
  const cov=(DB.companies||[]).filter(c=>!c._gone && creditOver(c.id));
  if(cov.length) out.push({ sev:'warn', key:'credit', label:'与信限度額を超えた取引先', n:cov.length, go:"goto('arco')",
    sub:cov.slice(0,3).map(c=>`${c.name}（${moneyPlain(arBalanceOf(c.id))}／限度${moneyPlain(c.creditLimit)}）`).join('、') });

  /* ── 入金したが、どの請求にも結び付けていないお金 ── */
  const un=unAllocated();
  if(un>0) out.push({ sev:'warn', key:'unalloc', label:'未消込の入金',
    amount:un, go:"goto('receipts')", sub:'どの請求に充てるか決めると、残高が正しくなります' });

  /* ── 債務: 期日を過ぎた支払（相手の信用に関わる） ── */
  const apOver=openBills().filter(b=>isOverdue(b));
  if(apOver.length) out.push({ sev:'danger', key:'ap-over', label:'支払期日を過ぎた支払',
    n:apOver.length, amount:apOver.reduce((s,b)=>s+balanceOfBill(b),0), go:"goto('apaging')" });

  const apSoon=openBills().filter(b=>effDue(b)&&effDue(b)>=t&&effDue(b)<=addDays(t,7));
  if(apSoon.length) out.push({ sev:'warn', key:'ap-soon', label:'7日以内に支払う',
    n:apSoon.length, amount:apSoon.reduce((s,b)=>s+balanceOfBill(b),0), go:"goto('bills')" });

  /* ── 今月の請求を作り忘れていないか（締日を過ぎた取引先だけ言う） ── */
  const ym=thisMonth();
  const notBilled=(DB.companies||[]).filter(c=>{
    if(c._gone||c.kind==='仕入先') return false;
    if(!rulesOfCompany(c.id).filter(r=>r.kind!=='spot').length) return false;
    const closing=Number(c.closingDay||31);
    const dd=new Date().getDate();
    if(dd < Math.min(closing, daysInMonth(ym))) return false;          // まだ締めていない
    return !(DB.invoices||[]).some(i=>String(i.companyId)===String(c.id)&&i.bookMonth===ym&&i.status!=='取消');
  });
  if(notBilled.length) out.push({ sev:'warn', key:'nobill', label:`${ym} の請求が未作成`,
    n:notBilled.length, go:"openGenerate()", sub:notBilled.slice(0,4).map(c=>c.name).join('、')+(notBilled.length>4?' ほか':'') });

  /* ── 作成中のまま置き去りの請求 ── */
  const draft=(DB.invoices||[]).filter(i=>i.status==='作成中'&&i.updatedAt&&daysBetween(String(i.updatedAt).slice(0,10),t)>7);
  if(draft.length) out.push({ sev:'warn', key:'draft', label:'「作成中」のまま7日以上の請求',
    n:draft.length, amount:draft.reduce((s,i)=>s+docTotal(i),0), go:"goto('invoices')",
    sub:'確定するまで売上にも債権にも入りません' });

  const draftB=(DB.bills||[]).filter(b=>b.status==='作成中'&&b.updatedAt&&daysBetween(String(b.updatedAt).slice(0,10),t)>7);
  if(draftB.length) out.push({ sev:'info', key:'draftb', label:'「作成中」のままの支払請求',
    n:draftB.length, amount:draftB.reduce((s,b)=>s+docTotal(b),0), go:"goto('bills')" });

  /* ── 定期費用の入力もれ（今月・月次費用表） ── */
  if(fyOf(ym)===CUR_FY){
    const i=fyIndexOf(ym);
    const miss=costRowsOf(CUR_FY).rows.filter(r=>!r.ap && r.kind==='fixed' && r.cells[i]!=null && !r.cells[i] && num(r.it.monthly));
    if(miss.length) out.push({ sev:'info', key:'costmiss', label:`${FY_MONTH_LABELS[i]}の定期費用が未入力`,
      n:miss.length, go:"goto('expenses')", sub:miss.slice(0,4).map(r=>r.it.name).join('、')+(miss.length>4?' ほか':'') });
  }

  /* ── 契約満了が近い物件（更新の交渉には時間が要る） ── */
  const endSoon=(DB.properties||[]).filter(pr=>{ const d=propDaysLeft(pr); return d!==null && d<=PROP_ALERT_DAYS; });
  if(endSoon.length) out.push({ sev:'warn', key:'prop-end', label:'契約満了が近い物件',
    n:endSoon.length, go:"goto('properties')",
    sub:endSoon.map(pr=>`${pr.name}：${propDaysLeft(pr)<0?'満了済み':'あと'+propDaysLeft(pr)+'日'}`).join('、') });

  /* ── 資金が足りなくなる週 ── */
  const cash=cashPlanByWeek(8); let run=num(DB.settings&&DB.settings.cashStart);
  let short=null;
  for(const w of cash){ run+=w.net; if(run<0){ short=w; break; } }
  if(short && num(DB.settings&&DB.settings.cashStart)) out.push({ sev:'danger', key:'cash', label:'資金がマイナスになる見込み',
    go:"goto('cashflow')", sub:`${short.s.slice(5).replace('-','/')} の週。入金予定と支払予定の差です` });

  return out;
}

/** 誰が何を直したか（サーバーの操作履歴から。開いたときだけ取りに行く） */
let _nmLogAt=0, _nmLog=null;
async function loadNotifLog(){
  const box=()=>document.getElementById('nmLog');
  const draw=rows=>{ const b=box(); if(!b) return;
    b.innerHTML = rows.length? rows.slice(0,12).map(r=>{
      const act={create:'を追加',update:'を編集',delete:'を削除',restore:'を復元'}[r.action]||('：'+r.action);
      return `<div class="nm-item" onclick="document.getElementById('notif').classList.remove('open');goto('audit')">
        <div class="nm-ic b-gray">·</div><div class="nm-txt">
          <b>${esc(String(r.actor_email||'').split('@')[0])}</b> が ${esc(AUDIT_ENT[r.entity]||r.entity)}${esc(act)}
          <div class="nm-time">${esc(String(r.at).slice(0,16).replace('T',' '))}</div></div></div>`;
    }).join('') : '<div class="nm-empty">まだ記録がありません。</div>'; };
  if(_nmLog && Date.now()-_nmLogAt < 60000) return draw(_nmLog);
  try{
    const r=await fetch(API_BASE+'/audit',{headers:headers()});
    const d=await r.json();
    _nmLog=(d.items||[]).filter(x=>x.entity!=='api_v1'); _nmLogAt=Date.now();
    draw(_nmLog);
  }catch(e){ const b=box(); if(b) b.innerHTML='<div class="nm-empty">更新履歴を取得できませんでした。</div>'; }
}

      入金の遅れ方を会社ごとに変えてあるので、台帳のタイムラインの色が全部見られます。
   ========================================================================== */
const DEMO_TAG='【デモ】';
let _dseed=20260913;
const drnd = ()=>{ _dseed=(_dseed*1103515245+12345)&0x7fffffff; return _dseed/0x7fffffff; };
const dint = (lo,hi)=>lo+Math.floor(drnd()*(hi-lo+1));
/** 千円単位で少しばらす（本物らしく見せるため。計算には意味を持たせない） */
const dvar = (base,pct)=>Math.round(base*(1+(drnd()*2-1)*pct)/100)*100;

function demoCount(){
  const keys=['companies','properties','costItems','invoices','payments','bills','payouts','expenses','budgets','billingRules','accounts','workers','assignments','collectionLogs'];
  return keys.reduce((n,k)=>n+((DB[k]||[]).filter(x=>x&&x.demo).length),0);
}

              入金の遅れ方を会社ごとに変えてあるので、取引先台帳のタイムラインの色が全部見られます。</div>`}
      <div style="display:flex;gap:8px;flex-wrap:wrap;">

      </div>
      <div class="fhelp" style="margin-top:10px;">入れたものには印が付いています。「全部消す」はその印の行だけを消すので、
        本物の請求や入金が巻き込まれることはありません。</div>
    </div></div>`;
}

async function demoSeed(){
  if(!isAdmin()){ toast('デモデータは管理者だけが入れられます。','err'); return; }
  if(demoCount() && !confirm('すでにデモデータがあります。いったん全部消してから作り直しますか？')) return;
  if(demoCount()){ await demoRemove(true); }
  if(!confirm('デモデータを入れます。\n\n・名前が【デモ】で始まる行が約350件できます\n・本物のデータには触れません\n・あとから「全部消す」で消せます\n\nよろしいですか？')) return;

  _dseed=20260913;
  const D=r=>Object.assign({demo:true}, r);
  const endYm=thisMonth();
  const months=[]; for(let i=13;i>=0;i--) months.push(addMonths(endYm,-i));   // 14か月
  const t=today();

  const cust=[
