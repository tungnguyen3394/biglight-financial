/* ============ 期間比較 — 「先月と比べて」「去年と比べて」「他の年と比べて」 ============ */
let CMP_KEY='revenue', CMP_IDX=null;
function setCmp(k){ CMP_KEY=k; renderPage('compare'); }
function setCmpIdx(i){ CMP_IDX=Number(i); renderPage('compare'); }

function viewCompare(){
  const fy=CUR_FY;
  const i = CMP_IDX==null? lastActualIdx(fy) : CMP_IDX;
  const cur=plBook(fy,'actual')[CMP_KEY], prev=plBook(fy-1,'actual')[CMP_KEY];
  const bud=plBook(fy,'budget')[CMP_KEY];
  const c=compareSeries(cur,prev,i);
  const rowsDef=[
    ['当月',            c.month,  '予算', bud[i]],
    ['前月比',          c.month,  '前月', c.prevMonth],
    ['前年同月比',      c.month,  '前年同月', c.lastYearMonth],
    ['四半期累計（QTD）', c.qtd,  '前四半期同期', c.prevQtd],
    ['四半期 前年比',    c.qtd,   '前年同四半期', c.lastYearQtd],
    ['半期累計',        c.htd,    '前半期同期', c.prevHtd],
    ['年度累計（YTD）',  c.ytd,   '前年同期', c.lastYearYtd],
    ['年度累計 予算比',  c.ytd,   '予算累計', sumRange(bud,0,i)],
  ];
  const cmpTable = `<div class="table-wrap"><table>
    <thead><tr><th>比較軸</th><th class="r">当期</th><th>比較対象</th><th class="r">対象値</th><th class="r">差額</th><th class="r">増減率</th></tr></thead>
    <tbody>${rowsDef.map(([lb,a,blb,b])=>`<tr>
      <td>${esc(lb)}</td><td class="r num"><b>${moneyPlain(a)}</b></td>
      <td class="muted">${esc(blb)}</td><td class="r num">${moneyPlain(b)}</td>
      <td class="r num ${a-b>0?'plus':(a-b<0?'minus':'zero')}">${a-b>0?'+':''}${moneyPlain(a-b)}</td>
      <td class="r">${pct(a,b)}</td></tr>`).join('')}</tbody></table></div>`;

  // 複数年の並列比較（過去の成績と比べる）
  const years = fyChoices().filter(y=>y<=fy).slice(0,5).sort((a,b)=>a-b);
  const yRows = years.map(y=>{
    const s=plBook(y,'actual')[CMP_KEY];
    const tot=sum12(s);
    return `<tr><td><b>${y}年度</b></td>
      ${s.map((v,k)=>`<td class="r num" style="${k===i?'background:var(--primary-soft);':''}">${money(v)}</td>`).join('')}
      <td class="r num"><b>${moneyPlain(tot)}</b></td></tr>`;
  }).join('');
  const maxTot = Math.max(...years.map(y=>Math.abs(sum12(plBook(y,'actual')[CMP_KEY]))),1);
  const bars = years.map(y=>{
    const t=sum12(plBook(y,'actual')[CMP_KEY]);
    return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;">
      <div style="width:76px;font-size:12px;" class="muted">${y}年度</div>
      <div class="bar" style="flex:1;height:16px;"><i style="width:${Math.abs(t)/maxTot*100}%;${t<0?'background:var(--red);':''}"></i></div>
      <div class="num" style="width:120px;text-align:right;font-size:12.5px;font-weight:600;">${moneyPlain(t)}</div></div>`;
  }).join('');

  const seg = `<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px;">
    <div class="seg">${['revenue','gross','operating','ordinary'].map(k=>{
      const lb={revenue:'売上高',gross:'売上総利益',operating:'営業利益',ordinary:'経常利益'}[k];
      return `<button class="${CMP_KEY===k?'on':''}" onclick="setCmp('${k}')">${lb}</button>`; }).join('')}</div>
    <select onchange="setCmpIdx(this.value)" style="padding:7px 10px;border:1px solid var(--border-strong);border-radius:8px;">
      ${FY_MONTH_LABELS.map((m,k)=>`<option value="${k}" ${k===i?'selected':''}>${m}を基準に比較</option>`).join('')}</select></div>`;

  return pageShell({ title:'期間比較', sub:fyLabel(fy),
    tools: toolsMenu(`<button class="btn secondary" onclick="window.print()">${IC.print} 印刷</button>`),
    body: seg
      +`<div class="panel"><div class="panel-hd"><b>${esc({revenue:'売上高',gross:'売上総利益',operating:'営業利益',ordinary:'経常利益'}[CMP_KEY])}</b><span class="sub">${FY_MONTH_LABELS[i]} 時点</span></div><div class="panel-bd tight">${cmpTable}</div></div>`
      +`<div class="panel"><div class="panel-hd"><b>年度別の推移</b><span class="sub">過去の成績と並べて見る</span></div>
         <div class="panel-bd tight"><div class="table-wrap" style="border:0;"><table class="stick1">
           <thead><tr><th style="min-width:96px;">年度</th>${FY_MONTH_LABELS.map(m=>`<th class="r">${m}</th>`).join('')}<th class="r">年間</th></tr></thead>
           <tbody>${yRows}</tbody></table></div></div></div>`
      +`<div class="panel"><div class="panel-hd"><b>年間合計の比較</b></div><div class="panel-bd">${bars}</div></div>` });
}

function viewMikomi(){
  const fy=CUR_FY, i=lastActualIdx(fy);
  const act=plBook(fy,'actual'), bud=plBook(fy,'budget'), fc=plBook(fy,'forecast'), prev=plBook(fy-1,'actual');
  const keys=[['revenue','売上高'],['gross','売上総利益'],['sga','販管費'],['operating','営業利益'],['ordinary','経常利益']];
  const qBlocks = QUARTERS.map(q=>{
    const cols = [0,1,2].map(k=>q.s+k);
    return `<div class="panel"><div class="panel-hd"><b>${esc(q.label)}</b>
        <span class="sub">${cols.every(c=>c<=i)?'実績確定':'実績＋見込'}</span></div>
      <div class="panel-bd tight"><div class="table-wrap" style="border:0;"><table>
        <thead><tr><th style="min-width:120px;">科目</th>

        <tbody>${keys.map(([k,lb])=>{
          const vals=cols.map(c=> c<=i? act[k][c] : (fc[k][c]||bud[k][c]));
          const t=vals.reduce((s,v)=>s+v,0), b=cols.reduce((s,c)=>s+bud[k][c],0);

            <td class="r num"><b>${moneyPlain(t)}</b></td><td class="r num">${moneyPlain(b)}</td>
            <td class="r">${b?`<span class="rate ${t>=b?'plus':'minus'}">${(t/b*100).toFixed(0)}%</span>`:'<span class="zero">—</span>'}</td></tr>`;
        }).join('')}</tbody></table></div></div></div>`;
  }).join('');

  const yearTable = `<div class="panel"><div class="panel-hd"><b>年間まとめ</b><span class="sub">当月・累計・年間見込 ×（予算・前年）</span></div>
    <div class="panel-bd tight"><div class="table-wrap" style="border:0;"><table>
      <thead><tr><th style="min-width:120px;">科目</th>
        <th class="r">当月<br><span class="muted" style="font-weight:400;">${FY_MONTH_LABELS[i]}</span></th>
        <th class="r">前年同月</th><th class="r">前年比</th>
        <th class="r">累計</th><th class="r">前年累計</th><th class="r">前年比</th>
        <th class="r">年間見込</th><th class="r">年間予算</th><th class="r">達成</th></tr></thead>
      <tbody>${keys.map(([k,lb])=>{
        const c=compareSeries(act[k],prev[k],i), land=landing(fy,k,i), b=sum12(bud[k]);
        return `<tr><td><b>${esc(lb)}</b></td>
          <td class="r num">${money(c.month)}</td><td class="r num">${money(c.lastYearMonth)}</td><td class="r">${pct(c.month,c.lastYearMonth)}</td>
          <td class="r num"><b>${moneyPlain(c.ytd)}</b></td><td class="r num">${money(c.lastYearYtd)}</td><td class="r">${pct(c.ytd,c.lastYearYtd)}</td>
          <td class="r num" style="color:var(--plan);font-weight:600;">${moneyPlain(land)}</td>
          <td class="r num">${moneyPlain(b)}</td>
          <td class="r">${b?`<span class="rate ${land>=b?'plus':'minus'}">${(land/b*100).toFixed(0)}%</span>`:'<span class="zero">—</span>'}</td></tr>`;
      }).join('')}</tbody></table></div></div></div>`;

  return pageShell({ title:'見込実績表', sub:fyLabel(fy)+' ／ 会議で配る形',
    tools: toolsMenu(`<button class="btn secondary" onclick="window.print()">${IC.print} 印刷（A4横）</button>`),
    body: yearTable+qBlocks });
}

    {key:'dueDate', label:'入金期日', date:true, val:r=>{

    {key:'status', label:'状態', raw:r=>invoiceStatus(r), val:r=>statusBadge(invoiceStatus(r))},

function confirmInvoice(id){
  const inv=findById('invoices',id); if(!inv) return;
  if(!confirm(`請求書 ${inv.no} を確定します。\n確定後は削除できません（取消のみ）。よろしいですか？`)) return;
  inv.status='確定'; inv.locked=true;
  if(!inv.issueDate) inv.issueDate=today();
  markDirty('invoices',inv); renderPage(CURRENT_PAGE); toast('確定しました。','ok');
}

/* ---------- 請求のまとめ作成（CRMの在籍者数 × 単価） ---------- */
let GEN_CTX=null;
function openGenerate(){
  const ym = addMonths(thisMonth(),0);
  openModal(`<h3>請求をまとめて作成</h3>
    <div class="mdsub">請求ルールのある取引先について、その月の請求書（作成中）をまとめて作ります。</div>
    <div class="form-grid">
      <div class="full"><label>対象月（計上月）</label>
        <input id="genYm" type="month" value="${attr(ym)}" onchange="genPreview()"></div>
    </div>
    <div id="genBox" style="margin-top:12px;"></div>
    <div class="modal-actions"><button class="btn secondary" onclick="closeModal()">キャンセル</button>
      <button class="btn" id="genGoBtn" onclick="genGo()">この内容で作成</button></div>`,'lg');
  genPreview();
}
function genPreview(){
  const ym=document.getElementById('genYm').value;
  const box=document.getElementById('genBox');
  if(!ym){ box.innerHTML=''; return; }
  const targets=[], noRule=[], already=[];
  (DB.companies||[]).forEach(c=>{
    if(c._gone) return;
    if(c.kind==='仕入先') return;
    const rules=rulesOfCompany(c.id).filter(r=>r.kind!=='spot');
    const exists=(DB.invoices||[]).some(i=>String(i.companyId)===String(c.id)&&i.bookMonth===ym&&i.status!=='取消');
    if(exists){ already.push(c); return; }
    if(!rules.length){ if(arBalanceOf(c.id)>0||c.kind==='得意先') noRule.push(c); return; }
    const {items,snapshot}=autoItemsFor(c.id,ym);
    if(!items.length) return;
    targets.push({company:c, items, snapshot, total:itemsSubtotal(items)+itemsTax(items)});
  });
  GEN_CTX={ ym, targets };
  const rows=targets.map((t,i)=>`<tr>
    <td><input type="checkbox" class="genck" data-i="${i}" checked></td>
    <td><b>${esc(t.company.name)}</b></td>
    <td style="white-space:normal;font-size:11.5px;" class="muted">${t.items.map(x=>esc(x.name)+(x.qty>1?` ${x.qty}名×${moneyPlain(x.price)}`:'')).join('<br>')}</td>
    <td class="r num"><b>${moneyPlain(t.total)}</b></td>
    <td>${esc(dueDateOf(t.ym||GEN_CTX.ym, t.company.closingDay, t.company.paySite, t.company.payDay))}</td></tr>`).join('');
  box.innerHTML = `
    ${targets.length? `<div class="table-wrap"><table>
      <thead><tr><th style="width:34px;"><input type="checkbox" checked onchange="document.querySelectorAll('.genck').forEach(c=>c.checked=this.checked)"></th>
        <th>取引先</th><th>内容</th><th class="r">請求額（税込）</th><th>入金期日</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
      <div class="infobar" style="margin-top:8px;">合計 <b class="num">${moneyPlain(targets.reduce((s,t)=>s+t.total,0))}</b> 円 ／ ${targets.length}社。作成後は「作成中」です。内容を確認してから確定してください。</div>`
      : `<div class="warnbar">この月に自動作成できる請求はありません。請求ルールが未設定か、すでに作成済みです。</div>`}
    ${already.length? `<div class="infobar">すでに ${ym} の請求がある取引先（作成しません）：${already.map(c=>esc(c.name)).join('、')}</div>`:''}
    ${noRule.length? `<div class="warnbar">請求ルールが未設定の取引先：${noRule.map(c=>`<a onclick="closeModal();openRules('${c.id}')" style="cursor:pointer;color:var(--primary);font-weight:600;">${esc(c.name)}</a>`).join('、')}
      <div style="margin-top:4px;font-weight:400;">ルールを作ると翌月から自動で請求に入ります。単発の請求は「＋ 個別に請求を作成」から。</div></div>`:''}`;
}
function genGo(){
  if(!GEN_CTX||!GEN_CTX.targets.length){ toast('作成する対象がありません。','err'); return; }
  const picked=[...document.querySelectorAll('.genck:checked')].map(c=>GEN_CTX.targets[Number(c.dataset.i)]);
  if(!picked.length){ toast('対象を選んでください。','err'); return; }
  let n=0;
  picked.forEach(t=>{
    const rec={ companyId:t.company.id, bookMonth:GEN_CTX.ym, issueDate:'', status:'作成中',
      items:t.items, workerSnapshot:t.snapshot, note:'自動作成（請求ルール）' };
    prepareDoc('invoices', rec, null);
    rec.dueDate = dueDateOf(GEN_CTX.ym, t.company.closingDay, t.company.paySite, t.company.payDay);
    commitRecord('invoices', rec, {}); n++;
  });
  closeModal(); renderPage('invoices'); toast(`${n}件の請求書（作成中）を作成しました。`,'ok');
}

function unAllocated(){
  return (DB.payments||[]).filter(p=>p.status!=='取消')
    .reduce((s,p)=>s+Math.max(0, num(p.amount)-(p.allocations||[]).reduce((t,a)=>t+num(a.amount),0)),0);
}
let PAY_CTX=null;
function openPaymentFor(invoiceId){
  const inv=findById('invoices',invoiceId); if(!inv) return;
  openPayment(null, { companyId:inv.companyId, amount:balanceOfInvoice(inv), focusInvoice:invoiceId });
}
function openPayment(id, preset){
  if(!canEdit('receipts')){ toast('入金を記録する権限がありません。','err'); return; }
  const p = id? findById('payments',id) : null;
  PAY_CTX = { id: id||null,
    companyId: p? p.companyId : (preset?.companyId||''),
    date: p? p.date : today(),
    amount: p? num(p.amount) : num(preset?.amount||0),
    fee: p? num(p.fee) : 0,
    method: p? p.method : '銀行振込',
    note: p? p.note : '',
    allocations: p? (p.allocations||[]).map(a=>Object.assign({},a)) : [] };
  drawPaymentModal();
  if(!id && preset?.focusInvoice) setTimeout(()=>payAuto(),0);
}
function drawPaymentModal(){
  const c=PAY_CTX;
  const open=openInvoices().filter(i=>!c.companyId||String(i.companyId)===String(c.companyId))
    .sort((a,b)=>String(a.dueDate||'').localeCompare(String(b.dueDate||'')));
  const allocMap={}; (c.allocations||[]).forEach(a=>allocMap[a.invoiceId]=num(a.amount));
  const allocSum=Object.values(allocMap).reduce((s,v)=>s+v,0);
  const rest=num(c.amount)-allocSum;
  const rows=open.map(i=>{
    const bal=balanceOfInvoice(i)+ (c.id? (allocMap[i.id]||0) : 0);
    return `<tr><td>${esc(i.no)}</td><td>${esc(i.bookMonth||'')}</td>
      <td>${i.dueDate&&i.dueDate<today()?`<span class="badge b-red">${esc(i.dueDate)}</span>`:esc(i.dueDate||'')}</td>
      <td class="r num">${moneyPlain(bal)}</td>
      <td style="width:130px;"><input class="num" style="width:100%;padding:5px;border:1px solid var(--border);border-radius:6px;text-align:right;font-size:12px;"
        value="${allocMap[i.id]?moneyPlain(allocMap[i.id]):''}" oninput="fmtMoneyInput(this);payAlloc('${i.id}',this.value)" placeholder="0"></td></tr>`;
  }).join('');
  openModal(`<h3>${c.id?'入金の修正':'入金を記録'}</h3>
    <div class="mdsub">1回の振込で複数の請求を消し込めます。差額は「未消込」として残ります。</div>
    <div class="form-grid">
      <div><label>入金日</label><input type="date" value="${attr(c.date)}" onchange="PAY_CTX.date=this.value"></div>
      <div><label>取引先</label><select onchange="PAY_CTX.companyId=this.value;PAY_CTX.allocations=[];drawPaymentModal()">
        <option value="">-</option>${(DB.companies||[]).filter(x=>!x._gone).map(x=>`<option value="${attr(x.id)}" ${String(x.id)===String(c.companyId)?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>
      <div><label>入金額</label><input class="num" style="text-align:right;" value="${c.amount?moneyPlain(c.amount):''}" oninput="fmtMoneyInput(this);PAY_CTX.amount=num(this.value);payRefreshRest()"></div>
      <div><label>振込手数料（先方負担分）</label><input class="num" style="text-align:right;" value="${c.fee?moneyPlain(c.fee):''}" oninput="fmtMoneyInput(this);PAY_CTX.fee=num(this.value)"></div>
      <div><label>方法</label><select onchange="PAY_CTX.method=this.value">${selOpts(PAY_METHODS,c.method)}</select></div>
      <div><label>備考</label><input value="${attr(c.note||'')}" oninput="PAY_CTX.note=this.value"></div>
    </div>
    <div class="form-section" style="margin-top:14px;">${IC.yen} 消込先の請求書
      <a class="pillbtn pill-save" style="margin-left:auto;" onclick="payAuto()">期日の古い順に自動で割り当て</a></div>
    ${c.companyId? (open.length? `<div class="table-wrap"><table>
        <thead><tr><th>請求番号</th><th>計上月</th><th>期日</th><th class="r">残高</th><th class="r">消込額</th></tr></thead>
        <tbody>${rows}</tbody></table></div>`
      : '<div class="infobar">この取引先に未回収の請求はありません。</div>')
      : '<div class="warnbar">先に取引先を選んでください。</div>'}
    <div id="payRest" style="margin-top:10px;font-size:13px;text-align:right;">
      消込合計 <b class="num">${moneyPlain(allocSum)}</b> ／ 未消込 <b class="num ${rest?(rest>0?'minus':'plus'):''}">${moneyPlain(rest)}</b></div>
    <div class="modal-actions ${c.id?'split':''}">
      ${c.id?`<button class="btn danger" onclick="payDelete()">削除</button>`:''}
      <div style="display:flex;gap:8px;"><button class="btn secondary" onclick="closeModal()">キャンセル</button>
      <button class="btn" onclick="paySave()">保存</button></div></div>`,'lg');
}
function payAlloc(invId,v){
  const amt=num(v);
  PAY_CTX.allocations=(PAY_CTX.allocations||[]).filter(a=>String(a.invoiceId)!==String(invId));
  if(amt) PAY_CTX.allocations.push({invoiceId:invId, amount:amt});
  payRefreshRest();
}
function payRefreshRest(){
  const el=document.getElementById('payRest'); if(!el) return;
  const s=(PAY_CTX.allocations||[]).reduce((t,a)=>t+num(a.amount),0), rest=num(PAY_CTX.amount)-s;
  el.innerHTML=`消込合計 <b class="num">${moneyPlain(s)}</b> ／ 未消込 <b class="num ${rest?(rest>0?'minus':'plus'):''}">${moneyPlain(rest)}</b>`;
}
function payAuto(){
  let rest=num(PAY_CTX.amount)+num(PAY_CTX.fee);
  const cur={}; (PAY_CTX.allocations||[]).forEach(a=>cur[a.invoiceId]=num(a.amount));
  PAY_CTX.allocations=[];
  openInvoices().filter(i=>String(i.companyId)===String(PAY_CTX.companyId))
    .sort((a,b)=>String(a.dueDate||'').localeCompare(String(b.dueDate||'')))
    .forEach(i=>{
      if(rest<=0) return;
      const bal=balanceOfInvoice(i)+(PAY_CTX.id?(cur[i.id]||0):0);
      const use=Math.min(bal,rest);
      if(use>0){ PAY_CTX.allocations.push({invoiceId:i.id, amount:use}); rest-=use; }
    });
  drawPaymentModal();
}
function paySave(){
  const c=PAY_CTX;
  if(!c.companyId||!num(c.amount)){ toast('取引先と入金額を入力してください。','err'); return; }
  const s=(c.allocations||[]).reduce((t,a)=>t+num(a.amount),0);
  if(s>num(c.amount)+num(c.fee)+1){
    if(!confirm(`消込額（${moneyPlain(s)}）が入金額を超えています。このまま保存しますか？`)) return;
  }
  commitRecord('payments', { companyId:c.companyId, date:c.date, amount:num(c.amount), fee:num(c.fee),
    method:c.method, note:c.note, allocations:c.allocations, status:'確定' }, { existingId:c.id });
  closeModal(); renderPage(CURRENT_PAGE); renderNav(); toast('入金を記録しました。','ok');
}
function payDelete(){
  if(!PAY_CTX.id) return;
  if(deleteRecord('payments', PAY_CTX.id, '入金記録')){ closeModal(); renderPage(CURRENT_PAGE); }
}

function viewAging(){
  const open=openInvoices();
  const byCo={};
  open.forEach(i=>{
    const k=String(i.companyId||'-');
    if(!byCo[k]) byCo[k]={ id:k, name:companyName(i.companyId).replace(/<[^>]+>/g,''), buckets:{}, total:0, oldest:'' };
    const b=agingBucket(i);
    byCo[k].buckets[b]=(byCo[k].buckets[b]||0)+balanceOfInvoice(i);
    byCo[k].total+=balanceOfInvoice(i);
    if(!byCo[k].oldest||(i.dueDate&&i.dueDate<byCo[k].oldest)) byCo[k].oldest=i.dueDate||'';
  });
  const rows=Object.values(byCo).sort((a,b)=>b.total-a.total);
  const totals={}; AGING_BUCKETS.forEach(b=>totals[b]=rows.reduce((s,r)=>s+(r.buckets[b]||0),0));
  const grand=rows.reduce((s,r)=>s+r.total,0);

  const kpis=`<div class="kpi-grid">
    ${AGING_BUCKETS.map(b=>`<div class="kpi"><div class="lbl">${esc(b)}</div>
      <div class="num ${b==='90日超'||b==='61〜90日'?'minus':''}">${moneyPlain(totals[b])}</div>
      <div class="sub">${grand?((totals[b]/grand)*100).toFixed(0)+'%':'—'}</div></div>`).join('')}
  </div>`;

  const table=`<div class="table-wrap"><table class="stick1">
    <thead><tr><th style="min-width:180px;">取引先</th>
      ${AGING_BUCKETS.map(b=>`<th class="r">${esc(b)}</th>`).join('')}
      <th class="r">合計</th><th>最も古い期日</th><th></th></tr></thead>
    <tbody>${rows.length? rows.map(r=>`<tr>
      <td>${coLink(r.id,'ar')}</td>
      ${AGING_BUCKETS.map(b=>`<td class="r num ${(b==='61〜90日'||b==='90日超')&&r.buckets[b]?'minus':''}">${r.buckets[b]?moneyPlain(r.buckets[b]):'<span class="zero">—</span>'}</td>`).join('')}
      <td class="r num"><b>${moneyPlain(r.total)}</b></td>
      <td>${r.oldest&&r.oldest<today()?`<span class="badge b-red">${esc(r.oldest)}</span>`:esc(r.oldest||'')}</td>
      <td><a onclick="agingDetail('${r.id}')" style="cursor:pointer;color:var(--primary);font-size:12px;">明細</a></td></tr>`).join('')
      : '<tr><td colspan="9" class="empty">未回収の請求はありません。</td></tr>'}
      ${rows.length?`<tr class="totrow"><td>合計</td>${AGING_BUCKETS.map(b=>`<td class="r num">${moneyPlain(totals[b])}</td>`).join('')}
        <td class="r num">${moneyPlain(grand)}</td><td></td><td></td></tr>`:''}
    </tbody></table></div>`;

  return pageShell({ title:'債権年齢表', sub:'期日からの経過日数で区分。61日以上は要対応です。',
    tools: toolsMenu(`<button class="btn secondary" onclick="window.print()">${IC.print} 印刷</button>`),
    body: kpis+table });
}

function viewBills(){

      return `<span title="${attr(its.map(x=>x.name).join('、'))}">${esc(its[0].name||accountLabel(its[0].accountCode))}${its.length>1?` <span class="muted">他${its.length-1}件</span>`:''}</span>`; }},
    {key:'total', label:'金額', cls:'r', noFilter:true, val:r=>`<b class="num">${moneyPlain(docTotal(r))}</b>`},
    {key:'balance', label:'未払残', cls:'r', noFilter:true, val:r=>{const b=balanceOfBill(r); return b>0?`<b class="num minus">${moneyPlain(b)}</b>`:'<span class="zero">0</span>';}},

function poAlloc(billId,v){
  const amt=num(v);
  PO_CTX.allocations=(PO_CTX.allocations||[]).filter(a=>String(a.billId)!==String(billId));
  if(amt) PO_CTX.allocations.push({billId, amount:amt});
  poRest();
}
function poRest(){
  const el=document.getElementById('poRest'); if(!el) return;
  const s=(PO_CTX.allocations||[]).reduce((t,a)=>t+num(a.amount),0), rest=num(PO_CTX.amount)-s;
  el.innerHTML=`消込合計 <b class="num">${moneyPlain(s)}</b> ／ 未消込 <b class="num ${rest?'minus':''}">${moneyPlain(rest)}</b>`;
}
function poAuto(){
  let rest=num(PO_CTX.amount);
  const cur={}; (PO_CTX.allocations||[]).forEach(a=>cur[a.billId]=num(a.amount));
  PO_CTX.allocations=[];
  openBills().filter(b=>String(b.companyId)===String(PO_CTX.companyId))
    .sort((a,b)=>String(a.dueDate||'').localeCompare(String(b.dueDate||'')))
    .forEach(b=>{ if(rest<=0) return; const bal=balanceOfBill(b)+(PO_CTX.id?(cur[b.id]||0):0);
      const use=Math.min(bal,rest); if(use>0){ PO_CTX.allocations.push({billId:b.id,amount:use}); rest-=use; } });
  drawPayoutModal();
}
function poSave(){
  const c=PO_CTX;
  if(!c.companyId||!num(c.amount)){ toast('支払先と金額を入力してください。','err'); return; }
  commitRecord('payouts', { companyId:c.companyId, date:c.date, amount:num(c.amount), method:c.method,
    note:c.note, allocations:c.allocations, status:'確定' }, { existingId:c.id });

/* ============================================================================
   勘定科目の登録 — 大分類 › 中分類 › 小分類（もっと深くもできる）
   ----------------------------------------------------------------------------
   利用者の指示（2026-09-13）:「勘定科目を 大・中・小 で定義する画面がほしい。
   さらに増やせるように。どの階層でも、その下の対象（建物など）を一覧で見たい」

   決めごと（ここを外すと数字が合わなくなります）:
   ・区分（収益／売上原価／販管費／営業外）は いちばん上でだけ決め、下は受け継ぐ。
     途中で変えられると、同じ科目が損益の2か所に出てしまうため。
   ・伝票・費目に選べるのは <b>末端（子を持たない科目）</b>だけ。
     親も選べると「親の金額＋子の金額」で二重に数えてしまう。
   ・コードは今までのまま。上に器（大分類）をかぶせるだけなので、
     すでに入っている請求・支払・費用・予算は1行も書き換えません。
   ========================================================================== */
const ACC_ROOTS = [
  { code:'R4', label:'売上高',   kind:'revenue' },
  { code:'R5', label:'売上原価', kind:'cogs' },
  { code:'R6', label:'販売費及び一般管理費', kind:'sga' },
  { code:'R7', label:'営業外損益', kind:'nonop' },
];
const accountById   = id   => (DB.accounts||[]).find(a=>String(a.id)===String(id)) || null;
const accountByCode = code => accounts().find(a=>String(a.code)===String(code)) || null;
const accountChildren = parentId => accounts().filter(a=>String(a.parentId||'')===String(parentId||''))
  .slice().sort((a,b)=> (Number(a.order||0)-Number(b.order||0)) || String(a.code||'').localeCompare(String(b.code||'')));
const accountRoots  = () => accountChildren('');
const accountIsLeaf = a  => !!a && !accountChildren(a.id).length;
/** 親をたどって区分を決める（自分に区分が無ければ受け継ぐ） */
function accountKindOf(a){
  let cur=a, guard=0;
  while(cur && !cur.kind && cur.parentId && guard++<12) cur=accountById(cur.parentId);
  return cur && cur.kind ? cur.kind : '';
}
/** 「販管費 › 地代家賃 › 電気代」 */
function accountPath(code){
  let a=accountByCode(code), out=[], guard=0;
  while(a && guard++<12){ out.unshift(a); a = a.parentId? accountById(a.parentId) : null; }
  return out;
}
const accountPathLabel = code => accountPath(code).map(a=>a.label).join(' › ') || String(code||'-');
/** その科目と、その下にぶら下がる全部のコード（集計に使う） */
function accountCodesUnder(code){
  const a=accountByCode(code); if(!a) return [code];
  const out=[]; (function walk(n){ out.push(n.code); accountChildren(n.id).forEach(walk); })(a);
  return out;
}
/** その科目を使っている伝票・費目・予算の数（消してよいかの判断に出す） */
function accountUsage(code){
  let n=0;
  const cnt = arr => (arr||[]).forEach(x=>{ if(String(x.accountCode)===String(code)) n++; });
  (DB.invoices||[]).forEach(i=>cnt(i.items)); (DB.bills||[]).forEach(b=>cnt(b.items));
  cnt(DB.expenses); cnt(DB.costItems); cnt(DB.budgets); cnt(DB.forecasts); cnt(DB.actualAdjust); cnt(DB.billingRules);
  return n;
}
/** 選べるのは末端だけ。親は見出しとして出す（選べない）。 */
function accountOptionsHtml(selected, kindFilter){
  let html='';
  (function walk(parentId, depth){
    accountChildren(parentId).forEach(a=>{
      if(a.active===false) return;
      const leaf=accountIsLeaf(a), kind=accountKindOf(a);
      const kids=accountChildren(a.id);
      if(kindFilter && leaf && kind!==kindFilter) return;
      const pad='　'.repeat(depth);
      if(leaf) html += `<option value="${attr(a.code)}" ${String(a.code)===String(selected)?'selected':''}>${esc(pad+a.label)}（${esc(a.code)}）</option>`;
      else     html += `<option disabled>${esc(pad+'── '+a.label)}</option>`;
      if(kids.length) walk(a.id, depth+1);
    });
  })('',0);
  /* 木がまだ無い（初期セット前）ときは、今までどおり平らな一覧を出す */
  if(!html) html = accounts().filter(a=>!kindFilter||a.kind===kindFilter)
    .map(a=>`<option value="${attr(a.code)}" ${String(a.code)===String(selected)?'selected':''}>${esc(a.code+' '+a.label)}（${esc(KIND_LABEL[a.kind]||'')}）</option>`).join('');
  return html;
}
/** 階層がもう作られているか。
    ★ 「親のいない科目があるか」で見てはいけない — 平らな一覧はみんな親がいない。
      「親を持つ科目が1つでもあるか」で見る。 */
const accTreeReady = () => accounts().some(a=>a.parentId);

/* ---------- 画面 ---------- */
function viewAccounts(){
  const canE=canEdit('settings');
  const fy=CUR_FY;
  const roots=accountRoots();

  const rowsHtml = (parentId, depth) => accountChildren(parentId).map(a=>{
    const kids=accountChildren(a.id), leaf=!kids.length, use=accountUsage(a.code);
    const codes=accountCodesUnder(a.code);
    const amt=codes.reduce((s,c)=>s+sum12(seriesByAccount(fy,c,'actual')),0);
    const lv=['大分類','中分類','小分類'][depth] || `第${depth+1}階層`;
    return `<tr class="${depth===0?'totrow':''}" style="${a.active===false?'opacity:.45;':''}">
      <td style="padding-left:${8+depth*22}px;">
        ${depth?'<span class="muted" style="font-size:11px;">└ </span>':''}<b>${esc(a.label)}</b>
        ${a.active===false?' <span class="badge b-gray">停止</span>':''}
        ${leaf?'':` <span class="muted" style="font-size:10.5px;">（${kids.length}件）</span>`}
        <div class="muted" style="font-size:10.5px;">${esc(lv)}${leaf?' ・ 伝票で選べます':' ・ 見出し（選べません）'}</div></td>
      <td class="muted" style="font-size:11.5px;">${esc(a.code)}</td>
      <td>${depth===0? `<span class="badge b-blue">${esc(KIND_LABEL[a.kind]||'')}</span>` : `<span class="muted" style="font-size:11px;">${esc(KIND_LABEL[accountKindOf(a)]||'')}</span>`}</td>
      <td class="r num">${use? use+'件' : '<span class="zero">—</span>'}</td>
      <td class="r num">${amt? moneyPlain(amt) : '<span class="zero">—</span>'}</td>
      <td>${canE? `<a class="pillbtn pill-new" onclick="accNodeForm('','${attr(a.id)}')">＋子</a>
        <a class="pillbtn pill-save" onclick="accNodeForm('${attr(a.id)}')">編集</a>
        <a class="pillbtn" onclick="accMove('${attr(a.id)}',-1)">↑</a>
        <a class="pillbtn" onclick="accMove('${attr(a.id)}',1)">↓</a>`:''}</td></tr>`
      + (kids.length? rowsHtml(a.id, depth+1) : '');
  }).join('');

  const body = accTreeReady()
    ? `<div class="table-wrap"><table>
        <thead><tr><th style="min-width:280px;">科目</th><th style="min-width:70px;">コード</th><th style="min-width:90px;">区分</th>
          <th class="r" style="min-width:80px;">使用中</th><th class="r" style="min-width:110px;">${fy}年度 実績</th><th style="min-width:170px;"></th></tr></thead>
        <tbody>${rowsHtml('',0)}</tbody></table></div>`
    : `<div class="warnbar">まだ階層が作られていません。「初期セット」を押すと、いま使っている勘定科目を
        <b>売上高／売上原価／販売費及び一般管理費／営業外損益</b> の4つの大分類に振り分けます。<br>
        <span style="font-weight:400;">コードも名前も変えません。いま入っている請求・支払・費用・予算はそのまま動きます。</span></div>`;

  return pageShell({ title:'勘定科目の登録', count:accounts().length,
    sub:'大分類 › 中分類 › 小分類（もっと深くもできます）。区分は大分類で決め、下は受け継ぎます。',
    tools:`${canE&&!accTreeReady()?`<button class="btn" onclick="accInitTree()">初期セット（今の科目を4分類に振り分け）</button>`:''}
      ${canE&&accTreeReady()?`<button class="btn" onclick="accNodeForm('','')">＋ 大分類を追加</button>`:''}
      ${toolsMenu(`<button class="btn secondary" onclick="goto('kbunrui')">分類別の集計を見る</button>
        <button class="btn secondary" onclick="exportCsvAccounts()">${IC.doc} CSV出力</button>`)}`,
    body: body + `<div class="fhelp" style="margin-top:8px;">
      伝票や費目で選べるのは <b>末端の科目</b>（子を持たないもの）だけです。親も選べると、親と子で同じお金を二重に数えてしまうためです。<br>
      使用中の件数が出ている科目は、消す前に伝票の付け替えが必要です。使わなくなったものは「停止」にすると、新しく選べなくなります（過去の数字はそのまま）。</div>` });
}
/** 今ある平らな科目を、区分ごとの大分類の下にぶら下げる。コードは触らない。 */
function accInitTree(){
  if(!canEdit('settings')){ toast('権限がありません。','err'); return; }
  if(!confirm('いま使っている勘定科目を、4つの大分類の下に振り分けます。\nコードも名前も金額も変わりません。よろしいですか？')) return;
  /* まだ DB に科目が1件も無ければ、既定の科目をそのまま登録してから木にする */
  if(!(DB.accounts||[]).length) DEFAULT_ACCOUNTS.forEach((a,i)=>commitRecord('accounts',{...a, order:i+1},{}));
  const rootId={};
  ACC_ROOTS.forEach((r,i)=>{
    let ex=(DB.accounts||[]).find(a=>a.code===r.code);
    if(!ex) ex=commitRecord('accounts',{...r, parentId:'', order:i+1},{}).record;
    rootId[r.kind]=ex.id;
  });
  (DB.accounts||[]).forEach(a=>{
    if(ACC_ROOTS.some(r=>r.code===a.code)) return;
    if(a.parentId) return;
    a.parentId = rootId[a.kind] || rootId.sga;
    if(!a.order) a.order = Number(String(a.code).replace(/\D/g,'')) || 0;
    markDirty('accounts', a);
  });
  renderPage('accounts'); toast('初期セットしました。ここから 中分類・小分類 を足せます。','ok');
}
function accNodeForm(id, parentId){
  const a = id? accountById(id) : null;
  const pid = a? (a.parentId||'') : (parentId||'');
  const parent = pid? accountById(pid) : null;
  const depth = parent? accountPath(parent.code).length : 0;
  const lv = ['大分類','中分類','小分類'][depth] || `第${depth+1}階層`;
  openModal(`<h3>${a?'科目の編集':lv+'を追加'}</h3>
    <div class="mdsub">${parent? `<b>${esc(accountPathLabel(parent.code))}</b> の下に作ります。`
      : '区分（損益のどこに入るか）は、この大分類で決まります。下の科目はこれを受け継ぎます。'}</div>
    <div class="form-grid">
      <div class="full"><label>名称 <span style="color:var(--danger)">*</span></label>
        <input id="acL" value="${attr(a?a.label:'')}" placeholder="${attr(depth===0?'例: 販売費及び一般管理費':(depth===1?'例: 水道光熱費':'例: 電気代'))}"></div>
      <div><label>コード <span style="color:var(--danger)">*</span></label>
        <input id="acC" value="${attr(a?a.code:'')}" placeholder="${attr(depth===0?'R6':'6210')}">
        <div class="fhelp">伝票に記録される印。あとから変えると過去の数字と結び付かなくなります。</div></div>
      ${depth===0? `<div><label>区分 <span style="color:var(--danger)">*</span></label>
        <select id="acK">${selOpts(Object.keys(KIND_LABEL).map(k=>({k,label:KIND_LABEL[k]})), a?a.kind:'sga')}</select></div>`
        : `<div><label>区分</label><input value="${attr(KIND_LABEL[accountKindOf(parent)]||'')}" readonly>
            <div class="fhelp">上の分類から受け継ぎます。</div></div>`}
      <div><label>並び順</label><input id="acO" type="number" value="${attr(a?(a.order||''):'')}" placeholder="小さいほど上"></div>
      <div><label>使う／停止</label><select id="acA">
        <option value="1" ${a&&a.active===false?'':'selected'}>使う</option>
        <option value="0" ${a&&a.active===false?'selected':''}>停止（新しく選べない）</option></select></div>
    </div>
    <div class="modal-actions ${a?'split':''}">
      ${a&&canDelete('settings')?`<button class="btn danger" onclick="accNodeDelete('${attr(a.id)}')">削除</button>`:''}
      <div style="display:flex;gap:8px;">
        <button class="btn secondary" onclick="closeModal()">キャンセル</button>
        <button class="btn" onclick="accNodeSave('${attr(id||'')}','${attr(pid)}')">保存</button></div></div>`);
}
function accNodeSave(id, parentId){
  const label=(document.getElementById('acL').value||'').trim();
  const code=(document.getElementById('acC').value||'').trim();
  if(!label||!code){ toast('名称とコードを入れてください。','err'); return; }
  const dup=accounts().find(a=>a.code===code && String(a.id)!==String(id));
  if(dup){ toast(`コード ${code} は「${dup.label}」で使われています。`,'err'); return; }
  const rec={ label, code, parentId:parentId||'',
    order:num(document.getElementById('acO').value),
    active: document.getElementById('acA').value==='1' };
  const kEl=document.getElementById('acK');
  if(kEl) rec.kind=kEl.value; else rec.kind='';        // 下の階層は区分を持たない（受け継ぐ）
  commitRecord('accounts', rec, { existingId:id||null });
  closeModal(); renderPage('accounts'); toast('保存しました。','ok');
}
function accNodeDelete(id){
  const a=accountById(id); if(!a) return;
  if(accountChildren(id).length){ toast('下に科目があります。先にそちらを消すか、移してください。','err'); return; }
  const use=accountUsage(a.code);
  if(use){ toast(`この科目は ${use}件の伝票・費目で使われています。消せません（「停止」にしてください）。`,'err'); return; }
  if(!confirm(`「${a.label}」を消します。よろしいですか？`)) return;
  if(deleteRecord('accounts', id, a.label)){ closeModal(); renderPage('accounts'); }
}
function accMove(id, dir){
  const a=accountById(id); if(!a) return;
  const sib=accountChildren(a.parentId||'');
  const i=sib.findIndex(x=>String(x.id)===String(id));
  const j=i+dir; if(j<0||j>=sib.length) return;
  sib.forEach((x,k)=>{ x.order=(k+1)*10; });
  a.order=(j+1)*10; sib[j].order=(i+1)*10;
  sib.forEach(x=>markDirty('accounts',x));
  renderPage('accounts');
}
function exportCsvAccounts(){
  const rows=[['階層','大分類','中分類','小分類','コード','名称','区分','使用中','年度実績']];
  (function walk(parentId, depth, path){
    accountChildren(parentId).forEach(a=>{
      const p=path.concat([a.label]);
      rows.push([depth+1, p[0]||'', p[1]||'', p[2]||'', a.code, a.label, KIND_LABEL[accountKindOf(a)]||'',
        accountUsage(a.code), sum12(seriesByAccount(CUR_FY,a.code,'actual'))]);
      walk(a.id, depth+1, p);
    });
  })('',0,[]);
  downloadCsv(`勘定科目_${CUR_FY}年度`, rows);
}

/* ============================================================================
   分類別集計 — 「どの科目に、どの建物で、いくら使ったか」
   ----------------------------------------------------------------------------
   利用者の指示（2026-09-13）:「大分類・中分類・小分類 それぞれで、その下の対象
   （建物）の一覧と金額を見たい。A棟は電気・水道・ガスでいくらか」

   数字の出どころは 予実（actualSeries）と同じ伝票です。ここで別の計算をしません。
   ★ テストで「分類別の合計 ＝ 予実の合計」を突き合わせています。ズレたら赤になります。
   ========================================================================== */
let KB_AXIS='account';      // account = 科目でまとめる / property = 建物でまとめる
let KB_KIND='';             // '' = 全部 / revenue / cogs / sga / nonop
let KB_OPEN={};             // 開いている行
const KB_NOPROP='(物件なし)';

function setKbAxis(a){ KB_AXIS=a; KB_OPEN={}; renderPage('kbunrui'); }
function setKbKind(k){ KB_KIND=k; renderPage('kbunrui'); }
function kbToggle(key){ KB_OPEN[key]=!KB_OPEN[key]; renderPage('kbunrui'); }

/** その費目の物件（費目マスタで決めた建物） */
function propOfCostItem(id){ const it=findById('costItems',id); return it? (it.propertyId||'') : ''; }

/** お金の動きを1本の表にする。1行 ＝ 1つの明細（税抜）。予実と同じ拾い方。 */
function moneyLines(fy){
  const months=fyMonths(fy), idx={}; months.forEach((m,i)=>{ idx[m]=i; });
  const out=[];
  const add=(ym, code, amount, propertyId, src)=>{
    const i=idx[ym]; if(i==null || !amount) return;
    out.push({ i, ym, code, amount, propertyId:propertyId||'', kind:accountKind(code), src });
  };
  /* ★ 取るのは「取消以外」。作成中も入れます — 予実（actualSeries）がそうだからです。
     ここで条件を変えると、同じ会社の同じ月なのに 予実 と 分類別 で数字が違う、という
     いちばん質の悪いズレが起きます。テストで両方を突き合わせています。 */
  (DB.invoices||[]).forEach(inv=>{
    if(inv.status==='取消') return;
    const ym=(inv.bookMonth||'').slice(0,7);
    (inv.items||[]).forEach(it=>add(ym, it.accountCode, itemAmount(it), it.propertyId,
      {t:'invoices', id:inv.id, label:(inv.no||'')+' ／ '+String(companyName(inv.companyId)).replace(/<[^>]+>/g,'')}));
  });
  (DB.bills||[]).forEach(b=>{
    if(b.status==='取消') return;
    const ym=(b.bookMonth||'').slice(0,7);
    (b.items||[]).forEach(it=>add(ym, it.accountCode, itemAmount(it), it.propertyId||propOfCostItem(it.costItemId),
      {t:'bills', id:b.id, label:(b.no||'')+' ／ '+String(companyName(b.companyId)).replace(/<[^>]+>/g,'')}));
  });
  (DB.expenses||[]).forEach(e=>{
    const ym=(e.bookMonth||e.date||'').slice(0,7);
    const rate=TAX_RATE[e.taxCat||'課税10%']||0;
    add(ym, e.accountCode, Math.round(num(e.amount)/(1+rate)), e.propertyId||propOfCostItem(e.costItemId),
      {t:'expenses', id:e.id, label:(e.note||accountLabel(e.accountCode))+(e.vendor?' ／ '+e.vendor:'')});
  });
  (DB.actualAdjust||[]).forEach(a=>{
    if(Number(a.fy)!==Number(fy)) return;
    const i=Number(a.mIndex); if(!(i>=0&&i<12) || !num(a.amount)) return;
    out.push({ i, ym:months[i], code:a.accountCode, amount:num(a.amount), propertyId:'',
      kind:accountKind(a.accountCode), src:{t:'adjust', id:a.id, label:'実績調整'} });
  });
  return out;
}
const kbZero = () => Array(12).fill(0);
const kbSum  = arr => arr.reduce((s,v)=>s+(v||0),0);

function viewKbunrui(){
  const fy=CUR_FY;
  const lines=moneyLines(fy).filter(l=>!KB_KIND || l.kind===KB_KIND);
  const cur=thisMonth(), curIdx = fyOf(cur)===fy ? fyIndexOf(cur) : -1;

  /* 集計の下ごしらえ（1回だけ回す） */
  const byCode={}, byCodeProp={}, byProp={}, byPropCode={};
  lines.forEach(l=>{
    byCode[l.code]=byCode[l.code]||kbZero(); byCode[l.code][l.i]+=l.amount;
    const pk=l.propertyId||KB_NOPROP;
    byCodeProp[l.code]=byCodeProp[l.code]||{};
    byCodeProp[l.code][pk]=byCodeProp[l.code][pk]||kbZero(); byCodeProp[l.code][pk][l.i]+=l.amount;
    byProp[pk]=byProp[pk]||kbZero(); byProp[pk][l.i]+=l.amount;
    byPropCode[pk]=byPropCode[pk]||{};
    byPropCode[pk][l.code]=byPropCode[pk][l.code]||kbZero(); byPropCode[pk][l.code][l.i]+=l.amount;
  });
  const sumCodes = codes => { const a=kbZero(); codes.forEach(c=>{ const s=byCode[c]; if(s) s.forEach((v,i)=>{ a[i]+=v; }); }); return a; };
  const propName = pk => pk===KB_NOPROP? KB_NOPROP : ((findById('properties',pk)||{}).name||'(消えた物件)');

  const cells=arr=>arr.map((v,i)=>`<td class="r num ${i===curIdx?'curcol':''}">${v?moneyPlain(v):'<span class="zero">—</span>'}</td>`).join('')
    +`<td class="r num"><b>${moneyPlain(kbSum(arr))}</b></td>`;
  const twist=(key,has)=>has? `<span class="kbtw">${KB_OPEN[key]?'▼':'▶'}</span>` : '<span class="kbtw" style="visibility:hidden;">▶</span>';
  const cellLinks=(arr,code,pk)=>arr.map((v,i)=>`<td class="r num ${i===curIdx?'curcol':''}">${v
    ?`<a onclick="event.stopPropagation();kbDrill('${attr(code)}','${attr(pk)}',${i})" style="cursor:pointer;color:var(--primary);">${moneyPlain(v)}</a>`
    :'<span class="zero">—</span>'}</td>`).join('')+`<td class="r num">${moneyPlain(kbSum(arr))}</td>`;

  let rows='', grand=kbZero();

  if(KB_AXIS==='account'){
    const walk=(parentId, depth)=>{
      accountChildren(parentId).forEach(a=>{
        if(KB_KIND && accountKindOf(a)!==KB_KIND) return;
        const codes=accountCodesUnder(a.code), arr=sumCodes(codes);
        const kids=accountChildren(a.id), leaf=!kids.length;
        const props=leaf? Object.keys(byCodeProp[a.code]||{}) : [];
        if(!kbSum(arr) && !props.length) return;
        const key='a:'+a.id;
        rows+=`<tr class="${depth===0?'totrow':''}" onclick="kbToggle('${attr(key)}')" style="cursor:pointer;">
          <td style="padding-left:${8+depth*20}px;">${twist(key, kids.length||props.length)}
            <b>${esc(a.label)}</b> <span class="muted" style="font-size:10.5px;">${esc(a.code)}</span></td>
          ${cells(arr)}</tr>`;
        if(depth===0) arr.forEach((v,i)=>{ grand[i]+=v; });
        if(KB_OPEN[key]){
          if(kids.length) walk(a.id, depth+1);
          else props.sort((x,y)=>kbSum(byCodeProp[a.code][y])-kbSum(byCodeProp[a.code][x])).forEach(pk=>{
            rows+=`<tr><td style="padding-left:${8+(depth+1)*20}px;" class="muted">
              <span class="kbtw" style="visibility:hidden;">▶</span>${esc(propName(pk))}
              ${pk!==KB_NOPROP?`<a class="pillbtn" style="margin-left:6px;" onclick="event.stopPropagation();propertyDetail('${attr(pk)}')">物件</a>`:''}</td>
              ${cellLinks(byCodeProp[a.code][pk], a.code, pk)}</tr>`;
          });
        }
      });
    };
    walk('',0);
    /* 木に入っていない科目（初期セット前・コードだけの行）も落とさない */
    const orphan=Object.keys(byCode).filter(c=>{ const a=accountByCode(c); return !a || (!a.parentId && accountChildren(a.id).length===0 && accTreeReady()); });
    if(orphan.length && accTreeReady()){
      const arr=sumCodes(orphan);
      rows+=`<tr class="grprow"><td colspan="14">分類に入っていない科目（勘定科目の登録で整理できます）</td></tr>
        <tr><td style="padding-left:28px;">${orphan.map(c=>esc(accountLabel(c))).join('、')}</td>${cells(arr)}</tr>`;
      arr.forEach((v,i)=>{ grand[i]+=v; });
    }
    if(!accTreeReady()){
      /* 階層をまだ作っていない環境: 科目をそのまま並べる（何も見えないより良い） */
      Object.keys(byCode).forEach(c=>{
        const arr=byCode[c];
        rows+=`<tr><td>${esc(accountLabel(c))} <span class="muted" style="font-size:10.5px;">${esc(c)}</span></td>${cells(arr)}</tr>`;
        arr.forEach((v,i)=>{ grand[i]+=v; });
      });
    }
  }else{
    Object.keys(byProp).sort((x,y)=>kbSum(byProp[y])-kbSum(byProp[x])).forEach(pk=>{
      const arr=byProp[pk], key='p:'+pk;
      rows+=`<tr class="totrow" onclick="kbToggle('${attr(key)}')" style="cursor:pointer;">
        <td>${twist(key,true)}<b>${esc(propName(pk))}</b>
          ${pk!==KB_NOPROP?`<a class="pillbtn" style="margin-left:6px;" onclick="event.stopPropagation();propertyDetail('${attr(pk)}')">物件</a>`:''}</td>
        ${cells(arr)}</tr>`;
      arr.forEach((v,i)=>{ grand[i]+=v; });
      if(KB_OPEN[key]){
        Object.keys(byPropCode[pk]).sort((x,y)=>kbSum(byPropCode[pk][y])-kbSum(byPropCode[pk][x])).forEach(c=>{
          rows+=`<tr><td style="padding-left:28px;" class="muted"><span class="kbtw" style="visibility:hidden;">▶</span>
            ${esc(accountPathLabel(c))}</td>${cellLinks(byPropCode[pk][c], c, pk)}</tr>`;
        });
      }
    });
  }

  const kinds=[['','すべて'],['revenue','収益'],['cogs','売上原価'],['sga','販管費'],['nonop','営業外']];
  const tools=`<div class="seg">
      <button class="${KB_AXIS==='account'?'on':''}" onclick="setKbAxis('account')">科目でまとめる</button>
      <button class="${KB_AXIS==='property'?'on':''}" onclick="setKbAxis('property')">建物でまとめる</button>
    </div>
    <select onchange="setKbKind(this.value)" style="margin-left:8px;">${kinds.map(k=>`<option value="${k[0]}" ${KB_KIND===k[0]?'selected':''}>${esc(k[1])}</option>`).join('')}</select>
    ${toolsMenu(`<button class="btn secondary" onclick="exportCsvKbunrui()">${IC.doc} CSV出力</button>
      <button class="btn secondary" onclick="window.print()">${IC.print} 印刷</button>
      <hr><button class="btn secondary" onclick="goto('accounts')">勘定科目の登録へ</button>`)}`;

  return pageShell({ title:'分類別集計', sub:`${fyLabel(fy)}・税抜。金額は予実と同じ伝票から数えています。`,
    tools,
    body:`<div class="table-wrap"><table class="stick1">
        <thead><tr><th style="min-width:270px;">${KB_AXIS==='account'?'勘定科目（大 › 中 › 小 › 建物）':'建物 › 勘定科目'}</th>
          ${FY_MONTH_LABELS.map((m,i)=>`<th class="r ${i===curIdx?'curcol':''}" style="min-width:92px;">${m}</th>`).join('')}
          <th class="r" style="min-width:110px;">年間計</th></tr></thead>
        <tbody>${rows || `<tr><td colspan="14" class="empty" style="padding:20px;">${fyLabel(fy)}に数字がありません。</td></tr>`}
          <tr class="totrow"><td><b>合計</b></td>${cells(grand)}</tr></tbody></table></div>
      <div class="fhelp" style="margin-top:8px;">行を押すと下の階層が開きます。いちばん下は <b>建物（物件）</b>です。
        金額を押すと、その月にその科目・その建物で動いた伝票が出ます。<br>
        建物は 費用管理の費目（または支払請求の明細）で選びます。選んでいないものは「${esc(KB_NOPROP)}」にまとまります。</div>` });
}
/** 金額の裏づけ: その月・その科目・その建物で動いた伝票を出す */
function kbDrill(code, propKey, monthIdx){
  const fy=CUR_FY;
  const lines=moneyLines(fy).filter(l=>String(l.code)===String(code) && l.i===Number(monthIdx)
    && String(l.propertyId||KB_NOPROP)===String(propKey));
  const total=lines.reduce((s,l)=>s+l.amount,0);
  const T={invoices:'請求書', bills:'支払請求', expenses:'費用', adjust:'実績調整'};
  openModal(`<h3>${esc(accountPathLabel(code))} ／ ${esc(propKey===KB_NOPROP?KB_NOPROP:((findById('properties',propKey)||{}).name||''))}</h3>
    <div class="mdsub">${esc(fyMonths(fy)[monthIdx])}（${esc(FY_MONTH_LABELS[monthIdx])}）の内訳。税抜。合計 <b class="num">${moneyPlain(total)}</b> 円</div>
    <div class="table-wrap"><table><thead><tr><th>種類</th><th>伝票</th><th class="r">金額（税抜）</th><th></th></tr></thead>
      <tbody>${lines.map(l=>`<tr><td><span class="badge ${l.src.t==='invoices'?'b-green':'b-blue'}">${esc(T[l.src.t]||l.src.t)}</span></td>
        <td>${esc(l.src.label)}</td><td class="r num">${moneyPlain(l.amount)}</td>
        <td>${['invoices','bills'].includes(l.src.t)?`<a class="pillbtn pill-save" onclick="closeModal();openDetail('${l.src.t}','${attr(l.src.id)}')">開く</a>`:''}</td></tr>`).join('')
        || '<tr><td colspan="4" class="empty">明細がありません。</td></tr>'}</tbody></table></div>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">閉じる</button></div>`,'lg');
}
function exportCsvKbunrui(){
  const fy=CUR_FY, months=fyMonths(fy);
  const lines=moneyLines(fy).filter(l=>!KB_KIND || l.kind===KB_KIND);
  const map={};
  lines.forEach(l=>{
    const path=accountPath(l.code).map(a=>a.label);
    const pk=l.propertyId||KB_NOPROP;
    const key=JSON.stringify([path[0]||'', path[1]||'', path[2]||'', accountLabel(l.code), pk]);
    if(!map[key]) map[key]=kbZero();
    map[key][l.i]+=l.amount;
  });
  const rows=[['大分類','中分類','小分類','科目','建物',...months,'年間計']];
  Object.keys(map).sort().forEach(key=>{
    const p=JSON.parse(key), a=map[key], pk=p[4];
    rows.push([p[0],p[1],p[2],p[3], pk===KB_NOPROP?KB_NOPROP:((findById('properties',pk)||{}).name||''), ...a, kbSum(a)]);
  });
  downloadCsv(`分類別集計_${fy}年度`, rows);
}

/* ============================================================================
   物件（建物）管理 — 借りている建物ごとに、契約と毎月のお金をまとめて見る
   ----------------------------------------------------------------------------
   利用者の指示（2026-09-13）:「家賃・電気・水道…を、借りている建物ごとに
   きちんと管理したい。そこもタイムラインで見たい」

   考え方:
     ・物件は「契約の器」。貸主（＝支払先）・期間・家賃・共益費・駐車場代を持つ
     ・毎月の実際の金額は 費目マスタ（月次費用表）から来る。費目に物件を紐づけると
       この画面に集まる。金額の出どころを二重に持たない（公式 §0.3）
     ・契約満了が近い物件はベルと画面で先に言う。更新の交渉には時間が要るため
   ========================================================================== */
/** 物件 × 12か月（税込）。費目（月次費用表）の行を物件ごとに束ねたもの。 */
function propRowsOf(fy){
  const months = fyMonths(fy);
  const all = costRowsOf(fy).rows;
  const props = (DB.properties||[]).slice().sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'ja'));
  const rows = props.map(pr=>{
    const items = all.filter(r=>String(r.it.propertyId||'')===String(pr.id));
    const cells = months.map((m,i)=>items.reduce((s,r)=>s+(r.cells[i]||0),0));
    return { pr, items, cells, plan:num(pr.rent)+num(pr.kyoeki)+num(pr.parking) };
  });
  /* 物件に紐づいていない費目は「物件なし」で1行にまとめる（隠すと合わなくなる） */
  const orphan = all.filter(r=>!r.it.propertyId);
  return { months, rows, orphan, orphanCells: months.map((m,i)=>orphan.reduce((s,r)=>s+(r.cells[i]||0),0)) };
}
/** 契約満了まで何日か。契約満了が空なら null（＝期限なし・自動更新） */
function propDaysLeft(pr){
  if(!pr || !pr.contractEnd) return null;
  return daysBetween(today(), String(pr.contractEnd).slice(0,10));
}
function propEndBadge(pr){
  const d=propDaysLeft(pr);
  if(d===null) return '<span class="muted" style="font-size:11.5px;">期限なし</span>';
  if(d<0)  return `<span class="badge b-red">満了済み（${-d}日前）</span>`;
  if(d<=PROP_ALERT_DAYS) return `<span class="badge b-amber">あと${d}日</span>`;
  return `<span class="muted" style="font-size:11.5px;">${esc(String(pr.contractEnd).slice(0,10))}</span>`;
}

function viewProperties(){
  const fy=CUR_FY;
  const { months, rows, orphan, orphanCells } = propRowsOf(fy);
  const cur=thisMonth(), curIdx = fyOf(cur)===fy ? fyIndexOf(cur) : -1;
  const canC=canCreate('properties');

  const soon=rows.filter(r=>{ const d=propDaysLeft(r.pr); return d!==null && d<=PROP_ALERT_DAYS; });
  const planTotal=rows.reduce((s,r)=>s+r.plan,0);
  const yearTotal=rows.reduce((s,r)=>s+r.cells.reduce((t,v)=>t+v,0),0);
  const monthNow=curIdx>=0? rows.reduce((s,r)=>s+(r.cells[curIdx]||0),0) : 0;

/* ============================================================================
   ⑪'' 買掛の自動作成（定期支払）と 債務年齢表
   ----------------------------------------------------------------------------
   利用者の指示（2026-09-13）:
     「費用は、ある会社に定期的に払うお金を管理するためのもの。
       だから新しい会社をその場で作れるようにしてほしい」
   そこで 費目マスタに【支払先（取引先）】と【払い方】を足しました。

     払い方 = 即払い … いままでどおり。月次費用表のマスに金額を打つ＝経費に入る。
                        買掛の残高は持たない（カード・口座振替など、その場で出ていくもの）
     払い方 = 買掛   … 毎月「支払請求」を作る。期日はその会社の締日・サイト・支払日から
                        自動で決まり、支払実行で消し込む。残高・年齢表・資金繰りに乗る。

   ★ 二重計上しないための決まり: 買掛の費目は expenses を作りません。
     金額は「その月の支払請求の明細」が唯一の出どころで、月次費用表はそれを読むだけ。
   ========================================================================== */
/** 買掛の費目 × 月 → その月の支払請求の明細（税込）。無ければ null。 */
function costBillCell(costItemId, ym){
  for(const b of (DB.bills||[])){
    if(!b || b.status==='取消') continue;
    if((b.bookMonth||'').slice(0,7)!==ym) continue;
    const it=(b.items||[]).find(x=>x && String(x.costItemId)===String(costItemId));
    if(it){
      const net=itemAmount(it), rate=TAX_RATE[it.taxCat||'課税10%']||0;
      return { bill:b, item:it, gross: net+Math.floor(net*rate) };
    }
  }
  return null;
}
/** その会社に、その月の「定期支払」の支払請求を作る材料を集める */
function apPlanFor(ym){
  const byCo={};
  costItemsSorted().forEach(it=>{
    if(!isApCost(it)) return;
    if(!it.companyId) return;                       // 支払先が無いと期日が決まらない
    if(!costItemActive(it, ym)) return;
    const gross=num(it.monthly); if(!gross) return;
    const c=findById('companies', it.companyId); if(!c) return;
    const k=String(it.companyId);
    if(!byCo[k]) byCo[k]={ company:c, items:[], already:false };
    if(costBillCell(it.id, ym)) byCo[k].already=true;   // もう作ってある
    else byCo[k].items.push({ accountCode:it.accountCode||'', name:it.name||'',
      amount: netOfGross(gross, it.taxCat), taxCat: it.taxCat||'課税10%', costItemId:String(it.id) });
  });
  return Object.values(byCo);
}

/** 実際に作るところ。画面（チェックボックス）から切り離してあるのでテストできる。 */
function apCreateBills(ym, plans){
  let n=0;
  (plans||[]).forEach(p=>{
    if(!p.items.length) return;
    const rec={ companyId:p.company.id, bookMonth:ym, recvDate:'', status:'作成中',
      items:p.items, note:'自動作成（定期支払・費目マスタ）' };
    prepareDoc('bills', rec, null);
    /* 期日はその会社の条件から。会社ごとに違うので、ここで固定の日数を使ってはいけない。 */
    rec.dueDate = dueDateOf(ym, p.company.closingDay, p.company.paySite, p.company.payDay);
    commitRecord('bills', rec, {}); n++;
  });
  return n;
}
function genBillsGo(){
  if(!GENB_CTX||!GENB_CTX.plan.length){ toast('作成する対象がありません。','err'); return; }
  const picked=[...document.querySelectorAll('.genbck:checked')].map(c=>GENB_CTX.plan[Number(c.dataset.i)]);
  if(!picked.length){ toast('対象を選んでください。','err'); return; }
  const n=apCreateBills(GENB_CTX.ym, picked);
  closeModal(); renderPage(CURRENT_PAGE); toast(`${n}件の支払請求（作成中）を作成しました。`,'ok');
}

/* ============================================================================
   ⑪' 取引先台帳 — 1社のお金の出入りを「通帳」と「12か月の帯」で見る
   ----------------------------------------------------------------------------
   なぜ要るのか（2026-09-13 利用者の指示）:
     請求管理・入金消込は「伝票の一覧」なので、「この会社とは今どうなっているか」が
     一目で分からない。会社を軸に、請求と入金を1本の時間順に並べ、
     さらに12か月の帯で「期日どおり払う会社か」を色で見せる。

   ★ 期日は会社ごとに違う（末日締・翌月末払い／20日締・翌々月25日払い…）。
     だから「計上からの日数」では絶対に色を付けない。必ず その伝票の入金期日
     （＝その会社の締日・サイト・支払日から計算された日）と比べる。
     翌々月25日払いの会社は、85日かかっても「期日内」。
   ★ 残高はどこで見ても同じ数字にする（売掛残高＝未回収の請求の合計）。
     入ったが消し込んでいないお金は残高から引かず、別に注意として出す。
   ========================================================================== */
const LED_LATE_WARN = 30;          // これを超える遅れは赤（それ以下は黄）
let LED_CO=null, LED_TAB='history', LED_SIDE='ar';

/** 債権（売掛）と債務（買掛）で同じ画面を使うための言い換え表。ここだけ見れば違いが分かる。 */
function ledS(side){
  return side==='ap' ? {
    side:'ap', title:'支払（買掛金）', docLabel:'支払請求', payLabel:'支払', balLabel:'買掛残高',
    dueLabel:'支払期日', docAmtLabel:'請求された額', payAmtLabel:'支払額',
    docs: id=>(DB.bills||[]).filter(b=>String(b.companyId)===String(id)),
    pays: id=>(DB.payouts||[]).filter(p=>String(p.companyId)===String(id)),
    docDate: b=> b.recvDate || (b.bookMonth? monthEnd(b.bookMonth):''),
    total: docTotal, paid: b=>paidOfBill(b), bal: b=>balanceOfBill(b), status: b=>billStatus(b),
    balOf: id=>apBalanceOf(id), payBtn: id=>`openPayoutFor('${id}')`, payPage:'payouts',
    unapplied: id=>(DB.payouts||[]).filter(p=>p.status!=='取消'&&String(p.companyId)===String(id))
      .reduce((s,p)=>s+Math.max(0,num(p.amount)-(p.allocations||[]).reduce((t,a)=>t+num(a.amount),0)),0),
  } : {
    side:'ar', title:'請求・入金（売掛金）', docLabel:'請求書', payLabel:'入金', balLabel:'売掛残高',
    dueLabel:'入金期日', docAmtLabel:'請求額', payAmtLabel:'入金額',
    docs: id=>(DB.invoices||[]).filter(i=>String(i.companyId)===String(id)),
    pays: id=>(DB.payments||[]).filter(p=>String(p.companyId)===String(id)),
    docDate: i=> i.issueDate || (i.bookMonth? monthEnd(i.bookMonth):''),
    total: docTotal, paid: i=>paidOfInvoice(i), bal: i=>balanceOfInvoice(i), status: i=>invoiceStatus(i),
    balOf: id=>arBalanceOf(id), payBtn: id=>`openPaymentFor('${id}')`, payPage:'receipts',
    unapplied: id=>(DB.payments||[]).filter(p=>p.status!=='取消'&&String(p.companyId)===String(id))
      .reduce((s,p)=>s+Math.max(0,num(p.amount)-(p.allocations||[]).reduce((t,a)=>t+num(a.amount),0)),0),
  };
}
/** その伝票に充てられた入金（支払）を古い順に。1回の振込が複数の伝票に分かれることがある。 */
function ledAllocs(side, docId){
  const src = side==='ap' ? (DB.payouts||[]) : (DB.payments||[]);
  const key = side==='ap' ? 'billId' : 'invoiceId';
  const out=[];
  src.forEach(p=>{ if(p.status==='取消') return;
    (p.allocations||[]).forEach(a=>{ if(String(a[key])===String(docId)) out.push({date:p.date||'', amount:num(a.amount), pid:p.id, method:p.method||''}); }); });
  return out.sort((x,y)=>String(x.date).localeCompare(String(y.date)));
}
/** 残高が0になった日＝「払い終わった日」。これと期日を比べて遅れを測る。 */
function ledSettleDate(side, doc){
  const S=ledS(side), total=S.total(doc);
  if(total<=0) return null;
  let s=0;
  for(const a of ledAllocs(side, doc.id)){ s+=a.amount; if(s>=total) return a.date||null; }
  return null;
}
/** 1枚の伝票の「払われ方」。days は期日から何日遅れたか（マイナスは前倒し）。 */
function ledLate(side, doc){
  const S=ledS(side), due=doc.dueDate||'', bal=S.bal(doc), settle=ledSettleDate(side,doc);
  if(bal<0) return {state:'over', days:0, settle};                       // 過入金
  if(settle) return {state:'paid', days: due? daysBetween(due,settle):0, settle};
  if(!due)   return {state:'open', days:0, settle:null};
  const d=daysBetween(due, today());
  return {state: d>0?'late':'notyet', days: Math.max(0,d), settle:null};
}
function ledColor(x){
  if(x.state==='over') return 'lg-over';
  if(x.state==='notyet'||x.state==='open') return 'lg-wait';
  if(x.days<=0) return 'lg-ok';
  return x.days<=LED_LATE_WARN ? 'lg-warn' : 'lg-bad';
}
function ledLateText(x){
  if(x.state==='over')   return '<span class="badge b-purple">過入金</span>';
  if(x.state==='open')   return '<span class="badge b-gray">期日なし</span>';
  if(x.state==='notyet') return '<span class="badge b-gray">未到来</span>';
  if(x.state==='late')   return `<span class="badge ${x.days<=LED_LATE_WARN?'b-amber':'b-red'}">${x.days}日 超過中</span>`;
  if(x.days<=0)          return `<span class="badge b-green">期日内${x.days<0?`（${-x.days}日前）`:''}</span>`;
  return `<span class="badge ${x.days<=LED_LATE_WARN?'b-amber':'b-red'}">${x.days}日 遅れ</span>`;
}

/** 支払いぶり。閉じた（払い終わった）伝票だけで数える。fy を渡すとその年度だけ。 */
function ledPerf(companyId, side, fy){
  const S=ledS(side);
  let n=0, onTime=0, late=0, lateSum=0, worst=0, openOver=0, openOverAmt=0;
  S.docs(companyId).forEach(d=>{
    if(d.status==='取消'||d.status==='作成中') return;
    if(fy!=null && fyOf((d.bookMonth||'').slice(0,7))!==Number(fy)) return;
    const x=ledLate(side,d);
    if(x.state==='paid'||x.state==='over'){
      n++;
      if(x.days<=0) onTime++; else { late++; lateSum+=x.days; worst=Math.max(worst,x.days); }
    }else if(x.state==='late'){ openOver++; openOverAmt+=S.bal(d); worst=Math.max(worst,x.days); }
  });
  return { n, onTime, late, rate: n? Math.round(onTime/n*1000)/10 : null,
    avgLate: late? Math.round(lateSum/late) : 0, worst, openOver, openOverAmt };
}
/** 一覧に出す小さな札。「この会社は期日を守るか」を1目盛りで。 */
function ledPerfBadge(companyId, side){
  const p=ledPerf(companyId, side==='ap'?'ap':'ar', null);
  if(!p.n && !p.openOver) return '<span class="zero">—</span>';
  if(!p.n) return `<span class="badge b-red">${p.openOver}件 超過中</span>`;
  const cls = p.rate>=95?'b-green' : (p.rate>=80?'b-amber':'b-red');
  return `<span class="badge ${cls}">期日内 ${p.rate}%</span>`
    + (p.avgLate? `<div class="muted" style="font-size:10.5px;">平均 ${p.avgLate}日遅れ</div>`:'')
    + (p.openOver? `<div style="font-size:10.5px;color:var(--danger);">超過中 ${p.openOver}件</div>`:'');
}

      <div class="sub">色はこの期日と比べて付けています</div></div>

      <div class="sub">${perf.n?`${perf.onTime}/${perf.n}件${perf.avgLate?` ・ 遅れた分は平均${perf.avgLate}日`:''}`:'完了した伝票がまだありません'}</div></div>

/** 出来事を時間順に1本へ。伝票＝残高が増える、入金＝消し込んだぶん減る。 */
function ledEvents(companyId, side){
  const S=ledS(side), ev=[];
  S.docs(companyId).forEach(d=>{
    if(d.status==='取消'||d.status==='作成中') return;
    ev.push({ kind:'doc', date:S.docDate(d)||'', doc:d, amount:S.total(d) });
  });
  S.pays(companyId).forEach(p=>{
    if(p.status==='取消') return;
    const alloc=(p.allocations||[]).reduce((s,a)=>s+num(a.amount),0);
    ev.push({ kind:'pay', date:p.date||'', pay:p, amount:num(p.amount), alloc, fee:num(p.fee) });
  });
  /* 同じ日なら 伝票 → 入金 の順（その日の残高の動きが読める順） */
  ev.sort((a,b)=> String(a.date).localeCompare(String(b.date)) || (a.kind==='doc'?-1:1));
  let bal=0;
  ev.forEach(e=>{ bal += e.kind==='doc' ? e.amount : -e.alloc; e.bal=bal; });
  return ev;
}

function ledHistoryHtml(c, side, fy){
  const S=ledS(side);
  const all=ledEvents(c.id, side);
  const months=fyMonths(fy), from=months[0]+'-01', to=monthEnd(months[11]);
  const inFy=all.filter(e=>e.date>=from && e.date<=to);
  const before=all.filter(e=>e.date<from);
  const carry = before.length? before[before.length-1].bal : 0;

  const rows = inFy.slice().reverse().map(e=>{
    if(e.kind==='doc'){
      const d=e.doc, x=ledLate(side,d), bal=S.bal(d);
      return `<tr onclick="openDetail('${side==='ap'?'bills':'invoices'}','${d.id}')" style="cursor:pointer;">
        <td>${esc(e.date)}</td>
        <td><span class="badge b-blue">${esc(S.docLabel)}</span></td>
        <td><b>${esc(d.no||'')}</b>${d.bookMonth?`<div class="muted" style="font-size:10.5px;">計上 ${esc(d.bookMonth)}</div>`:''}</td>
        <td class="r num"><b>${moneyPlain(e.amount)}</b></td>
        <td class="r"><span class="zero">—</span></td>
        <td class="r num">${moneyPlain(e.bal)}</td>
        <td>${esc(d.dueDate||'—')}</td>
        <td>${ledLateText(x)}</td>
        <td>${bal>0&&canEdit(S.payPage)?`<a class="pillbtn pill-save" onclick="event.stopPropagation();${S.payBtn(d.id)}">${esc(S.payLabel)}</a>`:''}</td></tr>`;
    }
    const p=e.pay, rest=e.amount-e.alloc;
    const to2=(p.allocations||[]).map(a=>{
      const d=findById(side==='ap'?'bills':'invoices', side==='ap'?a.billId:a.invoiceId);
      return d? esc(d.no||'') : '—'; }).join('、');
    return `<tr onclick="${side==='ap'?`openPayout('${p.id}')`:`openPayment('${p.id}')`}" style="cursor:pointer;">
      <td>${esc(e.date)}</td>
      <td><span class="badge b-green">${esc(S.payLabel)}</span></td>
      <td class="muted" style="font-size:11.5px;">${to2||'<span class="badge b-amber">未消込</span>'}${e.fee?`<div class="muted" style="font-size:10.5px;">手数料 ${moneyPlain(e.fee)}</div>`:''}</td>
      <td class="r"><span class="zero">—</span></td>
      <td class="r num plus"><b>${moneyPlain(e.amount)}</b>${rest?`<div style="font-size:10.5px;color:var(--warning);">うち未消込 ${moneyPlain(rest)}</div>`:''}</td>
      <td class="r num">${moneyPlain(e.bal)}</td>
      <td>${esc(p.method||'')}</td><td></td><td></td></tr>`;
  }).join('');

  const sumDoc=inFy.filter(e=>e.kind==='doc').reduce((s,e)=>s+e.amount,0);
  const sumPay=inFy.filter(e=>e.kind==='pay').reduce((s,e)=>s+e.amount,0);

  return `<div class="table-wrap"><table>
      <thead><tr><th style="min-width:96px;">日付</th><th style="min-width:80px;">種類</th><th style="min-width:150px;">番号・内容</th>
        <th class="r" style="min-width:104px;">${esc(S.docAmtLabel)}</th><th class="r" style="min-width:104px;">${esc(S.payAmtLabel)}</th>
        <th class="r" style="min-width:104px;">残高</th><th style="min-width:96px;">${esc(S.dueLabel)}</th><th style="min-width:110px;">期日との差</th><th></th></tr></thead>
      <tbody>
        ${rows || `<tr><td colspan="9" class="empty" style="padding:20px;">${fyLabel(fy)}には動きがありません。年度を切り替えてみてください。</td></tr>`}
        <tr class="totrow"><td>${esc(months[0])} 時点の繰越</td><td></td><td></td><td></td><td></td>
          <td class="r num">${moneyPlain(carry)}</td><td></td><td></td><td></td></tr>
        <tr class="totrow"><td><b>${fyLabel(fy)} 合計</b></td><td></td><td></td>
          <td class="r num">${moneyPlain(sumDoc)}</td><td class="r num plus">${moneyPlain(sumPay)}</td>
          <td class="r num"><b>${moneyPlain(inFy.length? inFy[inFy.length-1].bal : carry)}</b></td><td></td><td></td><td></td></tr>
      </tbody></table></div>
    <div class="fhelp" style="margin-top:8px;">残高は「まだ${side==='ap'?'払っていない':'回収できていない'}${esc(S.docLabel)}の合計」です。${esc(S.payLabel)}のうち、まだどの${esc(S.docLabel)}にも結び付けていないぶんは引いていません（上に注意が出ます）。</div>`;
}

function ledTimelineHtml(c, side, fy){
  const S=ledS(side), months=fyMonths(fy), idx={}; months.forEach((m,i)=>{ idx[m]=i; });
  const curYm=thisMonth(), curIdx = fyOf(curYm)===fy ? fyIndexOf(curYm) : -1;

  /* ---- 上の3行: 月ごとの合計 ---- */
  const docSum=Array(12).fill(0), paySum=Array(12).fill(0);
  S.docs(c.id).forEach(d=>{
    if(d.status==='取消'||d.status==='作成中') return;
    const i=idx[(d.bookMonth||'').slice(0,7)]; if(i!=null) docSum[i]+=S.total(d);
  });
  S.pays(c.id).forEach(p=>{
    if(p.status==='取消') return;
    const i=idx[String(p.date||'').slice(0,7)]; if(i!=null) paySum[i]+=num(p.amount);
  });
  /* 月末残高は「その月末までの出来事」を積んだもの（通帳と同じ数え方） */
  const ev=ledEvents(c.id, side), balEnd=Array(12).fill(0);
  months.forEach((m,i)=>{
    const end=monthEnd(m);
    const upto=ev.filter(e=>e.date<=end);
    balEnd[i] = upto.length? upto[upto.length-1].bal : (i>0? balEnd[i-1] : 0);
  });

  /* ---- 帯: 伝票1枚 = 1行 ---- */
  const docs=S.docs(c.id).filter(d=>d.status!=='取消'&&d.status!=='作成中'&&idx[(d.bookMonth||'').slice(0,7)]!=null)
    .sort((a,b)=>String(a.bookMonth||'').localeCompare(String(b.bookMonth||'')));

  const barRow = d => {
    const s=idx[(d.bookMonth||'').slice(0,7)];
    const x=ledLate(side,d), cls=ledColor(x);
    const settleIdx = x.settle!=null && idx[String(x.settle).slice(0,7)]!=null ? idx[String(x.settle).slice(0,7)] : null;
    const dueIdx = d.dueDate && idx[String(d.dueDate).slice(0,7)]!=null ? idx[String(d.dueDate).slice(0,7)] : null;
    /* 終わり: 払い終わった月。まだなら 今月（過去年度なら12月目）まで伸ばす */
    let e = settleIdx!=null ? settleIdx : (curIdx>=0? curIdx : 11);
    if(x.settle && settleIdx==null) e=11;                 // 翌年度に払い終わった → 端まで
    if(e<s) e=s;
    const cells=months.map((m,i)=>{
      const on = i>=s && i<=e;
      const isDue = dueIdx===i, isEnd = settleIdx===i;
      return `<td class="r lgcell ${i===curIdx?'curcol':''}">${on?`<span class="lgbar ${cls} ${isDue?'lgdue':''}"></span>`:(isDue?'<span class="lgbar lg-none lgdue"></span>':'')}
        ${isEnd?'<div class="lgdot">●</div>':''}${isDue&&!isEnd?'<div class="lgdot muted">期日</div>':''}</td>`;
    }).join('');
    return `<tr onclick="openDetail('${side==='ap'?'bills':'invoices'}','${d.id}')" style="cursor:pointer;">
      <td><b>${esc(d.no||'')}</b><div class="muted" style="font-size:10.5px;">計上 ${esc(d.bookMonth||'')} ／ 期日 ${esc(d.dueDate||'—')}</div></td>
      ${cells}
      <td class="r num">${moneyPlain(S.total(d))}</td>
      <td class="r num">${S.bal(d)>0?`<b class="minus">${moneyPlain(S.bal(d))}</b>`:'<span class="zero">0</span>'}</td>
      <td>${ledLateText(x)}</td></tr>`;
  };

  const sumRow=(label,arr,cls)=>`<tr class="totrow"><td>${esc(label)}</td>
    ${arr.map((v,i)=>`<td class="r num ${i===curIdx?'curcol':''} ${cls||''}">${v?moneyPlain(v):'<span class="zero">—</span>'}</td>`).join('')}
    <td class="r num">${moneyPlain(arr.reduce((s,v)=>s+v,0))}</td><td></td><td></td></tr>`;

/** 履歴をCSVに（いま見えている年度・いまの側） */
function exportCsvLedger(){
  const c=LED_CO?findById('companies',LED_CO):null; if(!c) return;
  const S=ledS(LED_SIDE), months=fyMonths(CUR_FY), from=months[0]+'-01', to=monthEnd(months[11]);
  const rows=[['日付','種類','番号・内容',S.docAmtLabel,S.payAmtLabel,'残高',S.dueLabel,'期日との差']];
  ledEvents(c.id, LED_SIDE).filter(e=>e.date>=from&&e.date<=to).forEach(e=>{
    if(e.kind==='doc'){
      const x=ledLate(LED_SIDE,e.doc);
      rows.push([e.date, S.docLabel, e.doc.no||'', e.amount, '', e.bal, e.doc.dueDate||'',
        x.state==='paid'? (x.days<=0?'期日内':x.days+'日遅れ') : (x.state==='late'? x.days+'日超過中':'')]);
    }else{
      rows.push([e.date, S.payLabel, (e.pay.allocations||[]).length?'消込あり':'未消込', '', e.amount, e.bal, '', '']);
    }
  });
  downloadCsv(`${(c.name||'取引先').replace(/[\\/:*?"<>|]/g,'')}_${CUR_FY}年度_${LED_SIDE==='ap'?'支払':'請求入金'}`, rows);
}

/* ============================================================================
   マスタ系の画面
   ========================================================================== */
/* ============================================================================
   ⑬ 費用管理 — 月次費用表（表は1枚だけ）
   ----------------------------------------------------------------------------
   ★ 考え方（2026-09-05 決定）:
     ・領収書を1枚ずつ入力する台帳ではない。正しい数字は会計事務所が持っている。
     ・この画面の目的はただ一つ —「毎月かかる費用が、いくらで、増えていないか」。
     ・だから 費目（行）× 月（列）の1枚の表。マスに税込金額を直接打つだけ。
     ・1マス ＝ expenses の1行（costItemId ＋ bookMonth）。だから予実の計算は
       今までのまま動く（actualSeries が expenses を税抜に直して費用に入れる）。
   ========================================================================== */
const COST_DIFF_PCT = 0.10;      // 月額予定からこれ以上ズレたらマスに色を付ける

/** 表に出す費目（定期が先・科目順）。active===false は出さない。 */
function costItemsSorted(){
  return (DB.costItems||[]).filter(c=>c && c.active!==false).slice().sort((a,b)=>
    ((a.kind==='variable')-(b.kind==='variable')) ||
    String(a.accountCode||'').localeCompare(String(b.accountCode||'')) ||
    String(a.name||'').localeCompare(String(b.name||''),'ja'));
}
/** その費目がその月に生きているか（開始月・終了月） */
function costItemActive(it, ym){
  if(!it) return false;
  if(it.startYm && ym < String(it.startYm).slice(0,7)) return false;
  if(it.endYm   && ym > String(it.endYm).slice(0,7))   return false;
  return true;
}
/** 表の1マスに対応する expenses の行 */
function costCell(costItemId, ym){
  return (DB.expenses||[]).find(e=>e && String(e.costItemId)===String(costItemId)
    && (e.bookMonth||'').slice(0,7)===ym) || null;
}
function costCellAmount(costItemId, ym){ const r=costCell(costItemId,ym); return r? num(r.amount) : 0; }
/** 税込 → 税抜（actualSeries と同じ式でなければ予実とズレる） */
function netOfGross(gross, taxCat){
  return Math.round(num(gross)/(1+(TAX_RATE[taxCat||'課税10%']||0)));
}
/** マスに書き込む。空欄・0 にすると行ごと消す（残すと「0円の費用」が残ってしまう）。 */
function setCostCell(costItemId, ym, amount){
  const it = findById('costItems', costItemId); if(!it) return;
  /* 買掛の費目は支払請求が唯一の入口。ここで経費も作ると、予実に二重に乗る。 */
  if(isApCost(it)){ toast('この費目は「買掛」です。金額は支払請求（支払管理）で直します。','err'); return; }
  const v = num(amount);
  const r = costCell(costItemId, ym);
  if(!r){
    if(!v) return;
    commitRecord('expenses', { costItemId:String(costItemId), bookMonth:ym, date:'',
      accountCode:it.accountCode||'', vendor:it.vendor||'', amount:v,
      taxCat:it.taxCat||'課税10%', method:it.method||'', note:it.name||'' }, {});
    return;
  }
  if(!v){ DB.expenses=(DB.expenses||[]).filter(x=>String(x.id)!==String(r.id)); markDeleted('expenses', r.id); return; }
  r.amount=v;
  r.accountCode=it.accountCode||r.accountCode;
  r.taxCat=it.taxCat||r.taxCat||'課税10%';
  r.vendor=it.vendor||r.vendor||'';
  r.note=it.name||r.note||'';
  r.updatedAt=new Date().toISOString(); r.updatedBy=(SESSION&&SESSION.email)||'';
  markDirty('expenses', r);
}
function onCostInput(el, costItemId, mi){
  fmtMoneyInput(el); el.classList.add('dirty');
  clearTimeout(el._t);
  el._t = setTimeout(()=>{
    setCostCell(costItemId, fyMonths(CUR_FY)[mi], el.value);
    el.classList.remove('dirty'); syncBadge(); costRerenderSoon();
  }, 500);
}
/** 合計を描き直す。ただし入力中は待つ — 打っている最中に画面が入れ替わるのが一番困る。 */
let _costRT=null;
function costRerenderSoon(){
  clearTimeout(_costRT);
  _costRT = setTimeout(()=>{
    const a = document.activeElement;
    if(a && a.classList && a.classList.contains && a.classList.contains('cellin')) return costRerenderSoon();
    if(CURRENT_PAGE==='expenses') renderPage('expenses');
  }, 900);
}

/** 費目 × 12か月（税込）。期間外のマスは null。 */
function costRowsOf(fy){
  const months = fyMonths(fy);
  const rows = costItemsSorted().map(it=>{
    const ap = isApCost(it);
    return {
      it, ap,
      kind: it.kind==='variable'?'variable':'fixed',
      /* 買掛の費目は expenses を持たない。金額の出どころは「その月の支払請求の明細」だけ
         （二重計上を防ぐため）。だから表はそれを読むだけで、打ち込みはできない。 */
      cells: months.map(ym => !costItemActive(it,ym) ? null
        : (ap ? ((costBillCell(it.id,ym)||{}).gross || 0) : costCellAmount(it.id,ym))),
      bills: ap ? months.map(ym => costBillCell(it.id,ym)) : null,
    };
  });
  return { months, rows };
}
/** 費目のない経費（過去の個別入力・CSV取込）。隠さずに1行にまとめて出す。 */
function costOtherByMonth(fy){
  const months=fyMonths(fy), idx={}; months.forEach((m,i)=>idx[m]=i);
  const gross=Array(12).fill(0), net=Array(12).fill(0); let n=0;
  (DB.expenses||[]).forEach(e=>{
    if(!e || e.costItemId) return;
    const i=idx[(e.bookMonth||e.date||'').slice(0,7)]; if(i==null) return;
    gross[i]+=num(e.amount); net[i]+=netOfGross(e.amount, e.taxCat); n++;
  });
  return { gross, net, n };
}

function viewExpenses(){
  const fy=CUR_FY, months=fyMonths(fy);
  const { rows } = costRowsOf(fy);
  const other = costOtherByMonth(fy);
  const canE = canEdit('expenses');
  const cur = thisMonth();
  const curIdx = fyOf(cur)===fy ? fyIndexOf(cur) : -1;
  const fixed = rows.filter(r=>r.kind==='fixed'), varia = rows.filter(r=>r.kind==='variable');

  /* ---- 月別の合計 ---- */
  const totGross=Array(12).fill(0), totNet=Array(12).fill(0);
  rows.forEach(r=>r.cells.forEach((v,i)=>{ if(!v) return; totGross[i]+=v; totNet[i]+=netOfGross(v, r.it.taxCat); }));
  for(let i=0;i<12;i++){ totGross[i]+=other.gross[i]; totNet[i]+=other.net[i]; }
  const totTax = totGross.map((v,i)=>v-totNet[i]);

  const arrOf  = list => { const a=Array(12).fill(0); list.forEach(r=>r.cells.forEach((v,i)=>{ if(v) a[i]+=v; })); return a; };
  const planOf = list => list.reduce((s,r)=>s+num(r.it.monthly),0);
  /** 平均は「数字が入っている月」だけで割る。12で割ると、期の途中では必ず小さく出てしまう
      （2か月しか実績が無い家賃が 43,083円/月 に見える。実際は 258,500円/月）。 */
  const avgOf  = arr => { const n=arr.filter(v=>v).length;
    return n? moneyPlain(Math.round(arr.reduce((s,v)=>s+v,0)/n)) : '<span class="zero">—</span>'; };

  /* ---- KPI ---- */
  const kCur  = curIdx>=0? totGross[curIdx] : 0;
  const kPrev = curIdx>0 ? totGross[curIdx-1] : 0;
  const planNow = curIdx>=0 ? fixed.filter(r=>r.cells[curIdx]!=null).reduce((s,r)=>s+num(r.it.monthly),0) : planOf(fixed);
  const actNow  = curIdx>=0 ? fixed.reduce((s,r)=>s+(r.cells[curIdx]||0),0) : 0;
  const missing = curIdx>=0 ? fixed.filter(r=>r.cells[curIdx]!=null && !r.cells[curIdx] && num(r.it.monthly)) : [];

  const kpis=`<div class="kpi-grid">
    <div class="kpi"><div class="lbl">今月の費用（税込）</div><div class="num">${moneyPlain(kCur)}</div>
      <div class="sub">前月比 ${kPrev?pct(kCur,kPrev,{reverse:true}):'<span class="zero">—</span>'}</div></div>
    <div class="kpi"><div class="lbl">定期費用 月額予定</div><div class="num">${moneyPlain(planNow)}</div>
      <div class="sub">${fixed.length}費目</div></div>
    <div class="kpi"><div class="lbl">今月 定期の実績</div><div class="num ${actNow>planNow&&planNow?'minus':''}">${moneyPlain(actNow)}</div>
      <div class="sub">予定との差 ${planNow?`<b class="${actNow-planNow>0?'minus':'plus'}">${actNow-planNow>0?'+':''}${moneyPlain(actNow-planNow)}</b>`:'—'}</div></div>
    <div class="kpi"><div class="lbl">年度累計（税抜）</div><div class="num">${moneyPlain(totNet.reduce((s,v)=>s+v,0))}</div>
      <div class="sub">この額が予実の費用に入ります</div></div>
  </div>`;

  const alert = missing.length? `<div class="alertbar">${IC.warn} ${FY_MONTH_LABELS[curIdx]}の定期費用が ${missing.length}件 未入力です（${missing.map(r=>esc(r.it.name)).join('、')}）。
    ${canE?`<button class="btn sm" style="background:#fff;color:var(--danger);border-color:currentColor;margin-left:auto;" onclick="costReflect()">月額予定で埋める</button>`:''}</div>` : '';

  /* ---- 表 ---- */
  const NCOL = 4+12+2;
  const grp = (label,hint) => `<tr class="grprow"><td colspan="${NCOL}">${esc(label)}${hint?` <span style="font-weight:400;">${esc(hint)}</span>`:''}</td></tr>`;

  const cellHtml = (r,i) => {
    const v = r.cells[i];
    if(v==null) return `<td class="r"><span class="zero">—</span></td>`;
    if(r.ap){
      const hit = r.bills && r.bills[i];
      if(!hit) return `<td class="r ${i===curIdx?'curcol':''}"><span class="zero">未作成</span></td>`;
      const bal = balanceOfBill(hit.bill);
      return `<td class="r num ${i===curIdx?'curcol':''}"><a onclick="openDetail('bills','${hit.bill.id}')"
        style="cursor:pointer;color:var(--primary);" title="支払請求 ${attr(hit.bill.no||'')}（${attr(billStatus(hit.bill))}）">${moneyPlain(hit.gross)}</a>
        ${bal>0?`<div class="lgdot" style="color:var(--warning);">未払</div>`:''}</td>`;
    }
    if(!canE) return `<td class="r num ${i===curIdx?'curcol':''}">${v?moneyPlain(v):'<span class="zero">—</span>'}</td>`;
    let cls='cellin';
    const plan=num(r.it.monthly);
    if(r.kind==='fixed' && plan && v){
      const d=(v-plan)/plan;
      if(d>=COST_DIFF_PCT) cls+=' over'; else if(d<=-COST_DIFF_PCT) cls+=' under';
    }
    return `<td class="r ${i===curIdx?'curcol':''}"><input class="${cls}" value="${v?moneyPlain(v):''}"
      inputmode="numeric" oninput="onCostInput(this,'${attr(r.it.id)}',${i})"></td>`;
  };

  const rowHtml = r => {
    const tot = r.cells.reduce((s,c)=>s+(c||0),0);
    const nMon = r.cells.filter(c=>c).length;
    return `<tr>
      <td><a onclick="openForm('costItems','${attr(r.it.id)}')" style="cursor:pointer;font-weight:600;">${esc(r.it.name||'(名称なし)')}</a>
        ${r.ap?' <span class="badge b-blue" title="毎月の支払請求で管理（期日・残高あり）">買掛</span>':''}
        ${r.it.companyId? `<div class="muted" style="font-size:11px;">${coLink(r.it.companyId,'ap')}</div>`
          : (r.it.vendor?`<div class="muted" style="font-size:11px;">${esc(r.it.vendor)}</div>`:'')}</td>
      <td class="muted" style="font-size:11.5px;">${esc(accountLabel(r.it.accountCode))}</td>
      <td class="muted" style="font-size:11.5px;">${esc(TAX_CATS.indexOf(r.it.taxCat)>=0?r.it.taxCat:'課税10%')}</td>
      <td class="r num muted">${num(r.it.monthly)?moneyPlain(r.it.monthly):'<span class="zero">—</span>'}</td>
      ${r.cells.map((_,i)=>cellHtml(r,i)).join('')}
      <td class="r num"><b>${moneyPlain(tot)}</b></td>
      <td class="r num muted">${nMon?moneyPlain(Math.round(tot/nMon)):'<span class="zero">—</span>'}</td></tr>`;
  };

  const sumRow = (label, arr, plan) => `<tr class="totrow">
    <td>${esc(label)}</td><td></td><td></td>
    <td class="r num">${plan?moneyPlain(plan):''}</td>
    ${arr.map((v,i)=>`<td class="r num ${i===curIdx?'curcol':''}">${v?moneyPlain(v):'<span class="zero">—</span>'}</td>`).join('')}
    <td class="r num">${moneyPlain(arr.reduce((s,v)=>s+v,0))}</td>
    <td class="r num">${avgOf(arr)}</td></tr>`;

  const otherRow = other.n? grp('個別入力（費目が未設定）','※ 過去に1件ずつ登録した分。費目を作って移すと、この表で管理できます。')+
    `<tr><td><b>費目なしの経費</b><div class="muted" style="font-size:11px;">${other.n}件</div></td><td></td><td></td>
      <td class="r"><span class="zero">—</span></td>
      ${other.gross.map((v,i)=>`<td class="r num ${i===curIdx?'curcol':''}">${v?`<a onclick="costOtherList(${i})" style="cursor:pointer;color:var(--primary);">${moneyPlain(v)}</a>`:'<span class="zero">—</span>'}</td>`).join('')}
      <td class="r num"><b>${moneyPlain(other.gross.reduce((s,v)=>s+v,0))}</b></td><td></td></tr>` : '';

  const empty = !rows.length && !other.n;
  const table = empty? `<div class="warnbar">まだ費目がありません。「＋ 費目を追加」から、毎月かかるもの（家賃・通信・リース・給与…）を登録してください。
      登録すると、この画面が12か月ぶんの入力表になります。</div>`
    : `<div class="table-wrap"><table class="stick1">
      <thead><tr>
        <th style="min-width:170px;">費目</th><th style="min-width:110px;">勘定科目</th><th style="min-width:78px;">税区分</th>
        <th class="r" style="min-width:92px;">月額予定</th>
        ${FY_MONTH_LABELS.map((m,i)=>`<th class="r ${i===curIdx?'curcol':''}" style="min-width:106px;">${m}</th>`).join('')}
        <th class="r" style="min-width:112px;">年間計</th>
        <th class="r" style="min-width:98px;" title="数字が入っている月だけで割った平均">月平均</th></tr></thead>
      <tbody>
        ${fixed.length? grp('定期費用（毎月かかるもの）','月額予定から10%以上ズレたマスに色が付きます')+fixed.map(rowHtml).join('')+sumRow('定期費用 計', arrOf(fixed), planOf(fixed)) : ''}
        ${varia.length? grp('変動費（月によって変わるもの）','')+varia.map(rowHtml).join('')+sumRow('変動費 計', arrOf(varia), 0) : ''}
        ${otherRow}
        <tr class="totrow"><td><b>合計（税込・実際に出ていくお金）</b></td><td></td><td></td><td class="r num">${moneyPlain(planOf(fixed))}</td>
          ${totGross.map((v,i)=>`<td class="r num ${i===curIdx?'curcol':''}">${v?moneyPlain(v):'<span class="zero">—</span>'}</td>`).join('')}
          <td class="r num">${moneyPlain(totGross.reduce((s,v)=>s+v,0))}</td>
          <td class="r num">${avgOf(totGross)}</td></tr>
        <tr><td class="muted">うち消費税</td><td></td><td></td><td></td>
          ${totTax.map(v=>`<td class="r num muted">${v?moneyPlain(v):'<span class="zero">—</span>'}</td>`).join('')}
          <td class="r num muted">${moneyPlain(totTax.reduce((s,v)=>s+v,0))}</td><td></td></tr>
        <tr class="totrow"><td><b>合計（税抜 → 予実の費用へ）</b></td><td></td><td></td><td></td>
          ${totNet.map(v=>`<td class="r num">${v?moneyPlain(v):'<span class="zero">—</span>'}</td>`).join('')}
          <td class="r num">${moneyPlain(totNet.reduce((s,v)=>s+v,0))}</td><td></td></tr>
      </tbody></table></div>`;

  const tools=`
    ${canCreate('expenses')?`<button class="btn" onclick="openForm('costItems',null,{kind:'fixed',taxCat:'課税10%',payMode:'即払い'})">＋ 費目を追加</button>`:''}
    ${canCreate('bills')&&costItemsSorted().some(isApCost)?`<button class="btn secondary" onclick="openGenBills()">定期の支払を作成（月まとめ）</button>`:''}
    ${canE&&fixed.length?`<button class="btn secondary" onclick="costReflect()">定期費用を反映</button>`:''}
    ${toolsMenu(`
      <button class="btn secondary" onclick="exportCsvCost()">${IC.doc} 月次費用表をCSV</button>
      <button class="btn secondary" onclick="exportCsvTable('expenses')">${IC.doc} 明細をCSV</button>
      <button class="btn secondary" onclick="window.print()">${IC.print} 印刷</button>
      <hr>
      ${canCreate('expenses')?`<button class="btn secondary" onclick="openForm('expenses',null,{date:today(),bookMonth:thisMonth()})">個別に経費を1件だけ登録</button>`:''}`)}`;

  return pageShell({ title:'費用管理（月次費用表）', count:rows.length,
    sub:'毎月かかる費用を1枚の表で見ます。金額は<b>税込</b>で入力（実際に出ていく額）。予実には自動で<b>税抜</b>で入ります。正式な決算数値は会計事務所の試算表が優先です。',
    tools, body: alert+kpis+table+
      `<div class="infobar" style="margin-top:10px;">マスに数字を打つだけで保存されます。費目名をクリックすると月額予定・支払先・契約期間を編集できます。</div>` });
}

/* ---- 費目が未設定の経費を見る（隠さない） ---- */
function costOtherList(mi){
  const ym=fyMonths(CUR_FY)[mi];
