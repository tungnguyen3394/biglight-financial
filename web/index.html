/* ============ 期間比較 — 「先月と比べて」「去年と比べて」「他の年と比べて」 ============ */
let CMP_KEY='revenue', CMP_IDX=null;
function setCmp(k){ CMP_KEY=k; renderPage('compare'); }
function setCmpIdx(i){ CMP_IDX=Number(i); renderPage('compare'); }

function viewCompare(){
  const fy=CUR_FY;
  const i = CMP_IDX==null? lastActualIdx(fy) : CMP_IDX;
  const cur=plBook(fy,'actual')[CMP_KEY], prev=plBook(fy-1,'actual')[CMP_KEY];
  const bud=plBook(fy,'budget')[CMP_KEY];
  const c=compareSeries(cur,prev,i);
  const rowsDef=[
    ['当月',            c.month,  '予算', bud[i]],
    ['前月比',          c.month,  '前月', c.prevMonth],
    ['前年同月比',      c.month,  '前年同月', c.lastYearMonth],
    ['四半期累計（QTD）', c.qtd,  '前四半期同期', c.prevQtd],
    ['四半期 前年比',    c.qtd,   '前年同四半期', c.lastYearQtd],
    ['半期累計',        c.htd,    '前半期同期', c.prevHtd],
    ['年度累計（YTD）',  c.ytd,   '前年同期', c.lastYearYtd],
    ['年度累計 予算比',  c.ytd,   '予算累計', sumRange(bud,0,i)],
  ];
  const cmpTable = `<div class="table-wrap"><table>
    <thead><tr><th>比較軸</th><th class="r">当期</th><th>比較対象</th><th class="r">対象値</th><th class="r">差額</th><th class="r">増減率</th></tr></thead>
    <tbody>${rowsDef.map(([lb,a,blb,b])=>`<tr>
      <td>${esc(lb)}</td><td class="r num"><b>${moneyPlain(a)}</b></td>
      <td class="muted">${esc(blb)}</td><td class="r num">${moneyPlain(b)}</td>
      <td class="r num ${a-b>0?'plus':(a-b<0?'minus':'zero')}">${a-b>0?'+':''}${moneyPlain(a-b)}</td>
      <td class="r">${pct(a,b)}</td></tr>`).join('')}</tbody></table></div>`;

  // 複数年の並列比較（過去の成績と比べる）
  const years = fyChoices().filter(y=>y<=fy).slice(0,5).sort((a,b)=>a-b);
  const yRows = years.map(y=>{
    const s=plBook(y,'actual')[CMP_KEY];
    const tot=sum12(s);
    return `<tr><td><b>${y}年度</b></td>
      ${s.map((v,k)=>`<td class="r num" style="${k===i?'background:var(--primary-soft);':''}">${money(v)}</td>`).join('')}
      <td class="r num"><b>${moneyPlain(tot)}</b></td></tr>`;
  }).join('');
  const maxTot = Math.max(...years.map(y=>Math.abs(sum12(plBook(y,'actual')[CMP_KEY]))),1);
  const bars = years.map(y=>{
    const t=sum12(plBook(y,'actual')[CMP_KEY]);
    return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;">
      <div style="width:76px;font-size:12px;" class="muted">${y}年度</div>
      <div class="bar" style="flex:1;height:16px;"><i style="width:${Math.abs(t)/maxTot*100}%;${t<0?'background:var(--red);':''}"></i></div>
      <div class="num" style="width:120px;text-align:right;font-size:12.5px;font-weight:600;">${moneyPlain(t)}</div></div>`;
  }).join('');

  const seg = `<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px;">
    <div class="seg">${['revenue','gross','operating','ordinary'].map(k=>{
      const lb={revenue:'売上高',gross:'売上総利益',operating:'営業利益',ordinary:'経常利益'}[k];
      return `<button class="${CMP_KEY===k?'on':''}" onclick="setCmp('${k}')">${lb}</button>`; }).join('')}</div>
    <select onchange="setCmpIdx(this.value)" style="padding:7px 10px;border:1px solid var(--border-strong);border-radius:8px;">
      ${FY_MONTH_LABELS.map((m,k)=>`<option value="${k}" ${k===i?'selected':''}>${m}を基準に比較</option>`).join('')}</select></div>`;

  return pageShell({ title:'期間比較', sub:fyLabel(fy),
    tools: toolsMenu(`<button class="btn secondary" onclick="window.print()">🖨 印刷</button>`),
    body: seg
      +`<div class="panel"><div class="panel-hd"><b>${esc({revenue:'売上高',gross:'売上総利益',operating:'営業利益',ordinary:'経常利益'}[CMP_KEY])}</b><span class="sub">${FY_MONTH_LABELS[i]} 時点</span></div><div class="panel-bd tight">${cmpTable}</div></div>`
      +`<div class="panel"><div class="panel-hd"><b>年度別の推移</b><span class="sub">過去の成績と並べて見る</span></div>
         <div class="panel-bd tight"><div class="table-wrap" style="border:0;"><table class="stick1">
           <thead><tr><th style="min-width:96px;">年度</th>${FY_MONTH_LABELS.map(m=>`<th class="r">${m}</th>`).join('')}<th class="r">年間</th></tr></thead>
           <tbody>${yRows}</tbody></table></div></div></div>`
      +`<div class="panel"><div class="panel-hd"><b>年間合計の比較</b></div><div class="panel-bd">${bars}</div></div>` });
}

function viewMikomi(){
  const fy=CUR_FY, i=lastActualIdx(fy);
  const act=plBook(fy,'actual'), bud=plBook(fy,'budget'), fc=plBook(fy,'forecast'), prev=plBook(fy-1,'actual');
  const keys=[['revenue','売上高'],['gross','売上総利益'],['sga','販管費'],['operating','営業利益'],['ordinary','経常利益']];
  const qBlocks = QUARTERS.map(q=>{
    const cols = [0,1,2].map(k=>q.s+k);
    return `<div class="panel"><div class="panel-hd"><b>${esc(q.label)}</b>
        <span class="sub">${cols.every(c=>c<=i)?'実績確定':'実績＋見込'}</span></div>
      <div class="panel-bd tight"><div class="table-wrap" style="border:0;"><table>
        <thead><tr><th style="min-width:120px;">科目</th>

          <th class="r">四半期計</th><th class="r">予算</th><th class="r">達成</th></tr></thead>
        <tbody>${keys.map(([k,lb])=>{
          const vals=cols.map(c=> c<=i? act[k][c] : (fc[k][c]||bud[k][c]));
          const t=vals.reduce((s,v)=>s+v,0), b=cols.reduce((s,c)=>s+bud[k][c],0);
          return `<tr><td>${esc(lb)}</td>${vals.map((v,x)=>`<td class="r num" style="${cols[x]<=i?'':'color:var(--plan);'}">${money(v)}</td>`).join('')}
            <td class="r num"><b>${moneyPlain(t)}</b></td><td class="r num">${moneyPlain(b)}</td>
            <td class="r">${b?`<span class="rate ${t>=b?'plus':'minus'}">${(t/b*100).toFixed(0)}%</span>`:'<span class="zero">—</span>'}</td></tr>`;
        }).join('')}</tbody></table></div></div></div>`;
  }).join('');

  const yearTable = `<div class="panel"><div class="panel-hd"><b>年間まとめ</b><span class="sub">当月・累計・年間見込 ×（予算・前年）</span></div>
    <div class="panel-bd tight"><div class="table-wrap" style="border:0;"><table>
      <thead><tr><th style="min-width:120px;">科目</th>
        <th class="r">当月<br><span class="muted" style="font-weight:400;">${FY_MONTH_LABELS[i]}</span></th>
        <th class="r">前年同月</th><th class="r">前年比</th>
        <th class="r">累計</th><th class="r">前年累計</th><th class="r">前年比</th>
        <th class="r">年間見込</th><th class="r">年間予算</th><th class="r">達成</th></tr></thead>
      <tbody>${keys.map(([k,lb])=>{
        const c=compareSeries(act[k],prev[k],i), land=landing(fy,k,i), b=sum12(bud[k]);
        return `<tr><td><b>${esc(lb)}</b></td>
          <td class="r num">${money(c.month)}</td><td class="r num">${money(c.lastYearMonth)}</td><td class="r">${pct(c.month,c.lastYearMonth)}</td>
          <td class="r num"><b>${moneyPlain(c.ytd)}</b></td><td class="r num">${money(c.lastYearYtd)}</td><td class="r">${pct(c.ytd,c.lastYearYtd)}</td>
          <td class="r num" style="color:var(--plan);font-weight:600;">${moneyPlain(land)}</td>
          <td class="r num">${moneyPlain(b)}</td>
          <td class="r">${b?`<span class="rate ${land>=b?'plus':'minus'}">${(land/b*100).toFixed(0)}%</span>`:'<span class="zero">—</span>'}</td></tr>`;
      }).join('')}</tbody></table></div></div></div>`;

  return pageShell({ title:'見込実績表', sub:fyLabel(fy)+' ／ 会議で配る形',
    tools: toolsMenu(`<button class="btn secondary" onclick="window.print()">🖨 印刷（A4横）</button>`),
    body: yearTable+qBlocks });
}

    {key:'dueDate', label:'入金期日', date:true, val:r=>{
      const b=balanceOfInvoice(r), late=r.dueDate&&r.dueDate<t&&b>0;

function confirmInvoice(id){
  const inv=findById('invoices',id); if(!inv) return;
  if(!confirm(`請求書 ${inv.no} を確定します。\n確定後は削除できません（取消のみ）。よろしいですか？`)) return;

  if(!inv.issueDate) inv.issueDate=today();
  markDirty('invoices',inv); renderPage(CURRENT_PAGE); toast('確定しました。','ok');
}

/* ---------- 請求のまとめ作成（CRMの在籍者数 × 単価） ---------- */
let GEN_CTX=null;
function openGenerate(){
  const ym = addMonths(thisMonth(),0);
  openModal(`<h3>請求をまとめて作成</h3>
    <div class="mdsub">請求ルールのある取引先について、その月の請求書（作成中）をまとめて作ります。</div>
    <div class="form-grid">
      <div class="full"><label>対象月（計上月）</label>
        <input id="genYm" type="month" value="${attr(ym)}" onchange="genPreview()"></div>
    </div>
    <div id="genBox" style="margin-top:12px;"></div>
    <div class="modal-actions"><button class="btn secondary" onclick="closeModal()">キャンセル</button>
      <button class="btn" id="genGoBtn" onclick="genGo()">この内容で作成</button></div>`,'lg');
  genPreview();
}
function genPreview(){
  const ym=document.getElementById('genYm').value;
  const box=document.getElementById('genBox');
  if(!ym){ box.innerHTML=''; return; }
  const targets=[], noRule=[], already=[];
  (DB.companies||[]).forEach(c=>{
    if(c._gone) return;
    if(c.kind==='仕入先') return;
    const rules=rulesOfCompany(c.id).filter(r=>r.kind!=='spot');
    const exists=(DB.invoices||[]).some(i=>String(i.companyId)===String(c.id)&&i.bookMonth===ym&&i.status!=='取消');
    if(exists){ already.push(c); return; }
    if(!rules.length){ if(arBalanceOf(c.id)>0||c.kind==='得意先') noRule.push(c); return; }
    const {items,snapshot}=autoItemsFor(c.id,ym);
    if(!items.length) return;
    targets.push({company:c, items, snapshot, total:itemsSubtotal(items)+itemsTax(items)});
  });
  GEN_CTX={ ym, targets };
  const rows=targets.map((t,i)=>`<tr>
    <td><input type="checkbox" class="genck" data-i="${i}" checked></td>
    <td><b>${esc(t.company.name)}</b></td>
    <td style="white-space:normal;font-size:11.5px;" class="muted">${t.items.map(x=>esc(x.name)+(x.qty>1?` ${x.qty}名×${moneyPlain(x.price)}`:'')).join('<br>')}</td>
    <td class="r num"><b>${moneyPlain(t.total)}</b></td>
    <td>${esc(dueDateOf(t.ym||GEN_CTX.ym, t.company.closingDay, t.company.paySite, t.company.payDay))}</td></tr>`).join('');
  box.innerHTML = `
    ${targets.length? `<div class="table-wrap"><table>
      <thead><tr><th style="width:34px;"><input type="checkbox" checked onchange="document.querySelectorAll('.genck').forEach(c=>c.checked=this.checked)"></th>
        <th>取引先</th><th>内容</th><th class="r">請求額（税込）</th><th>入金期日</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
      <div class="infobar" style="margin-top:8px;">合計 <b class="num">${moneyPlain(targets.reduce((s,t)=>s+t.total,0))}</b> 円 ／ ${targets.length}社。作成後は「作成中」です。内容を確認してから確定してください。</div>`
      : `<div class="warnbar">この月に自動作成できる請求はありません。請求ルールが未設定か、すでに作成済みです。</div>`}
    ${already.length? `<div class="infobar">すでに ${ym} の請求がある取引先（作成しません）：${already.map(c=>esc(c.name)).join('、')}</div>`:''}
    ${noRule.length? `<div class="warnbar">請求ルールが未設定の取引先：${noRule.map(c=>`<a onclick="closeModal();openRules('${c.id}')" style="cursor:pointer;color:var(--primary);font-weight:600;">${esc(c.name)}</a>`).join('、')}
      <div style="margin-top:4px;font-weight:400;">ルールを作ると翌月から自動で請求に入ります。単発の請求は「＋ 個別に請求を作成」から。</div></div>`:''}`;
}
function genGo(){
  if(!GEN_CTX||!GEN_CTX.targets.length){ toast('作成する対象がありません。','err'); return; }
  const picked=[...document.querySelectorAll('.genck:checked')].map(c=>GEN_CTX.targets[Number(c.dataset.i)]);
  if(!picked.length){ toast('対象を選んでください。','err'); return; }
  let n=0;
  picked.forEach(t=>{
    const rec={ companyId:t.company.id, bookMonth:GEN_CTX.ym, issueDate:'', status:'作成中',
      items:t.items, workerSnapshot:t.snapshot, note:'自動作成（請求ルール）' };
    prepareDoc('invoices', rec, null);
    rec.dueDate = dueDateOf(GEN_CTX.ym, t.company.closingDay, t.company.paySite, t.company.payDay);
    commitRecord('invoices', rec, {}); n++;
  });
  closeModal(); renderPage('invoices'); toast(`${n}件の請求書（作成中）を作成しました。`,'ok');
}

function unAllocated(){
  return (DB.payments||[]).filter(p=>p.status!=='取消')
    .reduce((s,p)=>s+Math.max(0, num(p.amount)-(p.allocations||[]).reduce((t,a)=>t+num(a.amount),0)),0);
}
let PAY_CTX=null;
function openPaymentFor(invoiceId){
  const inv=findById('invoices',invoiceId); if(!inv) return;
  openPayment(null, { companyId:inv.companyId, amount:balanceOfInvoice(inv), focusInvoice:invoiceId });
}
function openPayment(id, preset){
  if(!canEdit('receipts')){ toast('入金を記録する権限がありません。','err'); return; }
  const p = id? findById('payments',id) : null;
  PAY_CTX = { id: id||null,
    companyId: p? p.companyId : (preset?.companyId||''),
    date: p? p.date : today(),
    amount: p? num(p.amount) : num(preset?.amount||0),
    fee: p? num(p.fee) : 0,
    method: p? p.method : '銀行振込',
    note: p? p.note : '',
    allocations: p? (p.allocations||[]).map(a=>Object.assign({},a)) : [] };
  drawPaymentModal();
  if(!id && preset?.focusInvoice) setTimeout(()=>payAuto(),0);
}
function drawPaymentModal(){
  const c=PAY_CTX;
  const open=openInvoices().filter(i=>!c.companyId||String(i.companyId)===String(c.companyId))
    .sort((a,b)=>String(a.dueDate||'').localeCompare(String(b.dueDate||'')));
  const allocMap={}; (c.allocations||[]).forEach(a=>allocMap[a.invoiceId]=num(a.amount));
  const allocSum=Object.values(allocMap).reduce((s,v)=>s+v,0);
  const rest=num(c.amount)-allocSum;
  const rows=open.map(i=>{
    const bal=balanceOfInvoice(i)+ (c.id? (allocMap[i.id]||0) : 0);
    return `<tr><td>${esc(i.no)}</td><td>${esc(i.bookMonth||'')}</td>
      <td>${i.dueDate&&i.dueDate<today()?`<span class="badge b-red">${esc(i.dueDate)}</span>`:esc(i.dueDate||'')}</td>
      <td class="r num">${moneyPlain(bal)}</td>
      <td style="width:130px;"><input class="num" style="width:100%;padding:5px;border:1px solid var(--border);border-radius:6px;text-align:right;font-size:12px;"
        value="${allocMap[i.id]?moneyPlain(allocMap[i.id]):''}" oninput="fmtMoneyInput(this);payAlloc('${i.id}',this.value)" placeholder="0"></td></tr>`;
  }).join('');
  openModal(`<h3>${c.id?'入金の修正':'入金を記録'}</h3>
    <div class="mdsub">1回の振込で複数の請求を消し込めます。差額は「未消込」として残ります。</div>
    <div class="form-grid">
      <div><label>入金日</label><input type="date" value="${attr(c.date)}" onchange="PAY_CTX.date=this.value"></div>
      <div><label>取引先</label><select onchange="PAY_CTX.companyId=this.value;PAY_CTX.allocations=[];drawPaymentModal()">
        <option value="">-</option>${(DB.companies||[]).filter(x=>!x._gone).map(x=>`<option value="${attr(x.id)}" ${String(x.id)===String(c.companyId)?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>
      <div><label>入金額</label><input class="num" style="text-align:right;" value="${c.amount?moneyPlain(c.amount):''}" oninput="fmtMoneyInput(this);PAY_CTX.amount=num(this.value);payRefreshRest()"></div>
      <div><label>振込手数料（先方負担分）</label><input class="num" style="text-align:right;" value="${c.fee?moneyPlain(c.fee):''}" oninput="fmtMoneyInput(this);PAY_CTX.fee=num(this.value)"></div>
      <div><label>方法</label><select onchange="PAY_CTX.method=this.value">${selOpts(PAY_METHODS,c.method)}</select></div>
      <div><label>備考</label><input value="${attr(c.note||'')}" oninput="PAY_CTX.note=this.value"></div>
    </div>
    <div class="form-section" style="margin-top:14px;">💴 消込先の請求書
      <a class="pillbtn pill-save" style="margin-left:auto;" onclick="payAuto()">期日の古い順に自動で割り当て</a></div>
    ${c.companyId? (open.length? `<div class="table-wrap"><table>
        <thead><tr><th>請求番号</th><th>計上月</th><th>期日</th><th class="r">残高</th><th class="r">消込額</th></tr></thead>
        <tbody>${rows}</tbody></table></div>`
      : '<div class="infobar">この取引先に未回収の請求はありません。</div>')
      : '<div class="warnbar">先に取引先を選んでください。</div>'}
    <div id="payRest" style="margin-top:10px;font-size:13px;text-align:right;">
      消込合計 <b class="num">${moneyPlain(allocSum)}</b> ／ 未消込 <b class="num ${rest?(rest>0?'minus':'plus'):''}">${moneyPlain(rest)}</b></div>
    <div class="modal-actions ${c.id?'split':''}">
      ${c.id?`<button class="btn danger" onclick="payDelete()">削除</button>`:''}
      <div style="display:flex;gap:8px;"><button class="btn secondary" onclick="closeModal()">キャンセル</button>
      <button class="btn" onclick="paySave()">保存</button></div></div>`,'lg');
}
function payAlloc(invId,v){
  const amt=num(v);
  PAY_CTX.allocations=(PAY_CTX.allocations||[]).filter(a=>String(a.invoiceId)!==String(invId));
  if(amt) PAY_CTX.allocations.push({invoiceId:invId, amount:amt});
  payRefreshRest();
}
function payRefreshRest(){
  const el=document.getElementById('payRest'); if(!el) return;
  const s=(PAY_CTX.allocations||[]).reduce((t,a)=>t+num(a.amount),0), rest=num(PAY_CTX.amount)-s;
  el.innerHTML=`消込合計 <b class="num">${moneyPlain(s)}</b> ／ 未消込 <b class="num ${rest?(rest>0?'minus':'plus'):''}">${moneyPlain(rest)}</b>`;
}
function payAuto(){
  let rest=num(PAY_CTX.amount)+num(PAY_CTX.fee);
  const cur={}; (PAY_CTX.allocations||[]).forEach(a=>cur[a.invoiceId]=num(a.amount));
  PAY_CTX.allocations=[];
  openInvoices().filter(i=>String(i.companyId)===String(PAY_CTX.companyId))
    .sort((a,b)=>String(a.dueDate||'').localeCompare(String(b.dueDate||'')))
    .forEach(i=>{
      if(rest<=0) return;
      const bal=balanceOfInvoice(i)+(PAY_CTX.id?(cur[i.id]||0):0);
      const use=Math.min(bal,rest);
      if(use>0){ PAY_CTX.allocations.push({invoiceId:i.id, amount:use}); rest-=use; }
    });
  drawPaymentModal();
}
function paySave(){
  const c=PAY_CTX;
  if(!c.companyId||!num(c.amount)){ toast('取引先と入金額を入力してください。','err'); return; }
  const s=(c.allocations||[]).reduce((t,a)=>t+num(a.amount),0);
  if(s>num(c.amount)+num(c.fee)+1){
    if(!confirm(`消込額（${moneyPlain(s)}）が入金額を超えています。このまま保存しますか？`)) return;
  }
  commitRecord('payments', { companyId:c.companyId, date:c.date, amount:num(c.amount), fee:num(c.fee),
    method:c.method, note:c.note, allocations:c.allocations, status:'確定' }, { existingId:c.id });
  closeModal(); renderPage(CURRENT_PAGE); renderNav(); toast('入金を記録しました。','ok');
}
function payDelete(){
  if(!PAY_CTX.id) return;
  if(deleteRecord('payments', PAY_CTX.id, '入金記録')){ closeModal(); renderPage(CURRENT_PAGE); }
}

function viewAging(){
  const open=openInvoices();
  const byCo={};
  open.forEach(i=>{
    const k=String(i.companyId||'-');
    if(!byCo[k]) byCo[k]={ id:k, name:companyName(i.companyId).replace(/<[^>]+>/g,''), buckets:{}, total:0, oldest:'' };
    const b=agingBucket(i);
    byCo[k].buckets[b]=(byCo[k].buckets[b]||0)+balanceOfInvoice(i);
    byCo[k].total+=balanceOfInvoice(i);
    if(!byCo[k].oldest||(i.dueDate&&i.dueDate<byCo[k].oldest)) byCo[k].oldest=i.dueDate||'';
  });
  const rows=Object.values(byCo).sort((a,b)=>b.total-a.total);
  const totals={}; AGING_BUCKETS.forEach(b=>totals[b]=rows.reduce((s,r)=>s+(r.buckets[b]||0),0));
  const grand=rows.reduce((s,r)=>s+r.total,0);

  const kpis=`<div class="kpi-grid">
    ${AGING_BUCKETS.map(b=>`<div class="kpi"><div class="lbl">${esc(b)}</div>
      <div class="num ${b==='90日超'||b==='61〜90日'?'minus':''}">${moneyPlain(totals[b])}</div>
      <div class="sub">${grand?((totals[b]/grand)*100).toFixed(0)+'%':'—'}</div></div>`).join('')}
  </div>`;

  const table=`<div class="table-wrap"><table class="stick1">
    <thead><tr><th style="min-width:180px;">取引先</th>
      ${AGING_BUCKETS.map(b=>`<th class="r">${esc(b)}</th>`).join('')}
      <th class="r">合計</th><th>最も古い期日</th><th></th></tr></thead>
    <tbody>${rows.length? rows.map(r=>`<tr>
      <td><b>${esc(r.name)}</b></td>
      ${AGING_BUCKETS.map(b=>`<td class="r num ${(b==='61〜90日'||b==='90日超')&&r.buckets[b]?'minus':''}">${r.buckets[b]?moneyPlain(r.buckets[b]):'<span class="zero">—</span>'}</td>`).join('')}
      <td class="r num"><b>${moneyPlain(r.total)}</b></td>
      <td>${r.oldest&&r.oldest<today()?`<span class="badge b-red">${esc(r.oldest)}</span>`:esc(r.oldest||'')}</td>
      <td><a onclick="agingDetail('${r.id}')" style="cursor:pointer;color:var(--primary);font-size:12px;">明細</a></td></tr>`).join('')
      : '<tr><td colspan="9" class="empty">未回収の請求はありません。</td></tr>'}
      ${rows.length?`<tr class="totrow"><td>合計</td>${AGING_BUCKETS.map(b=>`<td class="r num">${moneyPlain(totals[b])}</td>`).join('')}
        <td class="r num">${moneyPlain(grand)}</td><td></td><td></td></tr>`:''}
    </tbody></table></div>`;

  return pageShell({ title:'債権年齢表', sub:'期日からの経過日数で区分。61日以上は要対応です。',
    tools: toolsMenu(`<button class="btn secondary" onclick="window.print()">🖨 印刷</button>`),
    body: kpis+table });
}

    {key:'balance', label:'未払残', cls:'r', noFilter:true, val:r=>{const b=balanceOfBill(r); return b>0?`<b class="num minus">${moneyPlain(b)}</b>`:'<span class="zero">0</span>';}},
    {key:'dueDate', label:'支払期日', date:true, val:r=>{

function openPayout(id, preset){

  const p=id? findById('payouts',id):null;
  PO_CTX={ id:id||null, companyId:p?p.companyId:(preset?.companyId||''), date:p?p.date:today(),
    amount:p?num(p.amount):num(preset?.amount||0), method:p?p.method:'銀行振込', note:p?p.note:'',
    allocations:p?(p.allocations||[]).map(a=>Object.assign({},a)):[] };
  drawPayoutModal();
  if(!id&&preset) setTimeout(()=>poAuto(),0);
}
function drawPayoutModal(){
  const c=PO_CTX;
  const open=openBills().filter(b=>!c.companyId||String(b.companyId)===String(c.companyId))
    .sort((a,b)=>String(a.dueDate||'').localeCompare(String(b.dueDate||'')));
  const map={}; (c.allocations||[]).forEach(a=>map[a.billId]=num(a.amount));
  const s=Object.values(map).reduce((t,v)=>t+v,0), rest=num(c.amount)-s;
  const rows=open.map(b=>{
    const bal=balanceOfBill(b)+(c.id?(map[b.id]||0):0);
    return `<tr><td>${esc(b.no)}</td><td>${esc(b.bookMonth||'')}</td>
      <td>${b.dueDate&&b.dueDate<today()?`<span class="badge b-red">${esc(b.dueDate)}</span>`:esc(b.dueDate||'')}</td>
      <td class="r num">${moneyPlain(bal)}</td>
      <td style="width:130px;"><input class="num" style="width:100%;padding:5px;border:1px solid var(--border);border-radius:6px;text-align:right;font-size:12px;"
        value="${map[b.id]?moneyPlain(map[b.id]):''}" oninput="fmtMoneyInput(this);poAlloc('${b.id}',this.value)" placeholder="0"></td></tr>`;
  }).join('');
  openModal(`<h3>${c.id?'支払の修正':'支払を記録'}</h3>
    <div class="mdsub">1回の振込で複数の請求を消し込めます。</div>
    <div class="form-grid">
      <div><label>支払日</label><input type="date" value="${attr(c.date)}" onchange="PO_CTX.date=this.value"></div>
      <div><label>支払先</label><select onchange="PO_CTX.companyId=this.value;PO_CTX.allocations=[];drawPayoutModal()">
        <option value="">-</option>${(DB.companies||[]).filter(x=>!x._gone).map(x=>`<option value="${attr(x.id)}" ${String(x.id)===String(c.companyId)?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>
      <div><label>支払額</label><input class="num" style="text-align:right;" value="${c.amount?moneyPlain(c.amount):''}" oninput="fmtMoneyInput(this);PO_CTX.amount=num(this.value);poRest()"></div>
      <div><label>方法</label><select onchange="PO_CTX.method=this.value">${selOpts(PAY_METHODS,c.method)}</select></div>
      <div class="full"><label>備考</label><input value="${attr(c.note||'')}" oninput="PO_CTX.note=this.value"></div>
    </div>
    <div class="form-section" style="margin-top:14px;">💴 消込先
      <a class="pillbtn pill-save" style="margin-left:auto;" onclick="poAuto()">期日の古い順に自動で割り当て</a></div>
    ${c.companyId? (open.length?`<div class="table-wrap"><table>
      <thead><tr><th>番号</th><th>計上月</th><th>期日</th><th class="r">残高</th><th class="r">消込額</th></tr></thead>
      <tbody>${rows}</tbody></table></div>`:'<div class="infobar">この支払先に未払はありません。</div>')
      :'<div class="warnbar">先に支払先を選んでください。</div>'}
    <div id="poRest" style="margin-top:10px;font-size:13px;text-align:right;">消込合計 <b class="num">${moneyPlain(s)}</b> ／ 未消込 <b class="num">${moneyPlain(rest)}</b></div>
    <div class="modal-actions ${c.id?'split':''}">
      ${c.id?`<button class="btn danger" onclick="poDelete()">削除</button>`:''}
      <div style="display:flex;gap:8px;"><button class="btn secondary" onclick="closeModal()">キャンセル</button>
      <button class="btn" onclick="poSave()">保存</button></div></div>`,'lg');
}
function poAlloc(billId,v){
  const amt=num(v);
  PO_CTX.allocations=(PO_CTX.allocations||[]).filter(a=>String(a.billId)!==String(billId));
  if(amt) PO_CTX.allocations.push({billId, amount:amt});
  poRest();
}
function poRest(){
  const el=document.getElementById('poRest'); if(!el) return;
  const s=(PO_CTX.allocations||[]).reduce((t,a)=>t+num(a.amount),0), rest=num(PO_CTX.amount)-s;
  el.innerHTML=`消込合計 <b class="num">${moneyPlain(s)}</b> ／ 未消込 <b class="num ${rest?'minus':''}">${moneyPlain(rest)}</b>`;
}
function poAuto(){
  let rest=num(PO_CTX.amount);
  const cur={}; (PO_CTX.allocations||[]).forEach(a=>cur[a.billId]=num(a.amount));
  PO_CTX.allocations=[];
  openBills().filter(b=>String(b.companyId)===String(PO_CTX.companyId))
    .sort((a,b)=>String(a.dueDate||'').localeCompare(String(b.dueDate||'')))
    .forEach(b=>{ if(rest<=0) return; const bal=balanceOfBill(b)+(PO_CTX.id?(cur[b.id]||0):0);
      const use=Math.min(bal,rest); if(use>0){ PO_CTX.allocations.push({billId:b.id,amount:use}); rest-=use; } });
  drawPayoutModal();
}
function poSave(){
  const c=PO_CTX;
  if(!c.companyId||!num(c.amount)){ toast('支払先と金額を入力してください。','err'); return; }
  commitRecord('payouts', { companyId:c.companyId, date:c.date, amount:num(c.amount), method:c.method,
    note:c.note, allocations:c.allocations, status:'確定' }, { existingId:c.id });
  closeModal(); renderPage(CURRENT_PAGE); renderNav(); toast('支払を記録しました。','ok');
}
function poDelete(){ if(PO_CTX.id && deleteRecord('payouts',PO_CTX.id,'支払記録')){ closeModal(); renderPage(CURRENT_PAGE); } }

/* ---------- 資金繰り: 入るお金 − 出るお金 ---------- */
let CF_MODE='week';
function setCf(m){ CF_MODE=m; renderPage('cashflow'); }
function viewCashflow(){
  const start=num(DB.settings?.cashStart||0);
  const rows = CF_MODE==='week'? cashPlanByWeek(12) : cashPlanByMonth(thisMonth(),12);
  let run=start;
  const body=rows.map(r=>{
    run+=r.net;
    const label = CF_MODE==='week' ? `${r.s.slice(5).replace('-','/')} 〜 ${r.e.slice(5).replace('-','/')}` : r.ym;
    return `<tr><td>${esc(label)}</td>
      <td class="r num plus">${r.in?moneyPlain(r.in):'<span class="zero">—</span>'}</td>
      <td class="r num minus">${r.out?moneyPlain(r.out):'<span class="zero">—</span>'}</td>
      <td class="r num ${r.net<0?'minus':(r.net>0?'plus':'zero')}"><b>${r.net>0?'+':''}${moneyPlain(r.net)}</b></td>
      <td class="r num ${run<0?'minus':''}"><b>${moneyPlain(run)}</b></td>
      <td>${run<0?'<span class="badge b-red">資金不足の見込み</span>':''}</td></tr>`;
  }).join('');
  const minRun=(()=>{ let r=start,m=start; rows.forEach(x=>{r+=x.net; m=Math.min(m,r);}); return m; })();

  const kpis=`<div class="kpi-grid">
    <div class="kpi"><div class="lbl">入金予定（全期間）</div><div class="num plus">${moneyPlain(rows.reduce((s,r)=>s+r.in,0))}</div></div>
    <div class="kpi"><div class="lbl">支払予定（全期間）</div><div class="num minus">${moneyPlain(rows.reduce((s,r)=>s+r.out,0))}</div></div>
    <div class="kpi"><div class="lbl">差引</div><div class="num ${rows.reduce((s,r)=>s+r.net,0)<0?'minus':'plus'}">${moneyPlain(rows.reduce((s,r)=>s+r.net,0))}</div></div>
    <div class="kpi"><div class="lbl">最低残高の見込み</div><div class="num ${minRun<0?'minus':''}">${moneyPlain(minRun)}</div>
      <div class="sub">開始残高 ${moneyPlain(start)}</div></div>
  </div>`;

  const seg=`<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px;">
    <div class="seg"><button class="${CF_MODE==='week'?'on':''}" onclick="setCf('week')">週ごと（12週）</button>
      <button class="${CF_MODE==='month'?'on':''}" onclick="setCf('month')">月ごと（12か月）</button></div>
    <button class="btn secondary sm" onclick="cfSetStart()">開始残高を設定</button>
    <span class="muted" style="font-size:11.5px;">請求書の入金期日と、支払請求の支払期日から自動で計算しています。</span></div>`;

  return pageShell({ title:'資金繰り', sub:'いつ・いくら足りなくなるかを先に知るための表',
    tools: toolsMenu(`<button class="btn secondary" onclick="window.print()">🖨 印刷</button>`),
    body: seg+kpis+`<div class="table-wrap"><table>
      <thead><tr><th>期間</th><th class="r">入金予定</th><th class="r">支払予定</th><th class="r">差引</th><th class="r">残高見込</th><th></th></tr></thead>
      <tbody>${body}</tbody></table></div>` });
}
function cfSetStart(){
  openModal(`<h3>開始残高の設定</h3>
    <div class="mdsub">資金繰り表の起点になる現在の現預金残高です。手入力（通帳の数字）です。</div>
    <div class="form-grid"><div class="full"><label>現在の現預金残高</label>
      <input id="cfStart" class="num" style="text-align:right;" value="${attr(moneyPlain(DB.settings?.cashStart||0))}" oninput="fmtMoneyInput(this)"></div></div>
    <div class="modal-actions"><button class="btn secondary" onclick="closeModal()">キャンセル</button>
      <button class="btn" onclick="cfSaveStart()">保存</button></div>`);
}
function cfSaveStart(){
  DB.settings=DB.settings||{}; DB.settings.cashStart=num(document.getElementById('cfStart').value);
  if(!PENDING.changed.settings) PENDING.changed.settings=DB.settings;
  PENDING.changed.settings=DB.settings; schedulePush();
  closeModal(); renderPage('cashflow'); toast('保存しました。','ok');
}

function viewWorkers(){
  const p='workers';
  const all=(DB.workers||[]).slice();
  const q=(SEARCH[p]||'').toLowerCase();
  const cur=(w)=>{
    const list=(DB.assignments||[]).filter(a=>String(a.workerId)===String(w.id))
      .sort((a,b)=>String(b.joinDate||'').localeCompare(String(a.joinDate||'')));
    return list[0]||null;
  };
  let rows=q? all.filter(w=>((w.name||'')+(w.code||'')+(w.kana||'')).toLowerCase().includes(q)) : all.slice();

/* ============================================================================
   ⑫ OKR — 目的④。数字は 予実 から自動で取れる（手で写さない）
   ========================================================================== */
function periodsOfFy(fy){ return QUARTERS.map(q=>`${fy}-Q${q.k}`); }
function curPeriod(){ const i=lastActualIdx(CUR_FY); return `${CUR_FY}-Q${quarterOfIdx(i)}`; }
let OKR_PERIOD=null;
function setOkrPeriod(p){ OKR_PERIOD=p; renderPage('okr'); }

/** KRの現在値。autoSource があれば実データから取る（公式 §0.10 と同じ考え方） */
function krCurrent(kr){
  const a=kr.autoSource;
  if(!a||!a.type) return num(kr.current);
  const fy=Number((kr.period||curPeriod()).split('-')[0])||CUR_FY;
  const i=lastActualIdx(fy);
  if(a.type==='yojitsu'){
    const b=plBook(fy,'actual')[a.metric||'revenue']||[];
    if(a.scope==='month') return b[i]||0;
    if(a.scope==='quarter'){ const qs=Math.floor(i/3)*3; return sumRange(b,qs,i); }
    return sumRange(b,0,i);                       // ytd
  }
  if(a.type==='ar'){
    if(a.metric==='overdue') return openInvoices().filter(x=>x.dueDate&&x.dueDate<today()).reduce((s,x)=>s+balanceOfInvoice(x),0);
    return arTotal();
  }
  if(a.type==='ap') return apTotal();
  if(a.type==='workers') return (DB.assignments||[]).filter(x=>activeInMonth(x,thisMonth())).length;
  if(a.type==='companies') return new Set((DB.assignments||[]).filter(x=>activeInMonth(x,thisMonth())).map(x=>x.companyId)).size;
  return num(kr.current);
}
function krRate(kr){
  const t=num(kr.target); if(!t) return 0;
  const c=krCurrent(kr);
  return kr.lowerIsBetter ? (c<=t?100:Math.max(0, (2-c/t)*100)) : Math.max(0, c/t*100);
}
function objRate(o){
  const krs=(DB.keyResults||[]).filter(k=>String(k.objectiveId)===String(o.id));
  if(!krs.length) return 0;
  return krs.reduce((s,k)=>s+Math.min(120,krRate(k)),0)/krs.length;
}
function okrSignal(r){ return r>=100?'完了':(r>=70?'順調':(r>=40?'注意':'遅延')); }

      <div class="num">${objs.filter(o=>okrSignal(objRate(o))===s).length}</div></div>`).join('')}
  </div>`;
  const periods=[...new Set([...periodsOfFy(CUR_FY), ...(DB.objectives||[]).map(o=>o.period)])].filter(Boolean).sort().reverse();

  return pageShell({ title:'OKR / KPI', sub:'四半期ごとの目標。数字は予実・債権から自動で取れます。',
    tools:`<select onchange="setOkrPeriod(this.value)" style="padding:7px 10px;border:1px solid var(--border-strong);border-radius:8px;">
        ${periods.map(p=>`<option value="${attr(p)}" ${p===period?'selected':''}>${esc(p)}</option>`).join('')}</select>
      ${canCreate('okr')?`<button class="btn" onclick="okrForm()">＋ 目標を追加</button>`:''}
      ${toolsMenu(`<button class="btn secondary" onclick="window.print()">🖨 印刷</button>`)}`,
    body: kpis + (objs.length? OKR_LEVELS.map(lv=>{
      const list=byLevel(lv); if(!list.length) return '';
      return `<div class="section-title" style="margin:16px 0 8px;">${esc(lv)}の目標</div>`+list.map(card).join('');
    }).join('') : '<div class="empty">この四半期の目標はまだありません。「＋ 目標を追加」から作成してください。</div>') });
}
function autoLabel(a){
  if(a.type==='yojitsu') return ({revenue:'売上高',gross:'粗利',operating:'営業利益',ordinary:'経常利益'}[a.metric]||a.metric)
    +'・'+({month:'当月',quarter:'四半期',ytd:'年度累計'}[a.scope]||'年度累計');
  if(a.type==='ar') return a.metric==='overdue'?'延滞債権':'売掛残高';
  if(a.type==='ap') return '買掛残高';

  DB.userPerms=DB.userPerms||{}; DB.userPerms[email]=DB.userPerms[email]||{};

    else toast('復元できませんでした。','err');

}

        ${canEdit('yojitsu')?`<button class="btn secondary sm" onclick="cfSetStart()">変更</button>`:''}</div>
        <div class="fhelp">通帳の現在残高を入れると、資金繰り表の残高見込みが実際の数字になります。</div></div></div>

    <div class="panel"><div class="panel-hd"><b>会計年度</b></div>
      <div class="panel-bd"><div style="font-size:13px;">8月1日 〜 翌年7月31日（${fyLabel(CUR_FY)}）<br>
        <span class="muted" style="font-size:12px;">四半期：Q1=8〜10月／Q2=11〜1月／Q3=2〜4月／Q4=5〜7月</span></div></div></div>

    <div class="panel"><div class="panel-hd"><b>この端末の状態</b></div>
      <div class="panel-bd" style="font-size:12.5px;line-height:1.9;">
        データ版数：<b class="num">${SERVER_REV}</b> ／ epoch：<code>${esc(SERVER_EPOCH)}</code><br>
        未同期の変更：<b>${pendingCount()}件</b><br>
        <button class="btn secondary sm" style="margin-top:8px;" onclick="localStorage.removeItem(STORAGE_KEY);location.reload()">キャッシュを消して再読み込み</button></div></div>` });
}
function accForm(id){
  const a=(DB.accounts||[]).find(x=>String(x.id)===String(id)||x.code===id);
  openModal(`<h3>${a?'勘定科目の編集':'勘定科目の追加'}</h3>
    <div class="form-grid">
      <div><label>コード</label><input id="acC" value="${attr(a?a.code:'')}" placeholder="6500"></div>
      <div><label>区分</label><select id="acK">${selOpts(Object.keys(KIND_LABEL).map(k=>({k,label:KIND_LABEL[k]})), a?a.kind:'sga')}</select></div>
      <div class="full"><label>名称</label><input id="acL" value="${attr(a?a.label:'')}" placeholder="例: 採用費"></div>
    </div>
    <div class="modal-actions"><button class="btn secondary" onclick="closeModal()">キャンセル</button>
      <button class="btn" onclick="accSave('${a?a.id:''}')">保存</button></div>`);
}
function accSave(id){
  const rec={ code:document.getElementById('acC').value.trim(), label:document.getElementById('acL').value.trim(),
    kind:document.getElementById('acK').value };
  if(!rec.code||!rec.label){ toast('コードと名称を入力してください。','err'); return; }
  commitRecord('accounts', rec, { existingId:id||null });
  closeModal(); renderPage('settings'); toast('保存しました。','ok');
}

/* ============ 検索・CSV ============ */
function globalSearch(q){
  const box=document.getElementById('searchResults');
  q=(q||'').trim().toLowerCase();
  if(!q||!DB){ box.classList.remove('show'); return; }
  const res=[];
  (DB.companies||[]).forEach(c=>{ if(((c.name||'')+(c.kana||'')).toLowerCase().includes(q))
    res.push({t:c.name, s:'取引先', go:`openDetail('companies','${c.id}')`}); });
  (DB.invoices||[]).forEach(i=>{ if(((i.no||'')+companyName(i.companyId)).toLowerCase().includes(q))
    res.push({t:i.no+' ／ '+companyName(i.companyId).replace(/<[^>]+>/g,''), s:'請求書 '+moneyPlain(docTotal(i))+'円', go:`openDetail('invoices','${i.id}')`}); });
  (DB.bills||[]).forEach(b=>{ if(((b.no||'')+companyName(b.companyId)).toLowerCase().includes(q))
    res.push({t:b.no+' ／ '+companyName(b.companyId).replace(/<[^>]+>/g,''), s:'支払請求', go:`openDetail('bills','${b.id}')`}); });
  (DB.workers||[]).forEach(w=>{ if(((w.name||'')+(w.code||'')).toLowerCase().includes(q))
    res.push({t:w.name, s:'特定技能者 '+(w.code||''), go:`goto('workers')`}); });
  box.innerHTML = res.slice(0,10).map(r=>`<div class="ac-item" onmousedown="closeSearch();${r.go}">
    <span>${esc(r.t)}</span><span class="muted" style="font-size:11px;">${esc(r.s)}</span></div>`).join('')
    || `<div class="ac-item muted">「${esc(q)}」に一致する結果がありません</div>`;
  box.classList.add('show');
}
function closeSearch(){ document.getElementById('searchResults').classList.remove('show');
  document.getElementById('quickSearch').value=''; }
document.addEventListener('click', e=>{ if(!e.target.closest('.topsearch')) document.getElementById('searchResults')?.classList.remove('show'); });

function downloadCsv(name, rows){
  const csv='﻿'+rows.map(r=>r.map(c=>`"${String(c==null?'':c).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download=`${name}_${today()}.csv`; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
}
function exportCsvTable(key){
  const map={
    invoices:[['請求番号','発行日','請求先','計上月','請求額','入金済','残高','期日','状態'],
      ()=>(DB.invoices||[]).map(i=>[i.no,i.issueDate,companyName(i.companyId).replace(/<[^>]+>/g,''),i.bookMonth,
        docTotal(i),paidOfInvoice(i),balanceOfInvoice(i),i.dueDate,invoiceStatus(i)])],
    bills:[['管理番号','受領日','支払先','計上月','金額','支払済','残高','期日','状態'],
      ()=>(DB.bills||[]).map(b=>[b.no,b.recvDate,companyName(b.companyId).replace(/<[^>]+>/g,''),b.bookMonth,
        docTotal(b),paidOfBill(b),balanceOfBill(b),b.dueDate,billStatus(b)])],
    payments:[['入金日','取引先','入金額','手数料','方法','備考'],
      ()=>(DB.payments||[]).map(p=>[p.date,companyName(p.companyId).replace(/<[^>]+>/g,''),p.amount,p.fee,p.method,p.note])],
    payouts:[['支払日','支払先','支払額','方法','備考'],
      ()=>(DB.payouts||[]).map(p=>[p.date,companyName(p.companyId).replace(/<[^>]+>/g,''),p.amount,p.method,p.note])],
    expenses:[['支払日','計上月','勘定科目','支払先','金額','方法','摘要'],
      ()=>(DB.expenses||[]).map(e=>[e.date,e.bookMonth,accountLabel(e.accountCode),e.vendor,e.amount,e.method,e.note])],
    companies:[['取引先名','区分','データ元','締日','支払サイト','支払日','売掛残','買掛残'],
      ()=>(DB.companies||[]).map(c=>[c.name,c.kind,c.source==='crm'?'CRM':'手入力',c.closingDay,c.paySite,c.payDay,arBalanceOf(c.id),apBalanceOf(c.id)])],
  };
  const m=map[key]; if(!m) return;
  downloadCsv(key, [m[0], ...m[1]()]);
}
function exportCsvYojitsu(){
  const act=plBook(CUR_FY,'actual'), bud=plBook(CUR_FY,'budget');
  const rows=[['科目','種別',...FY_MONTH_LABELS,'年間']];
  PL_ROWS.filter(r=>r.type!=='rate').forEach(r=>{
    rows.push([r.label,'実績',...act[r.key],sum12(act[r.key])]);
    rows.push([r.label,'予算',...bud[r.key],sum12(bud[r.key])]);
  });
  downloadCsv(`予実_${CUR_FY}年度`, rows);
}

  }catch(e){}
  if(GTOKEN && SESSION){

      SESSION=Object.assign(SESSION,me); afterLogin();

  }
})();
