/** cols: [{key,label,cls,val(row),raw(row),noFilter}] */
function dataTable(pageId, rows, cols, opt){
  opt=opt||{};
  fcolReg(pageId, {
    rows: ()=>opt.allRows||rows,
    valueOf: (r,c)=>{ const cd=cols.find(x=>x.key===c); return cd? (cd.raw? cd.raw(r) : r[c]) : r[c]; },
    isDate: c=>{ const cd=cols.find(x=>x.key===c); return !!(cd&&cd.date); },
  });
  const head = cols.map(c=>`<th class="${c.cls||''}">${c.noFilter?esc(c.label):fcolHead(pageId,c.key,c.label)}</th>`).join('');
  if(!rows.length) return `<div class="table-wrap"><div class="empty">${esc(opt.emptyText||'データがありません。')}</div></div>`;
  const body = rows.map((r,i)=>`<tr class="${opt.onRow?'clickable':''}" ${opt.onRow?`onclick="${opt.onRow(r)}"`:''}>
      ${cols.map(c=>`<td class="${c.cls||''}">${c.val? c.val(r,i) : esc(r[c.key]??'')}</td>`).join('')}</tr>`).join('');
  const foot = opt.footer? `<tr class="totrow">${opt.footer.map(c=>`<td class="${c.cls||''}">${c.html}</td>`).join('')}</tr>` : '';
  return `<div class="table-wrap"><table class="${opt.stick?'stick1':''}"><thead><tr>${head}</tr></thead>
    <tbody>${body}${foot}</tbody></table></div>`;
}

/* ---------- フォーム（ENTITIES から自動生成） ---------- */
let FORM_CTX = null;    // {entity, id, items:[], allocations:[]}
function openForm(entKey, id, preset){
  const E = ENTITIES[entKey]; if(!E) return;
  const page = E.page;
  const isEdit = !!id;
  if(isEdit && !canEdit(page)){ return openDetail(entKey,id); }
  if(!isEdit && !canCreate(page)){ toast('作成の権限がありません。','err'); return; }
  const row = isEdit ? Object.assign({}, findById(E.key,id)) : Object.assign({}, preset||{});
  /* 払い方を入れていない古い費目は「即払い」。空欄のまま '-' と出ると、どちらか分からない。 */
  if(entKey==='costItems' && !row.payMode) row.payMode='即払い';
  FORM_CTX = { entity:entKey, id: isEdit?id:null, items: (row.items||[]).map(x=>Object.assign({},x)) };
  /* 取引先（得意先／支払先）は 3列の専用レイアウト。入力欄そのものは下の formFieldHtml を共用する。 */
  if(entKey==='companies') return openCompanyModal('form', row, isEdit?id:null);

  let sec=null;
  const fields = E.fields.map(f=>{
    let hd='';
    if(f.section && f.section!==sec){ sec=f.section; hd=secHead(f); }
    return hd+formFieldHtml(entKey, E, f, row);
  }).join('');

  openModal(`
    <h3>${isEdit?'編集':'新規作成'} — ${esc(E.label)}</h3>
    ${row.source==='crm'?`<div class="mdsub">CRM連携の項目は編集できません。会計情報だけこの画面で入力します。</div>`:''}
    <form id="entForm" class="form-grid" onsubmit="return saveForm(event)">${fields}</form>
    <div class="modal-actions ${isEdit&&canDelete(page)?'split':''}">
      ${isEdit&&canDelete(page)?`<button class="btn danger" onclick="deleteFromForm('${entKey}','${id}')">削除</button>`:''}
      <div style="display:flex;gap:8px;">
        <button class="btn secondary" onclick="closeModal()">キャンセル</button>
        <button class="btn" onclick="saveForm(event)">保存</button>
      </div>
    </div>`, (E.fields.some(f=>f.type==='items') || E.fields.length>7) ? 'lg' : '');
}
/** フォームの1項目（ラベル＋入力欄）。o で見た目だけ差し替えられる（保存される値は変わらない）:
    o.label（HTML可）/ o.options / o.ph / o.noHelp（説明は title に回して高さを取らない）/ o.cls / o.attrs */
function formFieldHtml(entKey, E, f, row, o){
    o=o||{};
    const locked = (E.readOnly || (f.crm && row.source==='crm'));
    const v = row[f.name]==null? '' : row[f.name];
    let input='';
    if(f.type==='items'){
      input = `<div id="itemsBox">${itemsEditorHtml()}</div>`;
      return `<div class="full"><label>${esc(f.label)}</label>${input}</div>`;
    }
    if(f.type==='textarea') input=`<textarea name="${f.name}" ${locked?'readonly':''}>${esc(v)}</textarea>`;
    else if(f.type==='select') input=`<select name="${f.name}" ${locked?'disabled':''}><option value="">-</option>`+
      selOpts(o.options||f.options||[], v)+`</select>`;
    else if(f.type==='account'){
      input=`<select name="${f.name}" ${locked?'disabled':''}><option value="">-</option>`+accountOptionsHtml(v)+`</select>`;
      /* 「欲しい科目が無い」ときに、どこへ行けばいいかをその場で言う。
         設定のどこかにある、では探せない（利用者の質問 2026-09-13）。 */
      if(canEdit('settings')) input += `<div class="fhelp">科目が足りない／分類したい →
        <a onclick="closeModal();goto('accounts')" style="cursor:pointer;color:var(--primary);font-weight:600;">設定 › 勘定科目の登録</a>
        ${accTreeReady()?'':'（まず「初期セット」を押すと 大分類 › 中分類 › 小分類 に整理できます）'}</div>`;
    }
    else if(f.type==='dept') input=`<select name="${f.name}"><option value="">-</option>`+
      (DB.departments||[]).map(d=>`<option value="${attr(d.code)}" ${d.code===v?'selected':''}>${esc(d.label||d.code)}</option>`).join('')+`</select>`;
    else if(f.type==='ref'){
      /* ★ 2026-09-13 利用者の指摘:「支払先に お客様の会社が並ぶのはおかしい」。
         支払先は『BIGLIGHT がサービスを受けている会社』。得意先とは別物なので、
         ここでは 仕入先／両方 だけを出します（会社台帳は1つのまま・二重登録を作らない）。 */
      let list=(DB[f.ref]||[]).filter(x=>!x._gone);
      if(f.refFilter==='payee') list=list.filter(x=>x.kind==='仕入先'||x.kind==='両方');
      if(f.refFilter==='customer') list=list.filter(x=>x.kind!=='仕入先');
      list=list.slice().sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'ja'));
      input=`<select name="${f.name}" ${locked?'disabled':''} onchange="onRefChange('${entKey}','${f.name}',this.value)"><option value="">-</option>`+
        list.map(x=>`<option value="${attr(x.id)}" ${String(x.id)===String(v)?'selected':''}>${esc(x.name||x.id)}</option>`).join('')+`</select>`;
      /* 一覧に無い会社をここで作れる。作りに行って戻ってくると、入力中の内容が消えてしまうため。 */
      if(f.quickAdd && f.ref==='companies' && !locked && canCreate('companies'))
        input += `<div style="margin-top:5px;"><a class="pillbtn pill-new" onclick="quickAddCompany('${f.name}','${attr(f.quickAdd)}')">＋ 新しい${f.quickAdd==='仕入先'?'支払先':'取引先'}を作る</a></div>`;
    }
    else if(f.type==='money') input=`<input name="${f.name}" type="text" inputmode="numeric" class="num" style="text-align:right;" value="${attr(v===''?'':moneyPlain(v))}" oninput="fmtMoneyInput(this)" ${locked?'readonly':''}>`;
    else if(f.type==='month') input=`<input name="${f.name}" type="month" value="${attr(String(v).slice(0,7))}" ${locked?'readonly':''}>`;
    else if(f.type==='date') input=`<input name="${f.name}" type="date" value="${attr(String(v).slice(0,10))}" ${locked?'readonly':''}>`;
    else if(f.type==='number') input=`<input name="${f.name}" type="number" value="${attr(v)}"${o.ph?` placeholder="${attr(o.ph)}"`:''} ${locked?'readonly':''}>`;
    else if(f.name==='owner') input=`<input name="${f.name}" type="text" value="${attr(v)}" placeholder="${attr(o.ph||f.ph||'')}" list="ownerList" autocomplete="off">
      <datalist id="ownerList">${(_USERS||[]).filter(u=>u.status==='active').map(u=>`<option value="${attr(u.email)}">${esc(u.name||'')}</option>`).join('')}</datalist>`;
    else input=`<input name="${f.name}" type="text" value="${attr(v)}" placeholder="${attr(o.ph||f.ph||'')}" ${locked?'readonly':''}>`;
    const cls=[f.full?'full':'', o.cls||''].filter(Boolean).join(' ');
    const tip=(o.noHelp && f.help)? ` title="${attr(String(f.help).replace(/<[^>]+>/g,''))}"` : '';
    return `<div class="${cls}"${o.attrs||''}${tip}>
      <label>${o.label!=null?o.label:esc(f.label)}${f.req?' <span style="color:var(--danger)">*</span>':''}${locked?' <span class="tag crm">CRM</span>':''}</label>
      ${input}${(f.help&&!o.noHelp)?`<div class="fhelp">${f.help}</div>`:''}</div>`;
}
function selOpts(list, v){
  return list.map(o=>{ const val=typeof o==='object'?o.k:o, lb=typeof o==='object'?o.label:o;
    return `<option value="${attr(val)}" ${String(val)===String(v)?'selected':''}>${esc(lb)}</option>`; }).join('');
}
function fmtMoneyInput(el){
  const p=el.selectionStart, before=el.value.length;
  const n=el.value.replace(/[^\d-]/g,'');
  el.value = n===''? '' : Number(n).toLocaleString('ja-JP');
  try{ el.setSelectionRange(Math.max(0,p+(el.value.length-before)), Math.max(0,p+(el.value.length-before))); }catch(e){}
}
/** 入力中の画面から離れずに取引先を1社作る（第2のモーダル）。
    作ったらその場で選択済みにする。離れて作りに行くと、書きかけが消えてしまうため。 */

      <div><label>締日</label><input id="qcClose" type="number" value="31" placeholder="末日なら31"></div>

function quickAddCompanyGo(fieldName){

    sel.innerHTML='<option value="">-</option>'+list.map(x=>`<option value="${attr(x.id)}">${esc(x.name||x.id)}</option>`).join('');

function onRefChange(entKey, field, val){
  // 請求先を選んだら支払サイトから期日を自動計算（空欄のときだけ・手入力は尊重）
  if(field!=='companyId') return;
  const f=document.getElementById('entForm'); if(!f) return;
  const due=f.querySelector('[name=dueDate]'), bm=f.querySelector('[name=bookMonth]');
  const c=findById('companies',val);
  if(due && !due.value && c && bm && bm.value){ due.value = dueDateOf(bm.value, c.closingDay, c.paySite, c.payDay); }
}
function readForm(entKey){
  const E=ENTITIES[entKey], f=document.getElementById('entForm'), out={};
  E.fields.forEach(fd=>{
    if(fd.type==='items'){ out.items = (FORM_CTX.items||[]).filter(x=>x&&(x.name||itemAmount(x))); return; }
    const el=f.querySelector(`[name="${fd.name}"]`); if(!el) return;
    let v=el.value;
    if(fd.type==='money'||fd.type==='number') v = v===''? '' : num(v);
    out[fd.name]=v;
  });
  return out;
}
function saveForm(ev){
  if(ev) ev.preventDefault();
  const entKey=FORM_CTX.entity, E=ENTITIES[entKey];
  const rec=readForm(entKey);
  const miss=E.fields.filter(f=>f.req && (rec[f.name]===''||rec[f.name]==null)).map(f=>f.label);
  if(miss.length){ toast('必須項目が未入力です：'+miss.join('・'),'err'); return false; }
  if(entKey==='invoices' && !FORM_CTX.id && rec.companyId && (payGrade(rec.companyId,'ar').g==='D' || creditOver(rec.companyId))){
    const s=dunStatus(rec.companyId);
    if(!confirm(`この取引先は ${payGrade(rec.companyId,'ar').g==='D'?`延滞 ${moneyPlain(s.amount)}円（最長${s.maxDays}日）`:''}${creditOver(rec.companyId)?' 与信限度額超過':''} があります。\nそれでも請求書を作りますか？`)) return false;
  }
  // 伝票は保存前に自動計算（番号・期日・合計）
  if(entKey==='invoices'||entKey==='bills') prepareDoc(entKey, rec, FORM_CTX.id);
  const old = FORM_CTX.id ? findById(E.key, FORM_CTX.id) : null;
  if(old) rec.source = old.source;
  commitRecord(E.key, rec, { existingId: FORM_CTX.id });
  closeModal(); renderPage(CURRENT_PAGE); toast('保存しました。','ok');
  return false;
}
function deleteFromForm(entKey,id){
  const E=ENTITIES[entKey];
  if(deleteRecord(E.key,id)){ closeModal(); renderPage(CURRENT_PAGE); }
}
function prepareDoc(entKey, rec, existingId){
  const isInv = entKey==='invoices';
  const key = isInv?'invoices':'bills';
  if(!rec.no){
    const pre = isInv? 'INV' : 'BIL';
    const ym=(rec.bookMonth||thisMonth()).replace('-','');
    const n=(DB[key]||[]).filter(x=>String(x.no||'').startsWith(pre+'-'+ym)).length+1;
    rec.no = `${pre}-${ym}-${String(n).padStart(3,'0')}`;
  }
  if(isInv && !rec.dueDate && rec.companyId){
    const c=findById('companies',rec.companyId);
    if(c) rec.dueDate = dueDateOf(rec.bookMonth||thisMonth(), c.closingDay, c.paySite, c.payDay);
  }
  rec.total = itemsSubtotal(rec.items)+itemsTax(rec.items);
  rec.net   = itemsSubtotal(rec.items);
  if(!rec.status) rec.status='作成中';
  if(['確定','一部入金','入金済','一部支払','支払済','延滞','期日超過'].includes(rec.status)) rec.locked = true;
  /* 請求書を確定で保存したら、そのときの繰越を写す（すでに写してあれば そのまま） */
  if(isInv && rec.locked){
    const prevRec = existingId? findById('invoices',existingId) : null;
    if(prevRec && prevRec.carry) rec.carry = prevRec.carry;
    else rec.carry = invoiceCarry(Object.assign({id:existingId||'__new__'}, rec));
  }
  const old = existingId? findById(key,existingId) : null;
  if(old && old.workerSnapshot) rec.workerSnapshot = old.workerSnapshot;
}

function setYjTab(t){ YJ_TAB=t; renderPage('yojitsu'); }

function planCell(which, fy, mIndex, accountCode){
  const src = which==='forecast'? (DB.forecasts||[]) : (DB.budgets||[]);
  const r = src.find(x=>Number(x.fy)===Number(fy)&&Number(x.mIndex)===Number(mIndex)&&x.accountCode===accountCode);
  return r? num(r.amount) : 0;
}
function setPlanCell(which, fy, mIndex, accountCode, amount){
  const key = which==='forecast'?'forecasts':(which==='adjust'?'actualAdjust':'budgets');
  const list = coll(key);
  let r = list.find(x=>Number(x.fy)===Number(fy)&&Number(x.mIndex)===Number(mIndex)&&x.accountCode===accountCode);
  if(!r){
    if(!num(amount)) return;
    r = { id:uid(which==='forecast'?'FC':(which==='adjust'?'AJ':'BG')), fy:Number(fy), mIndex:Number(mIndex),
          accountCode, amount:num(amount) };
    commitRecord(key, r, {});
  }else{
    r.amount = num(amount); r.updatedAt=new Date().toISOString();
    markDirty(key, r);
  }
}
function onPlanInput(el, which, mIndex, accountCode){
  fmtMoneyInput(el); el.classList.add('dirty');
  clearTimeout(el._t);
  el._t = setTimeout(()=>{ setPlanCell(which, CUR_FY, mIndex, accountCode, el.value); el.classList.remove('dirty'); syncBadge(); }, 500);
}

/** 損益表: 行＝損益の科目、列＝12か月＋累計。表示は 予実対比／実績／予算／見込 を切替。 */
function yjPlTable(fy, act, bud, fc, prev, lastIdx){
  const seg = `<div style="display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap;">
    <div class="seg">
      <button class="${YJ_VIEW==='compare'?'on':''}" onclick="setYjView('compare')">予実対比</button>
      <button class="${YJ_VIEW==='actual'?'on':''}" onclick="setYjView('actual')">実績</button>
      <button class="${YJ_VIEW==='budget'?'on':''}" onclick="setYjView('budget')">予算</button>
      <button class="${YJ_VIEW==='forecast'?'on':''}" onclick="setYjView('forecast')">見込</button>
    </div>
    <span class="muted" style="font-size:11.5px;">金額は税抜。実績は伝票（請求・支払・経費）から自動計算しています。</span></div>`;

  const cell = (row, mi) => {
    const a=act[row.key]?act[row.key][mi]:0, b=bud[row.key]?bud[row.key][mi]:0, f=fc[row.key]?fc[row.key][mi]:0;
    if(row.type==='rate'){
      const base = act[row.base][mi], of = act[row.of][mi];
      return base? `<span class="num">${(of/base*100).toFixed(1)}%</span>` : '<span class="zero">—</span>';
    }
    if(YJ_VIEW==='actual')   return money(a);
    if(YJ_VIEW==='budget')   return money(b);
    if(YJ_VIEW==='forecast') return money(f||b);
    // 予実対比: 実績 / 予算 と 差異
    const diff = a-b;
    const good = row.good===false ? diff<0 : diff>0;
    return `<div class="num" style="line-height:1.35;">${money(a)}
      <div style="font-size:10.5px;color:var(--muted);">予 ${moneyPlain(b)}</div>
      ${b||a?`<div style="font-size:10.5px;" class="${Math.abs(diff)<1?'zero':(good?'plus':'minus')}">${diff>0?'+':''}${moneyPlain(diff)}</div>`:''}</div>`;
  };
  const totCell = (row) => {
    if(row.type==='rate'){
      const base=sum12(act[row.base]), of=sum12(act[row.of]);
      return base? `<span class="num">${(of/base*100).toFixed(1)}%</span>` : '<span class="zero">—</span>';
    }
    const a=sum12(act[row.key]), b=sum12(bud[row.key]);
    if(YJ_VIEW==='actual') return `<b class="num">${moneyPlain(a)}</b>`;
    if(YJ_VIEW==='budget') return `<b class="num">${moneyPlain(b)}</b>`;
    if(YJ_VIEW==='forecast') return `<b class="num">${moneyPlain(sum12(fc[row.key]))}</b>`;
    return `<div class="num"><b>${moneyPlain(a)}</b>
      <div style="font-size:10.5px;color:var(--muted);">予 ${moneyPlain(b)}</div>
      ${b?`<div style="font-size:10.5px;" class="rate">${(a/b*100).toFixed(0)}%</div>`:''}</div>`;
  };

  const head = `<tr><th style="min-width:132px;">科目</th>
    ${FY_MONTH_LABELS.map((m,i)=>`<th class="r" style="${i===lastIdx?'color:var(--primary);':''}">${m}</th>`).join('')}
    <th class="r">年度累計</th><th class="r">着地見込</th></tr>`;
  const body = PL_ROWS.map(row=>{
    const strong = row.strong? 'style="font-weight:700;background:var(--surface-2);"' : '';
    const land = row.type==='rate' ? '<span class="zero">—</span>'
      : `<b class="num">${moneyPlain(landing(fy,row.key,lastIdx))}</b>`;
    return `<tr ${strong}><td ${strong}>${esc(row.label)}</td>
      ${FY_MONTH_LABELS.map((_,mi)=>`<td class="r">${cell(row,mi)}</td>`).join('')}
      <td class="r">${totCell(row)}</td><td class="r">${land}</td></tr>`;
  }).join('');

  return seg+`<div class="table-wrap"><table class="stick1"><thead>${head}</thead><tbody>${body}</tbody></table></div>
    <div class="infobar">「着地見込」＝ 実績（${FY_MONTH_LABELS[lastIdx]}まで）＋ 残り月の見込（見込が無い月は予算）。</div>`;
}

/** 勘定科目別: どの科目がどれだけ動いたか。予実がズレたときに原因を探す画面。 */
function yjAccountTable(fy){
  const groups = ['revenue','cogs','sga','nonop'];
  let html='';
  groups.forEach(kind=>{
    const list = accountsOfKind(kind);
    if(!list.length) return;
    const rows = list.map(a=>{
      const act = seriesByAccount(fy,a.code,'actual'), bud = seriesByAccount(fy,a.code,'budget');
      const ta=sum12(act), tb=sum12(bud);
      if(!ta && !tb) return '';
      return `<tr><td>${esc(a.code)} ${esc(a.label)}</td>
        ${act.map((v,i)=>`<td class="r num">${money(v)}</td>`).join('')}
        <td class="r"><b class="num">${moneyPlain(ta)}</b></td>
        <td class="r num">${moneyPlain(tb)}</td>
        <td class="r">${tb?`<span class="rate ${ta>=tb?(kind==='revenue'?'plus':'minus'):(kind==='revenue'?'minus':'plus')}">${(ta/tb*100).toFixed(0)}%</span>`:'<span class="zero">—</span>'}</td></tr>`;
    }).join('');
    html += `<div class="panel"><div class="panel-hd"><b>${esc(KIND_LABEL[kind])}</b>
        <span class="sub">実績（税抜）／ 年度累計と予算比</span></div>
      <div class="panel-bd tight"><div class="table-wrap" style="border:0;">
        <table class="stick1"><thead><tr><th style="min-width:160px;">勘定科目</th>
          ${FY_MONTH_LABELS.map(m=>`<th class="r">${m}</th>`).join('')}
          <th class="r">累計</th><th class="r">予算</th><th class="r">達成</th></tr></thead>
        <tbody>${rows||`<tr><td colspan="16" class="empty">この区分の実績・予算はまだありません。</td></tr>`}</tbody></table>
      </div></div></div>`;
  });
  return html;
}

/** 予算・見込の入力: 科目×12か月のグリッド。1マス直して即保存。 */
function yjInputTable(fy){

   ⑩ 債権（売掛金）— 目的②
   ========================================================================== */
/* ============================================================================
   ⑩ 回収（売掛金）— 取引先 × 月 の残高で見る（Money Forward 会計の「売掛金」の考え方）
   ----------------------------------------------------------------------------
   ★ 2026-09-14 利用者の指示:
     請求書そのもの（作成・明細・税・PDF・送付・状態）は Money Forward 請求書 が持つ。
     このシステムは「いくら請求し・いくら入り・いくら残っているか」を月ごとに見るだけ。
     → 画面の中心は請求書ではなく、取引先ごとの月末残高。
   ★ 式（ここ1か所だけ。表・元帳・ポップ・KPI はすべて arMonthly を通す）:
       当月末残高 ＝ 前月末残高 ＋ 当月請求額 − 当月入金額
       前月末残高 ＝ それより前の 請求額の累計 − 入金額の累計
     ・請求額 ＝ 計上月（bookMonth）がその月の請求の 税込合計。作成中・取消 は入れない。
     ・入金額 ＝ 入金日がその月の入金（＋先方負担の振込手数料）。取消 は入れない。
     ・請求書の「状態」や 消込（allocations）には頼らない。
   ★ 期限超過額（その時点）＝ 入金期日（休業日の調整後）を過ぎた請求の累計 − その日までの入金の累計
     （入金は古い請求から充てる考え方）。0 未満は 0、残高を超えたら残高。
   ★ 月次の表は保存しない（実績は保存しない約束 §0.10）。accounts_receivable_monthly に
     当たるものは arMonthly() の戻り値 {opening, billed, payment, closing, overdue}。
     請求は invoices（MF から取り込んだものは source:'mf'）、入金は payments（source で出どころを持つ）。
   ========================================================================== */
const AR_LIVE = inv => !!inv && inv.status!=='取消' && inv.status!=='作成中';
const arYmOfInv = inv => ymOfDoc(inv) || String(inv.issueDate||'').slice(0,7);
const arCoName = id => String(companyName(id)).replace(/<[^>]+>/g,'') || '-';
let AR_FILT = { open:false, over:false };

/** 1社ぶんの材料 — 請求と入金を月に振り分けたもの */
function arFacts(companyId){
  const id=String(companyId), bills=[], pays=[];
  (DB.invoices||[]).forEach(i=>{
    if(String(i.companyId)!==id || !AR_LIVE(i)) return;
    const ym=arYmOfInv(i); if(!ym) return;
    bills.push({ ym, amount:docTotal(i), due:effDue(i), doc:i });
  });
  (DB.payments||[]).forEach(p=>{
    if(String(p.companyId)!==id || p.status==='取消' || !p.date) return;
    pays.push({ ym:String(p.date).slice(0,7), date:String(p.date).slice(0,10), amount:received(p), doc:p });
  });
  return { bills, pays };
}
/** 期限超過額（asOf の時点）。ym までに計上した請求だけを見る。 */
function arOverdueAt(f, asOf, ym, closing){
  const dueBilled=f.bills.reduce((s,b)=>(b.ym<=ym && b.due && b.due<asOf)? s+b.amount : s, 0);
  const paid=f.pays.reduce((s,p)=>p.date<=asOf? s+p.amount : s, 0);
  return Math.max(0, Math.min(closing, dueBilled-paid));
}
/** months（YYYY-MM の並び）ごとの 前月残高・請求額・入金額・月末残高・期限超過額 */
function arMonthly(companyId, months, facts){
  const f=facts||arFacts(companyId), tm=thisMonth(), t=today();
  return months.map(ym=>{
    let opening=0, billed=0, payment=0;
    f.bills.forEach(b=>{ if(b.ym<ym) opening+=b.amount; else if(b.ym===ym) billed+=b.amount; });
    f.pays.forEach(p=>{ if(p.ym<ym) opening-=p.amount; else if(p.ym===ym) payment+=p.amount; });
    const closing=opening+billed-payment, future=ym>tm;
    const overdue=future? 0 : arOverdueAt(f, ym<tm? monthEnd(ym) : t, ym, closing);
    return { companyId:String(companyId), ym, opening, billed, payment, closing, overdue, future };
  });
}
function arStatus(bal, over){ return over>0? '期限超過' : (bal>0? '未回収あり' : '正常'); }
const arStatusBadge = s => `<span class="ar-st ${s==='期限超過'?'s-over':(s==='未回収あり'?'s-open':'s-ok')}">${s}</span>`;
/** 売掛金の動きがある取引先（請求か入金が1件でもある会社） */
function arCompanyIds(){
  const ids=new Set();
  (DB.invoices||[]).forEach(i=>{ if(AR_LIVE(i) && i.companyId) ids.add(String(i.companyId)); });
  (DB.payments||[]).forEach(p=>{ if(p.status!=='取消' && p.companyId) ids.add(String(p.companyId)); });
  return [...ids];
}
/** 今月の全社合計（KPI） */
function arTotals(){
  const tm=thisMonth(); const o={ billed:0, payment:0, balance:0, overdue:0, openN:0, overN:0 };
  arCompanyIds().forEach(id=>{
    const r=arMonthly(id,[tm])[0];
    o.billed+=r.billed; o.payment+=r.payment; o.balance+=r.closing; o.overdue+=r.overdue;
    if(r.closing>0) o.openN++; if(r.overdue>0) o.overN++;
  });
  return o;
}
const arYmLabel = ym => `${Number(ym.slice(0,4))}年${Number(ym.slice(5))}月`;
const arAmt = v => v<0? '−'+moneyPlain(-v) : moneyPlain(v);

function viewArBook(){
  const p='arbook', fy=CUR_FY, months=fyMonths(fy), tm=thisMonth();
  const all=arCompanyIds().map(id=>{
    const f=arFacts(id), m=arMonthly(id, months, f), now=arMonthly(id,[tm],f)[0];
    return { id, name:arCoName(id), m, bal:now.closing, over:now.overdue, st:arStatus(now.closing, now.overdue) };
  });
  const q=(SEARCH[p]||'').trim().toLowerCase();
  let rows=all.filter(r=>{
    if(q){ const c=findById('companies',r.id)||{}; if(!((r.name||'')+(c.kana||'')).toLowerCase().includes(q)) return false; }
    if(AR_FILT.open && !(r.bal>0)) return false;

/* ---------- 入金の充て先（古い請求から自動）----------
   新しい画面では請求書ごとの消込をしない。ただし 督促・資金繰り・API は
   請求書ごとの残高（allocations）で動いているので、裏で古い順に充てて食い違わないようにする。 */
function arFifoAlloc(companyId, amount, paymentId){
  const old=paymentId? (findById('payments',paymentId)||{}).allocations||[] : [];
  const mine={}; old.forEach(a=>mine[a.invoiceId]=(mine[a.invoiceId]||0)+num(a.amount));
  let rest=num(amount); const out=[];
  (DB.invoices||[]).filter(i=>String(i.companyId)===String(companyId) && AR_LIVE(i))
    .sort((a,b)=>String(a.dueDate||arYmOfInv(a)).localeCompare(String(b.dueDate||arYmOfInv(b))) || String(a.no||'').localeCompare(String(b.no||'')))
    .forEach(i=>{
      if(rest<=0) return;
      const bal=balanceOfInvoice(i)+(mine[i.id]||0);
      const use=Math.min(bal, rest);
      if(use>0){ out.push({ invoiceId:i.id, amount:use }); rest-=use; }
    });
  return out;
}
/** 請求を取り込んだあと、充て先の決まっていない入金の残りを 古い請求から充てる（既存の充て先は変えない） */
function arApplyUnallocated(companyId){
  let n=0;
  (DB.payments||[]).filter(p=>String(p.companyId)===String(companyId) && p.status!=='取消')
    .sort((a,b)=>String(a.date||'').localeCompare(String(b.date||'')))
    .forEach(p=>{
      const used=(p.allocations||[]).reduce((s,a)=>s+num(a.amount),0), rest=received(p)-used;
      if(rest<=0) return;
      const add=arFifoAlloc(companyId, rest, null);
      if(!add.length) return;
      p.allocations=(p.allocations||[]).concat(add); p.updatedAt=new Date().toISOString();
      markDirty('payments', p); n++;
    });
  return n;
}

/* ============================================================================
   Money Forward 請求書 → このシステムの請求（invoices, source:'mf'）
   ----------------------------------------------------------------------------
   ・取り方は2つ。どちらも同じ形 {mfId, number, partnerId, partnerName, billingDate, salesDate,
     dueDate, subtotal, total} にそろえてから、同じ手順で取り込む。
       ① API（サーバーの /mf/billings。接続は管理者が1回）  ② MF から出した CSV
   ・取引先の対応: 取引先に覚えさせた MF の取引先ID（mfPartnerId）→ 無ければ 名前（株式会社などを除いて一致）
     → それでも無ければ 画面で選ぶ。選んだ対応は取引先に保存し、次からは自動。
   ・同じ請求は mfId（CSV で ID が無いときは 請求書番号）で見分けて 更新する（二重にしない）。
   ・計上月 ＝ 売上計上日の月（無ければ請求日の月）。入金期日 ＝ MF の支払期限。
   ・MF で消した請求は、ここでは自動で消しません（取消は人が決める）。
   ========================================================================== */
let MFI=null;     // 取り込みの作業中データ
const arNormName = s => String(s||'').normalize('NFKC').replace(/株式会社|有限会社|合同会社|合資会社|合名会社|一般社団法人|一般財団法人|\(株\)|\(有\)|\(同\)|㈱|㈲|御中|様|\s|　/g,'').toLowerCase();

async function openMfImport(){
  if(!(myRole()==='Admin'||myRole()==='Manager')){ toast('取り込めるのは 管理者・マネージャー だけです。','err'); return; }
  const fy=CUR_FY;
  MFI={ items:[], source:'', map:{}, status:null, from:`${fy}-08-01`, to:today() };
  mfDraw();
  try{
    const r=await fetch(API_BASE+'/mf/status',{headers:headers()});
    MFI.status = r.ok? await r.json() : { configured:false, connected:false, error:'HTTP '+r.status };
  }catch(e){ MFI.status={ configured:false, connected:false, error:'通信に失敗しました' }; }
  if(MFI && !MFI.items.length) mfDraw();
}
function mfDraw(){
  if(!MFI) return;
  const s=MFI.status;
  const apiBox = !s? '<div class="muted">接続の状態を確認しています…</div>'
    : !s.configured? `<div class="muted">API は未設定です（サーバーの .env に MF_CLIENT_ID / MF_CLIENT_SECRET を入れると使えます）。下の CSV で取り込めます。</div>`
    : !s.connected? `<div>Money Forward と未接続です。${isAdmin()?`<button class="btn sm" onclick="mfConnect()">接続する</button>`:'管理者に「接続する」を依頼してください。'}</div>`
    : `<div class="ar-mf-row">期間（請求日）<input type="date" id="mfFrom" value="${attr(MFI.from)}"> 〜 <input type="date" id="mfTo" value="${attr(MFI.to)}">

    <div class="mdsub">請求書の中身（明細・税・PDF）は取り込みません。取引先・請求日・計上日・期日・金額 だけを 売掛金 に入れます。</div>
    <div class="ar-mf-src">

        <input type="file" accept=".csv,text/csv" onchange="mfReadCsv(this.files&&this.files[0])">
        <div class="fhelp">MF 請求書の一覧から出力した CSV。見出しで列を判断します（取引先名・請求日・合計金額 など）。</div></div>

      ${MFI.items.length?`<button class="btn" onclick="mfApply()">この内容で取り込む</button>`:''}</div>`,'xl');
}

function mfReadCsv(file){
  if(!file) return;
  const fr=new FileReader();
  fr.onload=()=>{
    const buf=fr.result; let text=new TextDecoder('utf-8').decode(buf);
    if(text.includes('�')){ try{ text=new TextDecoder('shift_jis').decode(buf); }catch(e){} }   // MF の CSV は Shift_JIS のことがある
    const res=mfParseCsv(text);
    if(res.error){ document.getElementById('mfPrev').innerHTML=`<div class="alertbar">${esc(res.error)}</div>`; return; }
    mfSetItems(res.items, 'csv');
  };
  fr.readAsArrayBuffer(file);
}
function arCsvRows(text){
  const rows=[]; let row=[], cell='', q=false; const s=String(text||'').replace(/^﻿/,'');
  for(let i=0;i<s.length;i++){ const ch=s[i];
    if(q){ if(ch==='"'&&s[i+1]==='"'){ cell+='"'; i++; } else if(ch==='"') q=false; else cell+=ch; }
    else if(ch==='"') q=true; else if(ch===','){ row.push(cell); cell=''; }
    else if(ch==='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; } else if(ch!=='\r') cell+=ch; }
  if(cell!==''||row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}
/** MF 請求書 CSV → そろえた形。列は見出しの候補で探す（出力の設定で順番が変わるため）。 */
function mfParseCsv(text){
  const rows=arCsvRows(text); if(rows.length<2) return { error:'CSV に行がありません。' };
  const head=rows[0].map(h=>String(h).trim().normalize('NFKC'));
  const col=names=>{ for(const n of names){ const i=head.findIndex(h=>h===n.normalize('NFKC')); if(i>=0) return i; } return -1; };
  const C={ id:col(['ID','請求書ID','id']), number:col(['請求書番号','請求番号','billing_number']),
    partnerId:col(['取引先ID','partner_id']), partner:col(['取引先名','取引先','請求先','partner_name']),
    billingDate:col(['請求日','発行日','billing_date']), salesDate:col(['売上計上日','計上日','sales_date']),
    dueDate:col(['お支払期限','支払期限','入金期日','支払期日','due_date']),
    total:col(['合計金額','請求金額','合計','金額(税込)','税込金額','total_price']), subtotal:col(['小計','小計金額','税抜金額','金額(税抜)','subtotal_price']) };
  const miss=[['取引先名',C.partner],['請求日',C.billingDate],['合計金額',C.total]].filter(x=>x[1]<0).map(x=>x[0]);
  if(miss.length) return { error:`CSV に必要な列が見つかりません：${miss.join('・')}（見つかった見出し：${head.slice(0,12).join(' / ')}）` };
  const d=v=>{ const m=String(v||'').trim().match(/^(\d{4})[\/\-年.](\d{1,2})[\/\-月.](\d{1,2})/); return m? `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}` : ''; };
  const v=(r,i)=>i>=0? String(r[i]??'').trim() : '';
  const items=rows.slice(1).map(r=>({
    mfId: v(r,C.id), number:v(r,C.number), partnerId:v(r,C.partnerId), partnerName:v(r,C.partner),
    billingDate:d(v(r,C.billingDate)), salesDate:d(v(r,C.salesDate)), dueDate:d(v(r,C.dueDate)),
    total:Math.round(num(v(r,C.total))), subtotal: C.subtotal>=0 && v(r,C.subtotal)!==''? Math.round(num(v(r,C.subtotal))) : null,
  })).filter(x=>x.partnerName && (x.billingDate||x.salesDate) && x.total);
  items.forEach(x=>{ if(!x.mfId) x.mfId = x.number? 'no:'+x.number : `csv:${arNormName(x.partnerName)}:${x.billingDate}:${x.total}`; });
  return items.length? { items } : { error:'取り込める行がありませんでした（取引先名・請求日・合計金額 が入っている行が必要です）。' };
}
function mfSetItems(items, source){
  MFI.items=items; MFI.source=source; MFI.map={};
  const cos=(DB.companies||[]).filter(c=>!c._gone);
  const byPid={}; cos.forEach(c=>{ if(c.mfPartnerId) byPid[String(c.mfPartnerId)]=c; });
  const byName={}; cos.forEach(c=>{ const k=arNormName(c.mfPartnerName||c.name); if(!k) return; (byName[k]=byName[k]||[]).push(c); });
  items.forEach(x=>{
    const key=mfPartnerKey(x); if(MFI.map[key]!==undefined) return;
    let c=x.partnerId&&byPid[x.partnerId];
    if(!c){ const hit=byName[arNormName(x.partnerName)]||[]; if(hit.length===1) c=hit[0]; }
    MFI.map[key]= c? String(c.id) : '';
  });
  mfDraw();
}
const mfPartnerKey = x => x.partnerId? 'id:'+x.partnerId : 'nm:'+arNormName(x.partnerName);
/** 1件の MF 請求 → invoices の形 */
function mfToInvoice(x, companyId){
  const bm=(x.salesDate||x.billingDate).slice(0,7);
  const rec={ companyId, bookMonth:bm, issueDate:x.billingDate||x.salesDate, dueDate:x.dueDate||'', total:num(x.total),
    no:x.number||'', note:x.title||'', items:[], status:'確定', locked:true, source:'mf', mfId:String(x.mfId), mfPartnerId:x.partnerId||'' };
  if(x.subtotal!=null && x.subtotal!=='') rec.subtotal=num(x.subtotal);
  return rec;
}
/** 取り込み先の既存請求（mfId → 無ければ 同じ取引先の同じ請求書番号の MF 請求） */
function mfExisting(x, companyId){
  const list=(DB.invoices||[]).filter(i=>i.source==='mf');
  return list.find(i=>String(i.mfId)===String(x.mfId))
    || (x.number? list.find(i=>String(i.no)===String(x.number) && String(i.companyId)===String(companyId)) : null) || null;
}
/** 取り込みの計画（画面の確認と、実際の取り込みで同じものを使う） */
function mfPlan(){
  const plan={ add:[], upd:[], same:[], unmapped:[], dupWarn:[] };
  MFI.items.forEach(x=>{
    const cid=MFI.map[mfPartnerKey(x)];
    if(!cid || cid==='__skip'){ plan.unmapped.push(x); return; }
    const rec=mfToInvoice(x, cid==='__new'? '__new' : cid), ex=cid==='__new'? null : mfExisting(x, cid);
    if(ex){
      if(ex.status==='取消') rec.status='取消';          // こちらで取消にした請求は、取り込み直しても生き返らせない
      const keys=['companyId','bookMonth','issueDate','dueDate','total','subtotal','no'];
      (keys.some(k=>String(ex[k]??'')!==String(rec[k]??'')) || String(ex.mfId)!==String(rec.mfId))? plan.upd.push({x,rec,ex}) : plan.same.push({x,rec,ex});
    }else{
      plan.add.push({x,rec});
      if(cid!=='__new' && (DB.invoices||[]).some(i=>i.source!=='mf' && AR_LIVE(i) && String(i.companyId)===String(cid) && arYmOfInv(i)===rec.bookMonth)) plan.dupWarn.push({x,rec});
    }
  });
  return plan;
}

    <div class="table-wrap" style="max-height:46vh;"><table>

          <option value="">— 選んでください —</option>

function mfApply(){
  if(!MFI || !MFI.items.length) return;
  /* 新しく作る取引先を先に作り、対応表を本物の ID に置き換える */
  const newCo={};
  Object.keys(MFI.map).forEach(k=>{
    if(MFI.map[k]!=='__new') return;
    const x=MFI.items.find(i=>mfPartnerKey(i)===k); if(!x) return;
    const { record }=commitRecord('companies', { name:x.partnerName, kind:'得意先', closingDay:31, paySite:1, payDay:31, taxCat:'課税10%',
      mfPartnerId:x.partnerId||'', mfPartnerName:x.partnerName }, {});
    newCo[k]=String(record.id); MFI.map[k]=String(record.id);
  });
  const P=mfPlan();
  if(!P.add.length && !P.upd.length){ toast('取り込む変更はありませんでした。','ok'); return; }
  if(P.dupWarn.length && !confirm(`同じ取引先・同じ計上月に このシステムの請求がすでにある分が ${P.dupWarn.length}件あります。\n二重計上にならないか確認しましたか？ 取り込みますか？`)) return;
  const touched=new Set();
  P.add.forEach(({rec})=>{ commitRecord('invoices', rec, {}); touched.add(String(rec.companyId)); });
  P.upd.forEach(({rec,ex})=>{ commitRecord('invoices', rec, { existingId:ex.id }); touched.add(String(rec.companyId)); touched.add(String(ex.companyId)); });
  /* 取引先に MF の取引先を覚えさせる（次回から自動で対応） */
  Object.keys(MFI.map).forEach(k=>{
    const cid=MFI.map[k]; if(!cid || cid==='__skip' || newCo[k]) return;
    const x=MFI.items.find(i=>mfPartnerKey(i)===k), c=findById('companies',cid); if(!x||!c) return;
    if(String(c.mfPartnerId||'')!==String(x.partnerId||'') || String(c.mfPartnerName||'')!==x.partnerName)
      commitRecord('companies', { mfPartnerId:x.partnerId||'', mfPartnerName:x.partnerName }, { existingId:cid });
  });
  touched.forEach(id=>arApplyUnallocated(id));
  const msg=`取り込みました：新規 ${P.add.length}件 ／ 更新 ${P.upd.length}件${P.unmapped.length?` ／ 未対応で見送り ${P.unmapped.length}件`:''}`;
  MFI=null; closeModal(); renderPage(CURRENT_PAGE); toast(msg,'ok');
}

    const rules=rulesOfCompany(c.id).filter(r=>r.kind!=='spot');
    const exists=(DB.invoices||[]).some(i=>String(i.companyId)===String(c.id)&&i.bookMonth===ym&&i.status!=='取消');
    if(exists){ already.push(c); return; }
    if(!rules.length){ if(arBalanceOf(c.id)>0||c.kind==='得意先') noRule.push(c); return; }
    const {items,snapshot}=autoItemsFor(c.id,ym);
    if(!items.length) return;
    targets.push({company:c, items, snapshot, total:itemsSubtotal(items)+itemsTax(items)});
  });
  GEN_CTX={ ym, targets };
  const rows=targets.map((t,i)=>`<tr>
    <td><input type="checkbox" class="genck" data-i="${i}" checked></td>
    <td><b>${esc(t.company.name)}</b>${genRisk(t.company.id)}</td>
    <td style="white-space:normal;font-size:11.5px;" class="muted">${t.items.map(x=>esc(x.name)+(x.qty>1?` ${x.qty}名×${moneyPlain(x.price)}`:'')).join('<br>')}</td>
    <td class="r num"><b>${moneyPlain(t.total)}</b></td>
    <td>${esc(dueDateOf(t.ym||GEN_CTX.ym, t.company.closingDay, t.company.paySite, t.company.payDay))}</td></tr>`).join('');
  box.innerHTML = `
    ${targets.length? `<div class="table-wrap"><table>
      <thead><tr><th style="width:34px;"><input type="checkbox" checked onchange="document.querySelectorAll('.genck').forEach(c=>c.checked=this.checked)"></th>
        <th>取引先</th><th>内容</th><th class="r">請求額（税込）</th><th>入金期日</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
      <div class="infobar" style="margin-top:8px;">合計 <b class="num">${moneyPlain(targets.reduce((s,t)=>s+t.total,0))}</b> 円 ／ ${targets.length}社。作成後は「作成中」です。内容を確認してから確定してください。</div>`
      : `<div class="warnbar">この月に自動作成できる請求はありません。請求ルールが未設定か、すでに作成済みです。</div>`}
    ${already.length? `<div class="infobar">すでに ${ym} の請求がある取引先（作成しません）：${already.map(c=>esc(c.name)).join('、')}</div>`:''}
    ${noRule.length? `<div class="warnbar">請求ルールが未設定の取引先：${noRule.map(c=>`<a onclick="closeModal();openRules('${c.id}')" style="cursor:pointer;color:var(--primary);font-weight:600;">${esc(c.name)}</a>`).join('、')}
      <div style="margin-top:4px;font-weight:400;">ルールを作ると翌月から自動で請求に入ります。単発の請求は「＋ 個別に請求を作成」から。</div></div>`:''}`;
}
/** 請求を作る前に知らせる危険: 長い延滞（評価D）・与信限度額超過 */
function genRisk(companyId){
  const g=payGrade(companyId,'ar'), over=creditOver(companyId);
  if(g.g!=='D' && !over) return '';
  const s=dunStatus(companyId);
  return `<div style="font-size:11px;color:var(--danger);margin-top:2px;">${IC.warn}
    ${g.g==='D'?`延滞 ${moneyPlain(s.amount)}円（最長${s.maxDays}日）`:''}${g.g==='D'&&over?' ・ ':''}${over?'与信限度額を超えています':''}</div>`;
}
function genGo(){
  if(!GEN_CTX||!GEN_CTX.targets.length){ toast('作成する対象がありません。','err'); return; }
  const picked=[...document.querySelectorAll('.genck:checked')].map(c=>GEN_CTX.targets[Number(c.dataset.i)]);
  if(!picked.length){ toast('対象を選んでください。','err'); return; }
  /* 止めはしない（請求するかは人が決める）。ただし、分かったうえで作ってもらう */
  const risky=picked.filter(t=>payGrade(t.company.id,'ar').g==='D' || creditOver(t.company.id));
  if(risky.length && !confirm(`次の取引先は 長い延滞 か 与信限度額超過 があります：\n\n${risky.map(t=>'・'+t.company.name).join('\n')}\n\nそれでも請求書を作りますか？`)) return;
  let n=0;
  picked.forEach(t=>{
    const rec={ companyId:t.company.id, bookMonth:GEN_CTX.ym, issueDate:'', status:'作成中',
      items:t.items, workerSnapshot:t.snapshot, note:'自動作成（請求ルール）' };
    prepareDoc('invoices', rec, null);
    rec.dueDate = dueDateOf(GEN_CTX.ym, t.company.closingDay, t.company.paySite, t.company.payDay);
    commitRecord('invoices', rec, {}); n++;
  });
  closeModal(); renderPage('invoices'); toast(`${n}件の請求書（作成中）を作成しました。`,'ok');
}

function openPaymentFor(invoiceId){

function drawPaymentModal(){

      ${bal.overdue>0?` ・ <span class="minus">うち期限超過 ¥${moneyPlain(bal.overdue)}</span>`:''}${c.id?' （この入金を含む）':''}</div>` : ''}

      ${c.id?`<button class="btn danger" onclick="payDelete()">削除</button>`:''}

      <button class="btn" onclick="paySave()">保存</button></div></div>`,'lg');
}
function payAlloc(invId,v){
  const amt=num(v);
  PAY_CTX.allocations=(PAY_CTX.allocations||[]).filter(a=>String(a.invoiceId)!==String(invId));
  if(amt) PAY_CTX.allocations.push({invoiceId:invId, amount:amt});
  payRefreshRest();
}
function payRefreshRest(){
  const el=document.getElementById('payRest'); if(!el) return;
  const s=(PAY_CTX.allocations||[]).reduce((t,a)=>t+num(a.amount),0), rest=num(PAY_CTX.amount)-s;
  el.innerHTML=`消込合計 <b class="num">${moneyPlain(s)}</b> ／ 未消込 <b class="num ${rest?(rest>0?'minus':'plus'):''}">${moneyPlain(rest)}</b>`;
}
function payAuto(){
  let rest=num(PAY_CTX.amount)+num(PAY_CTX.fee);
  const cur={}; (PAY_CTX.allocations||[]).forEach(a=>cur[a.invoiceId]=num(a.amount));
  PAY_CTX.allocations=[];
  openInvoices().filter(i=>String(i.companyId)===String(PAY_CTX.companyId))
    .sort((a,b)=>String(a.dueDate||'').localeCompare(String(b.dueDate||'')))
    .forEach(i=>{
      if(rest<=0) return;
      const bal=balanceOfInvoice(i)+(PAY_CTX.id?(cur[i.id]||0):0);
      const use=Math.min(bal,rest);
      if(use>0){ PAY_CTX.allocations.push({invoiceId:i.id, amount:use}); rest-=use; }
    });
  drawPaymentModal();
}
function paySave(){
  const c=PAY_CTX;
  if(!c.companyId||!num(c.amount)){ toast('取引先と入金額を入力してください。','err'); return; }
  /* 充て先は 古い請求から自動。取引先・金額が変わっていなければ 今の充て先をそのまま使う */
  const old=c.id? findById('payments',c.id) : null;
  const same = old && String(old.companyId)===String(c.companyId) && num(old.amount)===num(c.amount) && num(old.fee)===num(c.fee);
  const allocations = same? (old.allocations||[]) : arFifoAlloc(c.companyId, num(c.amount)+num(c.fee), c.id);
  commitRecord('payments', { companyId:c.companyId, date:c.date, amount:num(c.amount), fee:num(c.fee),
    method:c.method, note:c.note, allocations, status:'確定' }, { existingId:c.id });
  closeModal(); renderPage(CURRENT_PAGE); renderNav(); toast('入金を記録しました。','ok');
}
function payDelete(){
  if(!PAY_CTX.id) return;
  if(deleteRecord('payments', PAY_CTX.id, '入金記録')){ closeModal(); renderPage(CURRENT_PAGE); }
}

function poAlloc(billId,v){
  const amt=num(v);
  PO_CTX.allocations=(PO_CTX.allocations||[]).filter(a=>String(a.billId)!==String(billId));

  poRest();
}
function poRest(){
  const el=document.getElementById('poRest'); if(!el) return;
  const s=(PO_CTX.allocations||[]).reduce((t,a)=>t+num(a.amount),0), rest=num(PO_CTX.amount)-s;
  el.innerHTML=`消込合計 <b class="num">${moneyPlain(s)}</b> ／ 未消込 <b class="num ${rest?'minus':''}">${moneyPlain(rest)}</b>`;
}
function poAuto(){
  let rest=num(PO_CTX.amount);
  const cur={}; (PO_CTX.allocations||[]).forEach(a=>cur[a.billId]=num(a.amount));
  PO_CTX.allocations=[];
  openBills().filter(b=>String(b.companyId)===String(PO_CTX.companyId))
    .sort((a,b)=>String(a.dueDate||'').localeCompare(String(b.dueDate||'')))
    .forEach(b=>{ if(rest<=0) return; const bal=balanceOfBill(b)+(PO_CTX.id?(cur[b.id]||0):0);
      const use=Math.min(bal,rest); if(use>0){ PO_CTX.allocations.push({billId:b.id,amount:use}); rest-=use; } });
  drawPayoutModal();
}

/* ============================================================================
   勘定科目の登録 — 大分類 › 中分類 › 小分類（もっと深くもできる）
   ----------------------------------------------------------------------------
   利用者の指示（2026-09-13）:「勘定科目を 大・中・小 で定義する画面がほしい。
   さらに増やせるように。どの階層でも、その下の対象（建物など）を一覧で見たい」

   決めごと（ここを外すと数字が合わなくなります）:
   ・区分（収益／売上原価／販管費／営業外）は いちばん上でだけ決め、下は受け継ぐ。
     途中で変えられると、同じ科目が損益の2か所に出てしまうため。
   ・伝票・費目に選べるのは <b>末端（子を持たない科目）</b>だけ。
     親も選べると「親の金額＋子の金額」で二重に数えてしまう。
   ・コードは今までのまま。上に器（大分類）をかぶせるだけなので、
     すでに入っている請求・支払・費用・予算は1行も書き換えません。
   ========================================================================== */
const ACC_ROOTS = [
  { code:'R4', label:'売上高',   kind:'revenue' },
  { code:'R5', label:'売上原価', kind:'cogs' },
  { code:'R6', label:'販売費及び一般管理費', kind:'sga' },
  { code:'R7', label:'営業外損益', kind:'nonop' },
];
const accountById   = id   => (DB.accounts||[]).find(a=>String(a.id)===String(id)) || null;
const accountByCode = code => accounts().find(a=>String(a.code)===String(code)) || null;
const accountChildren = parentId => accounts().filter(a=>String(a.parentId||'')===String(parentId||''))
  .slice().sort((a,b)=> (Number(a.order||0)-Number(b.order||0)) || String(a.code||'').localeCompare(String(b.code||'')));
const accountRoots  = () => accountChildren('');
const accountIsLeaf = a  => !!a && !accountChildren(a.id).length;
/** 親をたどって区分を決める（自分に区分が無ければ受け継ぐ） */
function accountKindOf(a){
  let cur=a, guard=0;
  while(cur && !cur.kind && cur.parentId && guard++<12) cur=accountById(cur.parentId);
  return cur && cur.kind ? cur.kind : '';
}
/** 「販管費 › 地代家賃 › 電気代」 */
function accountPath(code){
  let a=accountByCode(code), out=[], guard=0;
  while(a && guard++<12){ out.unshift(a); a = a.parentId? accountById(a.parentId) : null; }
  return out;
}
const accountPathLabel = code => accountPath(code).map(a=>a.label).join(' › ') || String(code||'-');
/** その科目と、その下にぶら下がる全部のコード（集計に使う） */
function accountCodesUnder(code){
  const a=accountByCode(code); if(!a) return [code];
  const out=[]; (function walk(n){ out.push(n.code); accountChildren(n.id).forEach(walk); })(a);
  return out;
}
/** その科目を使っている伝票・費目・予算の数（消してよいかの判断に出す） */
function accountUsage(code){
  let n=0;
  const cnt = arr => (arr||[]).forEach(x=>{ if(String(x.accountCode)===String(code)) n++; });
  (DB.invoices||[]).forEach(i=>cnt(i.items)); (DB.bills||[]).forEach(b=>cnt(b.items));
  cnt(DB.expenses); cnt(DB.costItems); cnt(DB.budgets); cnt(DB.forecasts); cnt(DB.actualAdjust); cnt(DB.billingRules);
  return n;
}
/** 選べるのは末端だけ。親は見出しとして出す（選べない）。 */
function accountOptionsHtml(selected, kindFilter){
  let html='';
  (function walk(parentId, depth){
    accountChildren(parentId).forEach(a=>{
      if(a.active===false) return;
      const leaf=accountIsLeaf(a), kind=accountKindOf(a);
      const kids=accountChildren(a.id);
      if(kindFilter && leaf && kind!==kindFilter) return;
      const pad='　'.repeat(depth);
      if(leaf) html += `<option value="${attr(a.code)}" ${String(a.code)===String(selected)?'selected':''}>${esc(pad+a.label)}（${esc(a.code)}）</option>`;
      else     html += `<option disabled>${esc(pad+'── '+a.label)}</option>`;
      if(kids.length) walk(a.id, depth+1);
    });
  })('',0);
  /* 木がまだ無い（初期セット前）ときは、今までどおり平らな一覧を出す */
  if(!html) html = accounts().filter(a=>!kindFilter||a.kind===kindFilter)
    .map(a=>`<option value="${attr(a.code)}" ${String(a.code)===String(selected)?'selected':''}>${esc(a.code+' '+a.label)}（${esc(KIND_LABEL[a.kind]||'')}）</option>`).join('');
  return html;
}
/** 階層がもう作られているか。
    ★ 「親のいない科目があるか」で見てはいけない — 平らな一覧はみんな親がいない。
      「親を持つ科目が1つでもあるか」で見る。 */
const accTreeReady = () => accounts().some(a=>a.parentId);

/* ---------- 画面 ---------- */
function viewAccounts(){
  const canE=canEdit('settings');
  const fy=CUR_FY;
  const roots=accountRoots();

  const rowsHtml = (parentId, depth) => accountChildren(parentId).map(a=>{
    const kids=accountChildren(a.id), leaf=!kids.length, use=accountUsage(a.code);
    const codes=accountCodesUnder(a.code);
    const amt=codes.reduce((s,c)=>s+sum12(seriesByAccount(fy,c,'actual')),0);
    const lv=['大分類','中分類','小分類'][depth] || `第${depth+1}階層`;
    return `<tr class="${depth===0?'totrow':''}" style="${a.active===false?'opacity:.45;':''}">
      <td style="padding-left:${8+depth*22}px;">
        ${depth?'<span class="muted" style="font-size:11px;">└ </span>':''}<b>${esc(a.label)}</b>
        ${a.active===false?' <span class="badge b-gray">停止</span>':''}
        ${leaf?'':` <span class="muted" style="font-size:10.5px;">（${kids.length}件）</span>`}
        <div class="muted" style="font-size:10.5px;">${esc(lv)}${leaf?' ・ 伝票で選べます':' ・ 見出し（選べません）'}</div></td>
      <td class="muted" style="font-size:11.5px;">${esc(a.code)}</td>
      <td>${depth===0? `<span class="badge b-blue">${esc(KIND_LABEL[a.kind]||'')}</span>` : `<span class="muted" style="font-size:11px;">${esc(KIND_LABEL[accountKindOf(a)]||'')}</span>`}</td>
      <td class="r num">${use? use+'件' : '<span class="zero">—</span>'}</td>
      <td class="r num">${amt? moneyPlain(amt) : '<span class="zero">—</span>'}</td>
      <td>${canE? `<a class="pillbtn pill-new" onclick="accNodeForm('','${attr(a.id)}')">＋子</a>
        <a class="pillbtn pill-save" onclick="accNodeForm('${attr(a.id)}')">編集</a>
        <a class="pillbtn" onclick="accMove('${attr(a.id)}',-1)">↑</a>
        <a class="pillbtn" onclick="accMove('${attr(a.id)}',1)">↓</a>`:''}</td></tr>`
      + (kids.length? rowsHtml(a.id, depth+1) : '');
  }).join('');

  const body = accTreeReady()
    ? `<div class="table-wrap"><table>
        <thead><tr><th style="min-width:280px;">科目</th><th style="min-width:70px;">コード</th><th style="min-width:90px;">区分</th>
          <th class="r" style="min-width:80px;">使用中</th><th class="r" style="min-width:110px;">${fy}年度 実績</th><th style="min-width:170px;"></th></tr></thead>
        <tbody>${rowsHtml('',0)}</tbody></table></div>`
    : `<div class="warnbar">まだ階層が作られていません。「初期セット」を押すと、いま使っている勘定科目を
        <b>売上高／売上原価／販売費及び一般管理費／営業外損益</b> の4つの大分類に振り分けます。<br>
        <span style="font-weight:400;">コードも名前も変えません。いま入っている請求・支払・費用・予算はそのまま動きます。</span></div>`;

  return pageShell({ title:'勘定科目の登録', count:accounts().length,

    tools:`${canE&&!accTreeReady()?`<button class="btn" onclick="accInitTree()">初期セット（今の科目を4分類に振り分け）</button>`:''}
      ${canE&&accTreeReady()?`<button class="btn" onclick="accNodeForm('','')">＋ 大分類を追加</button>`:''}
      ${toolsMenu(`<button class="btn secondary" onclick="goto('kbunrui')">分類別の集計を見る</button>
        <button class="btn secondary" onclick="exportCsvAccounts()">${IC.doc} CSV出力</button>`)}`,

      伝票や費目で選べるのは <b>末端の科目</b>（子を持たないもの）だけです。親も選べると、親と子で同じお金を二重に数えてしまうためです。<br>
      使用中の件数が出ている科目は、消す前に伝票の付け替えが必要です。使わなくなったものは「停止」にすると、新しく選べなくなります（過去の数字はそのまま）。</div>` });
}
/** 今ある平らな科目を、区分ごとの大分類の下にぶら下げる。コードは触らない。 */
function accInitTree(){
  if(!canEdit('settings')){ toast('権限がありません。','err'); return; }
  if(!confirm('いま使っている勘定科目を、4つの大分類の下に振り分けます。\nコードも名前も金額も変わりません。よろしいですか？')) return;
  /* まだ DB に科目が1件も無ければ、既定の科目をそのまま登録してから木にする */
  if(!(DB.accounts||[]).length) DEFAULT_ACCOUNTS.forEach((a,i)=>commitRecord('accounts',{...a, order:i+1},{}));
  const rootId={};
  ACC_ROOTS.forEach((r,i)=>{
    let ex=(DB.accounts||[]).find(a=>a.code===r.code);
    if(!ex) ex=commitRecord('accounts',{...r, parentId:'', order:i+1},{}).record;
    rootId[r.kind]=ex.id;
  });
  (DB.accounts||[]).forEach(a=>{
    if(ACC_ROOTS.some(r=>r.code===a.code)) return;
    if(a.parentId) return;
    a.parentId = rootId[a.kind] || rootId.sga;
    if(!a.order) a.order = Number(String(a.code).replace(/\D/g,'')) || 0;
    markDirty('accounts', a);
  });
  renderPage('accounts'); toast('初期セットしました。ここから 中分類・小分類 を足せます。','ok');
}

function accNodeSave(id, parentId){
  const label=(document.getElementById('acL').value||'').trim();
  const code=(document.getElementById('acC').value||'').trim();
  if(!label||!code){ toast('名称とコードを入れてください。','err'); return; }
  const dup=accounts().find(a=>a.code===code && String(a.id)!==String(id));
  if(dup){ toast(`コード ${code} は「${dup.label}」で使われています。`,'err'); return; }
  const rec={ label, code, parentId:parentId||'',
    order:num(document.getElementById('acO').value),
    active: document.getElementById('acA').value==='1' };
  const kEl=document.getElementById('acK');
  if(kEl) rec.kind=kEl.value; else rec.kind='';        // 下の階層は区分を持たない（受け継ぐ）
  commitRecord('accounts', rec, { existingId:id||null });
  closeModal(); renderPage('accounts'); toast('保存しました。','ok');
}
function accNodeDelete(id){
  const a=accountById(id); if(!a) return;
  if(accountChildren(id).length){ toast('下に科目があります。先にそちらを消すか、移してください。','err'); return; }
  const use=accountUsage(a.code);
  if(use){ toast(`この科目は ${use}件の伝票・費目で使われています。消せません（「停止」にしてください）。`,'err'); return; }
  if(!confirm(`「${a.label}」を消します。よろしいですか？`)) return;
  if(deleteRecord('accounts', id, a.label)){ closeModal(); renderPage('accounts'); }
}
function accMove(id, dir){
  const a=accountById(id); if(!a) return;
  const sib=accountChildren(a.parentId||'');
  const i=sib.findIndex(x=>String(x.id)===String(id));
  const j=i+dir; if(j<0||j>=sib.length) return;
  sib.forEach((x,k)=>{ x.order=(k+1)*10; });
  a.order=(j+1)*10; sib[j].order=(i+1)*10;
  sib.forEach(x=>markDirty('accounts',x));
  renderPage('accounts');
}
function exportCsvAccounts(){
  const rows=[['階層','大分類','中分類','小分類','コード','名称','区分','使用中','年度実績']];
  (function walk(parentId, depth, path){
    accountChildren(parentId).forEach(a=>{
      const p=path.concat([a.label]);
      rows.push([depth+1, p[0]||'', p[1]||'', p[2]||'', a.code, a.label, KIND_LABEL[accountKindOf(a)]||'',
        accountUsage(a.code), sum12(seriesByAccount(CUR_FY,a.code,'actual'))]);
      walk(a.id, depth+1, p);
    });
  })('',0,[]);
  downloadCsv(`勘定科目_${CUR_FY}年度`, rows);
}

/* ============================================================================
   分類別集計 — 「どの科目に、どの建物で、いくら使ったか」
   ----------------------------------------------------------------------------
   利用者の指示（2026-09-13）:「大分類・中分類・小分類 それぞれで、その下の対象
   （建物）の一覧と金額を見たい。A棟は電気・水道・ガスでいくらか」

   数字の出どころは 予実（actualSeries）と同じ伝票です。ここで別の計算をしません。
   ★ テストで「分類別の合計 ＝ 予実の合計」を突き合わせています。ズレたら赤になります。
   ========================================================================== */
let KB_AXIS='account';      // account = 科目でまとめる / property = 建物でまとめる
let KB_KIND='';             // '' = 全部 / revenue / cogs / sga / nonop
let KB_OPEN={};             // 開いている行
const KB_NOPROP='(物件なし)';

function setKbAxis(a){ KB_AXIS=a; KB_OPEN={}; renderPage('kbunrui'); }
function setKbKind(k){ KB_KIND=k; renderPage('kbunrui'); }
function kbToggle(key){ KB_OPEN[key]=!KB_OPEN[key]; renderPage('kbunrui'); }

/** その費目の物件（費目マスタで決めた建物） */
function propOfCostItem(id){ const it=findById('costItems',id); return it? (it.propertyId||'') : ''; }

/** お金の動きを1本の表にする。1行 ＝ 1つの明細（税抜）。予実と同じ拾い方。 */
function moneyLines(fy){
  const months=fyMonths(fy), idx={}; months.forEach((m,i)=>{ idx[m]=i; });
  const out=[];
  const add=(ym, code, amount, propertyId, src)=>{
    const i=idx[ym]; if(i==null || !amount) return;
    out.push({ i, ym, code, amount, propertyId:propertyId||'', kind:accountKind(code), src });
  };
  /* ★ 取るのは「取消以外」。作成中も入れます — 予実（actualSeries）がそうだからです。
     ここで条件を変えると、同じ会社の同じ月なのに 予実 と 分類別 で数字が違う、という
     いちばん質の悪いズレが起きます。テストで両方を突き合わせています。 */
  (DB.invoices||[]).forEach(inv=>{
    if(inv.status==='取消') return;
    const ym=(inv.bookMonth||'').slice(0,7);
    (inv.items||[]).forEach(it=>add(ym, it.accountCode, itemAmount(it), it.propertyId,
      {t:'invoices', id:inv.id, label:(inv.no||'')+' ／ '+String(companyName(inv.companyId)).replace(/<[^>]+>/g,'')}));
  });
  (DB.bills||[]).forEach(b=>{
    if(b.status==='取消') return;
    const ym=(b.bookMonth||'').slice(0,7);
    (b.items||[]).forEach(it=>add(ym, it.accountCode, itemAmount(it), it.propertyId||propOfCostItem(it.costItemId),
      {t:'bills', id:b.id, label:(b.no||'')+' ／ '+String(companyName(b.companyId)).replace(/<[^>]+>/g,'')}));
  });
  (DB.expenses||[]).forEach(e=>{
    const ym=(e.bookMonth||e.date||'').slice(0,7);
    const rate=TAX_RATE[e.taxCat||'課税10%']||0;
    add(ym, e.accountCode, Math.round(num(e.amount)/(1+rate)), e.propertyId||propOfCostItem(e.costItemId),
      {t:'expenses', id:e.id, label:(e.note||accountLabel(e.accountCode))+(e.vendor?' ／ '+e.vendor:'')});
  });
  (DB.actualAdjust||[]).forEach(a=>{
    if(Number(a.fy)!==Number(fy)) return;
    const i=Number(a.mIndex); if(!(i>=0&&i<12) || !num(a.amount)) return;
    out.push({ i, ym:months[i], code:a.accountCode, amount:num(a.amount), propertyId:'',
      kind:accountKind(a.accountCode), src:{t:'adjust', id:a.id, label:'実績調整'} });
  });
  return out;
}
const kbZero = () => Array(12).fill(0);
const kbSum  = arr => arr.reduce((s,v)=>s+(v||0),0);

function viewKbunrui(){
  const fy=CUR_FY;
  const lines=moneyLines(fy).filter(l=>!KB_KIND || l.kind===KB_KIND);
  const cur=thisMonth(), curIdx = fyOf(cur)===fy ? fyIndexOf(cur) : -1;

  /* 集計の下ごしらえ（1回だけ回す） */
  const byCode={}, byCodeProp={}, byProp={}, byPropCode={};
  lines.forEach(l=>{
    byCode[l.code]=byCode[l.code]||kbZero(); byCode[l.code][l.i]+=l.amount;
    const pk=l.propertyId||KB_NOPROP;
    byCodeProp[l.code]=byCodeProp[l.code]||{};
    byCodeProp[l.code][pk]=byCodeProp[l.code][pk]||kbZero(); byCodeProp[l.code][pk][l.i]+=l.amount;
    byProp[pk]=byProp[pk]||kbZero(); byProp[pk][l.i]+=l.amount;
    byPropCode[pk]=byPropCode[pk]||{};
    byPropCode[pk][l.code]=byPropCode[pk][l.code]||kbZero(); byPropCode[pk][l.code][l.i]+=l.amount;
  });
  const sumCodes = codes => { const a=kbZero(); codes.forEach(c=>{ const s=byCode[c]; if(s) s.forEach((v,i)=>{ a[i]+=v; }); }); return a; };
  const propName = pk => pk===KB_NOPROP? KB_NOPROP : ((findById('properties',pk)||{}).name||'(消えた物件)');

  const cells=arr=>arr.map((v,i)=>`<td class="r num ${i===curIdx?'curcol':''}">${v?moneyPlain(v):'<span class="zero">—</span>'}</td>`).join('')
    +`<td class="r num"><b>${moneyPlain(kbSum(arr))}</b></td>`;
  const twist=(key,has)=>has? `<span class="kbtw">${KB_OPEN[key]?'▼':'▶'}</span>` : '<span class="kbtw" style="visibility:hidden;">▶</span>';
  const cellLinks=(arr,code,pk)=>arr.map((v,i)=>`<td class="r num ${i===curIdx?'curcol':''}">${v
    ?`<a onclick="event.stopPropagation();kbDrill('${attr(code)}','${attr(pk)}',${i})" style="cursor:pointer;color:var(--primary);">${moneyPlain(v)}</a>`
    :'<span class="zero">—</span>'}</td>`).join('')+`<td class="r num">${moneyPlain(kbSum(arr))}</td>`;

  let rows='', grand=kbZero();

  if(KB_AXIS==='account'){
    const walk=(parentId, depth)=>{
      accountChildren(parentId).forEach(a=>{
        if(KB_KIND && accountKindOf(a)!==KB_KIND) return;
        const codes=accountCodesUnder(a.code), arr=sumCodes(codes);
        const kids=accountChildren(a.id), leaf=!kids.length;
        const props=leaf? Object.keys(byCodeProp[a.code]||{}) : [];
        if(!kbSum(arr) && !props.length) return;
        const key='a:'+a.id;
        rows+=`<tr class="${depth===0?'totrow':''}" onclick="kbToggle('${attr(key)}')" style="cursor:pointer;">
          <td style="padding-left:${8+depth*20}px;">${twist(key, kids.length||props.length)}
            <b>${esc(a.label)}</b> <span class="muted" style="font-size:10.5px;">${esc(a.code)}</span></td>
          ${cells(arr)}</tr>`;
        if(depth===0) arr.forEach((v,i)=>{ grand[i]+=v; });
        if(KB_OPEN[key]){
          if(kids.length) walk(a.id, depth+1);
          else props.sort((x,y)=>kbSum(byCodeProp[a.code][y])-kbSum(byCodeProp[a.code][x])).forEach(pk=>{
            rows+=`<tr><td style="padding-left:${8+(depth+1)*20}px;" class="muted">
              <span class="kbtw" style="visibility:hidden;">▶</span>${esc(propName(pk))}
              ${pk!==KB_NOPROP?`<a class="pillbtn" style="margin-left:6px;" onclick="event.stopPropagation();propertyDetail('${attr(pk)}')">物件</a>`:''}</td>
              ${cellLinks(byCodeProp[a.code][pk], a.code, pk)}</tr>`;
          });
        }
      });
    };
    walk('',0);
    /* 木に入っていない科目（初期セット前・コードだけの行）も落とさない */
    const orphan=Object.keys(byCode).filter(c=>{ const a=accountByCode(c); return !a || (!a.parentId && accountChildren(a.id).length===0 && accTreeReady()); });
    if(orphan.length && accTreeReady()){
      const arr=sumCodes(orphan);
      rows+=`<tr class="grprow"><td colspan="14">分類に入っていない科目（勘定科目の登録で整理できます）</td></tr>
        <tr><td style="padding-left:28px;">${orphan.map(c=>esc(accountLabel(c))).join('、')}</td>${cells(arr)}</tr>`;
      arr.forEach((v,i)=>{ grand[i]+=v; });
    }
    if(!accTreeReady()){
      /* 階層をまだ作っていない環境: 科目をそのまま並べる（何も見えないより良い） */
      Object.keys(byCode).forEach(c=>{
        const arr=byCode[c];
        rows+=`<tr><td>${esc(accountLabel(c))} <span class="muted" style="font-size:10.5px;">${esc(c)}</span></td>${cells(arr)}</tr>`;
        arr.forEach((v,i)=>{ grand[i]+=v; });
      });
    }
  }else{
    Object.keys(byProp).sort((x,y)=>kbSum(byProp[y])-kbSum(byProp[x])).forEach(pk=>{
      const arr=byProp[pk], key='p:'+pk;
      rows+=`<tr class="totrow" onclick="kbToggle('${attr(key)}')" style="cursor:pointer;">
        <td>${twist(key,true)}<b>${esc(propName(pk))}</b>
          ${pk!==KB_NOPROP?`<a class="pillbtn" style="margin-left:6px;" onclick="event.stopPropagation();propertyDetail('${attr(pk)}')">物件</a>`:''}</td>
        ${cells(arr)}</tr>`;
      arr.forEach((v,i)=>{ grand[i]+=v; });
      if(KB_OPEN[key]){
        Object.keys(byPropCode[pk]).sort((x,y)=>kbSum(byPropCode[pk][y])-kbSum(byPropCode[pk][x])).forEach(c=>{
          rows+=`<tr><td style="padding-left:28px;" class="muted"><span class="kbtw" style="visibility:hidden;">▶</span>
            ${esc(accountPathLabel(c))}</td>${cellLinks(byPropCode[pk][c], c, pk)}</tr>`;
        });
      }
    });
  }

  const kinds=[['','すべて'],['revenue','収益'],['cogs','売上原価'],['sga','販管費'],['nonop','営業外']];
  const tools=`<div class="seg">
      <button class="${KB_AXIS==='account'?'on':''}" onclick="setKbAxis('account')">科目でまとめる</button>
      <button class="${KB_AXIS==='property'?'on':''}" onclick="setKbAxis('property')">建物でまとめる</button>
    </div>
    <select onchange="setKbKind(this.value)" style="margin-left:8px;">${kinds.map(k=>`<option value="${k[0]}" ${KB_KIND===k[0]?'selected':''}>${esc(k[1])}</option>`).join('')}</select>
    ${toolsMenu(`<button class="btn secondary" onclick="exportCsvKbunrui()">${IC.doc} CSV出力</button>
      <button class="btn secondary" onclick="window.print()">${IC.print} 印刷</button>
      <hr><button class="btn secondary" onclick="goto('accounts')">勘定科目の登録へ</button>`)}`;

  return pageShell({ title:'分類別集計', sub:`${fyLabel(fy)}・税抜。金額は予実と同じ伝票から数えています。`,
    tools,
    body:`<div class="table-wrap"><table class="stick1">
        <thead><tr><th style="min-width:270px;">${KB_AXIS==='account'?'勘定科目（大 › 中 › 小 › 建物）':'建物 › 勘定科目'}</th>
          ${FY_MONTH_LABELS.map((m,i)=>`<th class="r ${i===curIdx?'curcol':''}" style="min-width:92px;">${m}</th>`).join('')}
          <th class="r" style="min-width:110px;">年間計</th></tr></thead>
        <tbody>${rows || `<tr><td colspan="14" class="empty" style="padding:20px;">${fyLabel(fy)}に数字がありません。</td></tr>`}
          <tr class="totrow"><td><b>合計</b></td>${cells(grand)}</tr></tbody></table></div>
      <div class="fhelp" style="margin-top:8px;">行を押すと下の階層が開きます。いちばん下は <b>建物（物件）</b>です。
        金額を押すと、その月にその科目・その建物で動いた伝票が出ます。<br>
        建物は 費用管理の費目（または支払請求の明細）で選びます。選んでいないものは「${esc(KB_NOPROP)}」にまとまります。</div>` });
}
/** 金額の裏づけ: その月・その科目・その建物で動いた伝票を出す */
function kbDrill(code, propKey, monthIdx){
  const fy=CUR_FY;
  const lines=moneyLines(fy).filter(l=>String(l.code)===String(code) && l.i===Number(monthIdx)
    && String(l.propertyId||KB_NOPROP)===String(propKey));
  const total=lines.reduce((s,l)=>s+l.amount,0);
  const T={invoices:'請求書', bills:'支払請求', expenses:'費用', adjust:'実績調整'};
  openModal(`<h3>${esc(accountPathLabel(code))} ／ ${esc(propKey===KB_NOPROP?KB_NOPROP:((findById('properties',propKey)||{}).name||''))}</h3>
    <div class="mdsub">${esc(fyMonths(fy)[monthIdx])}（${esc(FY_MONTH_LABELS[monthIdx])}）の内訳。税抜。合計 <b class="num">${moneyPlain(total)}</b> 円</div>
    <div class="table-wrap"><table><thead><tr><th>種類</th><th>伝票</th><th class="r">金額（税抜）</th><th></th></tr></thead>
      <tbody>${lines.map(l=>`<tr><td><span class="badge ${l.src.t==='invoices'?'b-green':'b-blue'}">${esc(T[l.src.t]||l.src.t)}</span></td>
        <td>${esc(l.src.label)}</td><td class="r num">${moneyPlain(l.amount)}</td>
        <td>${['invoices','bills'].includes(l.src.t)?`<a class="pillbtn pill-save" onclick="closeModal();openDetail('${l.src.t}','${attr(l.src.id)}')">開く</a>`:''}</td></tr>`).join('')
        || '<tr><td colspan="4" class="empty">明細がありません。</td></tr>'}</tbody></table></div>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">閉じる</button></div>`,'lg');
}
function exportCsvKbunrui(){
  const fy=CUR_FY, months=fyMonths(fy);
  const lines=moneyLines(fy).filter(l=>!KB_KIND || l.kind===KB_KIND);
  const map={};
  lines.forEach(l=>{
    const path=accountPath(l.code).map(a=>a.label);
    const pk=l.propertyId||KB_NOPROP;
    const key=JSON.stringify([path[0]||'', path[1]||'', path[2]||'', accountLabel(l.code), pk]);
    if(!map[key]) map[key]=kbZero();
    map[key][l.i]+=l.amount;
  });
  const rows=[['大分類','中分類','小分類','科目','建物',...months,'年間計']];
  Object.keys(map).sort().forEach(key=>{
    const p=JSON.parse(key), a=map[key], pk=p[4];
    rows.push([p[0],p[1],p[2],p[3], pk===KB_NOPROP?KB_NOPROP:((findById('properties',pk)||{}).name||''), ...a, kbSum(a)]);
  });
  downloadCsv(`分類別集計_${fy}年度`, rows);
}

/* ============================================================================
   物件（建物）管理 — 借りている建物ごとに、契約と毎月のお金をまとめて見る
   ----------------------------------------------------------------------------
   利用者の指示（2026-09-13）:「家賃・電気・水道…を、借りている建物ごとに
   きちんと管理したい。そこもタイムラインで見たい」

   考え方:
     ・物件は「契約の器」。貸主（＝支払先）・期間・家賃・共益費・駐車場代を持つ
     ・毎月の実際の金額は 費目マスタ（月次費用表）から来る。費目に物件を紐づけると
       この画面に集まる。金額の出どころを二重に持たない（公式 §0.3）
     ・契約満了が近い物件はベルと画面で先に言う。更新の交渉には時間が要るため
   ========================================================================== */
/** 物件 × 12か月（税込）。費目（月次費用表）の行を物件ごとに束ねたもの。 */
function propRowsOf(fy){
  const months = fyMonths(fy);
  const all = costRowsOf(fy).rows;
  const props = (DB.properties||[]).slice().sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'ja'));
  const rows = props.map(pr=>{
    const items = all.filter(r=>String(r.it.propertyId||'')===String(pr.id));
    const cells = months.map((m,i)=>items.reduce((s,r)=>s+(r.cells[i]||0),0));
    return { pr, items, cells, plan:num(pr.rent)+num(pr.kyoeki)+num(pr.parking) };
  });
  /* 物件に紐づいていない費目は「物件なし」で1行にまとめる（隠すと合わなくなる） */
  const orphan = all.filter(r=>!r.it.propertyId);
  return { months, rows, orphan, orphanCells: months.map((m,i)=>orphan.reduce((s,r)=>s+(r.cells[i]||0),0)) };
}
/** 契約満了まで何日か。契約満了が空なら null（＝期限なし・自動更新） */
function propDaysLeft(pr){
  if(!pr || !pr.contractEnd) return null;
  return daysBetween(today(), String(pr.contractEnd).slice(0,10));
}
function propEndBadge(pr){
  const d=propDaysLeft(pr);
  if(d===null) return '<span class="muted" style="font-size:11.5px;">期限なし</span>';
  if(d<0)  return `<span class="badge b-red">満了済み（${-d}日前）</span>`;
  if(d<=PROP_ALERT_DAYS) return `<span class="badge b-amber">あと${d}日</span>`;
  return `<span class="muted" style="font-size:11.5px;">${esc(String(pr.contractEnd).slice(0,10))}</span>`;
}

/* ============================================================================
   ⑪'' 買掛の自動作成（定期支払）と 債務年齢表
   ----------------------------------------------------------------------------
   利用者の指示（2026-09-13）:
     「費用は、ある会社に定期的に払うお金を管理するためのもの。
       だから新しい会社をその場で作れるようにしてほしい」
   そこで 費目マスタに【支払先（取引先）】と【払い方】を足しました。

     払い方 = 即払い … いままでどおり。月次費用表のマスに金額を打つ＝経費に入る。
                        買掛の残高は持たない（カード・口座振替など、その場で出ていくもの）
     払い方 = 買掛   … 毎月「支払請求」を作る。期日はその会社の締日・サイト・支払日から
                        自動で決まり、支払実行で消し込む。残高・年齢表・資金繰りに乗る。

   ★ 二重計上しないための決まり: 買掛の費目は expenses を作りません。
     金額は「その月の支払請求の明細」が唯一の出どころで、月次費用表はそれを読むだけ。
   ========================================================================== */
/** 買掛の費目 × 月 → その月の支払請求の明細（税込）。無ければ null。 */
function costBillCell(costItemId, ym){
  for(const b of (DB.bills||[])){
    if(!b || b.status==='取消') continue;
    if((b.bookMonth||'').slice(0,7)!==ym) continue;
    const it=(b.items||[]).find(x=>x && String(x.costItemId)===String(costItemId));
    if(it){
      const net=itemAmount(it), rate=TAX_RATE[it.taxCat||'課税10%']||0;
      return { bill:b, item:it, gross: net+Math.floor(net*rate) };
    }
  }
  return null;
}
/** その会社に、その月の「定期支払」の支払請求を作る材料を集める */
function apPlanFor(ym){
  const byCo={};
  costItemsSorted().forEach(it=>{
    if(!isApCost(it)) return;
    if(!it.companyId) return;                       // 支払先が無いと期日が決まらない
    if(!costItemActive(it, ym)) return;
    const gross=num(it.monthly); if(!gross) return;
    const c=findById('companies', it.companyId); if(!c) return;
    const k=String(it.companyId);
    if(!byCo[k]) byCo[k]={ company:c, items:[], already:false };
    if(costBillCell(it.id, ym)) byCo[k].already=true;   // もう作ってある
    else byCo[k].items.push({ accountCode:it.accountCode||'', name:it.name||'',
      amount: netOfGross(gross, it.taxCat), taxCat: it.taxCat||'課税10%', costItemId:String(it.id) });
  });
  return Object.values(byCo);
}

      <div style="margin-top:4px;font-weight:400;">支払先を決めないと、支払期日が計算できません。</div></div>`:''}`;

/** 実際に作るところ。画面（チェックボックス）から切り離してあるのでテストできる。 */
function apCreateBills(ym, plans){
  let n=0;
  (plans||[]).forEach(p=>{
    if(!p.items.length) return;
    const rec={ companyId:p.company.id, bookMonth:ym, recvDate:'', status:'作成中',
      items:p.items, note:'自動作成（定期支払・費目マスタ）' };
    prepareDoc('bills', rec, null);
    /* 期日はその会社の条件から。会社ごとに違うので、ここで固定の日数を使ってはいけない。 */
    rec.dueDate = dueDateOf(ym, p.company.closingDay, p.company.paySite, p.company.payDay);
    commitRecord('bills', rec, {}); n++;
  });
  return n;
}
function genBillsGo(){
  if(!GENB_CTX||!GENB_CTX.plan.length){ toast('作成する対象がありません。','err'); return; }
  const picked=[...document.querySelectorAll('.genbck:checked')].map(c=>GENB_CTX.plan[Number(c.dataset.i)]);
  if(!picked.length){ toast('対象を選んでください。','err'); return; }
  const n=apCreateBills(GENB_CTX.ym, picked);
  closeModal(); renderPage(CURRENT_PAGE); toast(`${n}件の支払請求（作成中）を作成しました。`,'ok');
}

/* ---------- 債務年齢表（債権年齢表の裏返し） ---------- */
function viewApAging(){
  const open=openBills();
  const byCo={};
  open.forEach(b=>{
    const k=String(b.companyId||'-');
    if(!byCo[k]) byCo[k]={ id:k, name:String(companyName(b.companyId)).replace(/<[^>]+>/g,''), buckets:{}, total:0, oldest:'' };
    const g=agingBucket(b);                       // 期日からの経過日数（請求と同じ区分）
    byCo[k].buckets[g]=(byCo[k].buckets[g]||0)+balanceOfBill(b);
    byCo[k].total+=balanceOfBill(b);
    if(!byCo[k].oldest||(b.dueDate&&b.dueDate<byCo[k].oldest)) byCo[k].oldest=b.dueDate||'';
    if(isOverdue(b)) byCo[k].late=true;
  });
  const rows=Object.values(byCo).sort((a,b)=>b.total-a.total);
  const totals={}; AGING_BUCKETS.forEach(b=>totals[b]=rows.reduce((s,r)=>s+(r.buckets[b]||0),0));

/* ============================================================================
   添付ファイル（画面側）— どの伝票にも 📎 を
   ----------------------------------------------------------------------------
   ファイルの中身は サーバーの別の表にあり、画面の同期データ（DB）には入れません。
   一覧の数は1画面ぶんを1回で取り（/files/counts）、中身は押したときだけ取りに行きます。
   付ける・消す は その伝票の画面の 編集・削除 の権限。見るのは 表示 の権限。
   ========================================================================== */
const ATT_PAGE = { invoices:'invoices', payments:'receipts', bills:'bills', payouts:'payouts',
  expenses:'expenses', costItems:'expenses', properties:'properties', companies:'companies' };
const ATT_LABEL = { invoices:'請求書', payments:'入金', bills:'支払請求', payouts:'支払', expenses:'費用',
  costItems:'費目', properties:'物件', companies:'取引先' };
const ATT_MAX = 10*1024*1024;
let ATT_COUNTS = {}, _attLoading = {};

async function attLoadCounts(entity){
  if(_attLoading[entity]) return;
  _attLoading[entity]=true;
  try{
    const r=await fetch(API_BASE+'/files/counts?entity='+encodeURIComponent(entity),{headers:headers()});
    const d=r.ok? await r.json() : { counts:{} };
    ATT_COUNTS[entity]=d.counts||{};
  }catch(e){ ATT_COUNTS[entity]={}; }
  _attLoading[entity]=false;
  /* 数が分かったら、今の画面だけ描き直す（入力中の画面は描き直さない） */
  const a=document.activeElement;
  if(!(a && /INPUT|TEXTAREA|SELECT/.test(a.tagName))) renderPage(CURRENT_PAGE);
}
/** 一覧の行に置く小さなボタン。数がまだ分からなければ、裏で取りに行く。 */
function attBtn(entity, id){
  if(!ATT_PAGE[entity] || !id) return '';
  if(!ATT_COUNTS[entity] && !_attLoading[entity] && GTOKEN) attLoadCounts(entity);
  const n=(ATT_COUNTS[entity]||{})[id]||0;
  return `<a class="attbtn${n?' has':''}" onclick="event.stopPropagation();attOpen('${entity}','${attr(id)}')" title="添付ファイル${n?`（${n}件）`:''}">${IC.clip}${n?`<span>${n}</span>`:''}</a>`;
}
const attSize = b => b>=1048576 ? (b/1048576).toFixed(1)+'MB' : Math.max(1,Math.round(b/1024))+'KB';

async function attOpen(entity, id){
  const page=ATT_PAGE[entity];

    ${canUp? `<label class="attdrop" id="attDrop" ondragover="event.preventDefault();this.classList.add('over')"
        ondragleave="this.classList.remove('over')" ondrop="event.preventDefault();this.classList.remove('over');attUpload('${entity}','${attr(id)}',event.dataTransfer.files)">
        <input type="file" multiple style="display:none;" onchange="attUpload('${entity}','${attr(id)}',this.files)"
          accept=".pdf,.png,.jpg,.jpeg,.gif,.webp,.heic,.xlsx,.xls,.docx,.doc">
        <b>ここにファイルをドロップ</b> または <u>選ぶ</u><br>
        <span class="muted" style="font-size:11.5px;">PDF・画像・Excel・Word ／ 1ファイル10MBまで（マクロ入りは受け付けません）</span></label>`

async function attRefresh(entity, id, canDel){
  try{
    const r=await fetch(API_BASE+'/files?entity='+encodeURIComponent(entity)+'&id='+encodeURIComponent(id),{headers:headers()});
    const d=await r.json().catch(()=>({}));

    if(!r.ok){ box.innerHTML=`<div class="alertbar">${esc(d.message||'添付を取得できませんでした（HTTP '+r.status+'）')}</div>`; return; }
    const items=d.items||[];
    (ATT_COUNTS[entity]=ATT_COUNTS[entity]||{})[id]=items.length;
    box.innerHTML = items.length? `<div class="table-wrap"><table><thead><tr><th>ファイル</th><th>種類</th><th class="r">大きさ</th><th>付けた人・日時</th><th></th></tr></thead>

          ${canDel?`<a class="pillbtn pill-del" onclick="attDelete('${entity}','${attr(id)}','${attr(f.id)}','${attr(f.fileName)}')">削除</a>`:''}</td></tr>`).join('')}
      </tbody></table></div>` : '<div class="empty">まだ添付はありません。</div>';
  }catch(e){ const b=document.getElementById('attList'); if(b) b.innerHTML='<div class="alertbar">通信に失敗しました。</div>'; }

function attReadB64(file){
  return new Promise((ok,ng)=>{ const fr=new FileReader(); fr.onload=()=>ok(String(fr.result).split(',')[1]||''); fr.onerror=ng; fr.readAsDataURL(file); });
}
async function attUpload(entity, id, fileList){
  const files=[...(fileList||[])]; if(!files.length) return;
  const box=document.getElementById('attList');
  let okN=0; const errs=[];
  for(const f of files){
    if(f.size>ATT_MAX){ errs.push(`${f.name}：10MBを超えています`); continue; }
    if(box) box.insertAdjacentHTML('afterbegin', `<div class="infobar" data-up="${attr(f.name)}">「${esc(f.name)}」を送っています…</div>`);
    try{
      const dataBase64=await attReadB64(f);
      const r=await fetch(API_BASE+'/files',{method:'POST',headers:headers(),body:JSON.stringify({entity, entityId:id, fileName:f.name, dataBase64})});
      const d=await r.json().catch(()=>({}));
      if(r.ok) okN++; else errs.push(`${f.name}：${d.message||('HTTP '+r.status)}`);
    }catch(e){ errs.push(`${f.name}：通信に失敗しました`); }
  }
  if(okN) toast(`${okN}件 添付しました。`,'ok');
  if(errs.length) toast('付けられなかったファイルがあります：\n'+errs.join('\n'),'err');
  attRefresh(entity, id, canDelete(ATT_PAGE[entity]));
  renderPage(CURRENT_PAGE);
}
async function attBlob(fileId){
  const r=await fetch(API_BASE+'/files/'+encodeURIComponent(fileId),{headers:headers()});
  if(!r.ok){ const d=await r.json().catch(()=>({})); throw new Error(d.message||('HTTP '+r.status)); }
  return r.blob();
}
async function attDownload(fileId, name){
  try{
    const b=await attBlob(fileId), url=URL.createObjectURL(b), a=document.createElement('a');
    a.href=url; a.download=name||'file'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  }catch(e){ toast('保存できませんでした：'+e.message,'err'); }
}
/** PDF と画像はその場で開く。それ以外は保存。 */
async function attView(fileId, mime){
  if(!/^(application\/pdf|image\/(png|jpeg|gif|webp))/.test(mime||'')){ return attDownload(fileId); }
  try{
    const b=await attBlob(fileId), url=URL.createObjectURL(b);
    const w=window.open(url,'_blank');

    setTimeout(()=>URL.revokeObjectURL(url), 60000);

}

/* ============================================================================
   請求書（繰越式）— 前回ご請求額・ご入金額・繰越額・今回お買上額・今回ご請求額
   ----------------------------------------------------------------------------
   利用者の指示（2026-09-14）: 未回収や過入金は、次の請求書に 繰越式 で載せる。

   ★ 繰越は「売上の明細」には絶対に入れません。入れると、前の月の売上を
     もう一度 売上として数えてしまう（予実が二重になる）。請求書の上の枠に出すだけ。
   ★ 数え方（ずっと同じ式・誰に聞かれても同じ説明ができるように）:
       繰越額       ＝ この請求書より前に出した請求の累計 − この日までに入ったお金の累計（手数料込み）
       ご入金額     ＝ 前回の請求書の日の翌日 〜 この請求書の日 に入ったお金
       前回ご請求額 ＝ 繰越額 ＋ ご入金額
       今回ご請求額 ＝ 繰越額 ＋ 今回お買上額
     過入金があると 繰越額 はマイナスになり、そのぶん 今回ご請求額 が減ります。
   ★ 確定した瞬間に数字を写して保存します（公式 §0.8 証拠はスナップショット）。
     あとから入金を直しても、送った請求書と刷り直した請求書が違う、ということを起こさない。
   ========================================================================== */
const invDocDate = inv => inv.issueDate || (inv.bookMonth? monthEnd(inv.bookMonth) : '');
/** 並び順（日付 → 番号）。同じ日に2枚出したときも前後が決まるように。 */
const invOrderKey = inv => invDocDate(inv)+'|'+String(inv.no||'')+'|'+String(inv.id||'');
const received = p => num(p.amount)+num(p.fee);           // 先方負担の振込手数料も「受け取った」うちに入れる

function invoiceCarry(inv){
  const cid=inv.companyId, key=invOrderKey(inv), asOf=invDocDate(inv);
  const others=(DB.invoices||[]).filter(i=>String(i.companyId)===String(cid) && String(i.id)!==String(inv.id)
    && i.status!=='取消' && i.status!=='作成中' && invOrderKey(i) < key)
    .sort((a,b)=>invOrderKey(a).localeCompare(invOrderKey(b)));
  const prev=others[others.length-1]||null, prevDate=prev? invDocDate(prev) : '';
  const pays=(DB.payments||[]).filter(p=>String(p.companyId)===String(cid) && p.status!=='取消' && p.date);
  const billedBefore=others.reduce((s,i)=>s+docTotal(i),0);
  const recvUpTo=pays.filter(p=>p.date<=asOf).reduce((s,p)=>s+received(p),0);
  const recvWindow=pays.filter(p=>p.date<=asOf && (!prevDate || p.date>prevDate)).reduce((s,p)=>s+received(p),0);
  const carry=billedBefore-recvUpTo, current=docTotal(inv);
  return { prev: carry+recvWindow, received: recvWindow, carry, current, total: carry+current,
    asOf, prevNo: prev? (prev.no||'') : '', computedAt: new Date().toISOString() };
}
/** 確定済みなら保存した数字、まだなら今の計算。どちらかを画面に明示する。 */
function invoiceCarryShown(inv){
  if(inv.carry && inv.carry.asOf) return Object.assign({ frozen:true }, inv.carry);
  return Object.assign({ frozen:false }, invoiceCarry(inv));
}
