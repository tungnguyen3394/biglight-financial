# BIGLIGHT 予実管理システム — 3サービス構成
#   web (nginx) : 画面(index.html) を配信 ＋ /api を api へ中継
#                 → 画面とAPIが同一オリジンになるので CORS が発生しない
#                   （CRMで拡張機能にサブドメインを遮断された事故の再発防止）
#   api         : Express + PostgreSQL
#   db          : PostgreSQL 16（データはボリュームに保存）
#
# Caddy（共有・ネットワーク "web"）が finance.biglight.jp を web:80 に流します。
#
# 起動:  docker compose up -d --build
services:
  web:
    image: nginx:alpine
    container_name: yojitsu-web
    restart: unless-stopped
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api]
    networks: [web, internal]
    labels:
      caddy: finance.biglight.jp
      caddy.reverse_proxy: "{{upstreams 80}}"
      # 2026-09-30 (audit hạ tầng): nén + header an toàn đặt ở MỘT tầng Caddy, giống CRM/Academy.
      # Nén: commit 21/9 ở máy Mac chưa bao giờ được đẩy lên, nên host này vẫn chưa nén (đo 30/9: 881KB trần).
      # Header: quét 17 tên miền 30/9, finance thiếu cả 4. Dấu "?" = chỉ đặt khi app chưa tự đặt (không đè).
      caddy.encode: zstd gzip
      caddy.header.Strict-Transport-Security: "max-age=31536000"
      caddy.header.?X-Content-Type-Options: nosniff
      caddy.header.?X-Frame-Options: SAMEORIGIN
      caddy.header.?Referrer-Policy: strict-origin-when-cross-origin

  api:
    build: ./backend
    container_name: yojitsu-api
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "4000"
      DATABASE_URL: "postgres://yojitsu:${DB_PASSWORD:-changeme}@db:5432/yojitsu"
      # ★ 2026-09-18: これが無いと中は UTC。「毎朝6:00」が日本時間の15:00に動いていました。
      TZ: Asia/Tokyo
    depends_on: [db]
    networks: [internal]

  db:
    image: postgres:16-alpine
    container_name: yojitsu-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: yojitsu
      POSTGRES_PASSWORD: "${DB_PASSWORD:-changeme}"
      POSTGRES_DB: yojitsu
      TZ: Asia/Tokyo
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yojitsu"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

networks:
  web:
    external: true      # Caddy と共有（CRMと同じ）
  internal:
