server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # 画面: 1ファイルSPA。キャッシュさせない（古いHTMLが残ると「直したのに直らない」の原因）
  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate";
    try_files $uri =404;
  }

  # API: 同一オリジンで中継 → CORS が発生しない
  location /api/ {
    proxy_pass http://api:4000/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    client_max_body_size 64m;

    # SSE（/api/events）はバッファすると届かない
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Connection '';
    chunked_transfer_encoding off;
  }

  # MCP（AI連携）。同じドメインなので CORS も preflight も発生しない。
  # ここは /api と違って パスを落とさない（proxy_pass の末尾に / を付けない）:
  # バックエンドは /mcp と /.well-known/... をそのまま見ています。
  # MCP_ENABLED=false のときはバックエンドに口が無いので 404 が返ります（安全）。
  location ^~ /mcp {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    client_max_body_size 1m;
  }

  # OAuth のメタデータ（RFC 9728 / RFC 8414）。AIクライアントがこの2本を先に読みます。
  location ^~ /.well-known/oauth- {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/html text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
